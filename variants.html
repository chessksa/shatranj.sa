<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#022f33"><title>أنماط اللعب | شطرنج العرب</title><link rel="stylesheet" href="v2/site/shell.css"><link rel="stylesheet" href="v2/platform/page.css"><style>.variant-layout{display:grid;grid-template-columns:minmax(320px,680px) minmax(270px,1fr);gap:16px;align-items:start;direction:ltr}.variant-board-wrap{direction:rtl}.variant-board{width:min(100%,70dvh);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:3px solid #66503b;box-shadow:0 16px 32px rgba(0,0,0,.24);direction:ltr}.variant-square{position:relative;border:0;padding:0;display:grid;place-items:center;min-width:0;min-height:0}.variant-square.light{background:var(--board-light,#e8dec8)}.variant-square.dark{background:var(--board-dark,#87966a)}.variant-square.selected{box-shadow:inset 0 0 0 4px var(--p-gold2)}.variant-square.target::after{content:"";position:absolute;width:22%;height:22%;border-radius:50%;background:rgba(13,59,53,.55)}.variant-square.center::before{content:"";position:absolute;inset:8%;border:2px solid rgba(239,207,124,.8);border-radius:6px;pointer-events:none}.variant-piece{width:86%;height:86%;object-fit:contain;pointer-events:none}.variant-side{direction:rtl;display:grid;gap:12px}.variant-player{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--p-line);border-radius:11px;background:rgba(255,255,255,.025)}.variant-clock{font-size:27px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--p-gold2)}.variant-player.turn{border-color:var(--p-gold)}.variant-games{display:grid;gap:5px;max-height:260px;overflow:auto}.variant-game-row{display:grid;grid-template-columns:1fr auto;gap:7px;padding:8px;border:1px solid var(--p-line);border-radius:10px;text-decoration:none}.variant-searching{display:inline-flex;gap:3px;align-items:center}.variant-searching i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:vPulse 1.1s infinite}.variant-searching i:nth-child(2){animation-delay:.18s}.variant-searching i:nth-child(3){animation-delay:.36s}.variant-rules{margin-top:8px;padding:8px 9px;border:1px solid rgba(216,182,101,.14);border-radius:9px;background:rgba(0,0,0,.1);font-size:11px;line-height:1.6}.variant-pocket{width:min(100%,70dvh);min-height:42px;margin:7px auto;display:none;align-items:center;gap:6px;padding:5px 8px;border:1px solid rgba(216,182,101,.18);border-radius:10px;background:rgba(0,0,0,.12);direction:rtl}.variant-pocket.show{display:flex}.variant-pocket-label{margin-inline-end:auto;color:var(--p-muted);font-size:10px}.variant-pocket-piece{position:relative;width:39px;height:34px;border:1px solid rgba(216,182,101,.2);border-radius:8px;background:rgba(255,255,255,.035);padding:1px;cursor:pointer}.variant-pocket-piece img{width:28px;height:28px;object-fit:contain}.variant-pocket-piece b{position:absolute;left:3px;bottom:1px;font-size:10px;color:var(--p-gold2)}.variant-pocket-piece.selected{outline:2px solid var(--p-gold2)}.variant-pocket-piece:disabled{opacity:.35;cursor:default}@keyframes vPulse{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}@media(max-width:900px){.variant-layout{grid-template-columns:1fr}.variant-board{width:min(100%,calc(100dvh - 320px));margin:auto}.variant-pocket{width:min(100%,calc(100dvh - 320px))}.variant-side{order:-1}}</style></head><body class="platform-page"><main class="platform-shell"><header class="platform-head"><div><h1>أنماط اللعب</h1><p>ثمانية أنماط بقواعد قانونية ومطابقة وحركة تتحقق منها الخوادم.</p></div><a class="platform-btn" href="play-v2.html">الشطرنج العادي</a></header><section class="variant-layout"><div class="variant-board-wrap"><div id="variantBlackPocket" class="variant-pocket" aria-label="جيب الأسود"></div><div id="variantBoard" class="variant-board" aria-label="رقعة نمط اللعب"></div><div id="variantWhitePocket" class="variant-pocket" aria-label="جيب الأبيض"></div></div><aside class="variant-side"><article class="platform-card full"><div id="blackPlayer" class="variant-player"><span><strong id="blackName">الأسود</strong><small id="blackMeta" class="platform-muted"></small></span><strong id="blackClock" class="variant-clock">10:00</strong></div><div style="height:8px"></div><div id="whitePlayer" class="variant-player"><span><strong id="whiteName">الأبيض</strong><small id="whiteMeta" class="platform-muted"></small></span><strong id="whiteClock" class="variant-clock">10:00</strong></div><div id="variantStatus" class="platform-muted" style="margin-top:10px">اختر النمط والزمن وابدأ البحث.</div><div class="platform-actions" style="margin-top:10px"><button id="variantDraw" class="platform-btn" disabled>تعادل</button><button id="variantResign" class="platform-btn danger" disabled>استسلام</button></div></article><article class="platform-card full"><h3>ابحث عن خصم</h3><select id="variantMode" class="platform-select"><option value="chess960">Chess960</option><option value="threecheck">Three-Check</option><option value="kingofthehill">King of the Hill</option><option value="crazyhouse">Crazyhouse</option><option value="atomic">Atomic</option><option value="antichess">Antichess</option><option value="horde">Horde</option><option value="racingkings">Racing Kings</option></select><div id="variantModeInfo" class="variant-rules platform-muted">Chess960: ترتيب البداية عشوائي قانوني، والملك بين الرخين.</div><div style="height:8px"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px"><select id="variantTime" class="platform-select"><option value="300,0">5 دقائق</option><option value="600,0" selected>10 دقائق</option><option value="900,10">15 + 10</option></select><select id="variantRated" class="platform-select"><option value="1">نقاط</option><option value="0">ودي</option></select></div><div class="platform-actions" style="margin-top:9px"><button id="variantQueue" class="platform-btn primary">ابدأ البحث</button><button id="variantCancel" class="platform-btn" disabled>إلغاء</button></div><div id="variantQueueState" class="platform-muted" style="margin-top:8px"></div></article><article class="platform-card full"><h3>مبارياتي في الأنماط</h3><div id="variantGames" class="variant-games"><div class="platform-empty">جارٍ التحميل…</div></div></article></aside></section></main><script src="config-base.js"></script><script type="module" src="v3/variants/app.mjs"></script><script type="module" src="v2/site/shell.mjs"></script></body></html>
