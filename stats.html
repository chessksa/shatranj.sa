<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#022f33"><title>الإحصائيات | شطرنج العرب</title><link rel="stylesheet" href="v2/site/shell.css"><link rel="stylesheet" href="v2/platform/page.css"><style>.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stat-box{border:1px solid var(--p-line);border-radius:12px;padding:11px;text-align:center;background:rgba(255,255,255,.025)}.stat-box small{display:block;color:var(--p-muted);font-size:10px}.stat-box strong{display:block;color:var(--p-gold2);font-size:23px;margin-top:4px}.bar-row{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;margin:8px 0}.bar-track{height:10px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}.bar-fill{height:100%;background:var(--p-gold)}.history{height:180px;display:flex;align-items:end;gap:3px;padding:10px 0;border-bottom:1px solid var(--p-line)}.history-bar{flex:1;min-width:3px;background:linear-gradient(180deg,var(--p-gold2),rgba(216,182,101,.42));border-radius:4px 4px 0 0}.achievement{display:grid;grid-template-columns:42px 1fr auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(216,182,101,.12);opacity:.5}.achievement.unlocked{opacity:1}.achievement-icon{font-size:25px;color:var(--p-gold2)}@media(max-width:700px){.stat-grid{grid-template-columns:repeat(2,1fr)}.bar-row{grid-template-columns:72px 1fr 55px}.platform-card{grid-column:1/-1!important}}
</style></head><body class="platform-page"><main class="platform-shell"><header class="platform-head"><div><h1>الإحصائيات وInsights</h1><p>أداؤك في اللعب، الألوان، الأزمنة، الألغاز والتعلم.</p></div></header><section class="platform-grid"><article class="platform-card full"><div class="stat-grid"><div class="stat-box"><small>النقاط</small><strong id="ratingStat">—</strong></div><div class="stat-box"><small>المباريات</small><strong id="gamesStat">0</strong></div><div class="stat-box"><small>نسبة الفوز</small><strong id="winRateStat">0%</strong></div><div class="stat-box"><small>تقييم الألغاز</small><strong id="puzzleRatingStat">—</strong></div></div></article><article class="platform-card"><h2>النتائج</h2><div id="resultStats"></div></article><article class="platform-card"><h2>الأبيض والأسود</h2><div id="colorStats"></div></article><article class="platform-card full"><h2>الأداء حسب زمن المباراة</h2><div id="timeControlStats"></div></article><article class="platform-card full"><h2>تاريخ النقاط</h2><div id="ratingHistory" class="history"></div><div id="ratingHistoryLabel" class="platform-muted"></div></article><article class="platform-card"><h2>الألغاز والتعلم</h2><div id="puzzleStats"></div></article><article class="platform-card"><h2>الإنجازات</h2><div id="achievementList"></div></article><div id="statsStatus" class="platform-card full platform-muted">جارٍ التحميل…</div></section></main><script src="config-base.js"></script><script type="module" src="v2/stats/app.mjs"></script><script type="module" src="v2/site/shell.mjs"></script></body></html>
