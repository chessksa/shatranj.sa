    /* Mobile opponent search polish */
    @media(max-width:900px){

    #mobilePullRefresh{position:fixed;z-index:120;top:6px;left:50%;transform:translate(-50%,-56px);min-width:122px;height:34px;padding:0 13px;border:1px solid rgba(224,181,103,.55);border-radius:18px;background:rgba(3,43,48,.96);color:#f4cd67;display:flex;align-items:center;justify-content:center;font:700 11px Arial,sans-serif;opacity:0;pointer-events:none;transition:transform .16s ease,opacity .16s ease;box-shadow:0 6px 18px rgba(0,0,0,.24)}
    #mobilePullRefresh.visible{opacity:1}

  </style>

</head>
<body>
  <div id="mobilePullRefresh" aria-hidden="true">اسحب للتحديث</div>
  <section class="legacy-matchmaking" id="matchmakingScreen" hidden>
    <div id="matchmakingSetup"><div id="matchmakingProfile"></div><div id="matchmakingError"></div></div>
    <div id="matchmakingWaiting" hidden><span id="matchmakingRange"></span><span id="matchmakingElapsed"></span><button id="cancelMatchmaking" type="button">إلغاء</button><div id="matchmakingWaitingError"></div></div>
    <div id="matchmakingFound" hidden><span id="matchmakingOpponent"></span></div>
  </section>

  <main class="page" id="gamePage">
    <div class="layout">
      <section class="board-panel">
        <div class="board-frame">
          <div class="coords-left" id="coordsLeft"></div>
          <div class="board-shell"><div id="board" class="board" aria-label="رقعة الشطرنج"></div><div id="moveHints" class="move-hints" aria-hidden="true"></div></div>
          <div class="coords-bottom" id="coordsBottom"></div>
        </div>

        <section class="actions-card" id="gameActions">
            <button class="action-item" id="resignBtn" type="button"><span class="action-icon">🏳</span><span class="action-label">استسلام</span></button>
            <button class="action-item" id="drawOffer" type="button"><span class="action-icon">🤝</span><span class="action-label">عرض تعادل</span></button>
            <button class="action-item grace-end-action" id="endGraceBtn" type="button" disabled><span class="action-icon">✕</span><span class="action-label">إنهاء</span><span class="grace-countdown" id="endGraceCountdown">5</span><span class="grace-note">خلال 5 ثوانٍ دون خصم نقاط</span></button>
        </section>
      </section>

      <aside class="side-panel">
        <div class="panel-stack">
          <div class="side-header">
            <div class="side-brand"><span class="side-brand-mark">♟</span><span>شطرنج العرب</span></div>
            <div class="side-header-actions">
              <button class="side-icon-btn" id="leaveBtn" type="button"><span id="leaveText">الرئيسية</span></button>
              <div id="siteNotificationHost"></div>
              <button class="side-icon-btn" id="reportBtn" type="button">⚑ إبلاغ</button>
            </div>
          </div>

          <section class="player-card opponent-slot" id="topPlayerCard">
            <div class="opponent-search-panel" id="opponentSearchPanel">
              <div id="opponentSearchSetup">
                <div class="opponent-search-title">اختر زمن المباراة</div>
                <div class="opponent-time-options">
                  <button class="opponent-time-option" type="button" data-minutes="5"><strong>5</strong><span>دقائق</span></button>
                  <button class="opponent-time-option" type="button" data-minutes="10"><strong>10</strong><span>دقائق</span></button>
                  <button class="opponent-time-option" type="button" data-minutes="15"><strong>15</strong><span>دقائق</span></button>
                </div>
                <p class="opponent-search-error" id="opponentSearchError"></p>
              </div>
              <div id="opponentSearchWaiting" hidden>
                <div class="opponent-waiting-line"><span class="search-dots" aria-hidden="true"><i></i><i></i><i></i></span><strong>جارٍ البحث عن خصم</strong></div>
                <div class="opponent-waiting-meta"><span>النطاق <b id="inlineMatchmakingRange">±150</b></span><span>الانتظار <b id="inlineMatchmakingElapsed">00:00</b></span></div>
                <button class="inline-cancel-search" id="cancelInlineMatchmaking" type="button">إلغاء البحث</button>
                <p class="opponent-search-error" id="opponentSearchWaitingError"></p>
              </div>
            </div>
            <div class="top-player-live" id="topPlayerLive" hidden>
              <div class="avatar" id="topAvatar"><img class="avatar-img" id="topAvatarImg" alt="" hidden></div>
              <div class="player-info"><a class="name" id="topName">—</a><div class="location"><span id="topLocation">—</span></div><div class="rating"><span class="rating-label">النقاط</span><span id="topRating">—</span></div><div class="status">متصل</div></div>
              <div class="clock-box"><div class="clock" id="topClock">--:--</div><div class="clock-progress"><span></span></div></div>
            </div>
          </section>


          <section class="player-card" id="bottomPlayerCard">
            <div class="avatar light" id="bottomAvatar"><img class="avatar-img" id="bottomAvatarImg" alt="" hidden></div>
            <div class="player-info"><a class="name" id="bottomName">أنت</a><div class="location"><span id="bottomLocation">—</span></div><div class="rating"><span class="rating-label">النقاط</span><span id="bottomRating">—</span></div><div class="status">متصل</div></div>
            <div class="clock-box"><div class="clock" id="bottomClock">--:--</div><div class="clock-progress"><span></span></div></div>
          </section>
        </div>
      </aside>
    </div>
  </main>

  <div class="report-modal" id="reportModal" hidden>
    <div class="report-card"><h2 id="reportTitle">إبلاغ عن اللاعب</h2><p>اكتب سبب البلاغ بوضوح.</p><textarea id="reportReason" maxlength="1000"></textarea><div class="report-actions"><button class="report-submit" id="submitReport" type="button">إرسال البلاغ</button><button class="report-cancel" id="cancelReport" type="button">إلغاء</button></div><p class="report-message" id="reportMessage"></p></div>
  </div>
  <div class="game-toast" id="gameToast" hidden></div>

  <script src="config.js?v=20260903-2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="site-notifications.js"></script>
  <script src="exact-board-v13.js?v=20260903-14"></script>
  <script>
    (()=>{
      const desktopMedia=window.matchMedia('(min-width:901px)');
      const gameActions=document.getElementById('gameActions');
      const boardPanel=document.querySelector('.board-panel');
      const desktopStack=document.querySelector('.panel-stack');
      const bottomPlayerCard=document.getElementById('bottomPlayerCard');
      const placeGameActions=()=>{
        if(!gameActions||!boardPanel||!desktopStack||!bottomPlayerCard) return;
        if(desktopMedia.matches){
          desktopStack.insertBefore(gameActions, bottomPlayerCard);
        }else{
          boardPanel.appendChild(gameActions);
        }
      };
      placeGameActions();
      if(desktopMedia.addEventListener) desktopMedia.addEventListener('change',placeGameActions);
      else desktopMedia.addListener(placeGameActions);
    })();
  </script>

  <script type="module">
    const params = new URLSearchParams(location.search);
    const computerMode = params.has('computer');
    const hasGame = Boolean(params.get('game'));
    if(computerMode){
      document.body.classList.add('pregame','computer-game');
      const s=document.createElement('script');
      s.type='module';
      s.src='play-computer.js?v=20260906-3';
      document.body.appendChild(s);
    }else if(hasGame){
      document.body.classList.add('live-game');
      document.getElementById('opponentSearchPanel').hidden = true;
      document.getElementById('topPlayerLive').hidden = false;
      const s=document.createElement('script');
      s.type='module';
      s.src='play-v8.js?v=20260905-3';
      document.body.appendChild(s);
    }else{
      document.body.classList.add('pregame');
      const s=document.createElement('script');
      s.type='module';
      s.src='play-v10-match.js?v=20260905-3';
      document.body.appendChild(s);
    }
  </script>

  <script>
    (()=>{
      const indicator=document.getElementById('mobilePullRefresh');
      if(!indicator || !window.matchMedia('(max-width:900px)').matches) return;
      const PULL_REFRESH_THRESHOLD=72;
      const PULL_ACTIVATE_DISTANCE=12;
      let pullStartY=0;
      let pullDistance=0;
      let pullActive=false;

      const resetPull=()=>{
        pullActive=false;
        pullDistance=0;
        indicator.classList.remove('visible','ready');
        indicator.style.transform='translate(-50%,-56px)';
        indicator.textContent='اسحب للتحديث';
      };
      const handlePullStart=(event)=>{
        if(!document.body.classList.contains('pregame')) return resetPull();
        if(event.touches.length!==1) return resetPull();
        pullStartY=event.touches[0].clientY;
        pullActive=true;
      };
      const handlePullMove=(event)=>{
        if(!document.body.classList.contains('pregame')) return resetPull();
        if(!pullActive || event.touches.length!==1) return;
        const distance=event.touches[0].clientY-pullStartY;
        if(distance<=0) return resetPull();
        if(distance<PULL_ACTIVATE_DISTANCE) return;
        pullDistance=Math.min(distance,110);
        event.preventDefault();
        const shown=Math.min(42,pullDistance*.45);
        indicator.classList.add('visible');
        indicator.classList.toggle('ready',pullDistance>=PULL_REFRESH_THRESHOLD);
        indicator.style.transform=`translate(-50%,${shown-40}px)`;
        indicator.textContent=pullDistance>=PULL_REFRESH_THRESHOLD?'اترك للتحديث':'اسحب للتحديث';
      };
      const handlePullEnd=()=>{
        if(!document.body.classList.contains('pregame')) return resetPull();
        if(!pullActive) return resetPull();
        const shouldRefresh=pullDistance>=PULL_REFRESH_THRESHOLD;
        if(!shouldRefresh) return resetPull();
        indicator.classList.add('visible','ready');
        indicator.style.transform='translate(-50%,2px)';
        indicator.textContent='جارٍ التحديث…';
        setTimeout(()=>location.reload(),80);
      };
      document.addEventListener('touchstart',handlePullStart,{passive:true});
      document.addEventListener('touchmove',handlePullMove,{passive:false});
      document.addEventListener('touchend',handlePullEnd,{passive:true});
      document.addEventListener('touchcancel',resetPull,{passive:true});
    })();
  </script>
