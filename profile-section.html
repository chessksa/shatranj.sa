<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>قسم العضو | شطرنج السعودية</title>
  <meta name="theme-color" content="#082d2f" />
  <style>
    :root{--bg:#082d2f;--panel:#103f40;--panel-soft:rgba(13,56,57,.88);--gold:#d4b467;--cream:#f4eddc;--muted:#adc1bc;--line:rgba(212,180,103,.22);--danger:#d96c6c;--good:#74b38b}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:linear-gradient(145deg,#082d2f,#0a3839 55%,#08292b);color:var(--cream)}
    a{color:inherit;text-decoration:none}button,select{font:inherit}button{cursor:pointer}
    .shell{width:min(920px,calc(100% - 24px));margin:auto;padding:10px 0 26px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;margin-bottom:8px;background:rgba(8,45,47,.95);border:1px solid var(--line);border-radius:14px}
    .brand{display:flex;align-items:center;gap:8px;font-weight:800}.brand-mark{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;color:var(--gold);font-size:21px}
    .back{min-height:38px;display:inline-flex;align-items:center;justify-content:center;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.04);font-size:13px}
    .section-card{background:rgba(13,56,57,.88);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 26px rgba(0,0,0,.10)}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.section-head h1{margin:0;font-size:21px}.count{min-width:30px;height:28px;padding:0 8px;display:grid;place-items:center;border-radius:14px;background:rgba(212,180,103,.14);color:var(--gold);font-weight:800;font-size:13px}
    .list{display:grid;gap:7px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px;border:1px solid rgba(255,255,255,.07);border-radius:10px;background:rgba(255,255,255,.025)}
    .row-title{font-weight:800}.row-meta{margin-top:3px;color:var(--muted);font-size:12px}.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.mini{min-height:36px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--cream);font-size:12px}.mini.ok{color:#d7ffe4;border-color:rgba(116,179,139,.4)}.mini.no{color:#ffd6d6;border-color:rgba(217,108,108,.35)}
    .presence{display:inline-flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%;background:#6c7f7c}.dot.online{background:#66c58a;box-shadow:0 0 0 3px rgba(102,197,138,.12)}
    .empty{padding:22px 8px;text-align:center;color:var(--muted)}.loading{padding:36px 8px;text-align:center;color:var(--muted)}
    .toast{position:fixed;left:18px;bottom:18px;max-width:min(360px,calc(100% - 36px));padding:11px 14px;border-radius:11px;background:#153e3f;border:1px solid var(--line);box-shadow:0 16px 35px rgba(0,0,0,.22);opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s;z-index:30}.toast.show{opacity:1;transform:none}.toast.error{border-color:rgba(217,108,108,.55)}
    .modal{position:fixed;inset:0;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.58);z-index:40}.modal[hidden]{display:none}.modal-card{width:min(420px,100%);padding:16px;background:#103f40;border:1px solid var(--line);border-radius:14px}.modal-card h3{margin:0 0 7px}.modal-card p{margin:0 0 12px;color:var(--muted)}.select{width:100%;padding:10px;background:#0b3435;color:var(--cream);border:1px solid var(--line);border-radius:9px}.modal-actions{display:flex;gap:7px;margin-top:12px}.modal-actions button{flex:1;min-height:39px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.04);color:var(--cream)}.modal-actions .gold{background:var(--gold);border-color:var(--gold);color:#173536;font-weight:800}
    @media(max-width:620px){.shell{width:calc(100% - 16px);padding-top:7px}.topbar{padding:6px 8px}.brand span:last-child{display:none}.section-card{padding:10px}.section-head h1{font-size:19px}.row{grid-template-columns:1fr}.row-actions{justify-content:flex-start}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="brand-mark">♞</span><span>شطرنج السعودية</span></a>
      <a class="back" href="profile.html">العودة للوحة العضو</a>
    </header>

    <main class="section-card">
      <div class="section-head"><h1 id="sectionTitle">—</h1><span class="count" id="sectionCount">0</span></div>
      <div class="loading" id="loadingState">جاري التحميل...</div>
      <div class="list" id="sectionList" hidden></div>
    </main>
  </div>

  <div class="modal" id="challengeModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="challengeModalTitle">
      <h3 id="challengeModalTitle">تحدي صديق</h3>
      <p id="challengeTargetName">اختر زمن المباراة.</p>
      <select class="select" id="challengeMinutes" aria-label="زمن التحدي">
        <option value="3">3 دقائق</option>
        <option value="5">5 دقائق</option>
        <option value="10">10 دقائق</option>
      </select>
      <div class="modal-actions">
        <button class="gold" id="sendChallengeBtn" type="button">إرسال التحدي</button>
        <button id="cancelChallengeModalBtn" type="button">إلغاء</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="profile-section.js?v=20260903-1"></script>
</body>
</html>
