<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#022f33"><title>المجتمع | شطرنج العرب</title><link rel="stylesheet" href="v2/site/shell.css"><link rel="stylesheet" href="v2/platform/page.css"><style>.community-search{display:grid;grid-template-columns:1fr auto;gap:8px}.social-list{display:grid;gap:4px}.social-person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(216,182,101,.12)}.social-person:last-child{border-bottom:0}.social-name{font-weight:900}.social-meta{font-size:11px;color:var(--p-muted);margin-top:3px}.challenge-time{display:flex;gap:5px}.challenge-time button.active{background:var(--p-gold);color:#173536}.chat-panel{position:fixed;z-index:10020;inset:0;display:grid;place-items:center;padding:16px;background:rgba(0,20,22,.72)}.chat-panel[hidden]{display:none}.chat-card{width:min(100%,540px);max-height:78dvh;border:1px solid var(--p-line);border-radius:18px;background:#073638;padding:14px;display:grid;grid-template-rows:auto minmax(180px,1fr) auto;gap:10px}.chat-head{display:flex;align-items:center;justify-content:space-between}.chat-head button{width:36px;height:36px}.chat-messages{overflow:auto;display:flex;flex-direction:column;gap:7px}.chat-message{max-width:82%;padding:8px 10px;border-radius:11px;background:rgba(255,255,255,.06);font-size:13px}.chat-message.mine{align-self:flex-start;background:rgba(216,182,101,.16)}.chat-message.theirs{align-self:flex-end}.chat-compose{display:grid;grid-template-columns:1fr auto;gap:7px}@media(max-width:700px){.community-search{grid-template-columns:1fr}.social-person{grid-template-columns:1fr}.social-person .platform-actions{justify-content:flex-start}}

button class="platform-btn primary" type="submit">إرسال</button></form></section></div><script src="config-base.js"></script><script type="module" src="v2/social/app.mjs"></script><script type="module" src="v2/site/shell.mjs"></script></body></html>
