<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#262522">
<title>الإعدادات | شطرنج العرب</title>
<link rel="stylesheet" href="v2/site/shell.css"><link rel="stylesheet" href="v2/site/typography-system.css?v=20261006-type1">
<style>
:root{--bg:#302e2b;--bg2:#302e2b;--panel:#302e2b;--panel2:#302e2b;--gold:#e2dcd3;--cream:#e2dcd3;--muted:#d6cfbf;--line:rgba(165,162,158,0.28);--board-light:#F1EEE8;--board-dark:#925A4E;--board-line:rgba(91,56,35,.24)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}body{background:radial-gradient(circle at 15% 18%,rgba(69,66,62,0.2),transparent 26%),linear-gradient(135deg,var(--bg),var(--bg2) 52%,var(--panel2));color:var(--cream)}button,select,input{font:inherit}.settings-shell{width:min(1180px,calc(100% - 28px));margin:auto;padding:24px 0 42px}.settings-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.settings-title h1{margin:0;font-size:28px}.settings-title p{margin:3px 0 0;color:var(--muted);font-size:13px}.settings-grid{display:grid;grid-template-columns:minmax(320px,.72fr) minmax(420px,1.28fr);gap:14px;align-items:start}.card{background:rgba(69,66,62,0.9);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 12px 30px rgba(0,0,0,.18)}.card h2{margin:0 0 12px;font-size:18px}.account-card{grid-column:1/-1}.preview-board{width:min(100%,520px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);margin:auto;border:3px solid #625f5b;overflow:hidden}.preview-square{position:relative;display:grid;place-items:center;border:.5px solid var(--board-line);min-width:0;min-height:0}.preview-square.light{background:var(--board-light)}.preview-square.dark{background:var(--board-dark)}.preview-square img{width:84%;height:84%;object-fit:contain;pointer-events:none}.preview-square[data-coordinate]::after{content:attr(data-coordinate);position:absolute;right:3px;bottom:2px;font-size:8px;font-weight:900;color:rgba(20,30,25,.62)}.preview-board[data-coordinates="off"] .preview-square::after{display:none}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.option{display:grid;gap:6px;padding:10px;border:1px solid rgba(255,255,255,.08);border-radius:11px;background:rgba(255,255,255,.025)}.option span{font-size:12px;color:var(--muted)}.option select,.option input[type="text"]{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--cream);padding:0 9px}.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}.toggle input{width:20px;height:20px;accent-color:var(--gold)}.v2-theme-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.v2-theme-option{border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.025);color:var(--cream);padding:7px;display:grid;gap:6px;cursor:pointer}.v2-theme-option.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(165,162,158,0.15)}.v2-theme-preview{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:2/1;border-radius:6px;overflow:hidden}.v2-theme-preview i{display:block}.v2-theme-option strong{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{min-height:22px;margin-top:10px;color:var(--gold);font-size:12px;font-weight:800}.status.error{color:#ffb6a8}.settings-save{height:42px;border:1px solid var(--gold);border-radius:10px;background:var(--gold);color:#302e2b;font-weight:900;padding:0 18px;cursor:pointer}.settings-save:disabled{opacity:.55;cursor:not-allowed}.account-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
@media(max-width:900px){.settings-shell{width:min(100% - 18px,1180px);padding-top:12px}.settings-grid{grid-template-columns:1fr}.account-card{grid-column:auto}.preview-card{order:-1}.v2-theme-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:520px){.settings-title h1{font-size:22px}.options{grid-template-columns:1fr}.v2-theme-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:12px}}

/* Original Lichess Wood 4 board artwork, loaded locally. */
#v2-settings-preview-board[data-board-theme="shatranj"],
.v2-theme-option[data-theme="shatranj"] .v2-theme-preview{
  background:#9b958d url("assets/boards/wood4.jpg") center/100% 100% no-repeat;
}
#v2-settings-preview-board[data-board-theme="shatranj"] .preview-square.light,
.v2-theme-option[data-theme="shatranj"] .v2-theme-preview i:nth-child(1),
.v2-theme-option[data-theme="shatranj"] .v2-theme-preview i:nth-child(4){
  background:rgba(165,162,158,0.43)!important;
}
#v2-settings-preview-board[data-board-theme="shatranj"] .preview-square.dark,
.v2-theme-option[data-theme="shatranj"] .v2-theme-preview i:nth-child(2),
.v2-theme-option[data-theme="shatranj"] .v2-theme-preview i:nth-child(3){
  background:rgba(49,24,11,.36)!important;
}
.board-texture-credit{margin:15px 2px 0;font-size:11px;color:#bacac7;text-align:center}
.board-texture-credit a{color:#e2dcd3;text-underline-offset:2px}
</style>
<link rel="stylesheet" href="site-charcoal-theme.css?v=20261012-charcoal-all-v3">
</head>
<body>
<main class="settings-shell">
  <div class="settings-title"><div><h1>الإعدادات</h1><p>إعدادات الحساب والخصوصية والرقعة في مكان واحد.</p></div></div>
  <div class="settings-grid">
    <section class="card account-card"><h2>الحساب والخصوصية</h2><div class="options">
      <label class="option"><span>من يستطيع تحديك</span><select id="v5-allow-challenges"><option value="everyone">الجميع</option><option value="friends">الأصدقاء فقط</option><option value="nobody">لا أحد</option></select></label>
      <label class="option"><span>من يستطيع مراسلتك</span><select id="v5-allow-messages"><option value="everyone">الجميع</option><option value="friends">الأصدقاء فقط</option><option value="nobody">لا أحد</option></select></label>
      <label class="option toggle"><span>إظهار حالة الاتصال</span><input id="v5-show-online" type="checkbox" checked></label>
      <label class="option toggle"><span>إشعارات الموقع</span><input id="v5-site-notifications" type="checkbox" checked></label>
      <label class="option toggle"><span>الصوت</span><input id="v5-sound-enabled" type="checkbox" checked></label>
      <label class="option"><span>اللغة</span><select id="v5-language"><option value="ar">العربية</option><option value="en">English</option></select></label>
      <label class="option"><span>المنطقة الزمنية</span><input id="v5-timezone" type="text" value="Asia/Riyadh" autocomplete="off"></label>
    </div><div class="account-actions"><button id="v5-settings-save" class="settings-save" type="button">حفظ إعدادات الحساب</button></div><div id="v5-account-status" class="status" role="status"></div></section>

    <section class="card preview-card"><h2>معاينة حية</h2><div id="v2-settings-preview-board" class="preview-board" aria-label="معاينة الرقعة"></div><div id="v2-settings-status" class="status" role="status"></div></section>
    <section class="card"><h2>ألوان الرقعة</h2><div id="v2-settings-theme-picker" class="v2-theme-grid"></div></section>
    <section class="card"><h2>خيارات اللعب والعرض</h2><div class="options">
      <label class="option"><span>الإحداثيات</span><select id="v2-setting-coordinates"><option value="inside">داخل الرقعة</option><option value="outside">خارج الرقعة</option><option value="off">بدون</option></select></label>
      <label class="option"><span>حركة القطع</span><select id="v2-setting-animation"><option value="none">بدون</option><option value="slow">بطيئة</option><option value="medium">متوسطة</option><option value="fast">سريعة</option><option value="natural">طبيعية</option><option value="arcade">Arcade</option></select></label>
      <label class="option"><span>طريقة النقل</span><select id="v2-setting-move-method"><option value="both">النقر والسحب</option><option value="click">النقر</option><option value="drag">السحب</option></select></label>
      <label class="option toggle"><span>إظهار النقلات القانونية</span><input id="v2-setting-legal" type="checkbox"></label>
      <label class="option toggle"><span>الأبيض دائمًا أسفل</span><input id="v2-setting-white-bottom" type="checkbox"></label>
    </div></section>
  </div>
  <p class="board-texture-credit">خامة الرقعة: <a href="assets/boards/SOURCE.md" target="_blank" rel="noopener noreferrer">Lichess Wood 4</a> · <a href="licenses/AGPL-3.0.txt" target="_blank" rel="noopener noreferrer">ترخيص AGPLv3+</a></p>
</main>
<script src="config-base.js"></script>
<script type="module" src="v2/settings/account.mjs"></script>
<script type="module" src="v2/board/settings-page.mjs?v=20261011-lichess-wood4-original-v1"></script>
<script type="module" src="v2/site/shell.mjs"></script>
</body>
</html>
