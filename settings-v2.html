<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082d2f">
<title>إعدادات الرقعة | شطرنج العرب</title>
<link rel="stylesheet" href="v2/site/shell.css">
<style>
:root{--bg:#082d2f;--panel:#103f40;--panel2:#16494a;--gold:#d4b467;--cream:#f4eddc;--muted:#adc1bc;--line:rgba(212,180,103,.22);--board-light:#e8dec8;--board-dark:#87966a;--board-line:rgba(35,42,32,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}body{background:linear-gradient(145deg,var(--bg),#0a3839 55%,#08292b);color:var(--cream)}button,select{font:inherit}.settings-shell{width:min(1180px,calc(100% - 28px));margin:auto;padding:24px 0 42px}.settings-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.settings-title h1{margin:0;font-size:28px}.settings-title p{margin:3px 0 0;color:var(--muted);font-size:13px}.settings-grid{display:grid;grid-template-columns:minmax(320px,.72fr) minmax(420px,1.28fr);gap:14px;align-items:start}.card{background:rgba(16,63,64,.9);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 12px 30px rgba(0,0,0,.14)}.card h2{margin:0 0 12px;font-size:18px}.preview-board{width:min(100%,520px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);margin:auto;border:3px solid #66503b;overflow:hidden}.preview-square{position:relative;display:grid;place-items:center;border:.5px solid var(--board-line);min-width:0;min-height:0}.preview-square.light{background:var(--board-light)}.preview-square.dark{background:var(--board-dark)}.preview-square img{width:84%;height:84%;object-fit:contain;pointer-events:none}.preview-square[data-coordinate]::after{content:attr(data-coordinate);position:absolute;right:3px;bottom:2px;font-size:8px;font-weight:900;color:rgba(20,30,25,.62)}.preview-board[data-coordinates="off"] .preview-square::after{display:none}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.option{display:grid;gap:6px;padding:10px;border:1px solid rgba(255,255,255,.08);border-radius:11px;background:rgba(255,255,255,.025)}.option span{font-size:12px;color:var(--muted)}.option select{height:40px;border-radius:9px;border:1px solid var(--line);background:#0b3435;color:var(--cream);padding:0 9px}.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}.toggle input{width:20px;height:20px;accent-color:var(--gold)}.v2-theme-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.v2-theme-option{border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.025);color:var(--cream);padding:7px;display:grid;gap:6px;cursor:pointer}.v2-theme-option.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,180,103,.15)}.v2-theme-preview{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:2/1;border-radius:6px;overflow:hidden}.v2-theme-preview i{display:block}.v2-theme-option strong{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{min-height:22px;margin-top:10px;color:var(--gold);font-size:12px;font-weight:800}
@media(max-width:900px){.settings-shell{width:min(100% - 18px,1180px);padding-top:12px}.settings-grid{grid-template-columns:1fr}.preview-card{order:-1}.v2-theme-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:520px){.settings-title h1{font-size:22px}.options{grid-template-columns:1fr}.v2-theme-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:12px}}
</style>
</head>
<body>
<main class="settings-shell">
  <div class="settings-title"><div><h1>إعدادات الرقعة</h1><p>اختر مظهر الرقعة وطريقة عرضها. ألوان الموقع الأساسية لن تتغير.</p></div></div>
  <div class="settings-grid">
    <section class="card preview-card"><h2>معاينة حية</h2><div id="v2-settings-preview-board" class="preview-board" aria-label="معاينة الرقعة"></div><div id="v2-settings-status" class="status" role="status"></div></section>
    <section class="card"><h2>ألوان الرقعة</h2><div id="v2-settings-theme-picker" class="v2-theme-grid"></div></section>
    <section class="card"><h2>خيارات اللعب والعرض</h2><div class="options">
      <label class="option"><span>الإحداثيات</span><select id="v2-setting-coordinates"><option value="inside">داخل الرقعة</option><option value="outside">خارج الرقعة</option><option value="off">بدون</option></select></label>
      <label class="option"><span>حركة القطع</span><select id="v2-setting-animation"><option value="none">بدون</option><option value="slow">بطيئة</option><option value="medium">متوسطة</option><option value="fast">سريعة</option><option value="natural">طبيعية</option><option value="arcade">Arcade</option></select></label>
      <label class="option"><span>طريقة النقل</span><select id="v2-setting-move-method"><option value="both">النقر والسحب</option><option value="click">النقر</option><option value="drag">السحب</option></select></label>
      <label class="option toggle"><span>إظهار النقلات القانونية</span><input id="v2-setting-legal" type="checkbox"></label>
      <label class="option toggle"><span>الأبيض دائمًا أسفل</span><input id="v2-setting-white-bottom" type="checkbox"></label>
    </div></section>
  </div>
</main>
<script type="module" src="v2/board/settings-page.mjs"></script>
<script type="module" src="v2/site/shell.mjs"></script>
</body>
</html>
