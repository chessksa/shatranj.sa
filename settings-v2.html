<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1d21">
<title>الإعدادات | شطرنج العرب</title>
<link rel="stylesheet" href="v2/site/shell.css?v=20261012-source-palette-v5"><link rel="stylesheet" href="v2/site/typography-system.css?v=20261012-source-palette-v5">
<style>
:root{
  --bg:#1a1d21;--panel:#2d3239;--gold:#d5dbe2;
  --cream:#e9edf1;--muted:#bfc6cf;--line:#48515b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
body{background:#1a1d21;color:var(--cream);direction:rtl}
button,select,input{font:inherit}
.settings-shell{width:min(100% - 20px,1000px);margin:0 auto;padding:14px 0 28px}
.settings-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.settings-title h1{margin:0;font-size:23px;font-weight:900}
.settings-title p{margin:3px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.card{min-width:0;background:linear-gradient(180deg,#363b43,#22262b);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:none}
.card h2{margin:0 0 11px;font-size:17px;font-weight:900}
.account-card{grid-column:1/-1}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.option{min-width:0;display:grid;gap:6px;padding:9px;border:1px solid #3b444e;border-radius:9px;background:#292e35}
.option span{font-size:12px;color:var(--muted)}
.option select,.option input[type="text"]{width:100%;min-width:0;height:38px;border-radius:8px;border:1px solid var(--line);background:#202429;color:var(--cream);padding:0 8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toggle input{width:19px;height:19px;accent-color:#9bc6fd}
.v2-theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.v2-theme-option{min-width:0;border:1px solid #48515b;border-radius:9px;background:#292e35;color:var(--cream);padding:7px;display:grid;gap:6px;cursor:pointer;transition:border-color .15s,background-color .15s}
.v2-theme-option:hover{background:#363c45;border-color:#718196}
.v2-theme-option.active{border-color:#9bc6fd;box-shadow:inset 0 0 0 1px #9bc6fd}
.v2-theme-option:focus-visible{outline:2px solid #9bc6fd;outline-offset:2px}
.v2-theme-preview{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:2/1;border-radius:5px;overflow:hidden}
.v2-theme-preview i{display:block}
.v2-theme-option strong{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{min-height:18px;margin-top:8px;color:#9bc6fd;font-size:12px;font-weight:800}
.status:empty{min-height:0;margin-top:0}
.status.error{color:#ffb6a8}
.settings-save{min-height:40px;border:1px solid #9bc6fd;border-radius:9px;background:#9bc6fd;color:#18242d;font-weight:900;padding:0 14px;cursor:pointer}
.settings-save:disabled{opacity:.55;cursor:not-allowed}
.account-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
@media(max-width:900px){
  .settings-shell{width:min(100% - 16px,1000px);padding-top:10px}
  .settings-grid{grid-template-columns:1fr;gap:10px}
  .account-card{grid-column:auto}
  .card{padding:12px}
}
@media(max-width:560px){
  .settings-title h1{font-size:20px}
  .options{grid-template-columns:1fr}
}
@media(max-width:360px){
  .v2-theme-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* Retain the original local Lichess Wood 4 swatch without a redundant full-size board. */
.v2-theme-option[data-theme="shatranj"] .v2-theme-preview{
  background:#9b958d url("assets/boards/wood4.jpg") center/100% 100% no-repeat;
}
.v2-theme-option[data-theme="shatranj"] .v2-theme-preview i:nth-child(1),
.v2-theme-option[data-theme="shatranj"] .v2-theme-preview i:nth-child(4){
  background:rgba(165,162,158,.43)!important;
}
.v2-theme-option[data-theme="shatranj"] .v2-theme-preview i:nth-child(2),
.v2-theme-option[data-theme="shatranj"] .v2-theme-preview i:nth-child(3){
  background:rgba(49,24,11,.36)!important;
}
.board-texture-credit{margin:12px 2px 0;font-size:11px;color:#bacac7;text-align:center}
.board-texture-credit a{color:#d5dbe2;text-underline-offset:2px}
</style>
<link rel="stylesheet" href="site-charcoal-theme.css?v=20261013-monitor-graphite-v1">
</head>
<body>
<main class="settings-shell">
  <div class="settings-title"><div><h1>الإعدادات</h1><p>إعدادات الحساب والخصوصية والرقعة في مكان واحد.</p></div></div>
  <div class="settings-grid">


    <section class="card board-colors-card"><h2>ألوان الرقعة</h2><div id="v2-settings-theme-picker" class="v2-theme-grid"></div><div id="v2-settings-status" class="status" role="status" aria-live="polite"></div></section>
    <section class="card"><h2>خيارات اللعب والعرض</h2><div class="options">
      <label class="option"><span>الإحداثيات</span><select id="v2-setting-coordinates"><option value="inside">داخل الرقعة</option><option value="outside">خارج الرقعة</option><option value="off">بدون</option></select></label>
      <label class="option"><span>حركة القطع</span><select id="v2-setting-animation"><option value="none">بدون</option><option value="slow">بطيئة</option><option value="medium">متوسطة</option><option value="fast">سريعة</option><option value="natural">طبيعية</option><option value="arcade">Arcade</option></select></label>
      <label class="option"><span>طريقة النقل</span><select id="v2-setting-move-method"><option value="both">النقر والسحب</option><option value="click">النقر</option><option value="drag">السحب</option></select></label>
      <label class="option toggle"><span>إظهار النقلات القانونية</span><input id="v2-setting-legal" type="checkbox"></label>
      <label class="option toggle"><span>الأبيض دائمًا أسفل</span><input id="v2-setting-white-bottom" type="checkbox"></label>
    </div></section>
    <section class="card account-card"><h2>الحساب والخصوصية</h2><div class="options">
      <label class="option"><span>من يستطيع تحديك</span><select id="v5-allow-challenges"><option value="everyone">الجميع</option><option value="friends">الأصدقاء فقط</option><option value="nobody">لا أحد</option></select></label>
      <label class="option"><span>من يستطيع مراسلتك</span><select id="v5-allow-messages"><option value="everyone">الجميع</option><option value="friends">الأصدقاء فقط</option><option value="nobody">لا أحد</option></select></label>
      <label class="option toggle"><span>إظهار حالة الاتصال</span><input id="v5-show-online" type="checkbox" checked></label>
      <label class="option toggle"><span>إشعارات الموقع</span><input id="v5-site-notifications" type="checkbox" checked></label>
      <label class="option toggle"><span>الصوت</span><input id="v5-sound-enabled" type="checkbox" checked></label>
      <label class="option"><span>اللغة</span><select id="v5-language"><option value="ar">العربية</option><option value="en">English</option></select></label>
      <label class="option"><span>المنطقة الزمنية</span><input id="v5-timezone" type="text" value="Asia/Riyadh" autocomplete="off"></label>
    </div><div class="account-actions"><button id="v5-settings-save" class="settings-save" type="button">حفظ إعدادات الحساب</button></div><div id="v5-account-status" class="status" role="status"></div></section>
  </div>
  <p class="board-texture-credit">خامة الرقعة: <a href="assets/boards/SOURCE.md" target="_blank" rel="noopener noreferrer">Lichess Wood 4</a> · <a href="licenses/AGPL-3.0.txt" target="_blank" rel="noopener noreferrer">ترخيص AGPLv3+</a></p>
</main>
<script src="config-base.js"></script>
<script type="module" src="v2/settings/account.mjs"></script>
<script type="module" src="v2/board/settings-page.mjs?v=20261013-live-home-board-v1"></script>
<script type="module" src="v2/site/shell.mjs"></script>
</body>
</html>
