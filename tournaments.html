<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#042628">
<title>البطولات | شطرنج العرب</title>
<style>
*{box-sizing:border-box}
:root{--hero-deep:#062f31;--hero-deeper:#042628;--hero-panel:#0b4143;--hero-panel-2:#083638;--hero-gold:#d8b665;--hero-gold-2:#efcf7c;--hero-cream:#f4eddc;--hero-muted:#b7c7c2;--hero-line:rgba(216,182,101,.26);--hero-cyan-line:rgba(46,147,147,.42)}
html{background:var(--hero-deeper);color-scheme:dark}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at 18% 34%,rgba(26,104,105,.23),transparent 29%),radial-gradient(circle at 78% 13%,rgba(216,182,101,.06),transparent 22%),linear-gradient(145deg,var(--hero-deeper),var(--hero-deep) 50%,#07383a);color:var(--hero-cream)}
a{text-decoration:none;color:inherit}.wrap{width:min(1180px,calc(100% - 34px));margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(4,39,41,.94);border-bottom:1px solid rgba(216,182,101,.2);box-shadow:0 10px 30px rgba(0,0,0,.14);backdrop-filter:blur(14px)}
.nav{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:23px;font-weight:900}.back{min-height:44px;padding:0 14px;border:1px solid var(--hero-line);border-radius:14px;background:rgba(255,255,255,.035);display:inline-flex;align-items:center;justify-content:center;color:var(--hero-gold);font-size:12px;font-weight:900}.back:hover{background:rgba(216,182,101,.08)}
main{padding:34px 0 48px}.page-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:16px;padding:18px 20px;border:1px solid var(--hero-cyan-line);border-radius:18px;background:linear-gradient(145deg,rgba(8,62,64,.86),rgba(7,49,51,.8));box-shadow:0 13px 30px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.025)}.page-head h1{margin:0;color:var(--hero-gold);font-size:30px}.page-head p{margin:6px 0 0;color:var(--hero-muted);font-size:13px}.count{color:var(--hero-gold-2);font-size:13px;font-weight:900;white-space:nowrap}
.registration-message{min-height:22px;margin:0 0 12px;padding:0 4px;color:var(--hero-muted);font-size:14px;font-weight:800}.registration-message.ok{color:#a7e7bd}.registration-message.error{color:#ffb2a8}
.tournament-table-shell{border:1px solid var(--hero-cyan-line);border-radius:18px;overflow:hidden;background:linear-gradient(145deg,rgba(8,62,64,.86),rgba(7,49,51,.8));box-shadow:0 13px 30px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.025)}
.tournament-table{width:100%;border-collapse:collapse;table-layout:fixed}.tournament-table th,.tournament-table td{padding:13px 14px;border-bottom:1px solid rgba(216,182,101,.18);text-align:right;vertical-align:middle}.tournament-table th{background:rgba(4,38,40,.62);color:#d9c58f;font-size:13px;font-weight:900}.tournament-table td{font-size:14px}.tournament-table th:not(:last-child),.tournament-table td:not(:last-child){border-left:1px solid rgba(216,182,101,.14)}
.tournament-table .num{width:66px;text-align:center;color:var(--hero-gold-2);font-weight:900}.tournament-table .name-col{width:auto}.tournament-table .date-col{width:240px}.tournament-table .status-col{width:130px;text-align:center}.tournament-row{cursor:pointer;transition:.15s ease}.tournament-row:hover,.tournament-row:focus{background:rgba(255,255,255,.045);outline:none}.tournament-row.finished-row{background:rgba(255,255,255,.015)}.tournament-row.finished-row .tournament-name{color:#cbd3cf}.tournament-name{font-size:15px;font-weight:900;color:var(--hero-cream)}.tournament-date{color:var(--hero-muted);font-size:13px}
.status{display:inline-flex;border-radius:999px;padding:6px 10px;border:1px solid var(--hero-line);font-size:13px;font-weight:900}.status-open{background:rgba(84,178,132,.11);color:#8fe0b1}.status-running{background:rgba(216,182,101,.11);color:var(--hero-gold-2)}.status-finished{background:rgba(255,255,255,.06);color:#cbd3cf}.empty{padding:32px;text-align:center;color:var(--hero-muted);font-size:15px;border:1px solid var(--hero-cyan-line);border-radius:16px;background:rgba(7,49,51,.62)}.error{color:#ffabab}
.detail-shell{border:1px solid var(--hero-cyan-line);border-radius:18px;background:linear-gradient(145deg,rgba(8,62,64,.88),rgba(7,49,51,.82));box-shadow:0 13px 30px rgba(0,0,0,.15);overflow:hidden}.detail-toolbar{padding:13px 16px;border-bottom:1px solid rgba(216,182,101,.18);background:rgba(4,38,40,.35)}.detail-back{min-height:40px;padding:0 13px;border:1px solid var(--hero-line);border-radius:11px;background:rgba(255,255,255,.035);color:var(--hero-gold);font:900 13px Arial,sans-serif;cursor:pointer}.detail-card{padding:20px}.detail-title-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.detail-title{margin:0;color:var(--hero-gold);font-size:25px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail-item{padding:12px 14px;border:1px solid rgba(216,182,101,.18);border-radius:12px;background:rgba(3,38,40,.33)}.detail-label{display:block;margin-bottom:5px;color:#d9c58f;font-size:11px;font-weight:900}.detail-value{font-size:15px;font-weight:800}.detail-register{margin-top:16px;padding-top:16px;border-top:1px solid rgba(216,182,101,.18);display:flex;justify-content:flex-start}.register-btn{min-width:132px;min-height:44px;padding:0 15px;border:0;border-radius:11px;background:#f6b26b;color:#3c2614;font:900 14px Arial,sans-serif;cursor:pointer;box-shadow:0 5px 12px rgba(0,0,0,.16)}.register-btn:hover:not(:disabled){background:#ffc27d}.register-btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}.register-btn.registered{background:#b9c7c2;color:#163537;opacity:1}
@media(max-width:700px){.wrap{width:min(100% - 18px,1180px)}.nav{min-height:62px}.brand{font-size:18px}.back{min-height:39px;padding:0 11px}.page-head{align-items:flex-start;flex-direction:column;padding:15px}.page-head h1{font-size:24px}main{padding-top:18px}.tournament-table th,.tournament-table td{padding:10px 7px}.tournament-table th{font-size:11px}.tournament-table td{font-size:12px}.tournament-table .num{width:40px}.tournament-table .date-col{width:120px}.tournament-table .status-col{width:88px}.tournament-name{font-size:13px}.tournament-date{font-size:11px}.status{padding:5px 7px;font-size:11px}.detail-card{padding:15px}.detail-title-row{align-items:flex-start;flex-direction:column}.detail-title{font-size:21px}.detail-grid{grid-template-columns:1fr}.detail-register{justify-content:stretch}.register-btn{width:100%}}
</style>
<script src="config.js"></script>
</head>
<body>
<header><div class="wrap nav"><div class="brand">شطرنج العرب</div><a class="back" href="index.html">العودة للرئيسية</a></div></header>
<main><div class="wrap">
  <div class="page-head"><div><h1>البطولات</h1><p>اختر البطولة لعرض تفاصيلها والتسجيل فيها.</p></div><div id="tournamentCount" class="count">0 بطولة</div></div>
  <div id="registrationMsg" class="registration-message" role="status" aria-live="polite"></div>
  <section id="tournamentListView" aria-label="قائمة البطولات">
    <div class="tournament-table-shell">
      <table class="tournament-table" aria-label="قائمة البطولات">
        <thead><tr><th class="num">#</th><th class="name-col">اسم البطولة</th><th class="date-col">الموعد</th><th class="status-col">الحالة</th></tr></thead>
        <tbody id="tournamentList"></tbody>
      </table>
    </div>
    <div id="tournamentEmpty" class="empty">جاري تحميل البطولات...</div>
  </section>
  <section id="tournamentDetailView" class="detail-shell" hidden aria-label="تفاصيل البطولة">
    <div class="detail-toolbar"><button id="backToTournamentList" class="detail-back" type="button">العودة إلى قائمة البطولات</button></div>
    <article id="tournamentDetailCard" class="detail-card"></article>
  </section>
</div></main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const cfg=window.SHATRANJ_CONFIG?.supabase||{};
const supabase=createClient(cfg.url,cfg.anonKey);
const listView=document.getElementById('tournamentListView');
const detailView=document.getElementById('tournamentDetailView');
const listEl=document.getElementById('tournamentList');
const detailCard=document.getElementById('tournamentDetailCard');
const emptyEl=document.getElementById('tournamentEmpty');
const countEl=document.getElementById('tournamentCount');
const registrationMsg=document.getElementById('registrationMsg');
const backToTournamentList=document.getElementById('backToTournamentList');
let tournaments=[];
let selectedTournamentId=null;

function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function scopeLabel(row){if(row.scope_type==='global')return 'عامة';if(row.scope_type==='country')return 'دولة';if(row.scope_type==='city')return 'مدينة';return row.scope_type||'—'}
function statusLabel(value){return ({open:'مفتوحة',running:'جارية',finished:'منتهية'})[value]||value||'—'}
function formatDate(value){if(!value)return 'يحدد لاحقًا';return new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value))}
function tournamentIsFull(row){const max=Number(row.max_players);return Number.isFinite(max)&&max>0&&Number(row.registered_count||0)>=max}
function registrationOpen(row){if(row.status!=='open')return false;const now=Date.now();if(row.registration_opens_at&&now<new Date(row.registration_opens_at).getTime())return false;if(row.registration_closes_at&&now>=new Date(row.registration_closes_at).getTime())return false;return true}
function setRegistrationMessage(text,type=''){registrationMsg.textContent=text||'';registrationMsg.className='registration-message'+(type?` ${type}`:'')}
function registrationErrorMessage(code){return ({not_authenticated:'سجّل الدخول أولًا للتسجيل في البطولة.',player_not_found:'تعذر العثور على ملف اللاعب النشط.',tournament_not_found:'البطولة غير موجودة.',registration_closed:'التسجيل مغلق لهذه البطولة.',tournament_full:'اكتمل عدد المشاركين في البطولة.',outside_scope:'هذه البطولة مخصصة لدولة أو مدينة مختلفة.',already_registered:'أنت مسجل بالفعل في هذه البطولة.'})[code]||'تعذر إتمام التسجيل الآن.'}

function tournamentSort(a,b){
  const aFinished=a.status==='finished'?1:0;
  const bFinished=b.status==='finished'?1:0;
  if(aFinished!==bFinished)return aFinished-bFinished;
  const aTime=a.starts_at?new Date(a.starts_at).getTime():Number.POSITIVE_INFINITY;
  const bTime=b.starts_at?new Date(b.starts_at).getTime():Number.POSITIVE_INFINITY;
  if(aFinished&&bFinished)return (Number.isFinite(bTime)?bTime:0)-(Number.isFinite(aTime)?aTime:0);
  return aTime-bTime;
}

function renderTournamentList(rows){
  const list=(Array.isArray(rows)?rows:[]).slice().sort(tournamentSort);
  countEl.textContent=`${list.length} بطولة`;
  if(!list.length){listEl.innerHTML='';emptyEl.hidden=false;emptyEl.textContent='لا توجد بطولات معلنة حاليًا.';return}
  emptyEl.hidden=true;
  listEl.innerHTML=list.map((row,index)=>`<tr class="tournament-row${row.status==='finished'?' finished-row':''}" tabindex="0" data-tournament-id="${esc(row.id)}" aria-label="عرض تفاصيل ${esc(row.name)}"><td class="num">${index+1}</td><td><span class="tournament-name">${esc(row.name)}</span></td><td><span class="tournament-date">${esc(formatDate(row.starts_at))}</span></td><td class="status-col"><span class="status status-${esc(row.status)}">${esc(statusLabel(row.status))}</span></td></tr>`).join('');
}

function registrationControl(row){if(tournamentIsFull(row))return '<button class="register-btn" type="button" disabled>اكتمل العدد</button>';return registrationOpen(row)?`<button class="register-btn" type="button" data-tournament-id="${esc(row.id)}">سجّل الآن</button>`:'<button class="register-btn" type="button" disabled>التسجيل مغلق</button>'}

function renderTournamentDetail(row){
  const registeredCount=Number(row.registered_count||0);
  detailCard.innerHTML=`
    <div class="detail-title-row"><h2 class="detail-title">${esc(row.name)}</h2><span class="status status-${esc(row.status)}">${esc(statusLabel(row.status))}</span></div>
    <div class="detail-grid">
      <div class="detail-item"><span class="detail-label">اسم البطولة</span><span class="detail-value">${esc(row.name)}</span></div>
      <div class="detail-item"><span class="detail-label">النطاق</span><span class="detail-value">${esc(scopeLabel(row))}</span></div>
      <div class="detail-item"><span class="detail-label">الدولة</span><span class="detail-value">${esc(row.country||'—')}</span></div>
      <div class="detail-item"><span class="detail-label">المدينة</span><span class="detail-value">${esc(row.city||'—')}</span></div>
      <div class="detail-item"><span class="detail-label">نظام الوقت</span><span class="detail-value">${esc(row.time_control||'—')}</span></div>
      <div class="detail-item"><span class="detail-label">الموعد</span><span class="detail-value">${esc(formatDate(row.starts_at))}</span></div>
      <div class="detail-item"><span class="detail-label">المسجلون</span><span class="detail-value" data-registration-count data-count="${registeredCount}">${registeredCount} لاعب</span></div>
      <div class="detail-item"><span class="detail-label">السعة</span><span class="detail-value">${row.max_players?esc(row.max_players)+' لاعب':'مفتوحة'}</span></div>
      <div class="detail-item"><span class="detail-label">الحالة</span><span class="detail-value">${esc(statusLabel(row.status))}</span></div>
    </div>
    <div class="detail-register">${registrationControl(row)}</div>`;
}

function openTournamentDetail(tournamentId){const row=tournaments.find(item=>String(item.id)===String(tournamentId));if(!row)return;selectedTournamentId=String(row.id);setRegistrationMessage('');renderTournamentDetail(row);listView.hidden=true;detailView.hidden=false}
function showTournamentList(){selectedTournamentId=null;setRegistrationMessage('');detailView.hidden=true;listView.hidden=false}

async function registerForTournament(button,tournamentId){
  setRegistrationMessage('');
  const {data:{session}}=await supabase.auth.getSession();
  if(!session){setRegistrationMessage('سجّل الدخول أولًا للتسجيل في البطولات.','error');location.href='index.html#register';return}
  const originalText=button.textContent;button.disabled=true;button.textContent='جاري التسجيل...';
  try{
    const {data,error}=await supabase.rpc('register_for_tournament',{p_tournament_id:tournamentId});
    if(error)throw error;
    const result=data||{};
    if(result.ok||result.code==='already_registered'){
      button.textContent=result.code==='already_registered'?'مسجل':'تم التسجيل';button.classList.add('registered');button.disabled=true;
      setRegistrationMessage(result.code==='already_registered'?'أنت مسجل بالفعل في هذه البطولة.':'تم تسجيلك في البطولة بنجاح.','ok');
      if(result.ok){const row=tournaments.find(item=>String(item.id)===String(tournamentId));if(row)row.registered_count=Number(row.registered_count||0)+1;const countCell=detailCard.querySelector('[data-registration-count]');if(countCell&&row){countCell.dataset.count=String(row.registered_count);countCell.textContent=`${row.registered_count} لاعب`}}
      return;
    }
    button.disabled=false;button.textContent=originalText;setRegistrationMessage(registrationErrorMessage(result.code),'error');
  }catch(error){console.error(error);button.disabled=false;button.textContent=originalText;setRegistrationMessage('تعذر إتمام التسجيل الآن. حاول مرة أخرى.','error')}
}

listEl.addEventListener('click',event=>{const row=event.target.closest('.tournament-row[data-tournament-id]');if(row)openTournamentDetail(row.dataset.tournamentId)});
listEl.addEventListener('keydown',event=>{if(event.key!=='Enter'&&event.key!==' ')return;const row=event.target.closest('.tournament-row[data-tournament-id]');if(!row)return;event.preventDefault();openTournamentDetail(row.dataset.tournamentId)});
detailCard.addEventListener('click',event=>{const button=event.target.closest('.register-btn[data-tournament-id]');if(!button||button.disabled)return;registerForTournament(button,button.dataset.tournamentId)});
backToTournamentList.addEventListener('click',showTournamentList);

async function loadTournaments(){
  try{
    const [{data,error},{data:countRows,error:countError}]=await Promise.all([
      supabase.from('tournaments').select('id,name,scope_type,country,city,time_control,starts_at,max_players,status,registration_opens_at,registration_closes_at').in('status',['open','running','finished']).order('starts_at',{ascending:true,nullsFirst:false}),
      supabase.rpc('get_tournament_registration_counts')
    ]);
    if(error)throw error;if(countError)console.warn('تعذر تحميل عدد المسجلين',countError);
    const countMap=new Map((countRows||[]).map(row=>[String(row.tournament_id),Number(row.registered_count||0)]));
    tournaments=(data||[]).map(row=>({...row,registered_count:countMap.get(String(row.id))||0}));
    renderTournamentList(tournaments);
  }catch(error){console.error(error);listEl.innerHTML='';emptyEl.hidden=false;emptyEl.classList.add('error');emptyEl.textContent='تعذر تحميل البطولات الآن.'}
}

loadTournaments();
</script>
<script type="module" src="site-presence.js?v=20260906-1"></script>
</body>
</html>
