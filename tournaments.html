<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d3b2e">
<title>البطولات | شطرنج العرب</title>
<style>
*{box-sizing:border-box}
:root{--green:#0d3b2e;--green2:#176148;--gold:#c5a34d;--cream:#f5f3ed;--line:#ded8cd;--text:#14221c;--muted:#6f7773;--white:#fff}
body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--text)}
a{text-decoration:none;color:inherit}
.wrap{width:min(1180px,calc(100% - 24px));margin:auto}
header{background:var(--green);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.nav{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{font-size:20px;font-weight:900}
.back{border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:9px 13px;font-size:12px;font-weight:900}
main{padding:22px 0 34px}
.page-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}
.page-head h1{margin:0;font-size:28px;color:var(--green)}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.count{font-size:12px;font-weight:900;color:var(--green)}
.table-card{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 5px 16px rgba(13,59,46,.05)}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1040px}
th,td{padding:11px 10px;border-bottom:1px solid #eee;text-align:right;vertical-align:middle}
th{background:#f8f6f0;color:#67706b;font-size:11px;white-space:nowrap}
td{font-size:12px}
tbody tr:hover{background:#fcfbf8}
.num{width:54px;text-align:center;font-weight:900;color:var(--green)}
.name{font-weight:900;color:var(--green)}
.status{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900}
.status-open{background:#edf6ef;color:#176148}.status-running{background:#fff4d9;color:#7d6215}.status-finished{background:#eee;color:#666}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}
.error{color:#a53a3a}
@media(max-width:700px){main{padding-top:15px}.page-head{align-items:flex-start;flex-direction:column}.page-head h1{font-size:23px}.nav{min-height:58px}.brand{font-size:18px}}
</style>
<script src="config.js"></script>
</head>
<body>
<header>
  <div class="wrap nav">
    <div class="brand">شطرنج العرب</div>
    <a class="back" href="index.html">العودة للرئيسية</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <div>
        <h1>البطولات</h1>
        <p>البطولات المعلنة على مستوى العالم العربي أو حسب الدولة والمدينة.</p>
      </div>
      <div id="tournamentCount" class="count">0 بطولة</div>
    </div>

    <div class="table-card">
      <div class="table-wrap">
        <table aria-label="جدول البطولات">
          <thead>
            <tr>
              <th class="num">#</th>
              <th>اسم البطولة</th>
              <th>النطاق</th>
              <th>الدولة</th>
              <th>المدينة</th>
              <th>نظام الوقت</th>
              <th>الموعد</th>
              <th>السعة</th>
              <th>الحالة</th>
            </tr>
          </thead>
          <tbody id="tournamentRows"></tbody>
        </table>
      </div>
      <div id="tournamentEmpty" class="empty">جاري تحميل البطولات...</div>
    </div>
  </div>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const cfg=window.SHATRANJ_CONFIG?.supabase||{};
const supabase=createClient(cfg.url,cfg.anonKey);
const rowsEl=document.getElementById('tournamentRows');
const emptyEl=document.getElementById('tournamentEmpty');
const countEl=document.getElementById('tournamentCount');

function esc(value){
  return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function scopeLabel(row){
  if(row.scope_type==='global')return 'عامة';
  if(row.scope_type==='country')return 'دولة';
  if(row.scope_type==='city')return 'مدينة';
  return row.scope_type||'—';
}
function statusLabel(value){return ({open:'مفتوحة',running:'جارية',finished:'منتهية'})[value]||value||'—'}
function formatDate(value){
  if(!value)return 'يحدد لاحقًا';
  return new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value));
}
function renderTournaments(rows){
  const list=Array.isArray(rows)?rows:[];
  countEl.textContent=`${list.length} بطولة`;
  if(!list.length){rowsEl.innerHTML='';emptyEl.hidden=false;emptyEl.textContent='لا توجد بطولات معلنة حاليًا.';return}
  emptyEl.hidden=true;
  rowsEl.innerHTML=list.map((row,index)=>`<tr>
    <td class="num">${index+1}</td>
    <td class="name">${esc(row.name)}</td>
    <td>${esc(scopeLabel(row))}</td>
    <td>${esc(row.country||'—')}</td>
    <td>${esc(row.city||'—')}</td>
    <td>${esc(row.time_control||'—')}</td>
    <td>${esc(formatDate(row.starts_at))}</td>
    <td>${row.max_players?esc(row.max_players)+' لاعب':'مفتوحة'}</td>
    <td><span class="status status-${esc(row.status)}">${esc(statusLabel(row.status))}</span></td>
  </tr>`).join('');
}

async function loadTournaments(){
  try{
    const {data,error}=await supabase
      .from('tournaments')
      .select('id,name,scope_type,country,city,time_control,starts_at,max_players,status')
      .in('status',['open','running','finished'])
      .order('starts_at',{ascending:true,nullsFirst:false});
    if(error)throw error;
    renderTournaments(data||[]);
  }catch(error){
    console.error(error);
    rowsEl.innerHTML='';
    emptyEl.hidden=false;
    emptyEl.classList.add('error');
    emptyEl.textContent='تعذر تحميل البطولات الآن.';
  }
}

loadTournaments();
</script>
</body>
</html>
