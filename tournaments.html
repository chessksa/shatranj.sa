<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#042628">
<title>البطولات | شطرنج العرب</title>
<style>
html,body{margin:0;min-height:100%;background:#042628;color:#f4eddc;font-family:Arial,sans-serif}
.loader{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:24px}
.loader strong{font-size:18px;color:#d8b665}.loader small{display:block;margin-top:8px;color:#b7c7c2}
</style>
</head>
<body>
<div class="loader"><div><strong>جاري فتح البطولات</strong><small>تحديث بيانات البطولة…</small></div></div>
<script>
(async()=>{
  const stamp='20260911-tournament-4x4-final1';
  const runtimeVersion=stamp+'-'+Date.now();
  const response=await fetch('./tournaments-app.html?v='+runtimeVersion,{cache:'no-store'});
  if(!response.ok)throw new Error('tournaments source '+response.status);
  let html=await response.text();

  html=html
    .replace(/config\.js\?v=[A-Za-z0-9._-]+/g,'config.js?v='+runtimeVersion)
    .replace(/site-presence\.js\?v=[A-Za-z0-9._-]+/g,'site-presence.js?v='+runtimeVersion)
    .replace('</body>','<script type="module" src="tournament-detail-4x4.js?v='+runtimeVersion+'"><\\/script></body>');

  document.open();
  document.write(html);
  document.close();
})().catch(error=>{
  console.error(error);
  document.body.innerHTML='<div class="loader"><div><strong>تعذر تحميل البطولات</strong><small>أعد فتح الصفحة.</small></div></div>';
});
</script>
</body>
</html>
