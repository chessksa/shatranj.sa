<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1a1d21">
  <meta name="shatranj-asset-version" content="20261013-puzzle-profile-mobile-v1">
  <title>الألغاز | شطرنج العرب</title>
  <link rel="stylesheet" href="v2/site/shell.css?v=20261012-source-palette-v5"><link rel="stylesheet" href="v2/site/typography-system.css?v=20261012-source-palette-v5">
  <link rel="stylesheet" href="v2/platform/page.css?v=20261012-source-palette-v5">
  <style>
    .puzzle-layout{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,28vw,380px);grid-template-rows:minmax(0,1fr);gap:14px;align-items:stretch;direction:ltr;min-height:0}
    .puzzle-board-wrap{grid-column:1;grid-row:1;direction:rtl;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden}
    .puzzle-board-frame{position:relative;width:min(100%,calc(100dvh - 116px),780px);max-width:100%;padding:10px 10px 18px;border-radius:14px;background:linear-gradient(145deg,#302e2b,#302e2b);border:1px solid rgba(165,162,158,0.72);box-shadow:0 14px 34px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.05)}
    .puzzle-board{width:100%;max-width:100%;max-height:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border:0;border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.55);direction:ltr}
    .puzzle-square{position:relative;border:0;border-right:1px solid rgba(69,66,62,0.34);border-bottom:1px solid rgba(69,66,62,0.34);padding:0;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden;box-shadow:inset 0 0 0 .5px rgba(69,66,62,0.26)}
    .puzzle-square.light{background:#d6cfbf}
    .puzzle-square.dark{background:#3b3937}
    .puzzle-square.selected{box-shadow:inset 0 0 0 5px rgba(165,162,158,0.95)}
    .puzzle-square.target::after{content:"";width:22%;height:22%;border-radius:50%;background:rgba(69,66,62,0.55);position:absolute}
    .puzzle-piece{width:96%;height:96%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.30))}
    .puzzle-side{grid-column:2;grid-row:1;direction:rtl;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:14px}
    .puzzle-score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .puzzle-score{padding:9px;border:1px solid var(--p-line);border-radius:11px;text-align:center;background:rgba(255,255,255,.025)}
    .puzzle-score small{display:block;color:var(--p-muted);font-size:10px}
    .puzzle-score strong{display:block;margin-top:3px;color:var(--p-gold2);font-size:19px}
    .puzzle-status{min-height:44px;padding:10px;border:1px solid var(--p-line);border-radius:11px;background:rgba(0,0,0,.12);line-height:1.45}
    .puzzle-board.busy{pointer-events:none;opacity:.92}

    /* Puzzle viewport fit 20260914 */
    html{height:100%}
    body.platform-page.puzzle-fit-page{height:100dvh;min-height:0;overflow:hidden!important}
    body.platform-page.puzzle-fit-page .platform-shell{height:100%;min-height:0;width:min(1240px,calc(100% - 24px));padding:10px 0 12px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px}
    body.platform-page.puzzle-fit-page .platform-head{margin:0;align-items:center}
    body.platform-page.puzzle-fit-page .platform-head h1{font-size:22px;line-height:1.1}
    body.platform-page.puzzle-fit-page .platform-head p{margin-top:3px;font-size:11px;line-height:1.2}
    body.platform-page.puzzle-fit-page .platform-btn{min-height:34px;padding-inline:10px}
    body.platform-page.puzzle-fit-page .platform-tabs{margin:0;gap:6px;flex-wrap:nowrap;min-width:0}
    body.platform-page.puzzle-fit-page .platform-tab{min-height:32px;padding:5px 10px;white-space:nowrap}
    body.platform-page.puzzle-fit-page .puzzle-layout{height:100%;min-height:0;overflow:hidden}
    body.platform-page.puzzle-fit-page .puzzle-board-wrap{height:100%;min-height:0}
    body.platform-page.puzzle-fit-page .puzzle-board{max-height:100%}
    body.platform-page.puzzle-fit-page .puzzle-side h2{font-size:19px;line-height:1.25;margin:9px 0}
    body.platform-page.puzzle-fit-page .puzzle-side .platform-actions{margin-top:auto!important;padding-top:10px;flex-wrap:nowrap}
    body.platform-page.puzzle-fit-page .puzzle-side .platform-actions .platform-btn{flex:1 1 0}

    /* Puzzle play-layout alignment 20260914 */
    @media(min-width:901px){
      body.platform-page.puzzle-fit-page .platform-shell{width:min(100%,1600px);max-width:100%;height:100dvh;margin:0 auto;padding:12px 24px 14px;display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,29vw,440px);grid-template-rows:auto auto minmax(0,1fr);column-gap:clamp(10px,1.25vw,18px);row-gap:8px;align-items:center;direction:ltr}
      body.platform-page.puzzle-fit-page .platform-head{grid-column:2;grid-row:1;direction:rtl;min-width:0;margin:0}
      body.platform-page.puzzle-fit-page .platform-head>div{min-width:0}
      body.platform-page.puzzle-fit-page .platform-head h1{font-size:20px}
      body.platform-page.puzzle-fit-page .platform-head p{white-space:normal}
      body.platform-page.puzzle-fit-page .platform-tabs{grid-column:2;grid-row:2;direction:rtl;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:100%;margin:0}
      body.platform-page.puzzle-fit-page .platform-tab{min-width:0;min-height:34px;padding:5px 7px;overflow:hidden;text-overflow:ellipsis}
      body.platform-page.puzzle-fit-page .puzzle-layout{display:contents!important}
      body.platform-page.puzzle-fit-page .puzzle-board-wrap{grid-column:1;grid-row:1/4;height:100%;min-width:0;min-height:0;direction:ltr!important;place-items:center end;overflow:hidden}
      body.platform-page.puzzle-fit-page .puzzle-board-frame{width:min(100%,calc(100dvh - 34px),920px);max-width:100%;justify-self:end}
      body.platform-page.puzzle-fit-page .puzzle-board{width:100%;max-width:100%;max-height:100%}
      body.platform-page.puzzle-fit-page .puzzle-side{grid-column:2;grid-row:3;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden}
    }

    @media(max-width:900px){
      body.platform-page.puzzle-fit-page{height:100dvh;min-height:0;overflow:hidden!important}
      body.platform-page.puzzle-fit-page.v2-shell-active{padding-bottom:66px!important}
      body.platform-page.puzzle-fit-page .platform-shell{width:calc(100% - 10px);height:100%;min-height:0;padding:5px 0 4px;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;gap:5px}
      body.platform-page.puzzle-fit-page .platform-head{grid-row:1;flex-direction:row;align-items:center;gap:7px;min-height:32px}
      body.platform-page.puzzle-fit-page .platform-head h1{font-size:18px}
      body.platform-page.puzzle-fit-page .platform-head p{display:none}
      body.platform-page.puzzle-fit-page .platform-head .platform-btn{min-height:30px;font-size:11px;padding-inline:8px}
      body.platform-page.puzzle-fit-page .platform-tabs{grid-row:3;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:100%;overflow:hidden!important}
      body.platform-page.puzzle-fit-page .platform-tab{min-width:0;min-height:30px;padding:4px 3px;font-size:10px;overflow:hidden;text-overflow:ellipsis}
      body.platform-page.puzzle-fit-page .puzzle-layout{grid-row:2;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:5px;height:100%;min-height:0;overflow:hidden!important}
      body.platform-page.puzzle-fit-page .puzzle-board-wrap{grid-column:1;grid-row:1;order:1;height:100%;min-height:0;overflow:hidden;align-items:center}
      body.platform-page.puzzle-fit-page .puzzle-board-frame{width:min(100%,calc(100dvh - 250px));max-height:min(58dvh,100%);margin:auto;padding:4px 4px 8px;border-radius:9px;box-shadow:0 8px 18px rgba(0,0,0,.2)}
      body.platform-page.puzzle-fit-page .puzzle-board{width:100%;max-height:100%;margin:auto}
      body.platform-page.puzzle-fit-page .puzzle-side{grid-column:1;grid-row:2;order:2;min-height:0;overflow:hidden;padding:7px 8px;border-radius:12px;display:grid;grid-template-columns:1fr;gap:5px}
      body.platform-page.puzzle-fit-page .puzzle-score-grid{gap:4px}
      body.platform-page.puzzle-fit-page .puzzle-score{padding:4px 3px;border-radius:8px}
      body.platform-page.puzzle-fit-page .puzzle-score small{font-size:8px;line-height:1.1}
      body.platform-page.puzzle-fit-page .puzzle-score strong{font-size:14px;margin-top:1px}
      body.platform-page.puzzle-fit-page .puzzle-side>div[style="height:12px"]{display:none}
      body.platform-page.puzzle-fit-page .platform-badge{min-height:20px;font-size:9px;padding:0 6px;justify-self:start}
      body.platform-page.puzzle-fit-page .puzzle-side h2{font-size:13px;line-height:1.15;margin:0}
      body.platform-page.puzzle-fit-page .puzzle-status{min-height:30px;padding:5px 7px;font-size:11px;line-height:1.25}
      body.platform-page.puzzle-fit-page #customThemeWrap{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px}
      body.platform-page.puzzle-fit-page #customThemeWrap[hidden]{display:none!important}
      body.platform-page.puzzle-fit-page #customThemeWrap .platform-select{min-height:30px;padding:4px 7px;font-size:10px}
      body.platform-page.puzzle-fit-page .puzzle-side .platform-actions{margin-top:0!important;padding-top:0;gap:5px;flex-wrap:nowrap}
      body.platform-page.puzzle-fit-page .puzzle-side .platform-actions .platform-btn{min-height:30px;font-size:10px;padding:0 6px}
    }

    /* One complete square board and scrollable content on mobile: never clip chess rows. */
    @media(max-width:900px){
      html{height:auto!important;min-height:100%!important;overflow-x:hidden!important}
      body.platform-page.puzzle-fit-page,
      body.platform-page.puzzle-fit-page.v2-shell-active{
        width:100%!important;min-height:100svh!important;height:auto!important;
        overflow-x:hidden!important;overflow-y:auto!important;
        overscroll-behavior-y:auto!important;
        padding-bottom:calc(92px + env(safe-area-inset-bottom))!important;
      }
      body.platform-page.puzzle-fit-page .platform-shell{
        width:calc(100% - 12px)!important;height:auto!important;min-height:0!important;
        padding:6px 0 12px!important;display:flex!important;
        flex-direction:column!important;gap:9px!important;
        overflow:visible!important;
      }
      body.platform-page.puzzle-fit-page .platform-head{order:1!important;flex:0 0 auto!important}
      body.platform-page.puzzle-fit-page .puzzle-layout{
        order:2!important;display:flex!important;flex-direction:column!important;
        height:auto!important;min-height:0!important;overflow:visible!important;
        gap:8px!important;flex:0 0 auto!important;
      }
      body.platform-page.puzzle-fit-page .puzzle-board-wrap{
        display:flex!important;align-items:center!important;justify-content:center!important;
        flex:0 0 auto!important;width:100%!important;height:auto!important;
        min-height:0!important;overflow:visible!important;
      }
      body.platform-page.puzzle-fit-page .puzzle-board-frame{
        width:min(100%,480px)!important;height:auto!important;
        max-width:100%!important;max-height:none!important;
        margin:0 auto!important;padding:4px!important;
        overflow:visible!important;flex:0 0 auto!important;
      }
      body.platform-page.puzzle-fit-page .puzzle-board{
        width:100%!important;height:auto!important;max-height:none!important;
        aspect-ratio:1/1!important;overflow:hidden!important;
        background:#9b958d url('assets/boards/wood4.jpg') center / 100% 100% no-repeat!important;
      }
      body.platform-page.puzzle-fit-page .puzzle-square.light,
      body.platform-page.puzzle-fit-page .puzzle-square.dark{
        background:transparent!important;
      }
      body.platform-page.puzzle-fit-page .puzzle-side{
        width:100%!important;grid-column:auto!important;grid-row:auto!important;
        min-height:0!important;height:auto!important;overflow:visible!important;
        flex:0 0 auto!important;display:flex!important;flex-direction:column!important;
        gap:7px!important;
      }
      body.platform-page.puzzle-fit-page .platform-tabs{
        order:3!important;grid-row:auto!important;flex:0 0 auto!important;
        overflow:visible!important;margin:0!important;
      }
      body.platform-page.puzzle-fit-page .puzzle-side .platform-actions{
        display:flex!important;flex-wrap:nowrap!important;gap:6px!important;
      }
      body.platform-page.puzzle-fit-page .puzzle-side .platform-actions .platform-btn{
        flex:1 1 0!important;min-width:0!important;
      }
    }
  </style>
<link rel="stylesheet" href="site-charcoal-theme.css?v=20261014-restored-home-selection-v1">
</head>
<body class="platform-page puzzle-fit-page">
  <main class="platform-shell">
    <header class="platform-head">
      <div>
        <h1>الألغاز</h1>
        <p>تكتيك مصنّف، لغز يومي، تدريب مخصص وRush.</p>
      </div>
      <a class="platform-btn" href="stats.html">إحصائياتي</a>
    </header>

    <div class="platform-tabs" id="puzzleModes">
      <button class="platform-tab active" data-mode="rated">مصنّف</button>
      <button class="platform-tab" data-mode="daily">اليومي</button>
      <button class="platform-tab" data-mode="custom">مخصص</button>
      <button class="platform-tab" data-mode="rush">Rush 3 دقائق</button>
    </div>

    <section class="puzzle-layout">
      <div class="puzzle-board-wrap">
        <div class="puzzle-board-frame">
          <div id="puzzleBoard" class="puzzle-board" aria-label="رقعة اللغز"></div>
        </div>
      </div>

      <aside class="platform-card puzzle-side">
        <div class="puzzle-score-grid">
          <div class="puzzle-score"><small>تقييم الألغاز</small><strong id="puzzleRating">—</strong></div>
          <div class="puzzle-score"><small>القلوب</small><strong id="puzzleHearts">5</strong></div>
          <div class="puzzle-score"><small>النتيجة/الوقت</small><strong id="puzzleRush">—</strong></div>
        </div>
        <div style="height:12px"></div>
        <div id="puzzleTitle" class="platform-badge">جارٍ التحميل</div>
        <h2 id="puzzlePrompt">ابحث عن أفضل نقلة</h2>
        <div id="puzzleStatus" class="puzzle-status platform-muted">جارٍ تجهيز اللغز…</div>
        <div style="height:12px"></div>
        <label id="customThemeWrap" hidden>
          <span class="platform-muted">موضوع التدريب</span>
          <select id="customTheme" class="platform-select">
            <option value="">كل المواضيع</option>
            <option value="mate">مات</option>
            <option value="attack">هجوم</option>
            <option value="queen">الوزير</option>
          </select>
        </label>
        <div class="platform-actions" style="margin-top:12px">
          <button id="nextPuzzle" class="platform-btn primary" type="button">لغز جديد</button>
          <button id="resetPuzzle" class="platform-btn" type="button">إعادة الوضع</button>
        </div>
      </aside>
    </section>
  </main>

  <script src="config-base.js"></script>
  <script type="module" src="v2/puzzles/app.mjs?v=20261013-movesound-v1"></script>
  <script type="module" src="v2/site/shell.mjs?v=20261013-puzzle-profile-mobile-v1"></script>
</body>
</html>
