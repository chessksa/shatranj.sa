<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#022f33"><title>الألغاز | شطرنج العرب</title><link rel="stylesheet" href="v2/site/shell.css"><link rel="stylesheet" href="v2/platform/page.css"><style>
.puzzle-layout{display:grid;grid-template-columns:minmax(320px,680px) minmax(260px,1fr);gap:16px;align-items:start;direction:ltr}.puzzle-board-wrap{direction:rtl}.puzzle-board{width:min(100%,70dvh);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:3px solid #66503b;box-shadow:0 16px 32px rgba(0,0,0,.24);direction:ltr}.puzzle-square{position:relative;border:0;padding:0;display:grid;place-items:center;min-width:0;min-height:0}.puzzle-square.light{background:var(--board-light,#e8dec8)}.puzzle-square.dark{background:var(--board-dark,#87966a)}.puzzle-square.selected{box-shadow:inset 0 0 0 4px rgba(239,207,124,.95)}.puzzle-square.target::after{content:"";width:22%;height:22%;border-radius:50%;background:rgba(13,59,53,.52);position:absolute}.puzzle-piece{width:86%;height:86%;object-fit:contain;pointer-events:none}.puzzle-side{direction:rtl}.puzzle-score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.puzzle-score{padding:10px;border:1px solid var(--p-line);border-radius:11px;text-align:center;background:rgba(255,255,255,.025)}.puzzle-score small{display:block;color:var(--p-muted);font-size:10px}.puzzle-score strong{display:block;margin-top:4px;color:var(--p-gold2);font-size:20px}.puzzle-status{min-height:48px;padding:12px;border:1px solid var(--p-line);border-radius:11px;background:rgba(0,0,0,.12);line-height:1.5}.puzzle-board.busy{pointer-events:none;opacity:.92}@media(max-width:900px){.puzzle-layout{grid-template-columns:1fr}.puzzle-board{width:min(100%,calc(100dvh - 250px));margin:auto}.puzzle-side{order:-1}.puzzle-score-grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body class="platform-page"><main class="platform-shell"><header class="platform-head"><div><h1>الألغاز</h1><p>تكتيك مصنّف، لغز يومي، تدريب مخصص وRush.</p></div><a class="platform-btn" href="stats.html">إحصائياتي</a></header><div class="platform-tabs" id="puzzleModes"><button class="platform-tab active" data-mode="rated">مصنّف</button><button class="platform-tab" data-mode="daily">اليومي</button><button class="platform-tab" data-mode="custom">مخصص</button><button class="platform-tab" data-mode="rush">Rush 3 دقائق</button></div><section class="puzzle-layout"><div class="puzzle-board-wrap"><div id="puzzleBoard" class="puzzle-board" aria-label="رقعة اللغز"></div></div><aside class="platform-card puzzle-side"><div class="puzzle-score-grid"><div class="puzzle-score"><small>تقييم الألغاز</small><strong id="puzzleRating">—</strong></div><div class="puzzle-score"><small>القلوب</small><strong id="puzzleHearts">5</strong></div><div class="puzzle-score"><small>النتيجة/الوقت</small><strong id="puzzleRush">—</strong></div></div><div style="height:12px"></div><div id="puzzleTitle" class="platform-badge">جارٍ التحميل</div><h2 id="puzzlePrompt">ابحث عن أفضل نقلة</h2><div id="puzzleStatus" class="puzzle-status platform-muted">جارٍ تجهيز اللغز…</div><div style="height:12px"></div><label id="customThemeWrap" hidden><span class="platform-muted">موضوع التدريب</span><select id="customTheme" class="platform-select"><option value="">كل المواضيع</option><option value="mate">مات</option><option value="attack">هجوم</option><option value="queen">الوزير</option></select></label><div class="platform-actions" style="margin-top:12px"><button id="nextPuzzle" class="platform-btn primary" type="button">لغز جديد</button><button id="resetPuzzle" class="platform-btn" type="button">إعادة الوضع</button></div></aside></section></main><script src="config-base.js"></script><script type="module" src="v2/puzzles/app.mjs"></script><script type="module" src="v2/site/shell.mjs"></script></body></ht
