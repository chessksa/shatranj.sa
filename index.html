<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c3435">
<title>شطرنج العرب</title>
<style>
html,body{margin:0;min-height:100%;background:#042628;color:#f4eddc;font-family:Arial,sans-serif}
.loader{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:24px}
.loader strong{font-size:18px}
.loader small{display:block;margin-top:8px;color:#b7c7c2}
</style>
</head>
<body>
<div class="loader"><div><strong>جاري فتح شطرنج العرب</strong><small>تحديث الواجهة…</small></div></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration=>registration.unregister().catch(()=>false)));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(key=>key.startsWith('shatranj-arab-')).map(key=>caches.delete(key)));
    }
  }catch(error){
    console.warn('تعذر تنظيف التخزين المؤقت القديم',error);
  }

  const stamp='20260920-guest-auth1';
  const runtimeVersion=stamp+'-'+Date.now();
  const response=await fetch('./index-app.html?v='+runtimeVersion,{cache:'no-store'});
  if(!response.ok) throw new Error('index source '+response.status);
  let html=await response.text();

  html=html
    .replace(/home-theme\.css\?v=[A-Za-z0-9._-]+/g,'home-theme.css?v='+runtimeVersion)
    .replace(/site-notifications\.js\?v=[A-Za-z0-9._-]+/g,'site-notifications.js?v='+runtimeVersion)
    .replace(/site-presence\.js\?v=[A-Za-z0-9._-]+/g,'site-presence.js?v='+runtimeVersion)
    .replace("const rankingLimit=window.matchMedia('(max-width:800px)').matches?5:10;","const rankingLimit=10;")
    .replace('animation:welcomeTickerInlineMove 60s linear infinite','animation:welcomeTickerInlineMove 52s linear infinite')
    .replace('setInterval(loadCurrentMatchesCount,30000);','setInterval(loadCurrentMatchesCount,3000);');

  html=html.replace(/href="watch\.html(?:\?[^\"]*)?"/g,'href="watch.html?v='+runtimeVersion+'"');
  html=html.replace(/play-v10\.html/g,'play-entry-v16.html');

  const playersLoaderPattern=/async function loadPlayers\(\)\{[\s\S]*?\n\}\n\nasync function loadCurrentMatchesCount\(\)\{/;
  const newPlayersLoader=`async function loadPlayers(){
  const {data,error}=await supabase.rpc('get_public_ranked_players',{p_gender:null});
  if(error) throw error;

  ALL_PLAYERS=Array.isArray(data)?data:[];

  renderWelcomeTicker(ALL_PLAYERS);
  window.__HOME_PLAYERS__=ALL_PLAYERS;
  window.dispatchEvent(new CustomEvent('home-players-loaded',{detail:ALL_PLAYERS}));

  const headerPlayers=document.querySelector('#headerPlayersCount');
  if(headerPlayers) headerPlayers.textContent=String(ALL_PLAYERS.length);

  applyFilter();
}

async function loadCurrentMatchesCount(){`;

  if(playersLoaderPattern.test(html)){
    html=html.replace(playersLoaderPattern,newPlayersLoader);
  }else{
    console.warn('تعذر استبدال مصدر جدول الترتيب');
  }

  const oldMatchesCount=`async function loadCurrentMatchesCount(){
  const el=document.querySelector('#headerMatchesCount');
  if(!el) return;

  const liveStatuses=['playing','active','in_progress','started'];

  try{
    const {count,error}=await supabase
      .from('live_games')
      .select('*',{count:'exact',head:true})
      .in('status',liveStatuses);

    if(error) throw error;
    el.textContent=String(typeof count==='number'?count:0);
  }catch(error){
    console.warn('تعذر تحميل عدد المباريات الجارية',error);
    el.textContent='0';
  }
}`;

  const newMatchesCount=`async function loadCurrentMatchesCount(){
  const el=document.querySelector('#headerMatchesCount');
  if(!el) return;

  try{
    const {data,error}=await supabase.rpc('list_public_current_games');
    if(error) throw error;
    el.textContent=String(Array.isArray(data)?data.length:0);
  }catch(error){
    console.warn('تعذر تحميل عدد المباريات الجارية',error);
  }
}`;

  if(html.includes(oldMatchesCount)){
    html=html.replace(oldMatchesCount,newMatchesCount);
  }else{
    console.warn('تعذر استبدال عداد المباريات الأصلي');
    if(!html.includes('home-current-games.mjs')){
      html=html.replace('</body>','<script type="module" src="home-current-games.mjs?v='+runtimeVersion+'"><\/script></body>');
    }
  }

  const bottomGapStylePattern=/<style id="homeBottomGapFix[^"]*">[\s\S]*?<\/style>/i;
  const newInline=`<style id="homeBottomGapFix20260910f">
@media(min-width:901px){
  html:has(body.home-signed-in){
    height:100dvh!important;
    min-height:100dvh!important;
    max-height:100dvh!important;
    overflow:hidden!important;
  }
  html body.home-signed-in{
    height:100dvh!important;
    min-height:0!important;
    max-height:100dvh!important;
    overflow:hidden!important;
    grid-template-rows:64px 34px 34px minmax(0,1fr)!important;
  }
  html body.home-signed-in .home-header{grid-row:1!important}
  html body.home-signed-in .welcome-ticker{grid-row:2!important}
  html body.home-signed-in #tournamentResultsTicker{grid-column:1/-1!important;grid-row:3!important}
  html body.home-signed-in .home-hero{grid-row:4!important}
  html body.home-signed-in #ranking{grid-row:4!important}
}
@media(max-width:900px){
  html{
    height:auto!important;
    min-height:100%!important;
    overflow-x:hidden!important;
    overflow-y:auto!important;
    overscroll-behavior-y:auto!important;
  }
  html body{
    height:auto!important;
    min-height:0!important;
    max-height:none!important;
    margin-bottom:0!important;
    padding-bottom:0!important;
    overflow-x:hidden!important;
    overflow-y:visible!important;
    overscroll-behavior-y:auto!important;
  }
  html body.home-signed-in{
    min-height:100dvh!important;
  }
  html body.home-signed-in #ranking{
    flex:1 0 auto!important;
    display:flex!important;
    flex-direction:column!important;
    overflow:visible!important;
  }
  html body.home-signed-in #ranking>.wrap{
    flex:1 0 auto!important;
    min-height:0!important;
    display:flex!important;
    flex-direction:column!important;
  }
}
@media(max-width:800px){
  html body.home-signed-in #ranking .table-card{
    position:relative!important;
    flex:0 0 210px!important;
    height:210px!important;
    min-height:210px!important;
    max-height:210px!important;
    overflow:hidden!important;
  }
  html body.home-signed-in #ranking .table-wrap{
    height:100%!important;
    min-height:0!important;
    max-height:100%!important;
    overflow-y:auto!important;
    overflow-x:hidden!important;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain!important;
  }
}
</style>`;

  if(bottomGapStylePattern.test(html)){
    html=html.replace(bottomGapStylePattern,newInline);
  }else{
    html=html.replace('</head>',newInline+'\n</head>');
  }

  if(!html.includes('ranking-top-three.css')){
    html=html.replace('</head>','<link rel="stylesheet" href="ranking-top-three.css?v='+runtimeVersion+'"></head>');
  }else{
    html=html.replace(/ranking-top-three\.css\?v=[A-Za-z0-9._-]+/g,'ranking-top-three.css?v='+runtimeVersion);
  }

  if(!html.includes('home-mobile-admin-colors.css')){
    html=html.replace('</head>','<link rel="stylesheet" href="home-mobile-admin-colors.css?v='+runtimeVersion+'"></head>');
  }else{
    html=html.replace(/home-mobile-admin-colors\.css\?v=[A-Za-z0-9._-]+/g,'home-mobile-admin-colors.css?v='+runtimeVersion);
  }

  if(!html.includes('home-header-svg.css')){
    html=html.replace('</head>','<link rel="stylesheet" data-home-header-svg href="home-header-svg.css?v='+runtimeVersion+'"></head>');
  }else{
    html=html.replace(/home-header-svg\.css\?v=[A-Za-z0-9._-]+/g,'home-header-svg.css?v='+runtimeVersion);
  }

  if(!html.includes('v2/site/shell.css')){
    html=html.replace('</head>','<link rel="stylesheet" href="v2/site/shell.css?v='+runtimeVersion+'"></head>');
  }
  if(!html.includes('v2/home/dashboard.css')){
    html=html.replace('</head>','<link rel="stylesheet" href="v2/home/dashboard.css?v='+runtimeVersion+'"></head>');
  }
  if(!html.includes('config-base.js')){
    html=html.replace('</body>','<script src="config-base.js?v='+runtimeVersion+'"><\/script></body>');
  }
  if(!html.includes('home-tickers-bootstrap.js')){
    html=html.replace('</body>','<script src="home-tickers-bootstrap.js?v='+runtimeVersion+'"><\/script></body>');
  }
  if(!html.includes('v2/home/dashboard.mjs')){
    html=html.replace('</body>','<script type="module" src="v2/home/dashboard.mjs?v='+runtimeVersion+'"><\/script></body>');
  }
  if(!html.includes('v2/site/shell.mjs')){
    html=html.replace('</body>','<script type="module" src="v2/site/shell.mjs?v='+runtimeVersion+'"><\/script></body>');
  }

  // Guest auth header fix: always expose both actions to visitors.
  html=html.replace(
    '<a href="#register" id="navAccount" class="nav-account header-action header-tile">تسجيل الدخول</a>',
    '<a href="#register" id="navSignup" class="nav-account header-action header-tile">تسجيل</a><a href="#register" id="navAccount" class="nav-account header-action header-tile">تسجيل الدخول</a>'
  );
  html=html.replace('</head>','<style id="guestAuthHeaderFix">#navSignup[hidden]{display:none!important}</style></head>');
  html=html.replace(
    "  $('#headerMember').hidden=!loggedIn;\n  $('#navAccount').hidden=loggedIn;",
    "  $('#headerMember').hidden=!loggedIn;\n  $('#navAccount').hidden=loggedIn;\n  const navSignup=$('#navSignup'); if(navSignup) navSignup.hidden=loggedIn;"
  );
  html=html.replace(
    "    $('#navAccount').hidden=false;\n    $('#guestAuth').hidden=true;",
    "    $('#navAccount').hidden=false;\n    const navSignup=$('#navSignup'); if(navSignup) navSignup.hidden=true;\n    $('#guestAuth').hidden=true;"
  );
  html=html.replace(
    "    $('#navAccount').hidden=true;\n    $('#navLogout').hidden=false;",
    "    $('#navAccount').hidden=true;\n    const navSignup=$('#navSignup'); if(navSignup) navSignup.hidden=true;\n    $('#navLogout').hidden=false;"
  );
  html=html.replace(
    "    $('#navAccount').hidden=false;\n    $('#navLogout').hidden=true;",
    "    $('#navAccount').hidden=false;\n    const navSignup=$('#navSignup'); if(navSignup) navSignup.hidden=false;\n    $('#navLogout').hidden=true;"
  );
  html=html.replace('</body>','<script>document.addEventListener("click",function(e){const a=e.target.closest("#navSignup");if(!a)return;setTimeout(function(){const t=document.querySelector("[data-tab=signup],#signupTab");if(t)t.click();},0);});<\/script></body>');

  document.open();
  document.write(html);
  document.close();
})().catch(error=>{
  console.error(error);
  document.body.innerHTML='<div class="loader"><div><strong>تعذر تحميل الواجهة</strong><small>أعد فتح الصفحة.</small></div></div>';
});
</script>
</body>
</html>
