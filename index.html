<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c3435">
<title>شطرنج العرب</title>
<style>
html,body{margin:0;min-height:100%;background:#042628;color:#f4eddc;font-family:Arial,sans-serif}
.loader{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:24px}
.loader strong{font-size:18px}
.loader small{display:block;margin-top:8px;color:#b7c7c2}
</style>
</head>
<body>
<div class="loader"><div><strong>جاري فتح شطرنج العرب</strong><small>تحديث الواجهة…</small></div></div>
<script>
(async()=>{
  const stamp='20260909-currentgames1';
  const response=await fetch('./index-app.html?v='+stamp,{cache:'no-store'});
  if(!response.ok) throw new Error('index source '+response.status);
  let html=await response.text();

  html=html
    .replace('home-theme.css?v=20260909-tickergap8','home-theme.css?v='+stamp)
    .replace("const rankingLimit=window.matchMedia('(max-width:800px)').matches?5:10;","const rankingLimit=10;")
    .replace('site-notifications.js?v=20260906-ticker-hyphen1','site-notifications.js?v='+stamp);

  html=html.split('href="watch.html"').join('href="watch.html?v='+stamp+'"');

  const oldInline='<style id="homeBottomGapFix20260909">\n@media(max-width:800px){body{padding-bottom:0!important}}\n</style>';
  const newInline=`<style id="homeBottomGapFix20260909">
@media(max-width:800px){
  html:has(body.home-signed-in),html,html body,html body.home-signed-in{
    height:auto!important;
    min-height:0!important;
    max-height:none!important;
    overflow-y:auto!important;
    overscroll-behavior-y:auto!important;
  }
  html body,html body.home-signed-in{padding-bottom:0!important}
  #ranking{flex:0 0 auto!important;overflow:visible!important}
  #ranking .table-card{position:relative!important;height:210px!important;min-height:210px!important;max-height:210px!important;overflow:hidden!important}
  #ranking .table-wrap{height:100%!important;min-height:0!important;max-height:100%!important;overflow-y:auto!important;overflow-x:hidden!important;-webkit-overflow-scrolling:touch}
}
</style>`;
  if(html.includes(oldInline)) html=html.replace(oldInline,newInline);

  if(!html.includes('home-current-games.mjs')){
    html=html.replace('</body>','<script type="module" src="home-current-games.mjs?v='+stamp+'"><\/script></body>');
  }

  document.open();
  document.write(html);
  document.close();
})().catch(error=>{
  console.error(error);
  document.body.innerHTML='<div class="loader"><div><strong>تعذر تحميل الواجهة</strong><small>أعد فتح الصفحة.</small></div></div>';
});
</script>
</body>
</html>
