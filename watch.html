<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#042628">
<title>شاهد المباريات | شطرنج العرب</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--hero-deep:#062f31;--hero-deeper:#042628;--hero-panel:#0b4143;--hero-panel-2:#083638;--hero-gold:#d8b665;--hero-gold-2:#efcf7c;--hero-cream:#f4eddc;--hero-muted:#b7c7c2;--hero-line:rgba(216,182,101,.26);--hero-cyan-line:rgba(46,147,147,.42)}
html{background:var(--hero-deeper);color-scheme:dark}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at 18% 34%,rgba(26,104,105,.23),transparent 29%),radial-gradient(circle at 78% 13%,rgba(216,182,101,.06),transparent 22%),linear-gradient(145deg,var(--hero-deeper),var(--hero-deep) 50%,#07383a);color:var(--hero-cream)}
a{text-decoration:none;color:inherit}.wrap{width:min(900px,calc(100% - 24px));margin:auto}
header{background:rgba(4,39,41,.94);color:var(--hero-cream);border-bottom:1px solid rgba(216,182,101,.2);box-shadow:0 10px 30px rgba(0,0,0,.14);backdrop-filter:blur(14px)}.nav{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;font-size:19px;color:var(--hero-cream)}.back{background:rgba(255,255,255,.035);border:1px solid var(--hero-line);color:var(--hero-gold);padding:8px 12px;border-radius:12px;font-size:12px;font-weight:900}.back:hover{background:rgba(216,182,101,.08)}
main{padding:18px 0}.head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:14px}.head h1{margin:0;font-size:23px;color:var(--hero-gold)}.head p{margin:3px 0 0;color:var(--hero-muted);font-size:12px}.count{background:linear-gradient(145deg,rgba(216,182,101,.11),rgba(7,52,54,.92));border:1px solid rgba(216,182,101,.42);color:var(--hero-cream);border-radius:14px;padding:8px 14px;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.12)}.count strong{display:block;color:var(--hero-gold-2);font-size:18px}.count span{font-size:9px;color:var(--hero-muted)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 2px 8px}.section-title h2{margin:0;font-size:16px;color:var(--hero-gold)}.section-title span{font-size:11px;color:var(--hero-muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.game{display:block;background:linear-gradient(145deg,rgba(8,62,64,.86),rgba(7,49,51,.8));border:1px solid var(--hero-cyan-line);border-radius:16px;padding:12px;box-shadow:0 13px 30px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.025);transition:.15s ease}.game:hover{border-color:rgba(216,182,101,.55);transform:translateY(-1px)}.game-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.live{display:inline-flex;align-items:center;gap:4px;color:#ff6b6b;font-size:10px;font-weight:900}.kind{font-size:10px;font-weight:900;color:var(--hero-gold-2)}.id{font-size:10px;color:var(--hero-muted)}.players{display:grid;gap:6px}.player{display:flex;align-items:center;justify-content:space-between;background:rgba(7,48,50,.8);border:1px solid var(--hero-line);border-radius:11px;padding:9px;color:var(--hero-cream)}.player strong{font-size:13px;color:var(--hero-cream)}.player span{font-size:11px;color:var(--hero-gold-2)}.empty{display:none;background:linear-gradient(145deg,rgba(8,62,64,.72),rgba(7,49,51,.7));border:1px solid var(--hero-cyan-line);border-radius:16px;padding:30px;text-align:center;color:var(--hero-muted)}.loading{text-align:center;padding:24px;color:var(--hero-muted)}
@media(max-width:620px){.grid{grid-template-columns:1fr}.brand{font-size:16px}.head h1{font-size:20px}.head{align-items:center}.count{padding:7px 10px}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="brand">♟ شطرنج العرب</div><a class="back" href="index.html">العودة</a></div></header>
<main class="wrap">
  <div class="head"><div><h1>المباريات الحالية</h1><p>شاهد المباريات الجارية مباشرة، بما فيها اللعب ضد الكمبيوتر.</p></div><div class="count"><strong id="liveCount">0</strong><span>مباراة جارية</span></div></div>
  <div id="loading" class="loading">جاري تحميل المباريات...</div>
  <div id="liveSection" hidden>
    <div class="section-title"><h2>بين اللاعبين</h2><span id="humanCount">0 مباراة</span></div>
    <div id="games" class="grid"></div>
  </div>
  <div id="computerSection" hidden>
    <div class="section-title"><h2>ضد الكمبيوتر</h2><span id="computerCount">0 مباراة</span></div>
    <div id="computerGames" class="grid"></div>
  </div>
  <div id="empty" class="empty">لا توجد مباريات جارية الآن.</div>
</main>
<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const cfg=window.SHATRANJ_CONFIG?.supabase||{};
const supabase=cfg.enabled&&cfg.url&&cfg.anonKey?createClient(cfg.url,cfg.anonKey):null;
const levelLabel={easy:'سهل',medium:'متوسط',hard:'صعب'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let loading=false;

function renderHuman(games){
  document.querySelector('#games').innerHTML=games.map((g,i)=>`
    <a class="game" href="human-watch.html?game=${encodeURIComponent(g.game_id)}" aria-label="مشاهدة المباراة مباشرة">
      <div class="game-top"><span class="live">● مباشر</span><span class="id">مباراة ${i+1}</span></div>
      <div class="players">
        <div class="player"><strong>♙ ${esc(g.white_name||'الأبيض')}</strong><span>${esc(g.white_rating??'')}</span></div>
        <div class="player"><strong>♟ ${esc(g.black_name||'الأسود')}</strong><span>${esc(g.black_rating??'')}</span></div>
      </div>
    </a>`).join('');
}
function renderComputer(games){
  document.querySelector('#computerGames').innerHTML=games.map(g=>`
    <a class="game" href="computer-watch.html?game=${encodeURIComponent(g.game_id)}" aria-label="مشاهدة مباراة ضد الكمبيوتر مباشرة">
      <div class="game-top"><span class="live">● مباشر</span><span class="kind">ضد الكمبيوتر · ${esc(levelLabel[g.level]||g.level||'')}</span></div>
      <div class="players">
        <div class="player"><strong>♙ ${esc(g.white_name||'لاعب')}</strong><span>${esc(g.white_rating??'')}</span></div>
        <div class="player"><strong>♟ الكمبيوتر</strong><span>${esc(levelLabel[g.level]||g.level||'')}</span></div>
      </div>
    </a>`).join('');
}
async function load(){
  if(!supabase||loading)return;
  loading=true;
  try{
    const {data,error}=await supabase.rpc('list_public_current_games');
    if(error)throw error;
    const all=Array.isArray(data)?data:[];
    const human=all.filter(g=>g.game_type==='human');
    const computer=all.filter(g=>g.game_type==='computer');
    document.querySelector('#loading').style.display='none';
    document.querySelector('#liveCount').textContent=String(all.length);
    document.querySelector('#humanCount').textContent=`${human.length} مباراة`;
    document.querySelector('#computerCount').textContent=`${computer.length} مباراة`;
    document.querySelector('#liveSection').hidden=!human.length;
    document.querySelector('#computerSection').hidden=!computer.length;
    document.querySelector('#empty').style.display=all.length?'none':'block';
    renderHuman(human);renderComputer(computer);
  }catch(error){
    console.warn('تعذر تحميل المباريات الحالية',error);
    document.querySelector('#loading').textContent='تعذر تحميل المباريات. أعد المحاولة.';
  }finally{loading=false}
}
load();setInterval(load,3000);
</script>
<script type="module" src="site-presence.js?v=20260906-1"></script>
</body>
</html>
