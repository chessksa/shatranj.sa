<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#042628">
<title>شاهد المباريات | شطرنج العرب</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--hero-deep:#062f31;--hero-deeper:#042628;--hero-panel:#0b4143;--hero-panel-2:#083638;--hero-gold:#d8b665;--hero-gold-2:#efcf7c;--hero-cream:#f4eddc;--hero-muted:#b7c7c2;--hero-line:rgba(216,182,101,.26);--hero-cyan-line:rgba(46,147,147,.42)}
html{background:var(--hero-deeper);color-scheme:dark}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at 18% 34%,rgba(26,104,105,.23),transparent 29%),radial-gradient(circle at 78% 13%,rgba(216,182,101,.06),transparent 22%),linear-gradient(145deg,var(--hero-deeper),var(--hero-deep) 50%,#07383a);color:var(--hero-cream)}
a{text-decoration:none;color:inherit}.wrap{width:min(900px,calc(100% - 24px));margin:auto}
header{background:rgba(4,39,41,.94);color:var(--hero-cream);border-bottom:1px solid rgba(216,182,101,.2);box-shadow:0 10px 30px rgba(0,0,0,.14);backdrop-filter:blur(14px)}
.nav{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;font-size:19px;color:var(--hero-cream)}.back{min-height:44px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.035);border:1px solid var(--hero-line);color:var(--hero-gold);padding:0 18px;border-radius:12px;font-size:14px;font-weight:900}.back:hover{background:rgba(216,182,101,.08)}
main{padding:18px 0 28px}
.match-shell{overflow:hidden;border:1px solid var(--hero-cyan-line);border-radius:16px;background:linear-gradient(145deg,rgba(8,62,64,.86),rgba(7,49,51,.8));box-shadow:0 13px 30px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.025)}
.match-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));direction:rtl;border-bottom:1px solid rgba(216,182,101,.22);background:rgba(4,39,41,.72)}
.match-tab{height:58px;border:0;background:transparent;color:var(--hero-cream);font:900 16px Arial,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}.match-tab+ .match-tab{border-inline-start:1px solid rgba(216,182,101,.2)}.match-tab strong{min-width:30px;color:var(--hero-gold-2);font-size:19px;line-height:1}.match-tab.active{background:linear-gradient(135deg,var(--hero-gold-2),#d5aa4d);color:#173536}.match-tab.active strong{color:#173536}.match-tab:hover:not(.active){background:rgba(216,182,101,.07)}
.table-wrap{width:100%;overflow:hidden}.match-table{width:100%;border-collapse:collapse;table-layout:fixed}.match-table td{height:58px;padding:8px 12px;border-bottom:1px solid rgba(216,182,101,.17);background:transparent;color:var(--hero-cream);vertical-align:middle}.match-table tr:last-child td{border-bottom:0}.match-row:hover td{background:rgba(255,255,255,.025)}.col-num{width:68px;text-align:center;color:var(--hero-gold-2)!important;font-weight:900;font-size:15px}.players-cell{text-align:right;overflow:hidden}.player-pair{display:flex;align-items:center;gap:9px;min-width:0;white-space:nowrap;overflow:hidden}.player-pair strong{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:14px}.player-pair b{flex:0 0 auto;color:var(--hero-gold);font-size:13px}.col-watch{width:118px;text-align:center}.watch-btn{display:inline-flex;align-items:center;justify-content:center;min-width:78px;height:34px;padding:0 13px;border:1px solid rgba(216,182,101,.48);border-radius:10px;background:rgba(216,182,101,.08);color:var(--hero-gold-2);font-size:12px;font-weight:900}.watch-btn:hover{background:var(--hero-gold);color:#173536}.empty-row td,.loading-row td{text-align:center!important;color:var(--hero-muted)!important;padding:28px 12px!important;height:auto!important}
@media(max-width:620px){.brand{font-size:16px}.back{min-height:42px;padding:0 13px;font-size:12px}.match-tab{height:52px;font-size:13px;gap:6px}.match-tab strong{min-width:24px;font-size:17px}.match-table td{height:54px;padding:7px 7px}.col-num{width:44px;font-size:13px}.col-watch{width:88px}.watch-btn{min-width:68px;height:32px;padding:0 9px;font-size:11px}.player-pair{gap:5px}.player-pair strong{font-size:12px}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="brand">♟ شطرنج العرب</div><a class="back" href="index.html">العودة للصفحة الرئيسية</a></div></header>
<main class="wrap">
  <section class="match-shell" aria-label="قائمة المباريات">
    <div class="match-tabs" role="tablist" aria-label="حالة المباريات">
      <button id="currentTab" class="match-tab active" type="button" role="tab" aria-selected="true" data-tab="current">المباريات الحالية <strong id="currentCount">0</strong></button>
      <button id="finishedTab" class="match-tab" type="button" role="tab" aria-selected="false" data-tab="finished">المباريات المنتهية <strong id="finishedCount">0</strong></button>
    </div>
    <div class="table-wrap">
      <table class="match-table" aria-live="polite">
        <tbody id="matchTableBody">
          <tr class="loading-row"><td colspan="3">جاري تحميل المباريات...</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const cfg=window.SHATRANJ_CONFIG?.supabase||{};
const supabase=cfg.enabled&&cfg.url&&cfg.anonKey?createClient(cfg.url,cfg.anonKey):null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const currentTab=document.getElementById('currentTab');
const finishedTab=document.getElementById('finishedTab');
const currentCount=document.getElementById('currentCount');
const finishedCount=document.getElementById('finishedCount');
const matchTableBody=document.getElementById('matchTableBody');
let currentGames=[];
let finishedGames=[];
let activeTab='current';
let loading=false;

function watchHref(game){
  const id=encodeURIComponent(game.game_id||'');
  if(game.game_type==='computer')return `computer-watch.html?game=${id}`;
  return `human-watch.html?game=${id}`;
}

function renderRows(games){
  if(!games.length){
    const message=activeTab==='finished'?'لا توجد مباريات منتهية.':'لا توجد مباريات جارية الآن.';
    matchTableBody.innerHTML=`<tr class="empty-row"><td colspan="3">${message}</td></tr>`;
    return;
  }
  matchTableBody.innerHTML=games.map((game,index)=>{
    const white=esc(game.white_name||'لاعب');
    const black=esc(game.black_name||(game.game_type==='computer'?'الكمبيوتر':'لاعب'));
    return `<tr class="match-row">
      <td class="col-num">${index+1}</td>
      <td class="players-cell"><span class="player-pair"><strong>${white}</strong><b aria-hidden="true">×</b><strong>${black}</strong></span></td>
      <td class="col-watch"><a class="watch-btn" href="${watchHref(game)}" aria-label="مشاهدة مباراة ${white} ضد ${black}">مشاهدة</a></td>
    </tr>`;
  }).join('');
}

function setActiveTab(tab){
  activeTab=tab==='finished'?'finished':'current';
  const isCurrent=activeTab==='current';
  currentTab.classList.toggle('active',isCurrent);
  finishedTab.classList.toggle('active',!isCurrent);
  currentTab.setAttribute('aria-selected',String(isCurrent));
  finishedTab.setAttribute('aria-selected',String(!isCurrent));
  renderRows(activeTab === 'finished' ? finishedGames : currentGames);
}

currentTab.addEventListener('click',()=>setActiveTab('current'));
finishedTab.addEventListener('click',()=>setActiveTab('finished'));

async function load(){
  if(!supabase||loading)return;
  loading=true;
  try{
    const [currentResult,finishedResult]=await Promise.all([
      supabase.rpc('list_public_current_games'),
      supabase.rpc('list_public_finished_games')
    ]);
    if(currentResult.error)throw currentResult.error;
    if(finishedResult.error)throw finishedResult.error;
    currentGames=Array.isArray(currentResult.data)?currentResult.data:[];
    finishedGames=Array.isArray(finishedResult.data)?finishedResult.data:[];
    currentCount.textContent=String(currentGames.length);
    const totalFinished=Number(finishedGames[0]?.total_count??finishedGames.length);
    finishedCount.textContent=String(Number.isFinite(totalFinished)?totalFinished:finishedGames.length);
    renderRows(activeTab === 'finished' ? finishedGames : currentGames);
  }catch(error){
    console.warn('تعذر تحميل قائمة المباريات',error);
    matchTableBody.innerHTML='<tr class="empty-row"><td colspan="3">تعذر تحميل المباريات. أعد المحاولة.</td></tr>';
  }finally{loading=false}
}

load();setInterval(load,3000);
</script>
<script type="module" src="site-presence.js?v=20260906-1"></script>
</body>
</html>
