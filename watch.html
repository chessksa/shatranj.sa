<style>

a{text-decoration:none;color:inherit}.wrap{width:min(1180px,calc(100% - 24px));margin:auto}
header{flex:0 0 58px;overflow:hidden;background:rgba(69,66,62,0.94);color:var(--hero-cream);border-bottom:1px solid rgba(165,162,158,0.2);box-shadow:0 10px 30px rgba(0,0,0,.14);backdrop-filter:blur(14px)}
.nav{height:58px;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;font-size:19px;color:var(--hero-cream)}.back{min-height:44px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.035);border:1px solid var(--hero-line);color:var(--hero-gold);padding:0 18px;border-radius:12px;font-size:14px;font-weight:900}.back:hover{background:rgba(165,162,158,0.08)}
main{flex:1 1 auto;min-height:0;overflow:hidden;padding:18px 0}
.tables-grid{height:100%;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:stretch}
.match-shell{height:100%;max-height:100%;overflow:hidden;display:flex;flex-direction:column;border:1px solid #66717D;border-radius:0;background:#303943;box-shadow:none}
.table-head{height:var(--match-head-h);flex:0 0 var(--match-head-h);display:flex;align-items:center;justify-content:center;gap:8px;border-bottom:1px solid #86765b;background:#685c49;color:#f7f1e7;font-weight:800;font-size:14px;line-height:1.1}.table-head strong{min-width:23px;color:#f3dfb4;font-size:16px;line-height:1;text-align:center}.current-shell .table-head,.finished-shell .table-head{background:#685c49}
.table-wrap{width:100%;flex:1 1 auto;min-height:0;height:auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(165,162,158,0.55) rgba(69,66,62,0.45)}.table-wrap::-webkit-scrollbar{width:7px}.table-wrap::-webkit-scrollbar-track{background:rgba(69,66,62,0.45)}.table-wrap::-webkit-scrollbar-thumb{background:rgba(165,162,158,0.48);border-radius:999px}
.match-table{width:100%;border-collapse:collapse;table-layout:fixed}.match-table td{text-align:center;height:var(--match-row-h);padding:1px 5px;line-height:18px;border-bottom:1px solid rgba(165,162,158,0.17);background:#303943;color:#edf1f4;vertical-align:middle}.match-table td+td{border-inline-start:1px solid rgba(165,162,158,0.17)}.match-table tr:last-child td{border-bottom:0}.match-row{cursor:pointer;height:var(--match-row-h)}.match-row:nth-child(even) td{background:#36414c}.match-row:hover td{background:#465461}.match-row:focus-visible{outline:1px solid #c2d0da;outline-offset:-2px}.match-row:focus-visible td{background:#465461}.match-row[aria-current="true"] td{background:#4c5c69}
.col-num{width:64px;color:#dce4eb!important;font-weight:800;font-size:13px}.players-cell{text-align:center;overflow:hidden}.player-pair{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden}.player-pair strong,.player-pair .player-profile-action{min-width:0;max-width:50%;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.player-profile-action{display:inline-block;border:0;background:transparent;color:inherit;padding:0 1px;line-height:18px;font-family:inherit;font-weight:800;white-space:nowrap;cursor:pointer;touch-action:manipulation}
.player-profile-action:hover,.player-profile-action:focus-visible{text-decoration:underline;text-underline-offset:3px;color:#ffffff!important;outline-offset:2px}
.match-shell .match-table .player-pair strong,.match-shell .match-table .player-pair .player-profile-action{color:#f7f9fb!important}
.player-profile-action:disabled{cursor:default;opacity:.65}.player-pair b{flex:0 0 auto;color:#aab8c5;font-size:12px}.match-row .players-cell{width:auto}.empty-row td,.loading-row td{text-align:center!important;color:var(--hero-muted)!important;padding:20px 12px!important;height:auto!important}
.refresh-btn{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:32px;padding:0 10px;border-radius:8px;border:1px solid #66717D;background:#353C45;color:#e2dcd3;font:700 12px Arial,sans-serif;cursor:pointer;touch-action:manipulation}
.table-head{position:relative}

@keyframes watch-refresh-spin{to{transform:rotate(-360deg)}}
.watch-pull-hint{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:30;pointer-events:none;border:1px solid #66717D;border-radius:0;padding:8px 15px;background:#353C45;color:#e2dcd3;font:700 12px Arial,sans-serif;box-shadow:0 5px 15px rgba(0,0,0,.25)}

@media(max-width:760px){.refresh-btn{left:6px;min-height:29px;padding:0 8px}:root{--match-row-h:25px;--match-head-h:34px}.wrap{width:min(100% - 14px,1180px)}.brand{font-size:16px}.back{min-height:42px;padding:0 13px;font-size:12px}.nav{height:58px;min-height:58px}.tables-grid{grid-template-columns:1fr;grid-template-rows:repeat(2,minmax(0,1fr));gap:0;align-items:stretch}.match-shell{height:100%;max-height:100%}.table-head{font-size:14px}.table-head strong{font-size:17px}.match-table td{padding:2px 5px}.col-num{width:40px;font-size:13px}.player-pair{gap:5px}.player-pair strong,.player-pair .player-profile-action{font-size:12px}main{padding:8px 0}}

html[data-embed="panel"] header{display:none}
html[data-embed="panel"] main{padding:0}
html[data-embed="panel"] .wrap{width:100%}

/* The current list grows with its visible match rows, up to 72% of the

<body>
<header><div class="wrap nav"><div class="brand">♟ شطرنج العرب</div><a class="back" href="index.html">العودة للصفحة الرئيسية</a></div></header>
<div id="watchPullHint" class="watch-pull-hint" hidden aria-hidden="true">↓ اسحب للتحديث</div>
<main class="wrap">
  <div class="tables-grid">
    <section id="current" class="match-shell current-shell" aria-label="المباريات الحالية">
      <div class="table-head">المباريات الحالية <strong id="currentCount">0</strong><button type="button" id="enableWatchSound" class="watch-sound-btn" title="تفعيل صوت مشاهدة المباريات" aria-label="تفعيل صوت مشاهدة المباريات" aria-pressed="false">🔊</button><button type="button" id="refreshMatches" class="refresh-btn" title="تحديث المباريات" aria-label="تحديث قوائم المباريات"><span class="refresh-glyph" aria-hidden="true">⟳</span><span id="refreshLabel" class="refresh-label">تحديث</span></button></div>
      <div class="table-wrap" data-no-pull-refresh>
        <table class="match-table" aria-live="polite">
          <tbody id="currentTableBody"><tr class="loading-row"><td colspan="2">جاري تحميل المباريات...</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="match-shell finished-shell" aria-label="المباريات المنتهية">
      <div class="table-head">المباريات المنتهية <strong id="finishedCount">0</strong></div>
      <div class="table-wrap" data-no-pull-refresh>
        <table class="match-table" aria-live="polite">
          <tbody id="finishedTableBody"><tr class="loading-row"><td colspan="2">جاري تحميل المباريات...</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
<script src="config.js"></script>
<script type="module">
import { playBoardMoveSound,enableBoardSound } from "./v2/board/move-sound.mjs?v=20261019-watch-audio-v1";
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const cfg=window.SHATRANJ_CONFIG?.supabase||{};
const supabase=cfg.enabled&&cfg.url&&cfg.anonKey?createClient(cfg.url,cfg.anonKey):null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const currentCount=document.getElementById('currentCount');
const finishedCount=document.getElementById('finishedCount');
const currentTableBody=document.getElementById('currentTableBody');
const finishedTableBody=document.getElementById('finishedTableBody');
const refreshBtn=document.getElementById('refreshMatches');
const refreshLabel=document.getElementById('refreshLabel');
const pullHint=document.getElementById('watchPullHint');
let pendingManualRefresh=false;
let feedbackTimer=0;
let loading=false;
let currentSignature='';
let finishedSignature='';
let selectedGameKey='';
const tablesGrid=document.querySelector('.tables-grid');

function watchHref(game){
  const id=encodeURIComponent(game.game_id||'');
  if(game.game_type==='computer')return `computer-watch.html?v=20261019-watch-contrast-results-v2&game=${id}`;
  if(game.game_type==='human_v2')return `human-watch.html?v=20261019-watch-contrast-results-v2&game=${id}&source=v2`;
  return `human-watch.html?v=20261019-watch-contrast-results-v2&game=${id}`;
}

function gamesSignature(games){
  return JSON.stringify((Array.isArray(games)?games:[]).map(game=>[
    game.game_id||'',game.game_type||'',game.white_name||'',game.black_name||''
  ]));
}

function renderRows(body,games,emptyMessage){
  const wrap=body.closest('.table-wrap');
  const scrollTop=wrap?.scrollTop||0;
  if(!games.length){
    body.innerHTML=`<tr class="empty-row"><td colspan="2">${emptyMessage}</td></tr>`;
    if(wrap)wrap.scrollTop=scrollTop;
    return;
  }
  body.innerHTML=games.map((game,index)=>{
    const white=esc(game.white_name||'لاعب');
    const black=esc(game.black_name||(game.game_type==='computer'?'الكمبيوتر':'لاعب'));
    const gameId=esc(game.game_id||'');
    const gameType=esc(game.game_type||'');
    const allowWhite=game.game_type==='human_v2'||game.game_type==='computer';
    const allowBlack=game.game_type==='human_v2';
    const whiteLabel=allowWhite?`<button type="button" class="player-profile-action" data-profile-game="${gameId}" data-profile-type="${gameType}" data-profile-color="white" aria-label="بيانات اللاعب ${white}">${white}</button>`:`<strong>${white}</strong>`;
    const blackLabel=allowBlack?`<button type="button" class="player-profile-action" data-profile-game="${gameId}" data-profile-type="${gameType}" data-profile-color="black" aria-label="بيانات اللاعب ${black}">${black}</button>`:`<strong>${black}</strong>`;
    const whiteRating=game.white_rating===null||game.white_rating===undefined?'':String(Number(game.white_rating)||'');
    const blackRating=game.black_rating===null||game.black_rating===undefined?'':String(Number(game.black_rating)||'');
    const key=`${game.game_type||''}:${game.game_id||''}`;
    const selected=selectedGameKey===key?' aria-current="true"':'';
    return `<tr class="match-row" role="link" tabindex="0"${selected} data-watch-href="${esc(watchHref(game))}" data-game-id="${gameId}" data-game-type="${gameType}" data-white-rating="${esc(whiteRating)}" data-black-rating="${esc(blackRating)}" aria-label="مشاهدة مباراة ${white} ضد ${black}">
      <td class="col-num">${index+1}</td>
      <td class="players-cell"><span class="player-pair">${whiteLabel}<b aria-hidden="true">×</b>${blackLabel}</span></td>
    </tr>`;
  }).join('');
  if(wrap)wrap.scrollTop=scrollTop;
}

async function load({manual=false}={}){
  if(!supabase){
    currentTableBody.innerHTML='<tr class="empty-row"><td colspan="2">تعذر الاتصال بقائمة المباريات.</td></tr>';
    finishedTableBody.innerHTML='<tr class="empty-row"><td colspan="2">تعذر الاتصال بقائمة المباريات.</td></tr>';
    return;
  }
  if(loading){
    if(manual)pendingManualRefresh=true;
    return;
  }
  loading=true;
  if(manual){
    clearTimeout(feedbackTimer);
    refreshBtn.disabled=true;
    refreshBtn.setAttribute('aria-busy','true');
    refreshLabel.textContent='جارٍ التحديث';
  }
  let succeeded=false;
  try{
    const [currentResult,finishedResult]=await Promise.all([
      supabase.rpc('list_public_current_games'),
      supabase.rpc('list_public_finished_games')
    ]);
    if(currentResult.error)throw currentResult.error;
    if(finishedResult.error)throw finishedResult.error;
    const currentGames=Array.isArray(currentResult.data)?currentResult.data:[];
    const finishedGames=Array.isArray(finishedResult.data)?finishedResult.data:[];
    currentCount.textContent=String(currentGames.length);
    const totalFinished=Number(finishedGames[0]?.total_count??finishedGames.length);
    finishedCount.textContent=String(Number.isFinite(totalFinished)?totalFinished:finishedGames.length);
    // A list with zero games should not consume half the available height.
    tablesGrid.classList.toggle('current-empty',currentGames.length===0);
    tablesGrid.classList.toggle('finished-empty',finishedGames.length===0);
    // The current section requests exactly its rows' height. CSS caps it at
    // 72%, preserving a useful scrollable finished-results section.
    const rootStyle=getComputedStyle(document.documentElement);
    const currentRowPx=parseFloat(rootStyle.getPropertyValue('--match-row-h'))||21;
    const headerPx=parseFloat(rootStyle.getPropertyValue('--match-head-h'))||30;
    const currentNeeded=headerPx+Math.max(1,currentGames.length)*currentRowPx+4;
    tablesGrid.style.setProperty('--watch-current-needed',currentNeeded+'px');
    const currentKey=gamesSignature(currentGames);
    const finishedKey=gamesSignature(finishedGames);
    if(currentKey!==currentSignature){
      currentSignature=currentKey;
      renderRows(currentTableBody,currentGames,'لا توجد مباريات جارية الآن.');
    }
    if(finishedKey!==finishedSignature){
      finishedSignature=finishedKey;
      renderRows(finishedTableBody,finishedGames,'لا توجد مباريات منتهية.');
    }
    succeeded=true;
  }catch(error){
    console.warn('تعذر تحميل قائمة المباريات',error);
    // Invalidate previous DOM signatures so the next successful retry restores both lists.
    currentSignature='';
    finishedSignature='';
    currentTableBody.innerHTML='<tr class="empty-row"><td colspan="2">تعذر تحميل المباريات.</td></tr>';
    finishedTableBody.innerHTML='<tr class="empty-row"><td colspan="2">تعذر تحميل المباريات.</td></tr>';
  }finally{
    loading=false;
    if(manual){
      refreshBtn.disabled=false;
      refreshBtn.removeAttribute('aria-busy');
      refreshLabel.textContent=succeeded?'تم التحديث':'تعذر التحديث';
      feedbackTimer=setTimeout(()=>{refreshLabel.textContent='تحديث'},1800);
    }
    if(pendingManualRefresh){
      pendingManualRefresh=false;
      void load({manual:true});
    }
  }
}

refreshBtn.addEventListener('click',()=>{void load({manual:true})});
document.getElementById('enableWatchSound')?.addEventListener('click',async event=>{
  const button=event.currentTarget;
  const enabled=await enableBoardSound();
  button.setAttribute('aria-pressed',String(enabled));
  button.title=enabled?'صوت المشاهدة مفعل':'تعذر تشغيل الصوت';
});
window.addEventListener('message',event=>{
  if(event.origin!==location.origin||event.source!==window.parent
    ||event.data?.type!=='shatranj:watch-move-audio')return;
  playBoardMoveSound(event.data.fromFen,event.data.toFen);
});

// The page has a fixed viewport and two independently scrolling lists; refresh the
// data (rather than reloading the page) when pulling down at the top of either list.
let watchPull=null;
const watchMain=document.querySelector('main');
const hideWatchPull=()=>{pullHint.hidden=true;pullHint.textContent='↓ اسحب للتحديث'};
watchMain.addEventListener('touchstart',event=>{
  if(!window.matchMedia('(max-width:760px)').matches||event.touches.length!==1)return;
  if(event.target.closest('a,button,input,select,textarea'))return;
  const shell=event.target.closest('.match-shell');
  if(!shell)return;
  const list=shell.querySelector('.table-wrap');
  if(list.scrollTop>1)return;
  watchPull={x:event.touches[0].clientX,y:event.touches[0].clientY,list,distance:0};
},{passive:true});
watchMain.addEventListener('touchmove',event=>{
  if(!watchPull||event.touches.length!==1)return;
  const dx=event.touches[0].clientX-watchPull.x;
  const dy=event.touches[0].clientY-watchPull.y;
  if(dy<=0||Math.abs(dx)>dy*.75||watchPull.list.scrollTop>1){
    watchPull=null;
    hideWatchPull();
    return;
  }
  if(dy<12)return;
  event.preventDefault();
  watchPull.distance=dy;
  pullHint.hidden=false;
  pullHint.textContent=dy>=85?'↑ أفلت لتحديث المباريات':'↓ اسحب للتحديث';
},{passive:false});
watchMain.addEventListener('touchend',()=>{
  if(!watchPull)return;
  const shouldRefresh=watchPull.distance>=85;
  watchPull=null;
  hideWatchPull();
  if(shouldRefresh)void load({manual:true});
},{passive:true});
watchMain.addEventListener('touchcancel',()=>{
  watchPull=null;
  hideWatchPull();
},{passive:true});

// Public match names resolve through the verified match ID, never a nonunique name.
document.addEventListener('click',async event=>{
  const button=event.target.closest?.('.player-profile-action[data-profile-game]');
  if(!button||button.disabled||!supabase)return;
  const gameId=String(button.dataset.profileGame||'');
  const gameType=String(button.dataset.profileType||'');
  const color=String(button.dataset.profileColor||'');
  if(!/^[0-9a-f-]{36}$/i.test(gameId)||!['human_v2','computer'].includes(gameType)
    ||!['white','black'].includes(color))return;
  button.disabled=true;
  try{
    const {data,error}=await supabase.rpc('get_public_match_player_ids',{
      p_game_id:gameId,p_game_type:gameType
    });
    if(error)throw error;
    const playerId=(Array.isArray(data)?data[0]:data)?.[color+'_player_id'];
    if(!/^[0-9a-f-]{36}$/i.test(String(playerId||'')))return;
    if(document.documentElement.dataset.embed==='panel'&&window.parent!==window){
      window.parent.postMessage({type:'shatranj:open-player-profile',playerId},location.origin);
    }else{
      location.href='player.html?id='+encodeURIComponent(playerId);
    }
  }catch(error){
    console.warn('تعذر فتح ملف اللاعب من قائمة المباريات',error);
  }finally{
    button.disabled=false;
  }
});

// The entire match row is the watch action; player-name buttons retain their
// independent profile action and must not unexpectedly start another match.
function openMatchFromRow(row){
  if(!row)return;
  const gameId=row.dataset.gameId||'';
  const gameType=row.dataset.gameType||'';
  if(!/^[a-f0-9-]{36}$/i.test(gameId)||!['human','human_v2','computer'].includes(gameType))return;
  if(document.documentElement.dataset.embed==='panel'&&window.parent!==window){
    window.parent.postMessage({
      type:'shatranj:watch-main-board',gameId,gameType,
      whiteRating:row.dataset.whiteRating||'',blackRating:row.dataset.blackRating||''
    },location.origin);
    document.querySelectorAll('.match-row[aria-current="true"]').forEach(item=>item.removeAttribute('aria-current'));
    row.setAttribute('aria-current','true');
    selectedGameKey=gameType+':'+gameId;
  }else{
    const href=row.dataset.watchHref||'';
    if(href)location.assign(href);
  }
}
document.addEventListener('click',event=>{
  if(event.target.closest?.('.player-profile-action'))return;
  const row=event.target.closest?.('.match-row[data-game-id]');
  if(row)openMatchFromRow(row);
});
document.addEventListener('keydown',event=>{
  if(!['Enter',' '].includes(event.key)||event.target.closest?.('.player-profile-action'))return;
  const row=event.target.closest?.('.match-row[data-game-id]');
  if(!row)return;
  event.preventDefault();
  openMatchFromRow(row);
});
load();setInterval(()=>{if(!document.hidden)void load()},2000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)void load()});
</script>
