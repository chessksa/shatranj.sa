<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#042628">
<title>شاهد المباريات | شطرنج العرب</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--hero-deep:#062f31;--hero-deeper:#042628;--hero-panel:#0b4143;--hero-panel-2:#083638;--hero-gold:#d8b665;--hero-gold-2:#efcf7c;--hero-cream:#f4eddc;--hero-muted:#b7c7c2;--hero-line:rgba(216,182,101,.26);--hero-cyan-line:rgba(46,147,147,.42)}
html{background:var(--hero-deeper);color-scheme:dark}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at 18% 34%,rgba(26,104,105,.23),transparent 29%),radial-gradient(circle at 78% 13%,rgba(216,182,101,.06),transparent 22%),linear-gradient(145deg,var(--hero-deeper),var(--hero-deep) 50%,#07383a);color:var(--hero-cream)}
a{text-decoration:none;color:inherit}.wrap{width:min(1180px,calc(100% - 24px));margin:auto}
header{background:rgba(4,39,41,.94);color:var(--hero-cream);border-bottom:1px solid rgba(216,182,101,.2);box-shadow:0 10px 30px rgba(0,0,0,.14);backdrop-filter:blur(14px)}
.nav{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;font-size:19px;color:var(--hero-cream)}.back{min-height:44px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.035);border:1px solid var(--hero-line);color:var(--hero-gold);padding:0 18px;border-radius:12px;font-size:14px;font-weight:900}.back:hover{background:rgba(216,182,101,.08)}
main{padding:18px 0 28px}
.tables-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.match-shell{overflow:hidden;border:1px solid var(--hero-cyan-line);border-radius:16px;background:linear-gradient(145deg,rgba(8,62,64,.86),rgba(7,49,51,.8));box-shadow:0 13px 30px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.025)}
.table-head{height:58px;display:flex;align-items:center;justify-content:center;gap:10px;border-bottom:1px solid rgba(216,182,101,.22);background:rgba(4,39,41,.72);color:var(--hero-cream);font-weight:900;font-size:16px}.table-head strong{min-width:30px;color:var(--hero-gold-2);font-size:19px;line-height:1;text-align:center}.current-shell .table-head{background:linear-gradient(135deg,rgba(216,182,101,.15),rgba(4,39,41,.78))}.finished-shell .table-head{background:rgba(4,39,41,.78)}
.table-wrap{width:100%;overflow:hidden}.match-table{width:100%;border-collapse:collapse;table-layout:fixed}.match-table td{text-align:center;height:58px;padding:8px 9px;border-bottom:1px solid rgba(216,182,101,.17);background:transparent;color:var(--hero-cream);vertical-align:middle}.match-table td+td{border-inline-start:1px solid rgba(216,182,101,.17)}.match-table tr:last-child td{border-bottom:0}.match-row:hover td{background:rgba(255,255,255,.025)}
.col-num{width:54px;color:var(--hero-gold-2)!important;font-weight:900;font-size:14px}.players-cell{overflow:hidden}.player-pair{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden}.player-pair strong{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:13px}.player-pair b{flex:0 0 auto;color:var(--hero-gold);font-size:12px}.col-watch{width:96px}.watch-btn{display:inline-flex;align-items:center;justify-content:center;min-width:72px;height:33px;padding:0 11px;border:1px solid rgba(216,182,101,.48);border-radius:10px;background:rgba(216,182,101,.08);color:var(--hero-gold-2);font-size:11px;font-weight:900}.watch-btn:hover{background:var(--hero-gold);color:#173536}.empty-row td,.loading-row td{text-align:center!important;color:var(--hero-muted)!important;padding:28px 12px!important;height:auto!important}
@media(max-width:760px){.wrap{width:min(100% - 14px,1180px)}.brand{font-size:16px}.back{min-height:42px;padding:0 13px;font-size:12px}.tables-grid{grid-template-columns:1fr}.tables-grid{gap:12px}.table-head{height:52px;font-size:14px}.table-head strong{font-size:17px}.match-table td{height:54px;padding:7px 6px}.col-num{width:44px;font-size:13px}.col-watch{width:86px}.watch-btn{min-width:66px;height:32px;padding:0 8px;font-size:11px}.player-pair{gap:5px}.player-pair strong{font-size:12px}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="brand">♟ شطرنج العرب</div><a class="back" href="index.html">العودة للصفحة الرئيسية</a></div></header>
<main class="wrap">
  <div class="tables-grid">
    <section class="match-shell current-shell" aria-label="المباريات الحالية">
      <div class="table-head">المباريات الحالية <strong id="currentCount">0</strong></div>
      <div class="table-wrap">
        <table class="match-table" aria-live="polite">
          <tbody id="currentTableBody"><tr class="loading-row"><td colspan="3">جاري تحميل المباريات...</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="match-shell finished-shell" aria-label="المباريات المنتهية">
      <div class="table-head">المباريات المنتهية <strong id="finishedCount">0</strong></div>
      <div class="table-wrap">
        <table class="match-table" aria-live="polite">
          <tbody id="finishedTableBody"><tr class="loading-row"><td colspan="3">جاري تحميل المباريات...</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const cfg=window.SHATRANJ_CONFIG?.supabase||{};
const supabase=cfg.enabled&&cfg.url&&cfg.anonKey?createClient(cfg.url,cfg.anonKey):null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const currentCount=document.getElementById('currentCount');
const finishedCount=document.getElementById('finishedCount');
const currentTableBody=document.getElementById('currentTableBody');
const finishedTableBody=document.getElementById('finishedTableBody');
let loading=false;

function watchHref(game){
  const id=encodeURIComponent(game.game_id||'');
  return game.game_type==='computer'?`computer-watch.html?game=${id}`:`human-watch.html?game=${id}`;
}

function renderRows(body,games,emptyMessage){
  if(!games.length){
    body.innerHTML=`<tr class="empty-row"><td colspan="3">${emptyMessage}</td></tr>`;
    return;
  }
  body.innerHTML=games.map((game,index)=>{
    const white=esc(game.white_name||'لاعب');
    const black=esc(game.black_name||(game.game_type==='computer'?'الكمبيوتر':'لاعب'));
    return `<tr class="match-row">
      <td class="col-num">${index+1}</td>
      <td class="players-cell"><span class="player-pair"><strong>${white}</strong><b aria-hidden="true">×</b><strong>${black}</strong></span></td>
      <td class="col-watch"><a class="watch-btn" href="${watchHref(game)}" aria-label="مشاهدة مباراة ${white} ضد ${black}">مشاهدة</a></td>
    </tr>`;
  }).join('');
}

async function load(){
  if(!supabase||loading)return;
  loading=true;
  try{
    const [currentResult,finishedResult]=await Promise.all([
      supabase.rpc('list_public_current_games'),
      supabase.rpc('list_public_finished_games')
    ]);
    if(currentResult.error)throw currentResult.error;
    if(finishedResult.error)throw finishedResult.error;
    const currentGames=Array.isArray(currentResult.data)?currentResult.data:[];
    const finishedGames=Array.isArray(finishedResult.data)?finishedResult.data:[];
    currentCount.textContent=String(currentGames.length);
    const totalFinished=Number(finishedGames[0]?.total_count??finishedGames.length);
    finishedCount.textContent=String(Number.isFinite(totalFinished)?totalFinished:finishedGames.length);
    renderRows(currentTableBody,currentGames,'لا توجد مباريات جارية الآن.');
    renderRows(finishedTableBody,finishedGames,'لا توجد مباريات منتهية.');
  }catch(error){
    console.warn('تعذر تحميل قائمة المباريات',error);
    currentTableBody.innerHTML='<tr class="empty-row"><td colspan="3">تعذر تحميل المباريات.</td></tr>';
    finishedTableBody.innerHTML='<tr class="empty-row"><td colspan="3">تعذر تحميل المباريات.</td></tr>';
  }finally{loading=false}
}

load();setInterval(load,3000);
</script>
<script type="module" src="site-presence.js?v=20260906-1"></script>
</body>
</html>
