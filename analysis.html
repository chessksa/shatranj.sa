<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#022f33"><title>التحليل | شطرنج العرب</title><link rel="stylesheet" href="v2/site/shell.css"><link rel="stylesheet" href="v2/platform/page.css"><style>
.analysis-layout{display:grid;grid-template-columns:minmax(320px,680px) minmax(300px,1fr);gap:16px;direction:ltr}.analysis-board-wrap{direction:rtl}.analysis-board{width:min(100%,70dvh);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:3px solid #66503b;direction:ltr}.analysis-square{position:relative;border:0;padding:0;display:grid;place-items:center}.analysis-square.light{background:var(--board-light,#e8dec8)}.analysis-square.dark{background:var(--board-dark,#87966a)}.analysis-square.selected{box-shadow:inset 0 0 0 4px var(--p-gold2)}.analysis-square.target::after{content:"";position:absolute;width:22%;height:22%;border-radius:50%;background:rgba(13,59,53,.55)}.analysis-piece{width:86%;height:86%;object-fit:contain;pointer-events:none}.analysis-side{direction:rtl;display:grid;gap:12px}.engine-eval{font-size:31px;font-weight:900;color:var(--p-gold2);direction:ltr;text-align:right}.engine-line{direction:ltr;text-align:left;white-space:normal;overflow-wrap:anywhere;font-family:monospace;font-size:12px}.review-list{max-height:320px;overflow:auto}.review-move{display:grid;grid-template-columns:55px 1fr 90px 65px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(216,182,101,.12);font-size:12px}.review-tag{font-weight:900}.review-tag.best,.review-tag.excellent{color:#7ee2a2}.review-tag.good{color:#b7d98a}.review-tag.inaccuracy{color:#f0cf7a}.review-tag.mistake{color:#f0a06d}.review-tag.blunder{color:#ff837b}@media(max-width:900px){.analysis-layout{grid-template-columns:1fr}.analysis-board{width:min(100%,calc(100dvh - 270px));margin:auto}.analysis-side{order:-1}.review-move{grid-template-columns:45px 1fr 78px 55px}}
</style></head><body class="platform-page"><main class="platform-shell"><header class="platform-head"><div><h1>التحليل وGame Review</h1><p>Stockfish 18 محلي، FEN/PGN، أفضل نقلة، خط رئيسي ومراجعة أخطاء.</p></div><button id="flipBoard" class="platform-btn" type="button">قلب الرقعة</button></header><section class="analysis-layout"><div class="analysis-board-wrap"><div id="analysisBoard" class="analysis-board" aria-label="رقعة التحليل"></div></div><aside class="analysis-side"><section class="platform-card full"><div class="engine-eval" id="engineEval">0.00</div><div id="engineBest" class="platform-badge">أفضل نقلة —</div><p id="engineLine" class="engine-line platform-muted">اضغط تحليل.</p><div class="platform-actions"><button id="runAnalysis" class="platform-btn primary" type="button">تحليل الوضع</button><select id="analysisDepth" class="platform-select" style="width:auto"><option value="12">عمق 12</option><option value="16" selected>عمق 16</option><option value="20">عمق 20</option></select><button id="resetBoard" class="platform-btn" type="button">البداية</button></div></section><section class="platform-card full"><h3>FEN</h3><input id="fenInput" class="platform-input" dir="ltr"><div class="platform-actions" style="margin-top:8px"><button id="loadFen" class="platform-btn" type="button">تحميل FEN</button><button id="copyFen" class="platform-btn" type="button">نسخ FEN</button></div></section><section class="platform-card full"><h3>PGN ومراجعة المباراة</h3><textarea id="pgnInput" class="platform-textarea" dir="ltr" placeholder="الصق PGN هنا"></textarea><div class="platform-actions" style="margin-top:8px"><button id="loadPgn" class="platform-btn" type="button">تحميل PGN</button><button id="runReview" class="platform-btn primary" type="button">Game Review</button></div><div id="reviewSummary" class="platform-muted" style="margin-top:10px"></div><div id="reviewResults" class="review-list"></div></section><div id="analysisStatus" class="platform-muted"></div></aside></section></main><script src="config-base.js"></script><script type="module" src="v2/analysis/app.mjs"></script><script type="module" src="v2/site/shell.mjs"></script></body></html>
