<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d3b2e">
<title>لوحة التحكم | شطرنج السعودية</title>
<style>
*{box-sizing:border-box}
:root{
  --green:#0d3b2e;
  --green2:#176148;
  --gold:#c5a34d;
  --cream:#f5f3ed;
  --text:#14221c;
  --muted:#707773;
  --line:#ddd7ca;
  --white:#fff;
}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:var(--cream);
  color:var(--text);
}
a{text-decoration:none;color:inherit}
button,input{font-family:inherit}
.wrap{width:min(900px,calc(100% - 24px));margin:auto}

header{
  background:var(--green);
  color:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}
.nav{
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand{font-size:19px;font-weight:900}
.back{
  padding:8px 11px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:8px;
  font-size:12px;
  font-weight:800;
}
main{padding:18px 0 28px}

.profile-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.04);
}

.profile-head{
  display:grid;
  grid-template-columns:130px 1fr;
  gap:18px;
  align-items:center;
  padding-bottom:16px;
  border-bottom:1px solid #eee9df;
}

.avatar-wrap{
  text-align:center;
}

.avatar{
  width:112px;
  height:112px;
  margin:auto;
  border-radius:50%;
  overflow:hidden;
  border:4px solid #eee8dc;
  background:var(--green);
  display:grid;
  place-items:center;
  color:#fff;
  font-size:34px;
  font-weight:900;
  position:relative;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

.avatar.has-image img{display:block}
.avatar.has-image .initial{display:none}

.upload-label{
  display:block;
  margin-top:9px;
  color:var(--green2);
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}
#avatarInput{display:none}

.name{
  margin:0;
  font-size:27px;
}
.username{
  margin-top:4px;
  direction:ltr;
  text-align:right;
  color:#7a817d;
  font-weight:800;
  font-size:13px;
}
.location{
  margin-top:8px;
  color:var(--muted);
  font-size:13px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:15px;
}
.stat{
  background:#faf8f3;
  border:1px solid #e4ded2;
  border-radius:10px;
  padding:11px;
}
.stat small{
  display:block;
  color:#777;
  font-size:10px;
}
.stat strong{
  display:block;
  margin-top:3px;
  color:var(--green);
  font-size:18px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:15px;
}
.btn{
  min-height:40px;
  padding:0 14px;
  border:0;
  border-radius:8px;
  background:var(--green2);
  color:#fff;
  font-weight:900;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.btn.gold{background:var(--gold);color:#17231e}
.btn.light{
  background:#f5f2ea;
  color:var(--green);
  border:1px solid #ddd7ca;
}

.msg{
  min-height:18px;
  margin-top:10px;
  font-size:12px;
  font-weight:900;
}
.ok{color:#17633f}
.err{color:#a53a3a}

.loading{
  padding:35px 15px;
  text-align:center;
  color:#777;
}

@media(max-width:620px){
  .profile-head{
    grid-template-columns:1fr;
    text-align:center;
  }
  .username{text-align:center}
  .stats{grid-template-columns:1fr 1fr}
  .name{font-size:23px}
  .actions{display:grid;grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="index.html">♟ شطرنج السعودية</a>
    <a class="back" href="index.html">العودة للرئيسية</a>
  </div>
</header>

<main class="wrap">
  <div id="loading" class="profile-card loading">جاري تحميل حساب اللاعب...</div>

  <section id="profileCard" class="profile-card" hidden>
    <div class="profile-head">
      <div class="avatar-wrap">
        <div id="avatar" class="avatar">
          <span id="initial" class="initial">♟</span>
          <img id="avatarImage" alt="الصورة الرمزية">
        </div>

        <label class="upload-label" for="avatarInput">تغيير الصورة الرمزية</label>
        <input id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp">
      </div>

      <div>
        <h1 id="playerName" class="name">—</h1>
        <div id="playerUsername" class="username"></div>
        <div id="playerLocation" class="location">—</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <small>النقاط</small>
        <strong id="rating">1500</strong>
      </div>
      <div class="stat">
        <small>المباريات</small>
        <strong id="games">0</strong>
      </div>
      <div class="stat">
        <small>المنطقة</small>
        <strong id="region">—</strong>
      </div>
      <div class="stat">
        <small>المدينة</small>
        <strong id="city">—</strong>
      </div>
    </div>

    <div class="actions">
      <a class="btn gold" href="play.html">♟ العب الآن</a>
      <a class="btn light" href="index.html#ranking">🏅 التصنيف</a>
      <button id="logoutBtn" class="btn light" type="button">تسجيل الخروج</button>
    </div>

    <div id="msg" class="msg"></div>
  </section>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://zjxkxhsvltihucdacjrv.supabase.co';
const SUPABASE_KEY='sb_publishable_bwFGOiJzT_Xv656pLPR8ww_oJxFzSGJ';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);

const $=selector=>document.querySelector(selector);
let authSession=null;
let profile=null;

function setMsg(text,type=''){
  const el=$('#msg');
  el.textContent=text||'';
  el.className='msg '+type;
}

function initials(name){
  const parts=String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '♟';
  return parts.slice(0,2).map(x=>x[0]).join('');
}

function avatarPublicUrl(userId){
  const {data}=supabase.storage
    .from('avatars')
    .getPublicUrl(`${userId}/avatar.webp`);

  return data?.publicUrl||'';
}

function showAvatar(url){
  const avatar=$('#avatar');
  const img=$('#avatarImage');

  img.onload=()=>avatar.classList.add('has-image');
  img.onerror=()=>avatar.classList.remove('has-image');
  img.src=url + (url.includes('?')?'&':'?') + 'v=' + Date.now();
}

async function resizeToWebp(file){
  const image=await createImageBitmap(file);
  const max=512;
  const scale=Math.min(1,max/Math.max(image.width,image.height));
  const w=Math.max(1,Math.round(image.width*scale));
  const h=Math.max(1,Math.round(image.height*scale));

  const canvas=document.createElement('canvas');
  canvas.width=w;
  canvas.height=h;

  const ctx=canvas.getContext('2d');
  ctx.drawImage(image,0,0,w,h);

  return await new Promise((resolve,reject)=>{
    canvas.toBlob(
      blob=>blob?resolve(blob):reject(new Error('image_conversion_failed')),
      'image/webp',
      .86
    );
  });
}

async function uploadAvatar(file){
  if(!file) return;

  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){
    return setMsg('اختر صورة JPG أو PNG أو WebP.','err');
  }

  if(file.size>8*1024*1024){
    return setMsg('حجم الصورة كبير جدًا. الحد الأقصى 8 ميجابايت قبل الضغط.','err');
  }

  setMsg('جاري رفع الصورة...');

  try{
    const blob=await resizeToWebp(file);
    const path=`${authSession.user.id}/avatar.webp`;

    const {error}=await supabase.storage
      .from('avatars')
      .upload(path,blob,{
        contentType:'image/webp',
        cacheControl:'0',
        upsert:true
      });

    if(error) throw error;

    showAvatar(avatarPublicUrl(authSession.user.id));
    setMsg('تم تحديث الصورة الرمزية.','ok');
  }catch(error){
    console.error(error);
    setMsg('تعذر رفع الصورة. تأكد من تشغيل ملف SQL الخاص بالصور الرمزية.','err');
  }
}

async function loadProfile(){
  const {data:{session}}=await supabase.auth.getSession();
  authSession=session;

  if(!session){
    location.href='index.html#register';
    return;
  }

  try{
    const {data,error}=await supabase.rpc('get_my_player_profile');
    if(error) throw error;

    profile=Array.isArray(data)?data[0]:data;
    if(!profile) throw new Error('profile_not_found');

    const metadata=session.user.user_metadata||{};
    const username=metadata.username||'';

    $('#playerName').textContent=profile.name||metadata.name||'لاعب';
    $('#initial').textContent=initials(profile.name||metadata.name);
    $('#playerUsername').textContent=username ? '@'+username : '';
    $('#playerLocation').textContent=
      [profile.city,profile.region].filter(Boolean).join(' — ')||'—';

    $('#rating').textContent=profile.rating??1500;
    $('#games').textContent=profile.games_count??0;
    $('#region').textContent=profile.region||'—';
    $('#city').textContent=profile.city||'—';

    showAvatar(avatarPublicUrl(session.user.id));

    $('#loading').hidden=true;
    $('#profileCard').hidden=false;
  }catch(error){
    console.error(error);
    $('#loading').textContent='تعذر تحميل بيانات اللاعب.';
  }
}

$('#avatarInput').addEventListener('change',event=>{
  uploadAvatar(event.target.files?.[0]);
  event.target.value='';
});

$('#logoutBtn').addEventListener('click',async()=>{
  await supabase.auth.signOut();
  location.href='index.html';
});

loadProfile();
</script>
</body>
</html>
