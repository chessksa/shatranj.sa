<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>لوحة اللاعب | شطرنج السعودية</title>
  <meta name="theme-color" content="#0c3435" />
  <style>
    :root{
      --bg:#082d2f;--bg2:#0c3b3c;--panel:#103f40;--panel2:#16494a;
      --gold:#d4b467;--gold2:#b89545;--cream:#f4eddc;--muted:#adc1bc;
      --line:rgba(212,180,103,.22);--danger:#d96c6c;--good:#74b38b;
      --shadow:0 18px 45px rgba(0,0,0,.2);--radius:18px
    }
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:linear-gradient(145deg,var(--bg),#0a3839 55%,#08292b);color:var(--cream)}
    a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}
    .shell{width:min(1180px,calc(100% - 28px));margin:auto;padding:18px 0 40px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px 18px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand-mark{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;color:var(--gold);background:rgba(255,255,255,.03);font-size:22px}
    .top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--cream);padding:10px 14px;border-radius:12px;transition:.18s;min-height:40px}.btn:hover{background:rgba(255,255,255,.08)}.btn.gold{background:var(--gold);border-color:var(--gold);color:#173536;font-weight:800}.btn.danger{color:#ffdada;border-color:rgba(217,108,108,.35)}
    .hero{background:linear-gradient(135deg,rgba(255,255,255,.065),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center}
    .avatar-wrap{position:relative;width:104px;height:104px}.avatar,.avatar-fallback{width:104px;height:104px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;background:#0a3031}.avatar-fallback{display:grid;place-items:center;font-size:34px;font-weight:800;color:var(--gold)}.avatar-fallback[hidden]{display:none!important}.avatar-edit{position:absolute;bottom:0;left:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold);background:#173f40;color:var(--cream)}.avatar-input{display:none}
    .identity h1{margin:0 0 6px;font-size:clamp(23px,4vw,34px)}.identity .sub{color:var(--muted);font-size:14px}.identity .rating{display:inline-flex;align-items:center;gap:6px;margin-top:10px;color:var(--gold);font-size:18px;font-weight:800}.hero-actions{display:flex;gap:8px;flex-direction:column;min-width:150px}
    .identity-name-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.identity-name-row h1{margin:0}.player-rank-badge{display:inline-flex;align-items:center;gap:6px;color:var(--gold);font-size:13px;font-weight:800;padding:4px 8px;border:1px solid rgba(212,180,103,.38);border-radius:999px;background:rgba(212,180,103,.08);white-space:nowrap}.rank-icon{width:22px;height:22px;display:block;color:var(--gold);fill:currentColor;stroke:currentColor}.rank-svg-defs{position:absolute;width:0;height:0;overflow:hidden}.player-rank-badge[data-rank=champion]{box-shadow:0 0 18px rgba(212,180,103,.15)}
    .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:14px 0}.stat{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:16px;padding:15px}.stat small{display:block;color:var(--muted);margin-bottom:7px}.stat strong{font-size:24px;color:var(--cream)}
    .grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:14px}.card{background:rgba(13,56,57,.88);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 12px 34px rgba(0,0,0,.12)}.card h2{margin:0;font-size:18px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.badge{min-width:24px;height:24px;padding:0 7px;border-radius:20px;background:rgba(212,180,103,.15);color:var(--gold);display:grid;place-items:center;font-size:12px;font-weight:800}
    .chart-box{height:220px;display:grid;align-items:center}.chart-box svg{width:100%;height:190px;overflow:visible}.chart-empty,.empty{color:var(--muted);text-align:center;padding:28px 10px}.chart-line{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart-grid{stroke:rgba(255,255,255,.08);stroke-width:1}.chart-dot{fill:var(--cream);stroke:var(--gold);stroke-width:2}.chart-label{fill:var(--muted);font-size:12px}
    .list{display:grid;gap:9px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.025)}.row-title{font-weight:800}.row-meta{font-size:12px;color:var(--muted);margin-top:4px}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.mini{border:1px solid var(--line);background:transparent;color:var(--cream);padding:7px 9px;border-radius:9px;font-size:12px;min-height:40px}.mini.ok{color:#d7ffe4;border-color:rgba(116,179,139,.4)}.mini.no{color:#ffd6d6;border-color:rgba(217,108,108,.35)}.presence{display:inline-flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%;background:#6c7f7c}.dot.online{background:#66c58a;box-shadow:0 0 0 3px rgba(102,197,138,.12)}
    .game-result{font-weight:800}.win{color:#8ed2a5}.loss{color:#ef9b9b}.draw{color:#e8dba9}.game-kind{font-size:11px;padding:3px 7px;border-radius:12px;background:rgba(212,180,103,.1);color:var(--gold)}
    .achievement-grid{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}.achievement{display:flex;flex:0 0 min(210px,72vw);align-items:center;gap:10px;padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.025)}.achievement .ico{font-size:24px;color:var(--gold)}.achievement .name{font-weight:800}.achievement .hint{font-size:11px;color:var(--muted);margin-top:3px}.achievement.locked{opacity:.4;filter:saturate(.5)}.achievement.earned{border-color:rgba(212,180,103,.35);background:rgba(212,180,103,.07)}
    .toast{position:fixed;left:20px;bottom:20px;max-width:min(380px,calc(100% - 40px));padding:12px 15px;border-radius:12px;background:#153e3f;border:1px solid var(--line);box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:none}.toast.error{border-color:rgba(217,108,108,.55)}
    .loading{min-height:55vh;display:grid;place-items:center;color:var(--muted)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:grid;place-items:center;padding:18px;z-index:50}.modal[hidden]{display:none}.modal-card{width:min(420px,100%);background:#103f40;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.modal-card h3{margin:0 0 8px}.modal-card p{color:var(--muted);margin:0 0 14px}.modal-actions{display:flex;gap:8px;margin-top:14px}.modal-actions .btn{flex:1}.select{width:100%;background:#0b3435;color:var(--cream);border:1px solid var(--line);border-radius:11px;padding:11px}
    @media(max-width:820px){.hero{grid-template-columns:auto 1fr}.hero-actions{grid-column:1/-1;flex-direction:row}.hero-actions .btn{flex:1}.stats{grid-template-columns:repeat(2,1fr)}.stat:first-child{grid-column:1/-1}.grid{grid-template-columns:1fr}.topbar{align-items:flex-start}.top-actions{justify-content:flex-end}}
    @media(max-width:520px){.shell{width:min(100% - 18px,1180px);padding-top:8px}.brand span:last-child{display:none}.hero{padding:16px;gap:13px}.avatar-wrap,.avatar,.avatar-fallback{width:82px;height:82px}.avatar-fallback{font-size:28px}.identity h1{font-size:22px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.card{padding:14px}.row{grid-template-columns:1fr}.row-actions{justify-content:flex-start}.top-actions .btn{padding:8px 10px;font-size:12px}}
  
    /* Compact member dashboard 20260903 */
    .shell{padding:10px 0 24px}
    .topbar{padding:6px 2px 10px}
    .hero{padding:16px;gap:14px;border-radius:18px}
    .identity .rating{margin-top:7px}
    .stats{gap:8px;margin:10px 0}
    .stat{padding:10px 12px}
    .stat small{margin-bottom:4px}
    .stat strong{font-size:22px}
    .grid{gap:10px}
    .card{padding:13px}
    .card-head{margin-bottom:10px}
    .chart-box{height:180px}
    .chart-box svg{height:160px}
    .chart-empty,.empty{padding:18px 8px}
    .list{gap:7px}
    .row{padding:9px}
    .row-meta{margin-top:2px}
    .achievement{padding:9px}
    @media(max-width:520px){
      .shell{padding-top:6px;padding-bottom:18px}
      .hero{padding:13px;gap:10px}
      .stats{gap:6px;margin:8px 0}
      .stat{padding:9px 10px}
      .card{padding:12px}
    }
  
    /* Unified compact profile sections 20260903 */
    .topbar{background:rgba(8,45,47,.95);border:1px solid var(--line);border-radius:14px;padding:7px 10px;margin-bottom:7px}
    .hero,.stat,.card{background:rgba(13,56,57,.88);border-color:var(--line);box-shadow:0 10px 26px rgba(0,0,0,.10)}
    .hero{padding:13px 15px}
    .stats{margin:7px 0;gap:6px}
    .stat{padding:8px 10px;border-radius:12px}
    .grid{grid-template-columns:1fr;gap:6px}
    .compact-section{grid-column:1/-1;padding:0;overflow:hidden;border-radius:12px;background:rgba(13,56,57,.88)}
    .section-toggle{width:100%;min-height:43px;border:0;background:transparent;color:var(--cream);display:flex;align-items:center;justify-content:flex-start;gap:7px;padding:7px 11px;text-align:right;font-weight:800}
    .section-toggle:hover{background:rgba(255,255,255,.035)}
    .section-toggle .section-title{font-size:15px}
    .section-toggle .badge{flex:0 0 auto}
    .toggle-chevron{margin-inline-start:auto;color:var(--muted);font-size:18px;transition:transform .18s}
    .compact-section.open .toggle-chevron{transform:rotate(180deg)}
    .compact-section>.list{padding:7px 9px 9px;border-top:1px solid rgba(255,255,255,.07)}
    .compact-section>.list[hidden]{display:none!important}
    .always-visible{padding:11px 12px;border-radius:12px}
    .always-visible .card-head{margin-bottom:7px}
    .empty{padding:12px 7px}
    .row{padding:8px;border-radius:10px}
    .achievement{padding:8px;border-radius:10px}
    @media(max-width:520px){.topbar{padding:6px 8px}.hero{padding:11px}.section-toggle{min-height:41px;padding:6px 9px}.always-visible{padding:10px}}
  
    /* Member dashboard icon navigation 20260903 */
    .profile-nav-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:7px 0}
    .profile-nav-item{min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:10px 8px;border:1px solid var(--line);border-radius:12px;background:rgba(13,56,57,.88);text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.10);transition:.16s}
    .profile-nav-item:hover{background:rgba(22,73,74,.96);transform:translateY(-1px)}
    .profile-nav-main{display:flex;align-items:center;justify-content:center;gap:7px;direction:rtl}
    .profile-nav-icon{font-size:24px;line-height:1;color:var(--gold)}
    .profile-nav-main strong{font-size:16px;color:var(--gold);line-height:1}
    .profile-nav-label{font-size:12px;color:var(--cream);white-space:nowrap}
    @media(max-width:620px){.profile-nav-grid{grid-template-columns:repeat(5,minmax(72px,1fr));overflow-x:auto;padding-bottom:2px}.profile-nav-item{min-height:78px;padding:8px 6px}.profile-nav-icon{font-size:22px}.profile-nav-label{font-size:11px}}
  
    /* Unified dashboard icon row 20260903 */
    .dashboard-icon-row{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin:7px 0;overflow-x:auto;padding-bottom:2px}
    .dashboard-icon-item{min-width:0;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 5px;border:1px solid var(--line);border-radius:11px;background:rgba(13,56,57,.88);box-shadow:0 10px 26px rgba(0,0,0,.10);text-align:center}
    .dashboard-icon-link{transition:.16s}.dashboard-icon-link:hover{background:rgba(22,73,74,.96);transform:translateY(-1px)}
    .dashboard-icon-item strong{font-size:18px;color:var(--gold);line-height:1.1}
    .dashboard-icon-label{max-width:100%;font-size:13px;line-height:1.25;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @media(max-width:820px){.dashboard-icon-row{grid-template-columns:repeat(10,82px)}.dashboard-icon-item{min-height:70px}.dashboard-icon-label{font-size:12px}}
    @media(max-width:520px){.dashboard-icon-row{margin:6px 0;gap:5px;grid-template-columns:repeat(10,78px)}.dashboard-icon-item{min-height:66px;padding:7px 4px}}
    
  </style>
</head>
<body>
  <svg class="rank-svg-defs" aria-hidden="true" focusable="false">
    <symbol id="rank-pawn" viewBox="0 0 64 64"><circle cx="32" cy="15" r="9" fill="currentColor"/><path d="M22 27h20l5 12H17l5-12Zm-7 16h34l5 10H10l5-10Z" fill="currentColor"/></symbol>
    <symbol id="rank-knight" viewBox="0 0 64 64"><path d="M17 52h36v-8H25c1-8 8-12 16-16 5-3 7-8 5-14l-8 5-8-8-3 11-9 8 6 5-7 17Zm17-31 5-3 1 5-6-2Z" fill="currentColor"/></symbol>
    <symbol id="rank-rook" viewBox="0 0 64 64"><path d="M14 10h9v8h7v-8h8v8h7v-8h9v17l-7 7v14h7v7H10v-7h7V34l-7-7V10h4Zm10 25h16v13H24V35Z" fill="currentColor"/></symbol>
    <symbol id="rank-queen" viewBox="0 0 64 64"><circle cx="13" cy="14" r="4" fill="currentColor"/><circle cx="32" cy="9" r="4" fill="currentColor"/><circle cx="51" cy="14" r="4" fill="currentColor"/><path d="M14 20l10 9 8-14 8 14 10-9-6 25H20l-6-25Zm5 31h26v6H19v-6Z" fill="currentColor"/></symbol>
    <symbol id="rank-crown" viewBox="0 0 64 64"><path d="M9 18l13 12 10-20 10 20 13-12-6 29H15L9 18Zm8 35h30v6H17v-6Z" fill="currentColor"/></symbol>
    <symbol id="rank-trophy" viewBox="0 0 64 64"><path d="M20 9h24v8h10v10c0 9-6 15-15 16-1 5-3 8-5 10h10v7H20v-7h10c-2-2-4-5-5-10-9-1-15-7-15-16V17h10V9Zm-4 14v4c0 5 3 8 8 9V23h-8Zm24 13c5-1 8-4 8-9v-4h-8v13Z" fill="currentColor"/></symbol>
  </svg>
  <div class="shell" id="profileApp">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="brand-mark">♞</span><span>شطرنج السعودية</span></a>
      <div class="top-actions">
        <a class="btn" href="index.html">الرئيسية</a>
        <a class="btn" href="index.html#ranking">التصنيف</a>
        <div id="siteNotificationHost"></div>
        <button class="btn danger" id="logoutBtn" type="button">تسجيل الخروج</button>
      </div>
    </header>

    <div class="loading" id="loadingState" hidden style="display:none!important">جاري تحميل لوحة اللاعب...</div>

    <main id="dashboard">
      <section class="hero" id="profileHero">
        <div class="avatar-wrap">
          <img class="avatar" id="avatarImage" alt="صورة اللاعب" hidden />
          <div class="avatar-fallback" id="avatarFallback">♟</div>
          <label class="avatar-edit" for="avatarInput" title="تغيير الصورة">✎</label>
          <input class="avatar-input" id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp" />
        </div>
        <div class="identity">
          <div class="identity-name-row">
            <h1 id="playerName">—</h1>
            <span class="player-rank-badge" id="playerRankBadge" data-rank="beginner">
              <svg class="rank-icon" viewBox="0 0 64 64" aria-hidden="true"><use id="playerRankUse" href="#rank-pawn"></use></svg>
              <span id="playerRankLabel">مبتدئ</span>
            </span>
          </div>
          <div class="sub" id="playerMeta">—</div>
          <div class="rating">♛ <span id="heroRating">1500</span> نقطة</div>
        </div>
        <div class="hero-actions">
          <a class="btn gold" href="play.html">العب الآن</a>
          <a class="btn" id="publicProfileLink" href="#">صفحتي العامة</a>
        </div>
      </section>

      <section class="dashboard-icon-row" aria-label="إحصائيات وأقسام اللاعب">
  <div class="dashboard-icon-item">
    <span class="dashboard-icon-label">النقاط</span>

    <strong id="statRating">—</strong>
  </div>
  <div class="dashboard-icon-item">
    <span class="dashboard-icon-label">المباريات</span>

    <strong id="statGames">—</strong>
  </div>
  <div class="dashboard-icon-item">
    <span class="dashboard-icon-label">فوز</span>

    <strong id="statWins">—</strong>
  </div>
  <div class="dashboard-icon-item">
    <span class="dashboard-icon-label">تعادل</span>

    <strong id="statDraws">—</strong>
  </div>
  <div class="dashboard-icon-item">
    <span class="dashboard-icon-label">خسارة</span>

    <strong id="statLosses">—</strong>
  </div>
  <a class="dashboard-icon-item dashboard-icon-link" href="profile-section.html?section=friends">
    <span class="dashboard-icon-label">الأصدقاء</span>

    <strong id="friendsCount">0</strong>
  </a>
  <a class="dashboard-icon-item dashboard-icon-link" href="profile-section.html?section=friend-requests">
    <span class="dashboard-icon-label">طلبات الصداقة</span>

    <strong id="incomingCount">0</strong>
  </a>
  <a class="dashboard-icon-item dashboard-icon-link" href="profile-section.html?section=sent-requests">
    <span class="dashboard-icon-label">الطلبات المرسلة</span>

    <strong id="outgoingCount">0</strong>
  </a>
  <a class="dashboard-icon-item dashboard-icon-link" href="profile-section.html?section=challenges">
    <span class="dashboard-icon-label">التحديات</span>

    <strong id="incomingChallengesCount">0</strong>
  </a>
  <a class="dashboard-icon-item dashboard-icon-link" href="profile-section.html?section=sent-challenges">
    <span class="dashboard-icon-label">التحديات المرسلة</span>

    <strong id="outgoingChallengesCount">0</strong>
  </a>
</section>

      <section class="grid">

        <div class="card always-visible" style="grid-column:1/-1">
          <div class="card-head"><h2>آخر المباريات</h2><span class="badge">10</span></div>
          <div class="list" id="recentGames"></div>
        </div>

      </section>
    </main>
  </div>


  <div class="modal" id="challengeModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="challengeModalTitle">
      <h3 id="challengeModalTitle">تحدي صديق</h3>
      <p id="challengeTargetName">اختر زمن المباراة.</p>
      <select class="select" id="challengeMinutes" aria-label="زمن التحدي">
        <option value="3">3 دقائق</option>
        <option value="5">5 دقائق</option>
        <option value="10">10 دقائق</option>
      </select>
      <div class="modal-actions">
        <button class="btn gold" id="sendChallengeBtn" type="button">إرسال التحدي</button>
        <button class="btn" id="cancelChallengeModalBtn" type="button">إلغاء</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="site-notifications.js"></script>
  <script src="profile.js?v=20260903-rank-badge"></script>
</body>
</html>
