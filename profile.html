<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06383c">
<title>لوحة العضو | شطرنج العرب</title>
<style>
:root{
  --profile-bg:#063236;--profile-panel:rgba(6,57,61,.88);
  --profile-panel-hi:rgba(11,70,73,.85);--profile-line:rgba(217,183,103,.27);
  --profile-gold:#e1bb67;--profile-text:#f5eee1;--profile-muted:#b9c9c5;
}
*{box-sizing:border-box}
html,body{width:100%;min-width:0;margin:0;min-height:100%;font-family:Arial,sans-serif}
html{background:#052e32;color:var(--profile-text)}
body{background:linear-gradient(160deg,#052c31,#073d40);color:var(--profile-text);overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.shell{width:min(100% - 22px,880px);min-width:0;margin:0 auto;padding:12px 0 30px}
#dashboard{display:grid;gap:10px;min-width:0}
.profile-block{
  min-width:0;border:1px solid var(--profile-line);border-radius:14px;
  background:var(--profile-panel);box-shadow:0 8px 24px rgba(0,0,0,.12);
  padding:11px;
}
.profile-dashboard-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;min-width:0
}
.profile-dashboard-grid .profile-stat,
.profile-dashboard-grid .profile-action{
  min-width:0;width:100%;min-height:82px;padding:9px 4px;
  border:1px solid rgba(139,190,188,.26);border-radius:10px;
  background:linear-gradient(145deg,rgba(10,76,79,.65),rgba(4,45,49,.76));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;text-align:center;text-decoration:none;
}
.profile-dashboard-grid .profile-stat-label,
.profile-dashboard-grid .profile-action-label{
  display:block;flex:0 1 auto;min-width:0;width:100%;max-width:100%;
  font-size:11px;line-height:1.35;font-weight:800;
  color:var(--profile-muted);text-align:center;overflow-wrap:anywhere
}
.profile-dashboard-grid .profile-stat-value,
.profile-dashboard-grid .profile-action-value{
  display:block;flex:0 0 auto;min-width:0;max-width:100%;padding:0;
  background:none;border:0;border-radius:0;
  color:var(--profile-gold);font-size:22px;line-height:1.15;font-weight:900;
  font-variant-numeric:tabular-nums;direction:ltr;text-align:center
}
.profile-dashboard-grid .profile-action{
  cursor:pointer;transition:border-color .16s ease,background .16s ease
}
.profile-dashboard-grid .profile-action:hover,
.profile-dashboard-grid .profile-action:focus-visible{
  outline:none;border-color:rgba(225,187,103,.72);
  background:rgba(17,81,84,.85)
}
.profile-games{display:grid;gap:7px;min-width:0}
.profile-games .row{
  min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;
  gap:6px;padding:9px 8px;border:1px solid rgba(139,190,188,.17);
  border-radius:9px;background:rgba(2,38,42,.55)
}
.profile-games .row{white-space:nowrap}
.profile-game-main{min-width:0;display:flex;align-items:center;justify-content:flex-start;gap:6px;overflow:hidden;white-space:nowrap}
.row-title{min-width:0;flex:0 1 auto;font-size:12px;color:var(--profile-text);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.row-meta{min-width:0;flex:1 1 auto;font-size:10px;line-height:1.5;color:var(--profile-muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.row-actions{display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;white-space:nowrap;gap:5px;text-align:center}
.game-kind{padding:4px 5px;border-radius:6px;background:rgba(225,187,103,.08);color:#dfc68b;font-size:9px;white-space:nowrap}
.game-result{font-size:11px;font-weight:900}
.game-result.win{color:#a8e2b9}.game-result.loss{color:#ffb9b4}.game-result.draw{color:#e1ce97}
.empty{padding:22px 6px;text-align:center;color:var(--profile-muted);font-size:12px}

.profile-toolbar{width:100%;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.profile-top-action{
 min-width:0;min-height:67px;padding:8px 4px;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:6px;text-align:center;cursor:pointer;
 border:1px solid rgba(225,187,103,.31);border-radius:11px;
 background:linear-gradient(145deg,rgba(10,76,79,.75),rgba(4,49,53,.84));
 color:var(--profile-text);font-size:11px;font-weight:800;line-height:1.3
}
.profile-top-action:hover,.profile-top-action:focus-visible{outline:none;border-color:var(--profile-gold);background:rgba(17,84,85,.95)}
.profile-top-action .profile-tool-icon{width:18px;height:18px;display:block;flex:0 0 18px;stroke:var(--profile-gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.profile-top-action span{text-align:center;width:100%;overflow-wrap:anywhere}
.profile-top-action.danger{border-color:rgba(225,116,116,.36)}
.profile-top-action.danger .profile-tool-icon{stroke:#efb1ae}
.avatar-input{display:none}
.loading{min-height:150px;display:grid;place-items:center;font-size:13px;color:var(--profile-muted);text-align:center;padding:16px}
.modal{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.68);
  display:grid;place-items:center;padding:14px
}
.modal-card{
  width:min(380px,100%);padding:16px;border-radius:14px;
  background:#0b4143;border:1px solid var(--profile-line);
  box-shadow:0 16px 40px rgba(0,0,0,.27)
}
.modal-card h3{font-size:17px;color:var(--profile-gold);margin:0 0 10px}
.modal-card p{font-size:13px;color:var(--profile-muted);line-height:1.5}
.select{width:100%;padding:10px;border-radius:9px;border:1px solid var(--profile-line);background:#062e32;color:var(--profile-text)}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.btn{min-height:38px;padding:9px;border:1px solid var(--profile-line);border-radius:9px;background:#0c4a4c;color:var(--profile-text)}
.btn.gold{background:var(--profile-gold);color:#143738;font-weight:900}
.modal-actions .btn{flex:1}
.toast{
  position:fixed;z-index:60;bottom:14px;right:10px;
  max-width:calc(100% - 20px);background:#0b4143;color:var(--profile-text);
  border:1px solid var(--profile-line);border-radius:9px;padding:10px;
  opacity:0;pointer-events:none;transition:opacity .17s;font-size:12px
}
.toast.show{opacity:1}.toast.error{border-color:#e18d8d}
@media(max-width:650px){
  .shell{width:calc(100% - 12px);padding:6px 0 18px}
  #dashboard{gap:7px}
  .profile-block{padding:9px 7px;border-radius:11px}
  .profile-dashboard-grid{gap:5px}
  .profile-dashboard-grid .profile-stat,
  .profile-dashboard-grid .profile-action{min-height:77px;padding:6px 3px;gap:7px}
  .profile-dashboard-grid .profile-stat-label,
  .profile-dashboard-grid .profile-action-label{font-size:10px}
  .profile-dashboard-grid .profile-stat-value,
  .profile-dashboard-grid .profile-action-value{font-size:20px}
  .profile-top-action{min-height:59px;font-size:10px;padding:6px 3px}
  .profile-top-action .profile-tool-icon{width:16px;height:16px}
  .profile-games .row{padding:8px 5px;gap:4px}
  .profile-game-main{gap:4px}
  .row-title{font-size:11px}
  .row-meta{font-size:9px}
  .row-actions{max-width:none;gap:3px}
  .game-kind{font-size:8px;padding:3px}
  .game-result{font-size:10px}
}
</style>
</head>
<body>
<div class="shell" id="profileApp">
  <div class="loading" id="loadingState" role="status">جاري تحميل بيانات العضو…</div>
  <main id="dashboard" hidden>
    <nav class="profile-toolbar" aria-label="أدوات العضو">
      <label class="profile-top-action" for="avatarInput" title="تغيير الصورة الشخصية">
        <svg class="profile-tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4l2-3h4l2 3h4v12H4z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>تغيير الصورة</span>
      </label>
      <input class="avatar-input" id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp">
      <button class="profile-top-action danger" id="logoutBtn" type="button" title="تسجيل الخروج">
        <svg class="profile-tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M6.5 5.5a9 9 0 1 0 11 0"/></svg>
        <span>تسجيل الخروج</span>
      </button>
    </nav>
    <section class="profile-block" aria-label="إحصاءات المباريات والأصدقاء والتحديات">
      <div class="profile-dashboard-grid">
        <div class="profile-stat"><span class="profile-stat-label">المباريات</span><strong class="profile-stat-value" id="statGames">—</strong></div>
        <div class="profile-stat" data-result="wins"><span class="profile-stat-label">فوز</span><strong class="profile-stat-value" id="statWins">—</strong></div>
        <div class="profile-stat"><span class="profile-stat-label">تعادل</span><strong class="profile-stat-value" id="statDraws">—</strong></div>
        <div class="profile-stat" data-result="losses"><span class="profile-stat-label">خسارة</span><strong class="profile-stat-value" id="statLosses">—</strong></div>
        <a class="profile-action" href="profile-section.html?section=friends"><span class="profile-action-label">الأصدقاء</span><strong class="profile-action-value" id="friendsCount">0</strong></a>
        <a class="profile-action" href="profile-section.html?section=friend-requests"><span class="profile-action-label">طلبات الصداقة</span><strong class="profile-action-value" id="incomingCount">0</strong></a>
        <a class="profile-action" href="profile-section.html?section=sent-requests"><span class="profile-action-label">الطلبات المرسلة</span><strong class="profile-action-value" id="outgoingCount">0</strong></a>
        <a class="profile-action" href="profile-section.html?section=challenges"><span class="profile-action-label">التحديات</span><strong class="profile-action-value" id="incomingChallengesCount">0</strong></a>
        <a class="profile-action" href="profile-section.html?section=sent-challenges"><span class="profile-action-label">التحديات المرسلة</span><strong class="profile-action-value" id="outgoingChallengesCount">0</strong></a>
      </div>
    </section>
    <section class="profile-block profile-recent-block" aria-label="آخر المباريات">
      <div class="profile-games" id="recentGames" aria-label="آخر 10 مباريات"></div>
    </section>
  </main>
</div>
<div class="modal" id="challengeModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="challengeModalTitle">
    <h3 id="challengeModalTitle">تحدي صديق</h3>
    <p id="challengeTargetName">اختر زمن المباراة.</p>
    <select class="select" id="challengeMinutes" aria-label="زمن التحدي">
      <option value="3">3 دقائق</option>
      <option value="5">5 دقائق</option>
      <option value="10">10 دقائق</option>
    </select>
    <div class="modal-actions">
      <button class="btn gold" id="sendChallengeBtn" type="button">إرسال التحدي</button>
      <button class="btn" id="cancelChallengeModalBtn" type="button">إلغاء</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="profile.js?v=20261009-unified-member-tiles-v1"></script>
<script type="module" src="site-presence.js?v=20260906-1"></script>
</body>
</html>
