<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>العب الآن | شطرنج السعودية</title>
  <style>
    :root{
      --bg1:#022f33;
      --bg2:#063a40;
      --bg3:#0b4850;
      --panel:#07363d;
      --panel-soft:rgba(7,54,61,.78);
      --gold:#e0b567;
      --gold-soft:rgba(224,181,103,.22);
      --line:rgba(224,181,103,.55);
      --board-dark:#7f9560;
      --board-light:#dacba5;
      --wood-1:#554125;
      --wood-2:#2a2118;
      --text:#f4efe6;
      --muted:#d6cfbf;
      --success:#40cf67;
      --danger:#db4343;
      --shadow:0 12px 30px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Tahoma","Segoe UI",Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 18%, rgba(12,110,120,.32), transparent 26%),
        radial-gradient(circle at 81% 24%, rgba(12,110,120,.24), transparent 18%),
        radial-gradient(circle at 35% 82%, rgba(12,110,120,.18), transparent 22%),
        linear-gradient(135deg,var(--bg1),var(--bg2) 48%,var(--bg3));
      background-attachment:fixed;
    }
    .topbar{
      border-bottom:1px solid rgba(224,181,103,.45);
      box-shadow:0 1px 0 rgba(255,255,255,.04) inset;
    }
    .topbar-inner{
      max-width:1440px;
      margin:0 auto;
      padding:18px 40px 16px;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:20px;
    }
    .header-actions{display:flex;align-items:center;gap:14px}
    .header-actions.start{justify-content:flex-start}
    .header-actions.end{justify-content:flex-end}
    .ghost-btn{
      min-width:194px;
      height:54px;
      border:1px solid var(--line);
      border-radius:14px;
      background:rgba(10,38,44,.35);
      color:var(--text);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      font-size:20px;
      cursor:pointer;
      box-shadow:0 0 0 1px rgba(255,255,255,.02) inset;
    }
    .ghost-btn.small{min-width:142px}
    .ghost-btn .icon{font-size:24px;color:var(--gold)}

    .brand{
      display:flex;
      align-items:center;
      gap:26px;
      justify-content:center;
      text-align:center;
      white-space:nowrap;
    }
    .brand-copy h1{
      margin:0;
      font-size:25px;
      font-weight:800;
      letter-spacing:.5px;
    }
    .brand-copy .en{
      margin-top:6px;
      font-size:18px;
      letter-spacing:4.5px;
      font-weight:700;
    }
    .brand-mark{
      width:86px;
      height:86px;
    }
    .brand-mark svg{width:100%;height:100%}
    .brand-mark .mark-stroke{stroke:var(--gold);fill:none;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}
    .brand-mark .mark-fill{fill:var(--gold)}

    .page{
      max-width:1440px;
      margin:0 auto;
      padding:24px 34px 28px;
    }
    .layout{
      display:grid;
      grid-template-columns:minmax(700px, 1fr) 500px;
      gap:22px;
      align-items:start;
      direction:ltr;
    }
    .board-panel{direction:ltr}
    .side-panel{direction:rtl}

    .board-frame{
      position:relative;
      padding:22px 22px 26px;
      border-radius:24px;
      background:
        linear-gradient(180deg, rgba(113,83,40,.5), rgba(54,39,22,.78)),
        linear-gradient(135deg,var(--wood-1),var(--wood-2));
      border:2px solid rgba(231,197,126,.78);
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.1);
    }
    .board-shell{
      position:relative;
      width:100%;
      aspect-ratio:1 / 1;
      border-radius:4px;
      overflow:hidden;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.45);
      background:#222;
    }
    .board{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(8,1fr);
      grid-template-rows:repeat(8,1fr);
    }
    .square{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      border-right:1px solid rgba(31,41,20,.38);
      border-bottom:1px solid rgba(31,41,20,.38);
      user-select:none;
    }
    .square.light{
      background:
        radial-gradient(circle at 35% 25%, rgba(255,255,255,.10), transparent 38%),
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.03)),
        var(--board-light);
    }
    .square.selected{box-shadow:inset 0 0 0 5px rgba(238,190,74,.95)}
    .square.target::after{content:"";width:22%;height:22%;border-radius:50%;background:rgba(20,62,48,.55);position:absolute}
    .square.capture::after{content:"";position:absolute;inset:8px;border:4px solid rgba(117,45,36,.55);border-radius:50%}
    .square.dark{
      background:
        radial-gradient(circle at 35% 25%, rgba(255,255,255,.06), transparent 38%),
        linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.06)),
        var(--board-dark);
    }
    .piece{
      width:76%;
      height:76%;
      display:flex;
      align-items:center;
      justify-content:center;
      filter:drop-shadow(0 4px 3px rgba(0,0,0,.28));
    }
    .piece svg{width:100%;height:100%;overflow:visible}
    .piece.black .fill-main{fill:#101010}
    .piece.black .fill-accent{fill:#212121}
    .piece.black .stroke-main{stroke:#080808}
    .piece.white .fill-main{fill:#f2e7cc}
    .piece.white .fill-accent{fill:#dbc28b}
    .piece.white .stroke-main{stroke:#7f6b46}

    .coords-left,.coords-bottom{
      position:absolute;
      z-index:5;
      color:#f4cd67;
      text-shadow:0 1px 1px rgba(0,0,0,.45);
      font-size:18px;
      line-height:1;
    }
    .coords-left{
      left:-8px;
      top:0;
      bottom:26px;
      width:22px;
      display:grid;
      grid-template-rows:repeat(8,1fr);
      place-items:center;
    }
    .coords-bottom{
      left:22px;
      right:22px;
      bottom:5px;
      height:20px;
      display:grid;
      grid-template-columns:repeat(8,1fr);
      place-items:center;
      direction:ltr;
    }

    .panel-stack{display:grid;gap:54px}
    .player-card,.actions-card{
      background:var(--panel-soft);
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.03);
    }
    .player-card{
      padding:28px 22px;
      display:grid;
      grid-template-columns:94px 1fr 170px;
      align-items:center;
      gap:18px;
      min-height:228px;
    }
    .avatar{
      width:94px;height:94px;border-radius:50%;
      border:2px solid rgba(224,181,103,.8);
      background:radial-gradient(circle at 38% 30%, #434a4f, #1a2126 62%, #12181c);
      position:relative;
      overflow:hidden;
    }
    .avatar.light{
      background:radial-gradient(circle at 38% 30%, #ffffff, #f4f4f4 48%, #dadada 70%, #cbcbcb);
    }
    .avatar::before{
      content:"";
      position:absolute;
      left:50%; top:22px;
      width:36px;height:36px;border-radius:50%;
      transform:translateX(-50%);
      background:rgba(0,0,0,.45);
    }
    .avatar::after{
      content:"";
      position:absolute;
      left:50%; bottom:14px;
      width:56px;height:40px;border-radius:50% 50% 42% 42%;
      transform:translateX(-50%);
      background:rgba(0,0,0,.45);
    }
    .avatar.light::before,.avatar.light::after{background:rgba(255,255,255,.92)}
    .status{
      display:flex;align-items:center;gap:9px;
      color:var(--success);font-size:18px;margin-bottom:10px
    }
    .status::before{
      content:"";width:15px;height:15px;border-radius:50%;background:var(--success);
      box-shadow:0 0 10px rgba(64,207,103,.5);
    }
    .name{font-size:24px;font-weight:800;margin:0 0 10px}
    .location{display:flex;align-items:center;gap:8px;color:#efbd64;font-size:17px;margin:0 0 18px}
    .rating{display:flex;align-items:center;gap:10px;font-size:18px;color:#fff}
    .rating .trend{font-size:22px;color:var(--gold)}
    .clock-box{justify-self:end;text-align:center;width:100%}
    .clock{
      border:1px solid rgba(224,181,103,.26);
      background:rgba(6,27,31,.58);
      border-radius:16px;
      padding:22px 12px;
      font-size:34px;
      font-weight:700;
      letter-spacing:1px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    }
    .clock-progress{
      margin-top:18px;
      height:10px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      overflow:hidden;
    }
    .clock.danger{color:#ff5151;border-color:rgba(255,81,81,.65);box-shadow:0 0 18px rgba(255,81,81,.12) inset}
    .clock-progress span{
      display:block;
      width:74%;height:100%;border-radius:999px;
      background:linear-gradient(90deg, #46bb6d, #69d786);
    }

    .actions-card{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      overflow:hidden;
      min-height:150px;
    }
    .action-item{
      background:transparent;
      border:0;
      color:var(--text);
      font:inherit;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:18px;
      min-height:150px;
      cursor:pointer;
    }
    .action-item + .action-item{border-right:1px solid rgba(224,181,103,.24)}
    .action-icon{font-size:34px;color:var(--gold);line-height:1}
    .action-label{font-size:19px;font-weight:700}

    @media (max-width: 1220px){
      .layout{grid-template-columns:1fr;direction:rtl}
      .board-panel,.side-panel{direction:rtl}
      .side-panel{max-width:980px;margin:0 auto;width:100%}
      .panel-stack{gap:22px}
    }
    @media (max-width: 900px){
      .topbar-inner{grid-template-columns:1fr;gap:16px;padding:18px 18px}
      .header-actions.start,.header-actions.end{justify-content:center}
      .brand{order:-1;flex-direction:column-reverse;gap:10px}
      .page{padding:18px 14px 24px}
      .board-frame{padding:16px 16px 24px}
      .player-card{grid-template-columns:72px 1fr;grid-template-areas:"avatar info" "clock clock";padding:18px;min-height:auto}
      .avatar{grid-area:avatar;width:72px;height:72px}
      .player-info{grid-area:info}
      .clock-box{grid-area:clock;justify-self:stretch}
      .actions-card{grid-template-columns:1fr}
      .action-item + .action-item{border-right:0;border-top:1px solid rgba(224,181,103,.24)}
      .ghost-btn{min-width:0;width:100%}
      .ghost-btn.small{width:auto;min-width:136px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="header-actions start">
        <button class="ghost-btn"><span class="icon">⎋</span><span>مغادرة المباراة</span></button>
      </div>

      <div class="brand" aria-label="شعار شطرنج السعودية">
        <div class="brand-copy">
          <h1>شطرنج السعودية</h1>
          <div class="en">SAUDI CHESS</div>
        </div>
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 100 100" role="img">
            <path class="mark-fill" d="M50 8c6 0 11 5 11 11 0 4-2 7-4 9l6 14H37l6-14c-3-2-4-5-4-9 0-6 5-11 11-11z"/>
            <path class="mark-fill" d="M48 42h4v23h-4z"/>
            <path class="mark-stroke" d="M25 71c11 0 19-4 25-11 6 7 14 11 25 11"/>
            <path class="mark-stroke" d="M22 84l22-15"/>
            <path class="mark-stroke" d="M78 84L56 69"/>
            <path class="mark-stroke" d="M31 89l19-13"/>
            <path class="mark-stroke" d="M69 89L50 76"/>
          </svg>
        </div>
      </div>

      <div class="header-actions end">
        <button class="ghost-btn small"><span class="icon">⚑</span><span>إبلاغ</span></button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="layout">
      <section class="board-panel">
        <div class="board-frame">
          <div class="coords-left" id="coordsLeft"></div>
          <div class="board-shell">
            <div id="board" class="board" aria-label="رقعة الشطرنج"></div>
          </div>
          <div class="coords-bottom" id="coordsBottom"></div>
        </div>
      </section>

      <aside class="side-panel">
        <div class="panel-stack">
          <section class="player-card">
            <div class="avatar"></div>
            <div class="player-info">
              <div class="status">متصل</div>
              <h2 class="name">أحمد الشمري</h2>
              <div class="location">📍 <span>الرياض</span></div>
              <div class="rating"><span>1520</span> <span class="trend">📈</span></div>
            </div>
            <div class="clock-box">
              <div class="clock" id="blackClock">10:00</div>
              <div class="clock-progress"><span style="width:76%"></span></div>
            </div>
          </section>

          <section class="actions-card">
            <button class="action-item" id="blackResign" type="button">
              <span class="action-icon">🏳</span>
              <span class="action-label">استسلام</span>
            </button>
            <button class="action-item" id="drawOffer" type="button">
              <span class="action-icon">🤝</span>
              <span class="action-label">عرض تعادل</span>
            </button>
            <button class="action-item" id="whiteResign" type="button">
              <span class="action-icon">🏳</span>
              <span class="action-label">استسلام</span>
            </button>
          </section>

          <section class="player-card">
            <div class="avatar light"></div>
            <div class="player-info">
              <div class="status">متصل</div>
              <h2 class="name">محمد العتيبي</h2>
              <div class="location">📍 <span>جدة</span></div>
              <div class="rating"><span>1500</span> <span class="trend">📈</span></div>
            </div>
            <div class="clock-box">
              <div class="clock" id="whiteClock">10:00</div>
              <div class="clock-progress"><span style="width:74%"></span></div>
            </div>
          </section>
        </div>
      </aside>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script>
    const files = ['a','b','c','d','e','f','g','h'];
    const ranks = [8,7,6,5,4,3,2,1];
    const boardEl = document.getElementById('board');
    const leftEl = document.getElementById('coordsLeft');
    const bottomEl = document.getElementById('coordsBottom');
    const whiteClockEl = document.getElementById('whiteClock');
    const blackClockEl = document.getElementById('blackClock');
    const whiteResign = document.getElementById('whiteResign');
    const blackResign = document.getElementById('blackResign');
    const drawOffer = document.getElementById('drawOffer');

    ranks.forEach(n=>{ const div=document.createElement('div'); div.textContent=n; leftEl.appendChild(div); });
    files.forEach(f=>{ const div=document.createElement('div'); div.textContent=f; bottomEl.appendChild(div); });

    function pieceSVG(type,color){
      const cls = color === 'w' ? 'white' : 'black';
      const base = (inner) => `<div class="piece ${cls}"><svg viewBox="0 0 100 100" aria-hidden="true">${inner}</svg></div>`;
      const sharedBase = `
        <ellipse class="fill-accent" cx="50" cy="88" rx="26" ry="7"></ellipse>
        <rect class="fill-main" x="26" y="80" width="48" height="8" rx="4"></rect>
        <path class="stroke-main" d="M25 80h50M30 88h40" stroke-width="2.6" fill="none" stroke-linecap="round"></path>`;
      if(type==='p') return base(`<circle class="fill-main" cx="50" cy="27" r="12"></circle><path class="fill-main" d="M50 39c10 0 18 8 18 18v2H32v-2c0-10 8-18 18-18z"></path><path class="fill-accent" d="M39 58h22c5 0 9 4 9 9v5H30v-5c0-5 4-9 9-9z"></path><path class="stroke-main" d="M38 58h24M35 71h30" stroke-width="2.4" fill="none" stroke-linecap="round"></path>${sharedBase}`);
      if(type==='r') return base(`<path class="fill-main" d="M30 22h8v8h6v-8h12v8h6v-8h8v15H30z"></path><path class="fill-main" d="M35 37h30v30H35z"></path><path class="fill-accent" d="M30 66h40v12H30z"></path><path class="stroke-main" d="M30 37h40M37 46h26M34 66h32" stroke-width="2.4" fill="none" stroke-linecap="round"></path>${sharedBase}`);
      if(type==='n') return base(`<path class="fill-main" d="M68 25c-7 0-13 3-18 8l-8 9-8 3 6 8-2 18h28c2-5 4-11 4-18 0-6-2-11-6-14l6-6c4-4 4-8-2-8z"></path><path class="fill-accent" d="M40 71h25c5 0 8 3 8 7H36c0-4 1-7 4-7z"></path><circle class="fill-accent" cx="59" cy="36" r="2.8"></circle><path class="stroke-main" d="M52 31c4 1 8 4 10 8M45 48c7 1 13 6 17 14M39 71h30" stroke-width="2.4" fill="none" stroke-linecap="round"></path>${sharedBase}`);
      if(type==='b') return base(`<path class="fill-main" d="M50 18c9 0 15 7 15 16 0 7-5 11-10 15 5 4 9 10 9 18v2H36v-2c0-8 4-14 9-18-5-4-10-8-10-15 0-9 6-16 15-16z"></path><path class="stroke-main" d="M56 27l-10 14M40 69h20" stroke-width="2.6" fill="none" stroke-linecap="round"></path><path class="fill-accent" d="M34 69h32c5 0 8 4 8 9H26c0-5 3-9 8-9z"></path>${sharedBase}`);
      if(type==='q') return base(`<circle class="fill-main" cx="28" cy="22" r="5"></circle><circle class="fill-main" cx="42" cy="16" r="5"></circle><circle class="fill-main" cx="58" cy="16" r="5"></circle><circle class="fill-main" cx="72" cy="22" r="5"></circle><path class="fill-main" d="M28 28l8 14 10-14 8 14 10-14 8 14-4 4H32l-4-4z"></path><path class="fill-accent" d="M35 46h30l4 23H31z"></path><path class="fill-accent" d="M31 69h38c5 0 8 4 8 9H23c0-5 3-9 8-9z"></path><path class="stroke-main" d="M35 46h30M38 57h24M38 69h24" stroke-width="2.3" fill="none" stroke-linecap="round"></path>${sharedBase}`);
      if(type==='k') return base(`<path class="fill-main" d="M35 26l8-8 7 10 7-10 8 8-4 6H39z"></path><path class="fill-accent" d="M38 32h24l5 15-6 5H39l-6-5z"></path><path class="fill-main" d="M42 52h16c7 0 13 7 13 16v1H29v-1c0-9 6-16 13-16z"></path><path class="fill-accent" d="M31 69h38c5 0 8 4 8 9H23c0-5 3-9 8-9z"></path><path class="stroke-main" d="M38 32h24M42 52h16M38 69h24" stroke-width="2.4" fill="none" stroke-linecap="round"></path>${sharedBase}`);
      return '';
    }

    function formatTime(totalSeconds){
      const safe=Math.max(0,totalSeconds|0);
      return String(Math.floor(safe/60)).padStart(2,'0')+':'+String(safe%60).padStart(2,'0');
    }

    let game;
    try { game = new Chess(); } catch(e) { alert('تعذر تحميل محرك الشطرنج. حدّث الصفحة وحاول مرة أخرى.'); }
    let selected=null;
    let legalTargets=[];
    let clocks={w:600,b:600};
    let finished=false;

    function renderBoard(){
      boardEl.innerHTML='';
      const data=game.board();
      for(let row=0;row<8;row++){
        for(let col=0;col<8;col++){
          const sq=document.createElement('div');
          const square=files[col]+ranks[row];
          sq.dataset.square=square;
          sq.className='square '+(((row+col)%2===0)?'light':'dark');
          if(selected===square) sq.classList.add('selected');
          const target=legalTargets.find(m=>m.to===square);
          if(target) sq.classList.add(target.flags.includes('c')||target.flags.includes('e')?'capture':'target');
          const p=data[row][col];
          if(p) sq.innerHTML=pieceSVG(p.type,p.color);
          sq.addEventListener('click',()=>handleSquare(square));
          boardEl.appendChild(sq);
        }
      }
      updateClockUI();
    }

    function handleSquare(square){
      if(finished || !game) return;
      if(selected){
        const candidate=legalTargets.find(m=>m.to===square);
        if(candidate){
          const move=game.move({from:selected,to:square,promotion:'q'});
          selected=null; legalTargets=[];
          if(move){
            renderBoard();
            checkGameEnd();
            return;
          }
        }
      }
      const piece=game.get(square);
      if(piece && piece.color===game.turn()){
        selected=square;
        legalTargets=game.moves({square,verbose:true});
      } else { selected=null; legalTargets=[]; }
      renderBoard();
    }

    function updateClockUI(){
      whiteClockEl.textContent=formatTime(clocks.w);
      blackClockEl.textContent=formatTime(clocks.b);
      whiteClockEl.classList.toggle('danger',clocks.w<=60);
      blackClockEl.classList.toggle('danger',clocks.b<=60);
      whiteClockEl.style.outline=(!finished && game.turn()==='w')?'2px solid rgba(64,207,103,.65)':'none';
      blackClockEl.style.outline=(!finished && game.turn()==='b')?'2px solid rgba(64,207,103,.65)':'none';
    }

    function finish(message){
      if(finished) return;
      finished=true;
      updateClockUI();
      setTimeout(()=>alert(message),30);
    }

    function checkGameEnd(){
      if(game.in_checkmate()) finish(game.turn()==='w'?'كش مات — فاز الأسود':'كش مات — فاز الأبيض');
      else if(game.in_draw()) finish('انتهت المباراة بالتعادل');
    }

    setInterval(()=>{
      if(finished || !game) return;
      const turn=game.turn();
      clocks[turn]=Math.max(0,clocks[turn]-1);
      updateClockUI();
      if(clocks[turn]===0) finish(turn==='w'?'انتهى وقت الأبيض — فاز الأسود':'انتهى وقت الأسود — فاز الأبيض');
    },1000);

    whiteResign.addEventListener('click',()=>{ if(!finished && confirm('هل تريد استسلام الأبيض؟')) finish('استسلم الأبيض — فاز الأسود'); });
    blackResign.addEventListener('click',()=>{ if(!finished && confirm('هل تريد استسلام الأسود؟')) finish('استسلم الأسود — فاز الأبيض'); });
    drawOffer.addEventListener('click',()=>{
      if(finished) return;
      if(confirm('عرض تعادل: هل يوافق اللاعب الآخر؟')) finish('اتفق اللاعبان على التعادل');
    });

    document.querySelector('.ghost-btn').addEventListener('click',()=>{
      if(confirm('هل تريد مغادرة المباراة؟')) location.href='index.html';
    });

    renderBoard();
  </script>
</body>
</html>
