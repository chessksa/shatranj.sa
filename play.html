<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d3b2e">
<title>العب الآن | شطرنج السعودية</title>
<style>
:root{
  --green:#0d3b2e;--green2:#176148;--bg:#f4f1e8;--line:#ddd7ca;
  --text:#14221c;--muted:#6d746f;--gold:#c5a34d;
}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
a{text-decoration:none;color:inherit}
.wrap{width:min(1080px,calc(100% - 24px));margin:auto}
header{background:var(--green);color:#fff;padding:10px 0}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:900;font-size:19px}.home{font-size:13px;opacity:.92}
main{padding:14px 0 24px}
.notice{background:#fff4d7;border:1px solid #ead49a;border-radius:11px;padding:9px 11px;margin-bottom:10px;font-size:13px}
.lobby{display:grid;grid-template-columns:1fr;gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;max-width:560px;margin:auto;width:100%}
.card h2{margin:0 0 7px}.card p{margin:0 0 9px;color:var(--muted);font-size:14px}
button{width:100%;height:43px;border-radius:9px;font-size:14px;border:0;background:var(--green2);color:#fff;font-weight:900;cursor:pointer}
button.secondary{background:#eeeae0;color:var(--green)}
button.danger{background:#8e3434}
button:disabled{opacity:.55;cursor:not-allowed}
.msg{margin-top:8px;font-weight:700;font-size:13px}.err{color:#9b3434}.ok{color:#17633f}

.game{display:none}
.game-head{
  display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:center;
  background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px 11px;margin-bottom:9px
}
.player{text-align:center}.player strong{display:block}.player small{color:var(--muted)}
.game-grid{display:grid;grid-template-columns:minmax(300px,650px) 1fr;gap:10px;align-items:start}

.board-frame{padding:7px;background:#302b27;border-radius:14px;box-shadow:0 12px 30px rgba(28,18,10,.22)}
.board{
  width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,1fr);
  background:url("assets/board.webp") center/100% 100% no-repeat;
  border-radius:10px;overflow:hidden;user-select:none
}
.square{position:relative;display:grid;place-items:center;cursor:pointer;min-width:0;min-height:0}
.square.selected::before{
  content:"";position:absolute;inset:2px;z-index:3;border:4px solid rgba(229,195,87,.95);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);pointer-events:none
}
.square.target::after{
  content:"";position:absolute;z-index:4;width:22%;height:22%;border-radius:50%;
  background:rgba(20,80,55,.52);pointer-events:none
}
.square.capture::after{
  content:"";position:absolute;z-index:4;inset:8%;
  border:5px solid rgba(20,80,55,.52);border-radius:50%;pointer-events:none
}
.piece-img{position:absolute;inset:0;z-index:2;width:100%;height:100%;object-fit:contain;pointer-events:none}
.coord-rank,.coord-file{
  position:absolute;z-index:5;color:rgba(244,224,192,.90);font-weight:900;
  font-size:clamp(10px,1.6vw,17px);text-shadow:0 1px 1px rgba(50,30,15,.30);pointer-events:none
}
.coord-rank{top:4px;left:7px}.coord-file{bottom:3px;right:7px}

.side{display:grid;gap:8px}
.status,.moves{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px}
.status{text-align:center}.status strong{display:block;font-size:18px;color:var(--green)}
.moves{max-height:330px;overflow:auto}.moves h3{margin:0 0 7px}
.move-list{display:grid;grid-template-columns:32px 1fr 1fr;gap:4px;font-size:14px}
.move-no{color:var(--muted)}
.actions{display:grid;gap:6px}
.waiting{padding:18px;text-align:center;background:#f8f6ef;border-radius:10px;color:var(--muted)}
.spinner{
  display:inline-block;width:17px;height:17px;border:3px solid #ddd;border-top-color:var(--green2);
  border-radius:50%;animation:spin .9s linear infinite;vertical-align:middle;margin-left:6px
}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:820px){.game-grid{grid-template-columns:1fr}.game-head{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <nav>
      <div class="brand">♟ شطرنج السعودية — العب الآن</div>
      <a class="home" href="./">العودة للرئيسية</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="lobby" class="lobby">
    <div class="card">
      <h2>ابحث عن خصم</h2>
      <p id="playerInfo">جاري تحميل حساب اللاعب...</p>
      <button id="matchBtn" disabled>♟ ابحث عن خصم</button>
      <div id="matchMsg" class="msg"></div>
    </div>
  </section>

  <section id="game" class="game">
    <div class="game-head">
      <div class="player"><strong id="whiteName">الأبيض</strong><small>الأبيض</small></div>
      <div class="player"><strong id="blackName">بانتظار لاعب...</strong><small>الأسود</small></div>
    </div>

    <div class="game-grid">
      <div class="board-frame"><div id="board" class="board"></div></div>

      <aside class="side">
        <div class="status">
          <strong id="statusText">تحميل...</strong>
          <span id="statusSub"></span>
        </div>

        <div id="waitingBox" class="waiting" style="display:none">
          <span class="spinner"></span>
          نبحث لك عن خصم الآن
        </div>

        <div class="moves">
          <h3>النقلات</h3>
          <div id="moveList" class="move-list"></div>
        </div>

        <div class="actions">
          <button id="resignBtn" class="danger">استسلام</button>
          <button id="leaveBtn" class="secondary">الخروج من المباراة</button>
        </div>
      </aside>
    </div>
  </section>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';

const SUPABASE_URL='https://zjxkxhsvltihucdacjrv.supabase.co';
const SUPABASE_KEY='sb_publishable_bwFGOiJzT_Xv656pLPR8ww_oJxFzSGJ';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);

const PIECE_IMAGES={
  wp:'assets/wp.webp',wr:'assets/wr.webp',wn:'assets/wn.webp',wb:'assets/wb.webp',wq:'assets/wq.webp',wk:'assets/wk.webp',
  bp:'assets/bp.webp',br:'assets/br.webp',bn:'assets/bn.webp',bb:'assets/bb.webp',bq:'assets/bq.webp',bk:'assets/bk.webp'
};

let session=JSON.parse(localStorage.getItem('shatranj_live_session')||'null');
let playerProfile=null;
let gameData=null;
let chess=new Chess();
let selected=null;
let legalTargets=[];
let channel=null;

function saveSession(){localStorage.setItem('shatranj_live_session',JSON.stringify(session))}
function clearSession(){localStorage.removeItem('shatranj_live_session');session=null}
function setMsg(el,text,type=''){el.textContent=text;el.className='msg '+type}
function resultArabic(r){return r==='1-0'?'فوز الأبيض':r==='0-1'?'فوز الأسود':r==='1/2-1/2'?'تعادل':''}

async function loadPlayerProfile(){
  const {data:{session:authSession}}=await supabase.auth.getSession();

  if(!authSession){
    $('#playerInfo').textContent='يجب تسجيل الدخول أولًا.';
    setMsg($('#matchMsg'),'ارجع للرئيسية وسجّل الدخول.','err');
    return false;
  }

  const {data,error}=await supabase.rpc('get_my_player_profile');

  if(error){
    console.error(error);
    $('#playerInfo').textContent='تعذر تحميل حساب اللاعب.';
    setMsg($('#matchMsg'),'تعذر تحميل حسابك الآن.','err');
    return false;
  }

  playerProfile=Array.isArray(data)?data[0]:data;

  if(!playerProfile?.name){
    $('#playerInfo').textContent='لم يتم العثور على ملف اللاعب.';
    setMsg($('#matchMsg'),'أكمل إنشاء حساب اللاعب من الصفحة الرئيسية.','err');
    return false;
  }

  const rating=playerProfile.rating??1500;
  $('#playerInfo').textContent=`${playerProfile.name} — ${rating} نقطة`;
  $('#matchBtn').disabled=false;
  return true;
}

async function findOpponent(){
  if(!playerProfile?.name){
    return setMsg($('#matchMsg'),'تعذر تحميل اسم اللاعب.','err');
  }

  const name=playerProfile.name;

  $('#matchBtn').disabled=true;
  $('#matchBtn').textContent='جاري البحث...';
  setMsg($('#matchMsg'),'نبحث عن لاعب جاهز...');

  try{
    const {data:waiting,error:waitErr}=await supabase
      .from('live_games')
      .select('id,code,created_at')
      .eq('status','waiting')
      .is('black_name',null)
      .order('created_at',{ascending:true})
      .limit(5);

    if(waitErr) console.warn(waitErr);

    if(waiting?.length){
      for(const g of waiting){
        const {data,error}=await supabase.rpc('join_live_game',{p_code:g.code,p_name:name});
        if(!error && data?.[0]){
          const x=data[0];
          session={gameId:x.game_id,code:x.game_code,seatKey:x.seat_key,color:x.color,name};
          saveSession();
          setMsg($('#matchMsg'),'تم العثور على خصم','ok');
          await openGame();
          return;
        }
      }
    }

    const {data,error}=await supabase.rpc('create_live_game',{p_name:name});
    if(error) throw error;

    const x=data?.[0];
    if(!x) throw new Error('لم يتم إنشاء المباراة');

    session={gameId:x.game_id,code:x.game_code,seatKey:x.seat_key,color:x.color,name};
    saveSession();
    setMsg($('#matchMsg'),'أنت الآن في قائمة الانتظار. سنبدأ تلقائيًا عند دخول خصم.','ok');
    await openGame();

  }catch(error){
    console.error(error);
    setMsg($('#matchMsg'),'تعذر البحث عن خصم الآن. حاول مرة أخرى.','err');
  }finally{
    $('#matchBtn').disabled=false;
    $('#matchBtn').textContent='♟ ابحث عن خصم';
  }
}

async function fetchGame(){
  const {data,error}=await supabase
    .from('live_games')
    .select('id,code,white_name,black_name,fen,moves,status,result,updated_at')
    .eq('id',session.gameId)
    .single();

  if(error) throw error;
  return data;
}

async function openGame(){
  try{gameData=await fetchGame()}
  catch(e){
    console.error(e);
    clearSession();
    $('#lobby').style.display='grid';
    $('#game').style.display='none';
    return;
  }

  $('#lobby').style.display='none';
  $('#game').style.display='block';
  applyGame(gameData);
  subscribeGame();
}

function subscribeGame(){
  if(channel) supabase.removeChannel(channel);
  channel=supabase
    .channel('live-game-'+session.gameId)
    .on('postgres_changes',
      {event:'UPDATE',schema:'public',table:'live_games',filter:`id=eq.${session.gameId}`},
      payload=>applyGame(payload.new)
    )
    .subscribe();
}

function applyGame(data){
  gameData=data;
  try{chess=new Chess(data.fen)}catch(e){console.error(e);return}
  selected=null;legalTargets=[];

  $('#whiteName').textContent=data.white_name||'الأبيض';
  $('#blackName').textContent=data.black_name||'بانتظار لاعب...';

  renderBoard();
  renderMoves();
  renderStatus();
}

function renderStatus(){
  const waiting=gameData.status==='waiting';
  $('#waitingBox').style.display=waiting?'block':'none';
  $('#resignBtn').disabled=gameData.status!=='active';

  if(waiting){
    $('#statusText').textContent='بانتظار لاعب';
    $('#statusSub').textContent='سيبدأ اللعب تلقائيًا عند العثور على خصم';
    return;
  }

  if(gameData.status==='finished'){
    $('#statusText').textContent=resultArabic(gameData.result)||'انتهت المباراة';
    $('#statusSub').textContent='تم تسجيل النتيجة للمباراة';
    return;
  }

  const myTurn=chess.turn()===session.color;
  $('#statusText').textContent=myTurn?'دورك الآن':'دور الخصم';
  $('#statusSub').textContent=chess.inCheck()?'كش!':(session.color==='w'?'أنت تلعب بالأبيض':'أنت تلعب بالأسود');
}

function boardSquares(){
  const files=['a','b','c','d','e','f','g','h'];
  const ranks=[8,7,6,5,4,3,2,1];
  const squares=[];
  for(const rank of ranks) for(const file of files) squares.push(file+rank);
  if(session?.color==='b') squares.reverse();
  return squares;
}

function renderBoard(){
  const board=$('#board');
  board.innerHTML='';

  boardSquares().forEach((sq,index)=>{
    const piece=chess.get(sq);
    const el=document.createElement('div');
    el.className='square';

    if(sq===selected) el.classList.add('selected');

    const target=legalTargets.find(x=>x.to===sq);
    if(target) el.classList.add(target.captured?'capture':'target');

    if(piece){
      const image=document.createElement('img');
      image.className='piece-img';
      image.alt='';
      image.draggable=false;
      image.src=PIECE_IMAGES[piece.color+piece.type];
      el.appendChild(image);
    }

    const displayCol=index%8;
    const displayRow=Math.floor(index/8);

    if(displayCol===0){
      const rank=document.createElement('span');
      rank.className='coord-rank';
      rank.textContent=sq[1];
      el.appendChild(rank);
    }

    if(displayRow===7){
      const file=document.createElement('span');
      file.className='coord-file';
      file.textContent=sq[0];
      el.appendChild(file);
    }

    el.addEventListener('click',()=>clickSquare(sq));
    board.appendChild(el);
  });
}

function clickSquare(sq){
  if(!session || gameData.status!=='active' || chess.turn()!==session.color) return;

  const piece=chess.get(sq);

  if(!selected){
    if(!piece || piece.color!==session.color) return;
    selected=sq;
    legalTargets=chess.moves({square:sq,verbose:true});
    renderBoard();
    return;
  }

  if(piece && piece.color===session.color){
    selected=sq;
    legalTargets=chess.moves({square:sq,verbose:true});
    renderBoard();
    return;
  }

  const from=selected;
  let move=null;
  try{move=chess.move({from,to:sq,promotion:'q'})}catch(e){move=null}

  if(!move){
    selected=null;legalTargets=[];
    renderBoard();
    return;
  }

  selected=null;legalTargets=[];
  renderBoard();
  sendMove(move);
}

async function sendMove(move){
  let result=null;

  if(chess.isGameOver()){
    result=chess.isCheckmate()?(move.color==='w'?'1-0':'0-1'):'1/2-1/2';
  }

  const {error}=await supabase.rpc('submit_live_move',{
    p_game_id:session.gameId,
    p_seat_key:session.seatKey,
    p_from:move.from,
    p_to:move.to,
    p_promotion:move.promotion||null,
    p_new_fen:chess.fen(),
    p_san:move.san,
    p_result:result
  });

  if(error){
    console.error(error);
    gameData=await fetchGame();
    applyGame(gameData);
  }
}

function renderMoves(){
  const moves=Array.isArray(gameData.moves)?gameData.moves:[];
  const list=$('#moveList');
  list.innerHTML='';

  for(let i=0;i<moves.length;i+=2){
    const no=document.createElement('div');
    const w=document.createElement('div');
    const b=document.createElement('div');

    no.className='move-no';
    no.textContent=(i/2+1)+'.';
    w.textContent=moves[i]?.san||'';
    b.textContent=moves[i+1]?.san||'';

    list.append(no,w,b);
  }
}

async function resign(){
  if(!confirm('هل تريد الاستسلام؟')) return;

  const {error}=await supabase.rpc('resign_live_game',{
    p_game_id:session.gameId,
    p_seat_key:session.seatKey
  });

  if(error) console.error(error);
}

function leave(){
  if(channel) supabase.removeChannel(channel);
  clearSession();
  location.reload();
}

$('#matchBtn').addEventListener('click',findOpponent);
$('#resignBtn').addEventListener('click',resign);
$('#leaveBtn').addEventListener('click',leave);

(async()=>{
  const ok=await loadPlayerProfile();
  if(ok && session?.gameId && session?.seatKey) await openGame();
})();
</script>
</body>
</html>
