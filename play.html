<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d3b2e">
<title>العب الآن | شطرنج السعودية</title>
<style>
:root{--green:#0d3b2e;--green2:#176148;--bg:#f7f3ea;--paper:#fffdf8;--line:#ded5c4;--text:#17221d;--muted:#77776f;--gold:#b58c38;--danger:#b42323;--darkwood:#2c2722}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
a{text-decoration:none;color:inherit}
.wrap{width:min(1240px,calc(100% - 24px));margin:auto}
header{background:#fff;border-bottom:1px solid #ebe4d7;position:sticky;top:0;z-index:20}
nav{height:68px;display:flex;justify-content:space-between;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;color:var(--green);font-weight:900;font-size:20px}
.brand-mark{font-size:31px;line-height:1} .home{font-size:13px;color:var(--green);font-weight:800}
main{padding:18px 0 28px}
.lobby{margin:0 auto 14px}
.card{background:rgba(255,255,255,.74);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.card-copy h2{font-size:16px;margin:0 0 3px} .card-copy p{margin:0;color:var(--muted);font-size:13px}
button{border:0;border-radius:10px;background:var(--green2);color:#fff;font-family:inherit;font-weight:900;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
#matchBtn{width:auto;min-width:160px;height:42px;padding:0 18px}
.msg{font-size:12px;font-weight:800}.err{color:#9c2f2f}.ok{color:#17633f}
.game{display:block}
.game-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start;direction:ltr}
.board-column{min-width:0;direction:rtl}
.board-shell{width:100%;max-width:840px;margin:auto;padding:4px;background:var(--darkwood);border:1px solid #15120f;border-radius:14px;box-shadow:0 9px 22px rgba(52,38,23,.16);overflow:hidden}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1/1;overflow:hidden;border-radius:9px;direction:ltr}
.square{position:relative;display:grid;place-items:center;cursor:pointer;min-width:0;min-height:0;background-size:cover;background-position:center;user-select:none}

.square.selected::before{content:"";position:absolute;inset:3px;z-index:3;border:4px solid rgba(235,193,55,.95);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);pointer-events:none}
.square.target::after{content:"";position:absolute;z-index:4;width:21%;height:21%;border-radius:50%;background:rgba(13,90,61,.52);pointer-events:none}
.square.capture::after{content:"";position:absolute;z-index:4;inset:8%;border:5px solid rgba(13,90,61,.55);border-radius:50%;pointer-events:none}
.coord-rank,.coord-file{position:absolute;z-index:5;font-weight:900;font-size:clamp(9px,1.15vw,14px);pointer-events:none;text-shadow:0 1px rgba(255,255,255,.28)}
.square.light .coord-rank,.square.light .coord-file{color:#745537} .square.dark .coord-rank,.square.dark .coord-file{color:#f0d9ad}
.coord-rank{top:4px;left:6px}.coord-file{bottom:4px;right:6px}
.board-status{max-width:840px;margin:9px auto 0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:#5d5d56;min-height:28px}
.board-status strong{color:var(--green)}
.waiting{display:none}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #d6d2c8;border-top-color:var(--green2);border-radius:50%;animation:spin .9s linear infinite;vertical-align:middle;margin-left:4px}@keyframes spin{to{transform:rotate(360deg)}}
.match-rail{direction:rtl;display:flex;flex-direction:column;gap:12px;position:sticky;top:86px}
.player-card{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(53,43,30,.06)}
.player-card.active-turn{border-color:#8ab39e;box-shadow:0 0 0 2px rgba(23,97,72,.08)}
.player-line{display:flex;align-items:center;gap:11px}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#eee8dc;color:#4d463d;border:1px solid #d6cebf;font-size:25px;font-weight:900}
.player-meta{min-width:0;flex:1}.player-meta strong{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-meta small{color:var(--muted);font-size:12px}
.you-badge{display:none;color:var(--green2);font-weight:900;margin-right:5px}
.clock{margin-top:12px;height:76px;border:1px solid #d9d2c4;border-radius:12px;background:#faf8f1;display:grid;place-items:center;font:900 40px/1 Arial,sans-serif;letter-spacing:1px;color:#173c2e;transition:.2s}
.clock.low-time{color:var(--danger);border-color:#efb0a8;background:#fff3f0}
.clock.stopped{color:#73736d}
.between-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.between-actions button{height:64px;background:#fffdf8;color:#352e26;border:1px solid #d9d0c0;padding:5px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px}
.between-actions button:hover:not(:disabled){border-color:#9d8562;background:#f7f0e3}
.between-actions button.danger{color:#9c2e2e} .action-icon{font-size:21px;line-height:1}
.status-strip{text-align:center;background:#efeade;border:1px solid #ded5c4;border-radius:11px;padding:9px 10px;font-size:12px;color:#67645c}
.status-strip strong{color:var(--green);display:block;margin-bottom:2px}
.game-details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:12px}
.game-details summary{cursor:pointer;font-weight:900;color:#50483d}
.move-list{margin-top:8px;display:grid;grid-template-columns:28px 1fr 1fr;gap:4px;font-size:12px;max-height:150px;overflow:auto}.move-no{color:var(--muted)}
@media(max-width:900px){.game-grid{grid-template-columns:1fr;direction:rtl}.match-rail{position:static;display:grid;grid-template-columns:1fr;max-width:840px;width:100%;margin:auto}.between-actions{order:2}.player-card:first-of-type{order:1}.player-card:last-of-type{order:3}.status-strip{order:4}.game-details{order:5}}
@media(max-width:560px){.wrap{width:min(100% - 12px,1240px)}nav{height:58px}.brand{font-size:16px}.brand-mark{font-size:25px}.card{align-items:stretch;flex-direction:column}#matchBtn{width:100%}.board-shell{padding:3px;border-radius:8px}.between-actions button{height:58px}.clock{height:62px;font-size:34px}}
</style>

<body>
<header><div class="wrap"><nav><div class="brand"><span class="brand-mark">♞</span><span>شطرنج السعودية</span></div><a class="home" href="./">الرئيسية</a></nav></div></header>
<main class="wrap">
  <section id="lobby" class="lobby">
    <div class="card">
      <div class="card-copy"><h2>العب الآن</h2><p id="playerInfo">جاري تحميل حساب اللاعب...</p><div id="matchMsg" class="msg"></div></div>
      <button id="matchBtn" disabled>ابحث عن خصم</button>
    </div>
  </section>

  <section id="game" class="game">
    <div class="game-grid">
      <div class="board-column">
        <div class="board-shell"><div id="board" class="board"><div class="square light" data-square="a8"><span class="coord-rank">8</span><span class="piece-sprite br" aria-hidden="true"></span></div>

<div class="square light" data-square="d1"><span class="coord-file">d</span><span class="piece-sprite wq" aria-hidden="true"></span></div>
<div class="square dark" data-square="e1"><span class="coord-file">e</span><span class="piece-sprite wk" aria-hidden="true"></span></div>
<div class="square light" data-square="f1"><span class="coord-file">f</span><span class="piece-sprite wb" aria-hidden="true"></span></div>
<div class="square dark" data-square="g1"><span class="coord-file">g</span><span class="piece-sprite wn" aria-hidden="true"></span></div>
<div class="square light" data-square="h1"><span class="coord-file">h</span><span class="piece-sprite wr" aria-hidden="true"></span></div></div></div>
        <div class="board-status"><span id="waitingBox" class="waiting"><span class="spinner"></span></span><span><strong id="statusText">الرقعة جاهزة</strong> — <span id="statusSub">ابحث عن خصم لبدء المباراة</span></span></div>
      </div>

      <aside class="match-rail">
        <section id="blackCard" class="player-card">
          <div class="player-line"><div class="avatar">♟</div><div class="player-meta"><strong id="blackName">الأسود</strong><small>الأسود <span id="blackYou" class="you-badge">• أنت</span> · <span id="blackRating">1500</span></small></div></div>
          <div id="blackClock" class="clock">10:00</div>
        </section>

        <div class="between-actions">
          <button id="drawBtn" disabled><span class="action-icon">🤝</span><span id="drawLabel">طلب التعادل</span></button>
          <button id="resignBtn" class="danger" disabled><span class="action-icon">⚑</span><span>استسلام</span></button>
          <button id="leaveBtn" disabled><span class="action-icon">↪</span><span>خروج</span></button>
        </div>

        <section id="whiteCard" class="player-card">
          <div class="player-line"><div class="avatar">♙</div><div class="player-meta"><strong id="whiteName">الأبيض</strong><small>الأبيض <span id="whiteYou" class="you-badge">• أنت</span> · <span id="whiteRating">1500</span></small></div></div>
          <div id="whiteClock" class="clock">10:00</div>
        </section>

        <div class="status-strip"><strong id="railStatus">جاهز للعب</strong></div>
        <details class="game-details"><summary>سجل النقلات</summary><div id="moveList" class="move-list"></div></details>
      </aside>
    </div>
  </section>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';

const SUPABASE_URL='https://zjxkxhsvltihucdacjrv.supabase.co';
const SUPABASE_KEY='sb_publishable_bwFGOiJzT_Xv656pLPR8ww_oJxFzSGJ';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const PIECE_IMAGES={wp:'wp',wr:'wr',wn:'wn',wb:'wb',wq:'wq',wk:'wk',bp:'bp',br:'br',bn:'bn',bb:'bb',bq:'bq',bk:'bk'};
const INITIAL_CLOCK_MS=10*60*1000;
const LOW_TIME_MS=60*1000;

let session=JSON.parse(localStorage.getItem('shatranj_live_session')||'null');
let playerProfile=null;
let gameData=null;
let chess=new Chess();
let selected=null;
let legalTargets=[];
let channel=null;
let timeoutClaiming=false;

function saveSession(){localStorage.setItem('shatranj_live_session',JSON.stringify(session))}
function clearSession(){localStorage.removeItem('shatranj_live_session');session=null}
function setMsg(el,text,type=''){el.textContent=text;el.className='msg '+type}
function resultArabic(r){return r==='1-0'?'فوز الأبيض':r==='0-1'?'فوز الأسود':r==='1/2-1/2'?'تعادل':''}
function asNumber(v,fallback){const n=Number(v);return Number.isFinite(n)?n:fallback}

async function loadPlayerProfile(){
  const {data:{session:authSession}}=await supabase.auth.getSession();
  if(!authSession){$('#playerInfo').textContent='يجب تسجيل الدخول أولًا.';setMsg($('#matchMsg'),'ارجع للرئيسية وسجّل الدخول.','err');return false}
  const {data,error}=await supabase.rpc('get_my_player_profile');
  if(error){console.error(error);$('#playerInfo').textContent='تعذر تحميل حساب اللاعب.';setMsg($('#matchMsg'),'تعذر تحميل حسابك الآن.','err');return false}
  playerProfile=Array.isArray(data)?data[0]:data;
  if(!playerProfile?.name){$('#playerInfo').textContent='لم يتم العثور على ملف اللاعب.';setMsg($('#matchMsg'),'أكمل إنشاء حساب اللاعب من الصفحة الرئيسية.','err');return false}
  const rating=playerProfile.rating??1500;
  $('#playerInfo').textContent=`${playerProfile.name} — ${rating} نقطة`;
  $('#matchBtn').disabled=false;
  updateRatings();
  return true;
}

function updateRatings(){
  const mine=playerProfile?.rating??1500;
  $('#whiteRating').textContent=session?.color==='w'?mine:1500;
  $('#blackRating').textContent=session?.color==='b'?mine:1500;
}

async function findOpponent(){
  if(!playerProfile?.name)return setMsg($('#matchMsg'),'تعذر تحميل اسم اللاعب.','err');
  const name=playerProfile.name;
  $('#matchBtn').disabled=true;$('#matchBtn').textContent='جاري البحث...';setMsg($('#matchMsg'),'نبحث عن لاعب جاهز...');
  try{
    const {data:waiting,error:waitErr}=await supabase.from('live_games').select('id,code,created_at').eq('status','waiting').is('black_name',null).order('created_at',{ascending:true}).limit(5);
    if(waitErr)console.warn(waitErr);
    if(waiting?.length){
      for(const g of waiting){
        const {data,error}=await supabase.rpc('join_live_game',{p_code:g.code,p_name:name});
        if(!error&&data?.[0]){const x=data[0];session={gameId:x.game_id,code:x.game_code,seatKey:x.seat_key,color:x.color,name};saveSession();setMsg($('#matchMsg'),'تم العثور على خصم','ok');await openGame();return}
      }
    }
    const {data,error}=await supabase.rpc('create_live_game',{p_name:name});if(error)throw error;
    const x=data?.[0];if(!x)throw new Error('لم يتم إنشاء المباراة');
    session={gameId:x.game_id,code:x.game_code,seatKey:x.seat_key,color:x.color,name};saveSession();setMsg($('#matchMsg'),'أنت الآن في قائمة الانتظار.','ok');await openGame();
  }catch(error){console.error(error);setMsg($('#matchMsg'),'تعذر البحث عن خصم الآن. حاول مرة أخرى.','err')}finally{$('#matchBtn').disabled=false;$('#matchBtn').textContent='ابحث عن خصم'}
}

async function fetchGame(){
  const {data,error}=await supabase.from('live_games').select('id,code,white_name,black_name,fen,moves,status,result,updated_at,white_time_ms,black_time_ms,turn_started_at,draw_offer_by').eq('id',session.gameId).single();
  if(error)throw error;return data;
}

async function openGame(){
  try{gameData=await fetchGame()}catch(e){console.error(e);clearSession();$('#lobby').style.display='block';showPreviewBoard();return}
  $('#lobby').style.display='none';$('#game').style.display='block';$('#leaveBtn').disabled=false;applyGame(gameData);subscribeGame();
}

function subscribeGame(){
  if(channel)supabase.removeChannel(channel);
  channel=supabase.channel('live-game-'+session.gameId).on('postgres_changes',{event:'UPDATE',schema:'public',table:'live_games',filter:`id=eq.${session.gameId}`},payload=>applyGame(payload.new)).subscribe();
}

function applyGame(data){
  gameData=data;try{chess=new Chess(data.fen)}catch(e){console.error(e);return}selected=null;legalTargets=[];
  $('#whiteName').textContent=data.white_name||'الأبيض';$('#blackName').textContent=data.black_name||'بانتظار لاعب...';
  $('#whiteYou').style.display=session?.color==='w'?'inline':'none';$('#blackYou').style.display=session?.color==='b'?'inline':'none';updateRatings();
  renderBoard();renderMoves();renderStatus();renderClocks();
}

function renderStatus(){
  if(!gameData)return;
  const waiting=gameData.status==='waiting';$('#waitingBox').style.display=waiting?'inline-block':'none';
  $('#resignBtn').disabled=gameData.status!=='active';$('#drawBtn').disabled=gameData.status!=='active';
  $('#drawLabel').textContent=gameData.draw_offer_by===session?.color?'إلغاء التعادل':(gameData.draw_offer_by&&gameData.draw_offer_by!==session?.color?'الرد على التعادل':'طلب التعادل');
  if(waiting){$('#statusText').textContent='بانتظار لاعب';$('#statusSub').textContent='سيبدأ اللعب تلقائيًا عند العثور على خصم';$('#railStatus').textContent='بانتظار الخصم';return}
  if(gameData.status==='finished'){const t=resultArabic(gameData.result)||'انتهت المباراة';$('#statusText').textContent=t;$('#statusSub').textContent='تم تسجيل النتيجة';$('#railStatus').textContent=t;return}
  const myTurn=chess.turn()===session?.color;$('#statusText').textContent=myTurn?'دورك الآن':'دور الخصم';$('#statusSub').textContent=chess.inCheck()?'كش!':(session?.color==='w'?'أنت تلعب بالأبيض':'أنت تلعب بالأسود');$('#railStatus').textContent=myTurn?'دورك الآن':'دور الخصم';
}

function showPreviewBoard(){
  gameData=null;chess=new Chess();selected=null;legalTargets=[];$('#game').style.display='block';$('#whiteName').textContent='الأبيض';$('#blackName').textContent='الأسود';$('#whiteYou').style.display='none';$('#blackYou').style.display='none';$('#statusText').textContent='الرقعة جاهزة';$('#statusSub').textContent='ابحث عن خصم لبدء المباراة';$('#railStatus').textContent='جاهز للعب';$('#waitingBox').style.display='none';$('#resignBtn').disabled=true;$('#drawBtn').disabled=true;$('#leaveBtn').disabled=true;$('#moveList').innerHTML='';updateRatings();renderBoard();renderClocks();
}

function boardSquares(){const fs=['a','b','c','d','e','f','g','h'],rs=[8,7,6,5,4,3,2,1],out=[];for(const r of rs)for(const f of fs)out.push(f+r);if(gameData&&session?.color==='b')out.reverse();return out}
function squareTone(sq){const f=sq.charCodeAt(0)-97,r=Number(sq[1]);return(f+r)%2===1?'dark':'light'}
function renderBoard(){
  const board=$('#board');board.innerHTML='';
  boardSquares().forEach((sq,index)=>{
    const piece=chess.get(sq),el=document.createElement('div');el.className='square '+squareTone(sq);el.dataset.square=sq;
    if(sq===selected)el.classList.add('selected');const target=legalTargets.find(x=>x.to===sq);if(target)el.classList.add(target.captured?'capture':'target');
    if(piece){const sprite=document.createElement('span');sprite.className='piece-sprite '+PIECE_IMAGES[piece.color+piece.type];sprite.setAttribute('aria-hidden','true');el.appendChild(sprite)}
    const displayCol=index%8,displayRow=Math.floor(index/8);if(displayCol===0){const rank=document.createElement('span');rank.className='coord-rank';rank.textContent=sq[1];el.appendChild(rank)}if(displayRow===7){const file=document.createElement('span');file.className='coord-file';file.textContent=sq[0];el.appendChild(file)}
    el.addEventListener('click',()=>clickSquare(sq));board.appendChild(el);
  })
}

function clickSquare(sq){
  if(!session||!gameData||gameData.status!=='active'||chess.turn()!==session.color)return;
  const piece=chess.get(sq);
  if(!selected){if(!piece||piece.color!==session.color)return;selected=sq;legalTargets=chess.moves({square:sq,verbose:true});renderBoard();return}
  if(piece&&piece.color===session.color){selected=sq;legalTargets=chess.moves({square:sq,verbose:true});renderBoard();return}
  const from=selected;let move=null;try{move=chess.move({from,to:sq,promotion:'q'})}catch(e){move=null}
  if(!move){selected=null;legalTargets=[];renderBoard();return}selected=null;legalTargets=[];renderBoard();sendMove(move);
}

async function sendMove(move){
  let result=null;if(chess.isGameOver())result=chess.isCheckmate()?(move.color==='w'?'1-0':'0-1'):'1/2-1/2';
  const {error}=await supabase.rpc('submit_live_move',{p_game_id:session.gameId,p_seat_key:session.seatKey,p_from:move.from,p_to:move.to,p_promotion:move.promotion||null,p_new_fen:chess.fen(),p_san:move.san,p_result:result});
  if(error){console.error(error);gameData=await fetchGame();applyGame(gameData)}
}

function renderMoves(){const moves=Array.isArray(gameData?.moves)?gameData.moves:[],list=$('#moveList');list.innerHTML='';for(let i=0;i<moves.length;i+=2){const no=document.createElement('div'),w=document.createElement('div'),b=document.createElement('div');no.className='move-no';no.textContent=(i/2+1)+'.';w.textContent=moves[i]?.san||'';b.textContent=moves[i+1]?.san||'';list.append(no,w,b)}}

function effectiveClock(color){
  if(!gameData)return INITIAL_CLOCK_MS;
  let ms=asNumber(color==='w'?gameData.white_time_ms:gameData.black_time_ms,INITIAL_CLOCK_MS);
  if(gameData.status==='active'&&chess.turn()===color&&gameData.turn_started_at){ms-=Math.max(0,Date.now()-new Date(gameData.turn_started_at).getTime())}
  return Math.max(0,ms);
}
function clockText(ms){const total=Math.ceil(ms/1000),m=Math.floor(total/60),s=total%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function paintClock(el,ms,active){el.textContent=clockText(ms);el.classList.toggle('low-time',ms<=LOW_TIME_MS);el.classList.toggle('stopped',!active)}
function renderClocks(){
  const w=effectiveClock('w'),b=effectiveClock('b'),active=gameData?.status==='active';paintClock($('#whiteClock'),w,active&&chess.turn()==='w');paintClock($('#blackClock'),b,active&&chess.turn()==='b');
  $('#whiteCard').classList.toggle('active-turn',active&&chess.turn()==='w');$('#blackCard').classList.toggle('active-turn',active&&chess.turn()==='b');
  if(active&&!timeoutClaiming&&((chess.turn()==='w'&&w<=0)||(chess.turn()==='b'&&b<=0)))claimTimeout();
}
async function claimTimeout(){timeoutClaiming=true;try{const {error}=await supabase.rpc('claim_live_timeout',{p_game_id:session.gameId,p_seat_key:session.seatKey});if(error)console.warn(error)}finally{setTimeout(()=>timeoutClaiming=false,1200)}}

async function drawAction(){
  if(!gameData||gameData.status!=='active')return;
  try{
    if(!gameData.draw_offer_by){const {error}=await supabase.rpc('offer_live_draw',{p_game_id:session.gameId,p_seat_key:session.seatKey});if(error)throw error;return}
    if(gameData.draw_offer_by===session.color){const {error}=await supabase.rpc('respond_live_draw',{p_game_id:session.gameId,p_seat_key:session.seatKey,p_accept:false});if(error)throw error;return}
    const accept=confirm('الخصم عرض التعادل. هل تقبل؟');const {error}=await supabase.rpc('respond_live_draw',{p_game_id:session.gameId,p_seat_key:session.seatKey,p_accept:accept});if(error)throw error;
  }catch(e){console.error(e);alert('تعذر تنفيذ طلب التعادل الآن.')}
}
async function resign(){if(!confirm('هل تريد الاستسلام؟'))return;const {error}=await supabase.rpc('resign_live_game',{p_game_id:session.gameId,p_seat_key:session.seatKey});if(error)console.error(error)}
function leave(){if(channel)supabase.removeChannel(channel);clearSession();location.reload()}

$('#matchBtn').addEventListener('click',findOpponent);$('#drawBtn').addEventListener('click',drawAction);$('#resignBtn').addEventListener('click',resign);$('#leaveBtn').addEventListener('click',leave);
setInterval(renderClocks,250);showPreviewBoard();
(async()=>{const ok=await loadPlayerProfile();if(ok&&session?.gameId&&session?.seatKey)await openGame()})();
</script>
</body>
</html>
