<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>العب الآن | شطرنج السعودية</title>
  <style>
    :root{
      --bg1:#022f33;--bg2:#063a40;--bg3:#0b4850;--panel:#07363d;
      --panel-soft:rgba(7,54,61,.78);--gold:#e0b567;--gold-soft:rgba(224,181,103,.22);
      --line:rgba(224,181,103,.55);--board-dark:#7f9560;--board-light:#dacba5;
      --wood-1:#554125;--wood-2:#2a2118;--text:#f4efe6;--muted:#d6cfbf;
      --success:#40cf67;--danger:#db4343;--shadow:0 12px 30px rgba(0,0,0,.28);
      --header-h:92px;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;width:100%}
    body{
      margin:0;min-height:100dvh;overflow-x:hidden;
      font-family:"Tahoma","Segoe UI",Arial,sans-serif;color:var(--text);
      background:
        radial-gradient(circle at 15% 18%,rgba(12,110,120,.32),transparent 26%),
        radial-gradient(circle at 81% 24%,rgba(12,110,120,.24),transparent 18%),
        radial-gradient(circle at 35% 82%,rgba(12,110,120,.18),transparent 22%),
        linear-gradient(135deg,var(--bg1),var(--bg2) 48%,var(--bg3));
      background-attachment:fixed;
    }
    .topbar{height:var(--header-h);border-bottom:1px solid rgba(224,181,103,.45);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
    .topbar-inner{height:100%;max-width:1600px;margin:0 auto;padding:8px 28px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px}
    .header-actions{display:flex;align-items:center;gap:12px;min-width:0}
    .header-actions.start{justify-content:flex-start}.header-actions.end{justify-content:flex-end}
    .ghost-btn{min-width:176px;height:46px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:rgba(10,38,44,.35);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:9px;font:700 16px inherit;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.02) inset;white-space:nowrap}
    .ghost-btn.small{min-width:112px}.ghost-btn .icon{font-size:20px;color:var(--gold)}
    .brand{display:flex;align-items:center;gap:16px;justify-content:center;text-align:center;white-space:nowrap}
    .brand-copy h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.4px}.brand-copy .en{margin-top:3px;font-size:13px;letter-spacing:3.8px;font-weight:700}
    .brand-mark{width:64px;height:64px;flex:0 0 auto}.brand-mark svg{width:100%;height:100%}.brand-mark .mark-stroke{stroke:var(--gold);fill:none;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}.brand-mark .mark-fill{fill:var(--gold)}

    .page{width:min(100%,1600px);height:calc(100dvh - var(--header-h));margin:0 auto;padding:12px 24px 14px}
    .layout{height:100%;display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,30vw,460px);gap:18px;align-items:center;direction:ltr}
    .board-panel{direction:ltr;height:100%;min-width:0;display:grid;place-items:center}
    .side-panel{direction:rtl;height:100%;min-width:0;display:grid;align-items:center}
    .board-frame{position:relative;width:min(100%,calc(100dvh - var(--header-h) - 34px),920px);padding:14px 14px 22px;border-radius:18px;background:linear-gradient(180deg,rgba(113,83,40,.5),rgba(54,39,22,.78)),linear-gradient(135deg,var(--wood-1),var(--wood-2));border:2px solid rgba(231,197,126,.78);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.1)}
    .board-shell{position:relative;width:100%;aspect-ratio:1/1;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.45);background:#222}
    .board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
    .square{position:relative;display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(31,41,20,.38);border-bottom:1px solid rgba(31,41,20,.38);user-select:none}
    .square.light{background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.10),transparent 38%),linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.03)),var(--board-light)}
    .square.dark{background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.06),transparent 38%),linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.06)),var(--board-dark)}
    .square.selected{box-shadow:inset 0 0 0 5px rgba(238,190,74,.95)}.square.target::after{content:"";width:22%;height:22%;border-radius:50%;background:rgba(20,62,48,.55);position:absolute}.square.capture::after{content:"";position:absolute;inset:8px;border:4px solid rgba(117,45,36,.55);border-radius:50%}
    .piece{width:76%;height:76%;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}.piece svg{width:100%;height:100%;overflow:visible}.piece.black .fill-main{fill:#101010}.piece.black .fill-accent{fill:#212121}.piece.black .stroke-main{stroke:#080808}.piece.white .fill-main{fill:#f2e7cc}.piece.white .fill-accent{fill:#dbc28b}.piece.white .stroke-main{stroke:#7f6b46}
    .coords-left,.coords-bottom{position:absolute;z-index:5;color:#f4cd67;text-shadow:0 1px 1px rgba(0,0,0,.45);font-size:14px;line-height:1}.coords-left{left:-6px;top:0;bottom:22px;width:18px;display:grid;grid-template-rows:repeat(8,1fr);place-items:center}.coords-bottom{left:14px;right:14px;bottom:4px;height:16px;display:grid;grid-template-columns:repeat(8,1fr);place-items:center;direction:ltr}

    .panel-stack{width:100%;max-height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);gap:12px}
    .player-card,.actions-card{background:var(--panel-soft);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.03)}
    .player-card{padding:14px;display:grid;grid-template-columns:66px minmax(0,1fr) 126px;align-items:center;gap:12px;min-height:0}
    .avatar{width:66px;height:66px;border-radius:50%;border:2px solid rgba(224,181,103,.8);background:radial-gradient(circle at 38% 30%,#434a4f,#1a2126 62%,#12181c);position:relative;overflow:hidden}.avatar.light{background:radial-gradient(circle at 38% 30%,#fff,#f4f4f4 48%,#dadada 70%,#cbcbcb)}.avatar::before{content:"";position:absolute;left:50%;top:15px;width:25px;height:25px;border-radius:50%;transform:translateX(-50%);background:rgba(0,0,0,.45)}.avatar::after{content:"";position:absolute;left:50%;bottom:9px;width:39px;height:28px;border-radius:50% 50% 42% 42%;transform:translateX(-50%);background:rgba(0,0,0,.45)}.avatar.light::before,.avatar.light::after{background:rgba(255,255,255,.92)}
    .status{display:flex;align-items:center;gap:6px;color:var(--success);font-size:13px;margin-bottom:5px}.status::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--success);box-shadow:0 0 8px rgba(64,207,103,.5)}
    .name{font-size:18px;font-weight:800;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.location{display:flex;align-items:center;gap:5px;color:#efbd64;font-size:12px;margin:0 0 7px}.rating{display:flex;align-items:center;gap:7px;font-size:13px;color:#fff}.rating .trend{font-size:16px;color:var(--gold)}
    .clock-box{justify-self:end;text-align:center;width:100%}.clock{border:1px solid rgba(224,181,103,.26);background:rgba(6,27,31,.58);border-radius:12px;padding:12px 8px;font-size:26px;font-weight:700;letter-spacing:1px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}.clock-progress{margin-top:8px;height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.clock.danger{color:#ff5151;border-color:rgba(255,81,81,.65);box-shadow:0 0 18px rgba(255,81,81,.12) inset}.clock-progress span{display:block;width:74%;height:100%;border-radius:999px;background:linear-gradient(90deg,#46bb6d,#69d786)}
    .actions-card{display:grid;grid-template-columns:repeat(3,1fr);overflow:hidden;min-height:82px}.action-item{background:transparent;border:0;color:var(--text);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:82px;cursor:pointer;padding:8px 4px}.action-item+.action-item{border-right:1px solid rgba(224,181,103,.24)}.action-icon{font-size:25px;color:var(--gold);line-height:1}.action-label{font-size:14px;font-weight:700;white-space:nowrap}

    @media (min-width:1221px){
      :root{--header-h:70px}
      .topbar-inner{padding:5px 18px}
      .brand{gap:12px}.brand-mark{width:50px;height:50px}.brand-copy h1{font-size:19px}.brand-copy .en{font-size:11px;letter-spacing:3px}
      .ghost-btn{height:40px;min-width:152px;padding:0 13px;font-size:14px}.ghost-btn.small{min-width:92px}
      .page{width:100%;height:calc(100dvh - var(--header-h));min-height:0;padding:8px 14px 10px;overflow:hidden}
      .layout{height:100%;min-height:0;grid-template-columns:minmax(0,1fr) clamp(340px,26vw,410px);gap:14px;align-items:center}
      .board-panel{height:100%;min-height:0;place-items:center}
      .board-frame{width:min(100%,calc(100dvh - var(--header-h) - 30px),982px);padding:12px 12px 20px;border-radius:17px}
      .side-panel{height:min(100%,calc(100dvh - var(--header-h) - 18px),990px);min-height:0;position:static;align-self:center;align-items:stretch}
      .panel-stack{height:100%;max-height:none;grid-template-rows:auto auto auto;align-content:space-between;gap:14px}
      .player-card{min-height:clamp(132px,18vh,190px);padding:17px;grid-template-columns:clamp(72px,5vw,86px) minmax(0,1fr) clamp(122px,9vw,142px);gap:14px}
      .avatar{width:clamp(72px,5vw,86px);height:clamp(72px,5vw,86px)}
      .avatar::before{top:17px;width:29px;height:29px}.avatar::after{bottom:11px;width:45px;height:32px}
      .status{font-size:14px;margin-bottom:6px}.status::before{width:10px;height:10px}
      .name{font-size:clamp(19px,1.3vw,22px);margin-bottom:7px}.location{font-size:13px;margin-bottom:9px}.rating{font-size:14px}.rating .trend{font-size:18px}
      .clock{font-size:clamp(28px,2vw,34px);padding:15px 9px;border-radius:13px}.clock-progress{margin-top:10px;height:7px}
      .actions-card{min-height:clamp(88px,10vh,112px)}.action-item{min-height:clamp(88px,10vh,112px);gap:8px;padding:9px 5px}.action-icon{font-size:27px}.action-label{font-size:15px}
    }

    @media (max-width:1220px) and (min-width:901px){
      :root{--header-h:82px}
      .topbar-inner{padding:7px 20px}.brand-mark{width:54px;height:54px}.brand-copy h1{font-size:19px}.brand-copy .en{font-size:11px}.ghost-btn{height:42px;min-width:150px;font-size:14px}.ghost-btn.small{min-width:96px}
      .page{padding:10px 18px 12px}.layout{grid-template-columns:minmax(0,1fr) 360px;gap:14px}.board-frame{width:min(100%,calc(100dvh - var(--header-h) - 28px),820px)}
      .player-card{grid-template-columns:58px minmax(0,1fr) 112px;padding:11px;gap:9px}.avatar{width:58px;height:58px}.clock{font-size:23px;padding:10px 7px}.actions-card,.action-item{min-height:72px}.panel-stack{gap:10px}
    }

    @media (max-width:900px){
      :root{--header-h:72px}
      body{background-attachment:scroll}
      .topbar{height:var(--header-h)}
      .topbar-inner{padding:7px 9px;grid-template-columns:1fr auto 1fr;gap:6px}
      .brand{gap:7px}.brand-mark{width:42px;height:42px}.brand-copy h1{font-size:16px}.brand-copy .en{display:none}
      .ghost-btn{width:auto;min-width:0;height:42px;padding:0 9px;border-radius:10px;gap:5px;font-size:12px}.ghost-btn.small{min-width:62px}.ghost-btn .icon{font-size:17px}
      .page{height:auto;min-height:calc(100dvh - var(--header-h));padding:8px 7px 12px}
      .layout{height:auto;display:flex;flex-direction:column;gap:7px;direction:rtl;align-items:stretch}
      .board-panel{order:2;height:auto;width:100%;direction:rtl}.board-frame{width:100%;max-width:none;padding:8px 8px 17px;border-radius:13px}.coords-left{left:-4px;bottom:17px;width:12px;font-size:10px}.coords-bottom{left:8px;right:8px;bottom:3px;height:11px;font-size:10px}
      .side-panel,.panel-stack{display:contents}
      .panel-stack>.player-card:first-child{order:1}.actions-card{order:3}.panel-stack>.player-card:last-child{order:4}
      .player-card{grid-template-columns:50px minmax(0,1fr) 96px;padding:8px 9px;gap:8px;min-height:82px;border-radius:13px}.avatar{width:50px;height:50px}.avatar::before{top:11px;width:19px;height:19px}.avatar::after{bottom:7px;width:30px;height:21px}
      .status{font-size:10px;margin-bottom:2px;gap:4px}.status::before{width:7px;height:7px}.name{font-size:14px;margin-bottom:3px}.location{font-size:10px;margin-bottom:3px}.rating{font-size:11px;gap:4px}.rating .trend{font-size:12px}
      .clock{font-size:20px;padding:8px 5px;border-radius:9px}.clock-progress{margin-top:5px;height:4px}
      .actions-card{grid-template-columns:repeat(3,1fr);min-height:68px;border-radius:13px}.action-item{min-height:68px;gap:4px;padding:5px 2px}.action-item+.action-item{border-top:0;border-right:1px solid rgba(224,181,103,.24)}.action-icon{font-size:20px}.action-label{font-size:11px}
    }

    @media (max-width:380px){
      .brand-copy h1{font-size:14px}.brand-mark{width:38px;height:38px}.ghost-btn{font-size:11px;padding:0 7px}.ghost-btn.small{min-width:56px}
      .player-card{grid-template-columns:44px minmax(0,1fr) 88px}.avatar{width:44px;height:44px}.clock{font-size:18px}.action-label{font-size:10px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="header-actions start">
        <button class="ghost-btn"><span class="icon">⎋</span><span>مغادرة المباراة</span></button>
      </div>

      <div class="brand" aria-label="شعار شطرنج السعودية">
        <div class="brand-copy">
          <h1>شطرنج السعودية</h1>
          <div class="en">SAUDI CHESS</div>
        </div>
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 100 100" role="img">
            <path class="mark-fill" d="M50 8c6 0 11 5 11 11 0 4-2 7-4 9l6 14H37l6-14c-3-2-4-5-4-9 0-6 5-11 11-11z"/>
            <path class="mark-fill" d="M48 42h4v23h-4z"/>
            <path class="mark-stroke" d="M25 71c11 0 19-4 25-11 6 7 14 11 25 11"/>
            <path class="mark-stroke" d="M22 84l22-15"/>
            <path class="mark-stroke" d="M78 84L56 69"/>
            <path class="mark-stroke" d="M31 89l19-13"/>
            <path class="mark-stroke" d="M69 89L50 76"/>
          </svg>
        </div>
      </div>

      <div class="header-actions end">
        <button class="ghost-btn small"><span class="icon">⚑</span><span>إبلاغ</span></button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="layout">
      <section class="board-panel">
        <div class="board-frame">
          <div class="coords-left" id="coordsLeft"></div>
          <div class="board-shell">
            <div id="board" class="board" aria-label="رقعة الشطرنج"></div>
          </div>
          <div class="coords-bottom" id="coordsBottom"></div>
        </div>
      </section>

      <aside class="side-panel">
        <div class="panel-stack">
          <section class="player-card">
            <div class="avatar"></div>
            <div class="player-info">
              <div class="status">متصل</div>
              <h2 class="name">أحمد الشمري</h2>
              <div class="location">📍 <span>الرياض</span></div>
              <div class="rating"><span>1520</span> <span class="trend">📈</span></div>
            </div>
            <div class="clock-box">
              <div class="clock" id="blackClock">10:00</div>
              <div class="clock-progress"><span style="width:76%"></span></div>
            </div>
          </section>

          <section class="actions-card">
            <button class="action-item" id="whiteResign" type="button">
              <span class="action-icon">🏳</span>
              <span class="action-label">استسلام</span>
            </button>
            <button class="action-item" id="drawOffer" type="button">
              <span class="action-icon">🤝</span>
              <span class="action-label">عرض تعادل</span>
            </button>
            <button class="action-item" id="flipBoard" type="button">
              <span class="action-icon">↻</span>
              <span class="action-label">قلب الرقعة</span>
            </button>
          </section>

          <section class="player-card">
            <div class="avatar light"></div>
            <div class="player-info">
              <div class="status">متصل</div>
              <h2 class="name">محمد العتيبي</h2>
              <div class="location">📍 <span>جدة</span></div>
              <div class="rating"><span>1500</span> <span class="trend">📈</span></div>
            </div>
            <div class="clock-box">
              <div class="clock" id="whiteClock">10:00</div>
              <div class="clock-progress"><span style="width:74%"></span></div>
            </div>
          </section>
        </div>
      </aside>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script>
    const files = ['a','b','c','d','e','f','g','h'];
    const ranks = [8,7,6,5,4,3,2,1];
    const boardEl = document.getElementById('board');
    const leftEl = document.getElementById('coordsLeft');
    const bottomEl = document.getElementById('coordsBottom');
    const whiteClockEl = document.getElementById('whiteClock');
    const blackClockEl = document.getElementById('blackClock');
    const whiteResign = document.getElementById('whiteResign');
    const flipBoardEl = document.getElementById('flipBoard');
    const drawOffer = document.getElementById('drawOffer');

    let flipped=false;
    function renderCoords(){
      leftEl.innerHTML=''; bottomEl.innerHTML='';
      const shownRanks=flipped?[...ranks].reverse():ranks;
      const shownFiles=flipped?[...files].reverse():files;
      shownRanks.forEach(n=>{ const div=document.createElement('div'); div.textContent=n; leftEl.appendChild(div); });
      shownFiles.forEach(f=>{ const div=document.createElement('div'); div.textContent=f; bottomEl.appendChild(div); });
    }

    function pieceSVG(type,color){
      const cls = color === 'w' ? 'white' : 'black';
      const base = (inner) => `<div class="piece ${cls}"><svg viewBox="0 0 100 100" aria-hidden="true">${inner}</svg></div>`;
      const sharedBase = `
        <ellipse class="fill-accent" cx="50" cy="88" rx="26" ry="7"></ellipse>
        <rect class="fill-main" x="26" y="80" width="48" height="8" rx="4"></rect>
        <path class="stroke-main" d="M25 80h50M30 88h40" stroke-width="2.6" fill="none" stroke-linecap="round"></path>`;
      if(type==='p') return base(`<circle class="fill-main" cx="50" cy="27" r="12"></circle><path class="fill-main" d="M50 39c10 0 18 8 18 18v2H32v-2c0-10 8-18 18-18z"></path><path class="fill-accent" d="M39 58h22c5 0 9 4 9 9v5H30v-5c0-5 4-9 9-9z"></path><path class="stroke-main" d="M38 58h24M35 71h30" stroke-width="2.4" fill="none" stroke-linecap="round"></path>${sharedBase}`);
      if(type==='r') return base(`<path class="fill-main" d="M30 22h8v8h6v-8h12v8h6v-8h8v15H30z"></path><path class="fill-main" d="M35 37h30v30H35z"></path><path class="fill-accent" d="M30 66h40v12H30z"></path><path class="stroke-main" d="M30 37h40M37 46h26M34 66h32" stroke-width="2.4" fill="none" stroke-linecap="round"></path>${sharedBase}`);
      if(type==='n') return base(`<path class="fill-main" d="M68 25c-7 0-13 3-18 8l-8 9-8 3 6 8-2 18h28c2-5 4-11 4-18 0-6-2-11-6-14l6-6c4-4 4-8-2-8z"></path><path class="fill-accent" d="M40 71h25c5 0 8 3 8 7H36c0-4 1-7 4-7z"></path><circle class="fill-accent" cx="59" cy="36" r="2.8"></circle><path class="stroke-main" d="M52 31c4 1 8 4 10 8M45 48c7 1 13 6 17 14M39 71h30" stroke-width="2.4" fill="none" stroke-linecap="round"></path>${sharedBase}`);
      if(type==='b') return base(`<path class="fill-main" d="M50 18c9 0 15 7 15 16 0 7-5 11-10 15 5 4 9 10 9 18v2H36v-2c0-8 4-14 9-18-5-4-10-8-10-15 0-9 6-16 15-16z"></path><path class="stroke-main" d="M56 27l-10 14M40 69h20" stroke-width="2.6" fill="none" stroke-linecap="round"></path><path class="fill-accent" d="M34 69h32c5 0 8 4 8 9H26c0-5 3-9 8-9z"></path>${sharedBase}`);
      if(type==='q') return base(`<circle class="fill-main" cx="28" cy="22" r="5"></circle><circle class="fill-main" cx="42" cy="16" r="5"></circle><circle class="fill-main" cx="58" cy="16" r="5"></circle><circle class="fill-main" cx="72" cy="22" r="5"></circle><path class="fill-main" d="M28 28l8 14 10-14 8 14 10-14 8 14-4 4H32l-4-4z"></path><path class="fill-accent" d="M35 46h30l4 23H31z"></path><path class="fill-accent" d="M31 69h38c5 0 8 4 8 9H23c0-5 3-9 8-9z"></path><path class="stroke-main" d="M35 46h30M38 57h24M38 69h24" stroke-width="2.3" fill="none" stroke-linecap="round"></path>${sharedBase}`);
      if(type==='k') return base(`<path class="fill-main" d="M35 26l8-8 7 10 7-10 8 8-4 6H39z"></path><path class="fill-accent" d="M38 32h24l5 15-6 5H39l-6-5z"></path><path class="fill-main" d="M42 52h16c7 0 13 7 13 16v1H29v-1c0-9 6-16 13-16z"></path><path class="fill-accent" d="M31 69h38c5 0 8 4 8 9H23c0-5 3-9 8-9z"></path><path class="stroke-main" d="M38 32h24M42 52h16M38 69h24" stroke-width="2.4" fill="none" stroke-linecap="round"></path>${sharedBase}`);
      return '';
    }

    function formatTime(totalSeconds){
      const safe=Math.max(0,totalSeconds|0);
      return String(Math.floor(safe/60)).padStart(2,'0')+':'+String(safe%60).padStart(2,'0');
    }

    let game;
    try { game = new Chess(); } catch(e) { alert('تعذر تحميل محرك الشطرنج. حدّث الصفحة وحاول مرة أخرى.'); }
    let selected=null;
    let legalTargets=[];
    let clocks={w:600,b:600};
    let finished=false;

    function renderBoard(){
      boardEl.innerHTML='';
      const data=game.board();
      const rowOrder=flipped?[7,6,5,4,3,2,1,0]:[0,1,2,3,4,5,6,7];
      const colOrder=flipped?[7,6,5,4,3,2,1,0]:[0,1,2,3,4,5,6,7];
      for(const row of rowOrder){
        for(const col of colOrder){
          const sq=document.createElement('div');
          const square=files[col]+ranks[row];
          sq.dataset.square=square;
          sq.className='square '+(((row+col)%2===0)?'light':'dark');
          if(selected===square) sq.classList.add('selected');
          const target=legalTargets.find(m=>m.to===square);
          if(target) sq.classList.add(target.flags.includes('c')||target.flags.includes('e')?'capture':'target');
          const p=data[row][col];
          if(p) sq.innerHTML=pieceSVG(p.type,p.color);
          sq.addEventListener('click',()=>handleSquare(square));
          boardEl.appendChild(sq);
        }
      }
      updateClockUI();
    }

    function handleSquare(square){
      if(finished || !game) return;
      if(selected){
        const candidate=legalTargets.find(m=>m.to===square);
        if(candidate){
          const move=game.move({from:selected,to:square,promotion:'q'});
          selected=null; legalTargets=[];
          if(move){
            renderBoard();
            checkGameEnd();
            return;
          }
        }
      }
      const piece=game.get(square);
      if(piece && piece.color===game.turn()){
        selected=square;
        legalTargets=game.moves({square,verbose:true});
      } else { selected=null; legalTargets=[]; }
      renderBoard();
    }

    function updateClockUI(){
      whiteClockEl.textContent=formatTime(clocks.w);
      blackClockEl.textContent=formatTime(clocks.b);
      whiteClockEl.classList.toggle('danger',clocks.w<=60);
      blackClockEl.classList.toggle('danger',clocks.b<=60);
      whiteClockEl.style.outline=(!finished && game.turn()==='w')?'2px solid rgba(64,207,103,.65)':'none';
      blackClockEl.style.outline=(!finished && game.turn()==='b')?'2px solid rgba(64,207,103,.65)':'none';
    }

    function finish(message){
      if(finished) return;
      finished=true;
      updateClockUI();
      setTimeout(()=>alert(message),30);
    }

    function checkGameEnd(){
      if(game.in_checkmate()) finish(game.turn()==='w'?'كش مات — فاز الأسود':'كش مات — فاز الأبيض');
      else if(game.in_draw()) finish('انتهت المباراة بالتعادل');
    }

    setInterval(()=>{
      if(finished || !game) return;
      const turn=game.turn();
      clocks[turn]=Math.max(0,clocks[turn]-1);
      updateClockUI();
      if(clocks[turn]===0) finish(turn==='w'?'انتهى وقت الأبيض — فاز الأسود':'انتهى وقت الأسود — فاز الأبيض');
    },1000);

    whiteResign.addEventListener('click',()=>{ if(!finished && confirm('هل تريد استسلام الأبيض؟')) finish('استسلم الأبيض — فاز الأسود'); });
    drawOffer.addEventListener('click',()=>{
      if(finished) return;
      if(confirm('عرض تعادل: هل يوافق اللاعب الآخر؟')) finish('اتفق اللاعبان على التعادل');
    });
    flipBoardEl.addEventListener('click',()=>{
      flipped=!flipped;
      selected=null; legalTargets=[];
      renderCoords();
      renderBoard();
    });

    document.querySelector('.ghost-btn').addEventListener('click',()=>{
      if(confirm('هل تريد مغادرة المباراة؟')) location.href='index.html';
    });

    renderCoords();
    renderBoard();
  </script>
</body>
</html>
