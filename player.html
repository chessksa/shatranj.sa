<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ملف اللاعب | شطرنج السعودية</title>
  <meta name="theme-color" content="#0c3435" />
  <style>
    :root{--bg:#082d2f;--panel:#103f40;--gold:#d4b467;--cream:#f4eddc;--muted:#adc1bc;--line:rgba(212,180,103,.22);--good:#74b38b;--bad:#d96c6c;--shadow:0 18px 45px rgba(0,0,0,.2)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:linear-gradient(145deg,var(--bg),#0a3839 55%,#08292b);color:var(--cream)}
    a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}.shell{width:min(1050px,calc(100% - 28px));margin:auto;padding:18px 0 42px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.mark{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);font-size:22px}.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--cream);padding:10px 14px;border-radius:12px;min-height:40px}.btn.gold{background:var(--gold);border-color:var(--gold);color:#173536;font-weight:800}.btn[disabled]{opacity:.55;cursor:default}
    .hero{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding:24px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,255,255,.065),rgba(255,255,255,.025));border-radius:24px;box-shadow:var(--shadow)}.avatar,.avatar-fallback{width:112px;height:112px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;background:#0a3031}.avatar-fallback{display:grid;place-items:center;color:var(--gold);font-size:38px;font-weight:800}.identity h1{margin:0 0 6px;font-size:clamp(24px,4vw,36px)}.meta{color:var(--muted);font-size:14px}.rating{color:var(--gold);font-size:20px;font-weight:800;margin-top:10px}.friend-action{min-width:180px;display:grid;gap:8px}.friend-state{font-size:12px;color:var(--muted);text-align:center}.presence{display:inline-flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%;background:#657875}.dot.online{background:#67c48a;box-shadow:0 0 0 3px rgba(103,196,138,.12)}
    .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}.stat,.card{border:1px solid var(--line);background:rgba(13,56,57,.88);border-radius:17px}.stat{padding:14px}.stat small{display:block;color:var(--muted);margin-bottom:6px}.stat strong{font-size:22px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.card{padding:18px}.card h2{margin:0 0 14px;font-size:18px}.wide{grid-column:1/-1}.chart{height:220px;display:grid;align-items:center}.chart svg{width:100%;height:190px;overflow:visible}.chart-line{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart-grid{stroke:rgba(255,255,255,.08)}.chart-dot{fill:var(--cream);stroke:var(--gold);stroke-width:2}.chart-label{fill:var(--muted);font-size:12px}.empty{color:var(--muted);text-align:center;padding:26px 10px}.list{display:grid;gap:9px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.025)}.row-title{font-weight:800}.row-meta{color:var(--muted);font-size:12px;margin-top:4px}.result{font-weight:800}.win{color:#8ed2a5}.loss{color:#ef9b9b}.draw{color:#e8dba9}.kind{font-size:11px;padding:3px 7px;border-radius:12px;background:rgba(212,180,103,.1);color:var(--gold)}.chips{display:flex;gap:6px;align-items:center}.achievement-grid{display:grid;gap:8px}.achievement{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid rgba(212,180,103,.22);border-radius:13px;background:rgba(212,180,103,.06)}.achievement .ico{font-size:22px;color:var(--gold)}.achievement .name{font-weight:800}.achievement .hint{font-size:11px;color:var(--muted);margin-top:3px}.message{min-height:50vh;display:grid;place-items:center;text-align:center;color:var(--muted)}.toast{position:fixed;left:20px;bottom:20px;padding:12px 15px;max-width:min(380px,calc(100% - 40px));border-radius:12px;background:#153e3f;border:1px solid var(--line);box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}.toast.error{border-color:rgba(217,108,108,.55)}
    @media(max-width:800px){.hero{grid-template-columns:auto 1fr}.friend-action{grid-column:1/-1;grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
    @media(max-width:520px){.shell{width:calc(100% - 18px);padding-top:9px}.brand span:last-child{display:none}.hero{padding:16px;gap:13px}.avatar,.avatar-fallback{width:84px;height:84px}.identity h1{font-size:22px}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:12px}.card{padding:14px}.row{grid-template-columns:1fr}.topbar .btn{padding:8px 10px;font-size:12px}}
  </style>
</head>
<body>
  <div class="shell" id="publicPlayerApp">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="mark">♞</span><span>شطرنج السعودية</span></a>
      <div style="display:flex;align-items:center;gap:8px"><div id="siteNotificationHost"></div><a class="btn" href="index.html">الرئيسية</a></div>
    </header>

    <div class="message" id="pageMessage">جاري تحميل ملف اللاعب...</div>

    <main id="publicContent" hidden>
      <section class="hero" id="publicPlayerHero">
        <div>
          <img class="avatar" id="publicAvatar" alt="صورة اللاعب" hidden />
          <div class="avatar-fallback" id="publicAvatarFallback">♟</div>
        </div>
        <div class="identity">
          <h1 id="publicName">—</h1>
          <div class="meta" id="publicMeta">—</div>
          <div class="rating">♛ <span id="publicRating">1500</span> نقطة</div>
        </div>
        <div class="friend-action" id="friendAction"></div>
      </section>

      <section class="stats">
        <div class="stat"><small>التصنيف</small><strong id="sRating">—</strong></div>
        <div class="stat"><small>المباريات</small><strong id="sGames">—</strong></div>
        <div class="stat"><small>فوز</small><strong id="sWins">—</strong></div>
        <div class="stat"><small>تعادل</small><strong id="sDraws">—</strong></div>
        <div class="stat"><small>خسارة</small><strong id="sLosses">—</strong></div>
        <div class="stat"><small>الأصدقاء</small><strong id="sFriends">—</strong></div>
      </section>

      <section class="grid">
        <div class="card">
          <h2>تطور التصنيف</h2>
          <div class="chart" id="publicRatingChart"></div>
        </div>
        <div class="card" id="publicAchievements">
          <h2>الإنجازات</h2>
          <div class="achievement-grid" id="publicAchievementsList"></div>
        </div>
        <div class="card wide">
          <h2>آخر 10 مباريات</h2>
          <div class="list" id="publicRecentGames"></div>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="site-notifications.js"></script>
  <script src="player.js"></script>
</body>
</html>
