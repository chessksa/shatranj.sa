<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#022f33"><title>الشطرنج اليومي | شطرنج العرب</title><link rel="stylesheet" href="v2/site/shell.css"><link rel="stylesheet" href="v2/platform/page.css"><style>.daily-layout{display:grid;grid-template-columns:minmax(320px,670px) minmax(280px,1fr);gap:16px;direction:ltr}.daily-board-wrap{direction:rtl}.daily-board{width:min(100%,69dvh);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:3px solid #66503b;direction:ltr}.daily-square{position:relative;border:0;padding:0;display:grid;place-items:center}.daily-square.light{background:var(--board-light,#e8dec8)}.daily-square.dark{background:var(--board-dark,#87966a)}.daily-square.selected{box-shadow:inset 0 0 0 4px var(--p-gold2)}.daily-square.target::after{content:"";position:absolute;width:22%;height:22%;border-radius:50%;background:rgba(13,59,53,.55)}.daily-piece{width:86%;height:86%;object-fit:contain;pointer-events:none}.daily-side{direction:rtl;display:grid;gap:12px}.daily-games{display:grid;gap:5px;max-height:330px;overflow:auto}.daily-game-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px;border:1px solid rgba(216,182,101,.14);border-radius:10px;text-decoration:none}.daily-game-row.active{border-color:var(--p-gold)}.daily-search-results{display:grid;gap:4px;margin-top:8px}.daily-due{font-size:24px;font-weight:900;color:var(--p-gold2)}@media(max-width:900px){.daily-layout{grid-template-columns:1fr}.daily-board{width:min(100%,calc(100dvh - 270px));margin:auto}.daily-side{order:-1}}
</style></head><body class="platform-page"><main class="platform-shell"><header class="platform-head"><div><h1>الشطرنج اليومي</h1><p>مباريات تمتد لأيام، مع مهلة محددة لكل نقلة.</p></div></header><section class="daily-layout"><div class="daily-board-wrap"><div id="dailyBoard" class="daily-board" aria-label="رقعة الشطرنج اليومي"></div></div><aside class="daily-side"><article class="platform-card full"><div id="dailyGameTitle" class="platform-badge">لا توجد مباراة مفتوحة</div><h2 id="dailyTurn">اختر مباراة أو ابدأ واحدة جديدة</h2><div id="dailyDue" class="daily-due">—</div><div id="dailyStatus" class="platform-muted">—</div><div class="platform-actions" style="margin-top:10px"><button id="dailyResign" class="platform-btn danger" type="button" disabled>استسلام</button><button id="refreshDaily" class="platform-btn" type="button">تحديث</button></div></article><article class="platform-card full"><h3>مبارياتي</h3><div id="dailyGames" class="daily-games"><div class="platform-empty">جارٍ التحميل…</div></div></article><article class="platform-card full"><h3>ابدأ مباراة يومية</h3><div style="display:grid;grid-template-columns:1fr 100px auto;gap:7px"><input id="dailyPlayerSearch" class="platform-input" placeholder="ابحث عن لاعب"><select id="daysPerMove" class="platform-select"><option value="1">1 يوم</option><option value="2">2 يوم</option><option value="3">3 أيام</option><option value="7">7 أيام</option><option value="14">14 يومًا</option></select><button id="dailySearchButton" class="platform-btn primary" type="button">بحث</button></div><div id="dailySearchResults" class="daily-search-results"></div></article></aside></section></main><script src="config-base.js"></script><script type="module" src="v2/daily/app.mjs"></script><script type="module" src="v2/site/shell.mjs"></script></body></html>
