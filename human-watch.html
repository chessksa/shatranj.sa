<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a1d21">
<title>مشاهدة مباراة مباشرة | شطرنج العرب</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}:root{--bg:#302e2b;--panel:#302e2b;--gold:#e2dcd3;--gold2:#e2dcd3;--text:#e2dcd3;--muted:#bfcac6;--line:rgba(165,162,158,0.27)}html,body{min-height:100%}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at 20% 10%,rgba(69,66,62,0.28),transparent 28%),linear-gradient(135deg,#302e2b,var(--bg) 48%,#302e2b);color:var(--text)}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 24px));margin:auto}header{border-bottom:1px solid var(--line);background:rgba(69,66,62,0.94)}.nav{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:19px;font-weight:900}.back{border:1px solid var(--line);border-radius:10px;padding:9px 13px;color:var(--gold2);font-weight:900}.layout{display:grid;grid-template-columns:minmax(300px,720px) minmax(260px,1fr);gap:18px;padding:20px 0}.board-card,.side{border:1px solid var(--line);border-radius:18px;background:rgba(69,66,62,0.88);box-shadow:0 15px 36px rgba(0,0,0,.24)}.board-card{padding:12px}.board{position:relative;width:100%;aspect-ratio:1;overflow:hidden;border:4px solid #625f5b;border-radius:5px;direction:ltr;background:#222}.side{padding:16px;align-self:start}.watch-badge{display:inline-flex;border:1px solid rgba(165,162,158,0.35);background:rgba(165,162,158,0.1);color:var(--gold2);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;margin-bottom:12px}.player{border:1px solid rgba(165,162,158,0.18);border-radius:13px;background:rgba(69,66,62,0.4);padding:13px;margin-bottom:10px}.player.active{border-color:var(--gold)}.player-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.player strong{font-size:15px}.meta{margin-top:5px;color:var(--muted);font-size:11px}.clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:25px;color:var(--gold2);direction:ltr}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.tile{border:1px solid rgba(165,162,158,0.16);border-radius:11px;padding:10px;background:rgba(69,66,62,0.32)}.tile small{display:block;color:var(--muted);font-size:10px}.tile strong{display:block;margin-top:4px;font-size:13px}.moves-title{margin:16px 0 8px;color:var(--gold2);font-size:14px}.moves{display:flex;gap:6px;flex-wrap:wrap;max-height:240px;overflow:auto}.move{border:1px solid rgba(165,162,158,0.16);border-radius:8px;padding:5px 7px;background:rgba(69,66,62,0.35);font-size:12px}.message{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}.message strong{display:block;color:var(--text);font-size:20px;margin-bottom:8px}@media(max-width:820px){.layout{grid-template-columns:1fr}.side{order:-1}.board-card{padding:7px}.clock{font-size:22px}.wrap{width:min(100% - 14px,1180px)}}
</style>
<link rel="stylesheet" href="site-charcoal-theme.css?v=20261014-natural-white-pieces-v2">
</head>
<body>
<header><div class="wrap nav"><div class="brand">♟ مشاهدة مباشرة</div><a class="back" href="watch.html">العودة للمباريات</a></div></header>
<main class="wrap">
  <div id="loading" class="message"><div><strong>جارٍ فتح المباراة...</strong><span>المشاهدة فقط، بدون تدخل في اللعب.</span></div></div>
  <div id="denied" class="message" hidden><div><strong>لا يمكن فتح المباراة</strong><span>المباراة غير موجودة أو لم تعد متاحة.</span></div></div>
  <div id="viewer" class="layout" hidden>
    <section class="board-card"><div id="board" class="board" aria-label="رقعة المباراة"></div></section>
    <aside class="side">
      <div class="watch-badge">مشاهدة فقط · لا يمكن التدخل <button id="enableWatchSound" type="button" class="watch-sound-button">🔊 تفعيل الصوت</button></div>
      <div id="blackCard" class="player"><div class="player-head"><div><strong id="blackName">♟ الأسود</strong><div class="meta">الأسود</div><span id="blackCaptured" class="spectator-missing">—</span></div><div id="blackClock" class="clock">00:00</div></div></div>
      <div id="whiteCard" class="player"><div class="player-head"><div><strong id="whiteName">♙ الأبيض</strong><div class="meta">الأبيض</div><span id="whiteCaptured" class="spectator-missing">—</span></div><div id="whiteClock" class="clock">00:00</div></div></div>
      <div class="info">
        <div class="tile"><small>الحالة</small><strong id="gameStatus">—</strong></div>
        <div class="tile"><small>النتيجة</small><strong id="gameResult">—</strong></div>
        <div class="tile"><small>زمن المباراة</small><strong id="gameTimeControl">—</strong></div>
        <div class="tile"><small>عدد النقلات</small><strong id="movesCount">0</strong></div>
      </div>
      <h2 class="moves-title">النقلات</h2><div id="moves" class="moves"></div><section id="postGameAnalysis" class="spectator-review" hidden aria-live="polite"></section>
    </aside>
  </div>
</main>
<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { SpectatorBoard } from './spectator-board.mjs?v=20261019-watch-contrast-results-v2';
import { createSpectatorClock } from './spectator-clock.mjs?v=20261018-v2-watch-clock-v1';
import { renderCapturedPieces } from './v2/play/captured-pieces.mjs?v=20261018-premove-review-v1';
import { playBoardMoveSound,enableBoardSound } from './v2/board/move-sound.mjs?v=20261018-premove-review-v1';
import { analyzeFinishedSpectator } from './v2/analysis/spectator-review.mjs?v=20261018-premove-review-v1';
const cfg=window.SHATRANJ_CONFIG?.supabase||{};
const supabase=cfg.enabled&&cfg.url&&cfg.anonKey?createClient(cfg.url,cfg.anonKey):null;
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const gameId=params.get('game');
const isV2=params.get('source')==='v2';
const statusLabel={matched:'بانتظار النقلة الأولى',playing:'جارية',active:'جارية',in_progress:'جارية',started:'جارية',finished:'منتهية',cancelled:'ملغاة',abandoned:'ملغاة'};
const resultLabel={'1-0':'فوز الأبيض','0-1':'فوز الأسود','1/2-1/2':'تعادل'};
const clockAnchor=createSpectatorClock();
let current=null;
let spectatorBoard=null;
let refreshTimer=null;
let clockFrame=null;
let refreshInFlight=false;
function showLoading(){ $('loading').hidden=false;$('viewer').hidden=true;$('denied').hidden=true; }
function showDenied(){ $('loading').hidden=true;$('viewer').hidden=true;$('denied').hidden=false; }
function showViewer(){ $('loading').hidden=true;$('denied').hidden=true;$('viewer').hidden=false; }
function msText(ms){const total=Math.max(0,Math.ceil(Number(ms||0)/1000));const m=Math.floor(total/60);const s=total%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function isActive(){return ['matched','playing','active','in_progress','started'].includes(String(current?.status||''));}
function effectiveClocks(){return clockAnchor.read();}
function renderClocks(){
  if(!current)return;
  const t=effectiveClocks();$('whiteClock').textContent=msText(t.white);$('blackClock').textContent=msText(t.black);
  const turn=String(current?.fen||'').split(/\s+/)[1];$('whiteCard').classList.toggle('active',isActive()&&turn==='w');$('blackCard').classList.toggle('active',isActive()&&turn==='b');
}
function latestMove(){const moves=Array.isArray(current?.moves)?current.moves:[];const last=moves[moves.length-1];return last?.from&&last?.to?{from:last.from,to:last.to}:null;}
function syncBoard(){if(!current?.fen)return;if(!spectatorBoard)spectatorBoard=new SpectatorBoard($('board'),current.fen);spectatorBoard.setPosition(current.fen,latestMove());}
function renderMoves(){
  const moves=Array.isArray(current?.moves)?current.moves:[];
  $('movesCount').textContent=String(moves.length);
  const host=$('moves');
  if(!moves.length){host.textContent='لم تبدأ النقلات بعد.';return;}
  const fragment=document.createDocumentFragment();
  for(const [index,move] of moves.entries()){
    const span=document.createElement('span');
    span.className='move';
    span.textContent=`${Math.floor(index/2)+1}${index%2?'...':'.'} ${String(move?.san||move?.to||'—')}`;
    fragment.appendChild(span);
  }
  host.replaceChildren(fragment);
}
function render(){
  if(!current)return;syncBoard();renderClocks();renderMoves();
  $('whiteName').textContent=`♙ ${current.white_name||'الأبيض'}`;$('blackName').textContent=`♟ ${current.black_name||'الأسود'}`;
  $('gameStatus').textContent=statusLabel[current.status]||current.status||'—';$('gameResult').textContent=resultLabel[current.result]||current.result||'—';$('gameTimeControl').textContent=current.time_control_minutes?`${current.time_control_minutes} دقيقة`:'—';
  renderCapturedPieces($('whiteCaptured'),current.fen,'w');
  renderCapturedPieces($('blackCaptured'),current.fen,'b');
  analyzeFinishedSpectator({host:$('postGameAnalysis'),gameId,moves:current.moves,status:current.status});
  showViewer();
}
async function fetchGame(){
  if(!supabase||!gameId){showDenied();return false;}
  if(refreshInFlight)return true;
  refreshInFlight=true;
  try{
    let data,error;
    if(isV2){
      const response=await supabase.rpc('get_public_v2_spectator_game_state',{p_game_id:gameId});
      error=response.error;
      data=Array.isArray(response.data)?response.data[0]:response.data;
    }else{
      const response=await supabase.from('live_games')
        .select('id,white_name,black_name,fen,moves,status,result,white_time_ms,black_time_ms,turn_started_at,time_control_minutes,updated_at')
        .eq('id',gameId).maybeSingle();
      error=response.error;data=response.data;
    }
    if(error||!data){if(!current)showDenied();return false;}
    // Only committed, read-only state may be painted; spectators never submit moves.
    const previous=current;
    current=data;clockAnchor.sync(current);render();
    if(previous?.fen&&previous.fen!==data.fen&&(data.moves?.length||0)>(previous.moves?.length||0))playBoardMoveSound(previous.fen,data.fen);
    return true;
  }catch(error){console.warn('تعذر فتح مباراة المشاهدة',error);if(!current)showDenied();return false;}
  finally{refreshInFlight=false;}
}
$('enableWatchSound')?.addEventListener('click',async event=>{
  const button=event.currentTarget;
  const unlocked=await enableBoardSound();
  button.textContent=unlocked?'🔊 الصوت مفعل':'تعذر تشغيل الصوت';
});
function startClockLoop(){
  const tick=()=>{renderClocks();clockFrame=requestAnimationFrame(tick);};
  if(clockFrame!==null)cancelAnimationFrame(clockFrame);
  tick();
}
function scheduleRefresh(delay=700){
  clearTimeout(refreshTimer);
  refreshTimer=setTimeout(async()=>{
    await fetchGame();
    scheduleRefresh(document.hidden?3000:(isActive()?(isV2?1200:700):2500));
  },delay);
}
async function init(){
  showLoading();if(!await fetchGame())return;
  startClockLoop();scheduleRefresh(isV2?1000:500);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)fetchGame();});
  window.addEventListener('beforeunload',()=>{clearTimeout(refreshTimer);if(clockFrame!==null)cancelAnimationFrame(clockFrame);},{once:true});
}
init();
</script>
</body>
</html>
