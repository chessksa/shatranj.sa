<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#062f34">
<title>مشاهدة مباراة مباشرة | شطرنج العرب</title>
<style>
*{box-sizing:border-box}:root{--bg:#042f34;--panel:#083d44;--gold:#d8b56a;--gold2:#f0cc7d;--text:#f5f1e7;--muted:#bfcac6;--line:rgba(216,181,106,.27);--cream:#d6cfbf;--teal:#246f77;--last:rgba(255,138,138,.34)}html,body{min-height:100%}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at 20% 10%,rgba(10,105,115,.28),transparent 28%),linear-gradient(135deg,#022a2f,var(--bg) 48%,#06464d);color:var(--text)}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 24px));margin:auto}header{border-bottom:1px solid var(--line);background:rgba(3,38,43,.94)}.nav{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:19px;font-weight:900}.back{border:1px solid var(--line);border-radius:10px;padding:9px 13px;color:var(--gold2);font-weight:900}.layout{display:grid;grid-template-columns:minmax(300px,720px) minmax(260px,1fr);gap:18px;padding:20px 0}.board-card,.side{border:1px solid var(--line);border-radius:18px;background:rgba(7,58,64,.88);box-shadow:0 15px 36px rgba(0,0,0,.24)}.board-card{padding:12px}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);overflow:hidden;border:4px solid #483a2b;border-radius:5px;direction:ltr}.sq{position:relative;display:grid;place-items:center}.sq.light{background:var(--cream)}.sq.dark{background:var(--teal)}.sq.last::after{content:"";position:absolute;inset:0;background:var(--last);pointer-events:none}.piece{width:87%;height:87%;object-fit:contain;pointer-events:none;user-select:none;position:relative;z-index:1}.side{padding:16px;align-self:start}.watch-badge{display:inline-flex;border:1px solid rgba(216,181,106,.35);background:rgba(216,181,106,.1);color:var(--gold2);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;margin-bottom:12px}.player{border:1px solid rgba(216,181,106,.18);border-radius:13px;background:rgba(3,38,43,.4);padding:13px;margin-bottom:10px}.player.active{border-color:var(--gold)}.player-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.player strong{font-size:15px}.meta{margin-top:5px;color:var(--muted);font-size:11px}.clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:25px;color:var(--gold2);direction:ltr}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.tile{border:1px solid rgba(216,181,106,.16);border-radius:11px;padding:10px;background:rgba(3,38,43,.32)}.tile small{display:block;color:var(--muted);font-size:10px}.tile strong{display:block;margin-top:4px;font-size:13px}.moves-title{margin:16px 0 8px;color:var(--gold2);font-size:14px}.moves{display:flex;gap:6px;flex-wrap:wrap;max-height:240px;overflow:auto}.move{border:1px solid rgba(216,181,106,.16);border-radius:8px;padding:5px 7px;background:rgba(3,38,43,.35);font-size:12px}.message{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}.message strong{display:block;color:var(--text);font-size:20px;margin-bottom:8px}@media(max-width:820px){.layout{grid-template-columns:1fr}.side{order:-1}.board-card{padding:7px}.clock{font-size:22px}.wrap{width:min(100% - 14px,1180px)}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="brand">♟ مشاهدة مباشرة</div><a class="back" href="watch.html">العودة للمباريات</a></div></header>
<main class="wrap">
  <div id="loading" class="message"><div><strong>جارٍ فتح المباراة...</strong><span>المشاهدة فقط، بدون تدخل في اللعب.</span></div></div>
  <div id="denied" class="message" hidden><div><strong>لا يمكن فتح المباراة</strong><span>المباراة غير موجودة أو لم تعد متاحة.</span></div></div>
  <div id="viewer" class="layout" hidden>
    <section class="board-card"><div id="board" class="board" aria-label="رقعة المباراة"></div></section>
    <aside class="side">
      <div class="watch-badge">مشاهدة فقط · لا يمكن التدخل</div>
      <div id="blackCard" class="player"><div class="player-head"><div><strong id="blackName">♟ الأسود</strong><div class="meta">الأسود</div></div><div id="blackClock" class="clock">00:00</div></div></div>
      <div id="whiteCard" class="player"><div class="player-head"><div><strong id="whiteName">♙ الأبيض</strong><div class="meta">الأبيض</div></div><div id="whiteClock" class="clock">00:00</div></div></div>
      <div class="info">
        <div class="tile"><small>الحالة</small><strong id="gameStatus">—</strong></div>
        <div class="tile"><small>النتيجة</small><strong id="gameResult">—</strong></div>
        <div class="tile"><small>زمن المباراة</small><strong id="gameTimeControl">—</strong></div>
        <div class="tile"><small>عدد النقلات</small><strong id="movesCount">0</strong></div>
      </div>
      <h2 class="moves-title">النقلات</h2><div id="moves" class="moves"></div>
    </aside>
  </div>
</main>
<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const cfg=window.SHATRANJ_CONFIG?.supabase||{};
const supabase=cfg.enabled&&cfg.url&&cfg.anonKey?createClient(cfg.url,cfg.anonKey):null;
const $=id=>document.getElementById(id);
const gameId=new URLSearchParams(location.search).get('game');
const pieceFiles={P:'wp.png',N:'wn.png',B:'wb.png',R:'wr.png',Q:'wq.png',K:'wk.png',p:'bp.png',n:'bn.png',b:'bb.png',r:'br.png',q:'bq.png',k:'bk.png'};
const statusLabel={playing:'جارية',active:'جارية',in_progress:'جارية',started:'جارية',finished:'منتهية',abandoned:'ملغاة'};
const resultLabel={'1-0':'فوز الأبيض','0-1':'فوز الأسود','1/2-1/2':'تعادل'};
let current=null;
function showDenied(){ $('loading').hidden=true;$('viewer').hidden=true;$('denied').hidden=false; }
function msText(ms){const total=Math.max(0,Math.ceil(Number(ms||0)/1000));const m=Math.floor(total/60);const s=total%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function isActive(){return ['playing','active','in_progress','started'].includes(String(current?.status||''));}
function effectiveClocks(){
  if(!current)return {white:0,black:0};
  let white=Number(current.white_time_ms||0),black=Number(current.black_time_ms||0);
  if(isActive()&&current.turn_started_at){
    const elapsed=Math.max(0,Date.now()-Date.parse(current.turn_started_at));
    const turn=String(current.fen||'').split(/\s+/)[1];
    if(turn==='w')white=Math.max(0,white-elapsed);else if(turn==='b')black=Math.max(0,black-elapsed);
  }
  return {white,black};
}
function renderClocks(){
  const t=effectiveClocks();$('whiteClock').textContent=msText(t.white);$('blackClock').textContent=msText(t.black);
  const turn=String(current?.fen||'').split(/\s+/)[1];$('whiteCard').classList.toggle('active',isActive()&&turn==='w');$('blackCard').classList.toggle('active',isActive()&&turn==='b');
}
function lastSquares(){const moves=Array.isArray(current?.moves)?current.moves:[];const last=moves[moves.length-1];return new Set([last?.from,last?.to].filter(Boolean));}
function renderBoard(fen){
  const board=$('board');board.innerHTML='';const rows=String(fen||'').split(' ')[0].split('/');const marked=lastSquares();
  rows.forEach((row,r)=>{let file=0;for(const ch of row){if(/\d/.test(ch)){for(let i=0;i<Number(ch);i++,file++)addSquare(r,file,null);}else{addSquare(r,file,ch);file++;}}});
  function addSquare(r,c,piece){const squareName=String.fromCharCode(97+c)+(8-r);const sq=document.createElement('div');sq.className=`sq ${(r+c)%2===0?'light':'dark'}${marked.has(squareName)?' last':''}`;if(piece&&pieceFiles[piece]){const img=document.createElement('img');img.className='piece';img.alt='';img.src=`assets/pieces/${pieceFiles[piece]}`;sq.appendChild(img);}board.appendChild(sq);}
}
function renderMoves(){const moves=Array.isArray(current?.moves)?current.moves:[];$('movesCount').textContent=String(moves.length);$('moves').innerHTML=moves.map((m,i)=>`<span class="move">${i+1}. ${String(m?.san||m?.to||'—')}</span>`).join('')||'<span class="meta">لم تبدأ النقلات بعد.</span>';}
function render(){
  if(!current)return;renderBoard(current.fen);renderClocks();renderMoves();
  $('whiteName').textContent=`♙ ${current.white_name||'الأبيض'}`;$('blackName').textContent=`♟ ${current.black_name||'الأسود'}`;
  $('gameStatus').textContent=statusLabel[current.status]||current.status||'—';$('gameResult').textContent=resultLabel[current.result]||current.result||'—';$('gameTimeControl').textContent=current.time_control_minutes?`${current.time_control_minutes} دقيقة`:'—';
  $('loading').hidden=true;$('denied').hidden=true;$('viewer').hidden=false;
}
async function fetchGame(){
  if(!supabase||!gameId){showDenied();return false;}
  const {data,error}=await supabase.from('live_games').select('id,white_name,black_name,fen,moves,status,result,white_time_ms,black_time_ms,turn_started_at,time_control_minutes,updated_at').eq('id',gameId).maybeSingle();
  if(error||!data){showDenied();return false;}
  current=data;render();return true;
}
async function init(){if(!await fetchGame())return;setInterval(renderClocks,250);setInterval(fetchGame,1200);}
init();
</script>
</body>
</html>
