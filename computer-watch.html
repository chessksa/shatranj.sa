<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#062f34">
<title>متابعة مباراة ضد الكمبيوتر | شطرنج السعودية</title>
<style>
*{box-sizing:border-box}:root{--bg:#042f34;--panel:#083d44;--panel2:#0b4a52;--gold:#d8b56a;--gold2:#f0cc7d;--text:#f5f1e7;--muted:#bfcac6;--line:rgba(216,181,106,.27);--cream:#e7dfc7;--olive:#788468}html,body{min-height:100%}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at 20% 10%,rgba(10,105,115,.28),transparent 28%),linear-gradient(135deg,#022a2f,var(--bg) 48%,#06464d);color:var(--text)}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 24px));margin:auto}header{border-bottom:1px solid var(--line);background:rgba(3,38,43,.94)}.nav{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:19px;font-weight:900}.back{border:1px solid var(--line);border-radius:10px;padding:9px 13px;color:var(--gold2);font-weight:900}.layout{display:grid;grid-template-columns:minmax(300px,720px) minmax(260px,1fr);gap:18px;padding:20px 0}.board-card,.side{border:1px solid var(--line);border-radius:18px;background:rgba(7,58,64,.88);box-shadow:0 15px 36px rgba(0,0,0,.24)}.board-card{padding:12px}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);overflow:hidden;border:4px solid #483a2b;border-radius:5px;direction:ltr}.sq{position:relative;display:grid;place-items:center}.sq.light{background:var(--cream)}.sq.dark{background:var(--olive)}.piece{width:87%;height:87%;object-fit:contain;pointer-events:none;user-select:none}.side{padding:16px;align-self:start}.watch-badge{display:inline-flex;border:1px solid rgba(216,181,106,.35);background:rgba(216,181,106,.1);color:var(--gold2);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;margin-bottom:12px}.player{border:1px solid rgba(216,181,106,.18);border-radius:13px;background:rgba(3,38,43,.4);padding:13px;margin-bottom:10px}.player.active{border-color:var(--gold)}.player-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.player strong{font-size:15px}.meta{margin-top:5px;color:var(--muted);font-size:11px}.clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:25px;color:var(--gold2);direction:ltr}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.tile{border:1px solid rgba(216,181,106,.16);border-radius:11px;padding:10px;background:rgba(3,38,43,.32)}.tile small{display:block;color:var(--muted);font-size:10px}.tile strong{display:block;margin-top:4px;font-size:13px}.moves-title{margin:16px 0 8px;color:var(--gold2);font-size:14px}.moves{display:flex;gap:6px;flex-wrap:wrap;max-height:240px;overflow:auto}.move{border:1px solid rgba(216,181,106,.16);border-radius:8px;padding:5px 7px;background:rgba(3,38,43,.35);font-size:12px}.message{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}.message strong{display:block;color:var(--text);font-size:20px;margin-bottom:8px}@media(max-width:820px){.layout{grid-template-columns:1fr}.side{order:-1}.board-card{padding:7px}.clock{font-size:22px}.wrap{width:min(100% - 14px,1180px)}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="brand">♟ متابعة إدارية · ضد الكمبيوتر</div><a class="back" href="admin.html">العودة للإدارة</a></div></header>
<main class="wrap">
  <div id="loading" class="message"><div><strong>جارٍ فتح المباراة...</strong><span>يتم التحقق من صلاحية المتابعة.</span></div></div>
  <div id="denied" class="message" hidden><div><strong>لا يمكن فتح المباراة</strong><span>ليس لديك صلاحية لمتابعة هذه المباراة.</span></div></div>
  <div id="viewer" class="layout" hidden>
    <section class="board-card"><div id="board" class="board" aria-label="رقعة المباراة"></div></section>
    <aside class="side">
      <div class="watch-badge">مشاهدة فقط · لا يمكن التدخل</div>
      <div id="computerCard" class="player"><div class="player-head"><div><strong>♟ الكمبيوتر</strong><div id="computerMeta" class="meta">—</div></div><div id="computerClock" class="clock">00:00</div></div></div>
      <div id="playerCard" class="player"><div class="player-head"><div><strong id="playerName">♙ اللاعب</strong><div id="playerMeta" class="meta">—</div></div><div id="playerClock" class="clock">00:00</div></div></div>
      <div class="info">
        <div class="tile"><small>الحالة</small><strong id="gameStatus">—</strong></div>
        <div class="tile"><small>النتيجة</small><strong id="gameResult">—</strong></div>
        <div class="tile"><small>المستوى</small><strong id="gameLevel">—</strong></div>
        <div class="tile"><small>زمن المباراة</small><strong id="gameTimeControl">—</strong></div>
      </div>
      <h2 class="moves-title">النقلات</h2><div id="moves" class="moves"></div>
    </aside>
  </div>
</main>
<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const cfg=window.SHATRANJ_CONFIG?.supabase||{};
const supabase=cfg.enabled&&cfg.url&&cfg.anonKey?createClient(cfg.url,cfg.anonKey):null;
const $=id=>document.getElementById(id);
const gameId=new URLSearchParams(location.search).get('game');
const levelLabel={easy:'سهل',medium:'متوسط',hard:'صعب'};
const statusLabel={active:'جارية',finished:'منتهية',abandoned:'متروكة'};
const resultLabel={win:'فوز اللاعب',loss:'فوز الكمبيوتر',draw:'تعادل'};
const pieceFiles={P:'wp.png',N:'wn.png',B:'wb.png',R:'wr.png',Q:'wq.png',K:'wk.png',p:'bp.png',n:'bn.png',b:'bb.png',r:'br.png',q:'bq.png',k:'bk.png'};
let current=null;
let player=null;
let serverFetchedAt=Date.now();

function showDenied(){ $('loading').hidden=true;$('viewer').hidden=true;$('denied').hidden=false; }
function msText(ms){const total=Math.max(0,Math.ceil(Number(ms||0)/1000));const m=Math.floor(total/60);const s=total%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function effectiveClocks(){
  if(!current)return {player:0,computer:0};
  let p=Number(current.player_time_ms||0),c=Number(current.computer_time_ms||0);
  if(current.status==='active'&&current.turn_started_at){
    const elapsed=Math.max(0,Date.now()-serverFetchedAt);
    const turn=String(current.fen||'').split(/\s+/)[1];
    if(turn==='w')p=Math.max(0,p-elapsed);else if(turn==='b')c=Math.max(0,c-elapsed);
  }
  return {player:p,computer:c};
}
function renderClocks(){const t=effectiveClocks();$('playerClock').textContent=msText(t.player);$('computerClock').textContent=msText(t.computer);const turn=String(current?.fen||'').split(/\s+/)[1];$('playerCard').classList.toggle('active',current?.status==='active'&&turn==='w');$('computerCard').classList.toggle('active',current?.status==='active'&&turn==='b');}
function renderBoard(fen){
  const board=$('board');board.innerHTML='';const rows=String(fen||'').split(' ')[0].split('/');
  rows.forEach((row,r)=>{let file=0;for(const ch of row){if(/\d/.test(ch)){for(let i=0;i<Number(ch);i++,file++)addSquare(r,file,null);}else{addSquare(r,file,ch);file++;}}});
  function addSquare(r,c,piece){const sq=document.createElement('div');sq.className=`sq ${(r+c)%2===0?'light':'dark'}`;if(piece&&pieceFiles[piece]){const img=document.createElement('img');img.className='piece';img.alt='';img.src=`assets/pieces/${pieceFiles[piece]}`;sq.appendChild(img);}board.appendChild(sq);}
}
function renderMoves(moves){$('moves').innerHTML=(Array.isArray(moves)?moves:[]).map((m,i)=>`<span class="move">${i+1}. ${String(m?.san||m?.to||'—')}</span>`).join('')||'<span class="meta">لم تبدأ النقلات بعد.</span>';}
function render(){
  if(!current)return;renderBoard(current.fen);renderClocks();
  $('gameStatus').textContent=statusLabel[current.status]||current.status||'—';$('gameResult').textContent=resultLabel[current.result]||'—';$('gameLevel').textContent=levelLabel[current.level]||current.level||'—';$('gameTimeControl').textContent=`${current.time_control_minutes||'—'} دقيقة`;
  $('computerMeta').textContent=`المستوى: ${levelLabel[current.level]||current.level||'—'}`;
  $('playerName').textContent=`♙ ${player?.name||'اللاعب'}`;$('playerMeta').textContent=[player?.rating?`${player.rating} نقطة`:null,player?.city,player?.country].filter(Boolean).join(' · ')||'—';renderMoves(current.moves);
  $('loading').hidden=true;$('denied').hidden=true;$('viewer').hidden=false;
}
async function fetchGame(){
  if(!supabase||!gameId){showDenied();return false;}
  const {data:{session}}=await supabase.auth.getSession();
  if(!session){showDenied();return false;}
  const {data,error}=await supabase.from('computer_games').select('id,player_id,level,fen,moves,status,result,time_control_minutes,player_time_ms,computer_time_ms,turn_started_at,created_at,updated_at').eq('id',gameId).maybeSingle();
  if(error||!data){showDenied();return false;}
  current=data;serverFetchedAt=Date.now();
  if(!player||player.id!==data.player_id){const {data:p}=await supabase.from('players').select('id,name,rating,country,city').eq('id',data.player_id).maybeSingle();player=p||null;}
  render();return true;
}
async function init(){if(!await fetchGame())return;setInterval(renderClocks,250);setInterval(fetchGame,1200);}
init();
</script>
</body>
</html>
