<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#022f33"><title>Puzzle Battle | شطرنج العرب</title><link rel="stylesheet" href="v2/site/shell.css"><link rel="stylesheet" href="v2/platform/page.css"><style>.battle-layout{display:grid;grid-template-columns:minmax(320px,680px) minmax(280px,1fr);gap:16px;direction:ltr;align-items:start}.battle-board{width:min(100%,70dvh);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:3px solid #66503b;box-shadow:0 16px 32px rgba(0,0,0,.24);direction:ltr}.battle-square{position:relative;border:0;padding:0;display:grid;place-items:center}.battle-square.light{background:var(--board-light,#e8dec8)}.battle-square.dark{background:var(--board-dark,#87966a)}.battle-square.selected{box-shadow:inset 0 0 0 4px var(--p-gold2)}.battle-square.target::after{content:"";position:absolute;width:22%;height:22%;border-radius:50%;background:rgba(13,59,53,.55)}.battle-piece{width:86%;height:86%;object-fit:contain;pointer-events:none}.battle-side{direction:rtl;display:grid;gap:12px}.battle-score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.battle-player{padding:12px;border:1px solid var(--p-line);border-radius:11px;text-align:center}.battle-player strong{display:block;font-size:28px;color:var(--p-gold2)}.battle-clock{font-size:34px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}.battle-searching{display:inline-flex;gap:3px}.battle-searching i{width:6px;height:6px;border-radius:50%;background:var(--p-gold2);animation:bPulse 1.1s infinite}.battle-searching i:nth-child(2){animation-delay:.18s}.battle-searching i:nth-child(3){animation-delay:.36s}@keyframes bPulse{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}@media(max-width:900px){.battle-layout{grid-template-columns:1fr}.battle-board{width:min(100%,calc(
