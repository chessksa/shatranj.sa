name: Test home ranking table polish

on:
  push:
    branches:
      - main
    paths:
      - home-theme.css
      - tests/test_home_ranking_table_polish.py
      - .github/workflows/test-home-ranking-table-polish.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_home_ranking_table_polish.py
