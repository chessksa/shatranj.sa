name: Apply compact play side header
# focused implementation after approval
on:
  push:
    paths:
      - '.github/workflows/apply-play-side-header.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move header above players and enlarge board
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('play.html')
          text = p.read_text(encoding='utf-8')

          text = text.replace('--header-h:92px;', '--header-h:0px;', 1)
          text = text.replace(':root{--header-h:82px}', ':root{--header-h:0px}', 1)
          text = text.replace(':root{--header-h:72px}', ':root{--header-h:0px}', 1)

          text = text.replace(
              '.panel-stack{width:100%;max-height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);gap:12px}',
              '.panel-stack{width:100%;max-height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto minmax(0,1fr);gap:12px}',
              1,
          )
          text = text.replace(
              '.panel-stack{height:100%;max-height:none;grid-template-rows:auto auto auto;align-content:space-between;gap:16px}',
              '.panel-stack{height:100%;max-height:none;grid-template-rows:auto minmax(0,1fr) auto minmax(0,1fr);align-content:space-between;gap:12px}',
              1,
          )

          style_marker = '    .player-card,.actions-card{background:var(--panel-soft);'
          side_styles = '''    .side-header{min-height:58px;padding:8px 10px;border:1px solid var(--line);border-radius:15px;background:var(--panel-soft);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.03);display:flex;align-items:center;justify-content:space-between;gap:10px}\n    .side-brand{display:flex;align-items:center;gap:7px;min-width:0;font-size:14px;font-weight:800;white-space:nowrap}.side-brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;border:1px solid rgba(224,181,103,.45);color:var(--gold);font-size:19px}.side-header-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0}.side-header-actions #siteNotificationHost{display:flex;align-items:center}.side-icon-btn{height:36px;padding:0 9px;border:1px solid rgba(224,181,103,.34);border-radius:10px;background:rgba(6,27,31,.46);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:5px;font:700 12px inherit;cursor:pointer;white-space:nowrap}.side-icon-btn .icon{color:var(--gold);font-size:15px}\n'''
          if '.side-header{' not in text:
              if style_marker not in text:
                  raise SystemExit('side header style marker not found')
              text = text.replace(style_marker, side_styles + style_marker, 1)

          mobile_marker = '      .side-panel,.panel-stack{display:contents}\n'
          if mobile_marker in text and '.side-header{order:0}' not in text:
              text = text.replace(mobile_marker, mobile_marker + '      .side-header{order:0;margin:0 2px}.side-brand{font-size:12px}.side-brand-mark{width:28px;height:28px}.side-icon-btn{height:34px;padding:0 7px;font-size:11px}\n', 1)

          header_pattern = re.compile(r'\n  <header class="topbar">.*?</header>\n\n', re.S)
          text, count = header_pattern.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit('top header block not found')

          stack_marker = '        <div class="panel-stack">\n'
          side_header = '''        <div class="panel-stack">\n          <div class="side-header">\n            <div class="side-brand" aria-label="شطرنج السعودية"><span class="side-brand-mark">♟</span><span>شطرنج السعودية</span></div>\n            <div class="side-header-actions">\n              <button class="side-icon-btn" id="leaveBtn" type="button"><span class="icon">↩</span><span id="leaveText">رجوع</span></button>\n              <div id="siteNotificationHost"></div>\n              <button class="side-icon-btn" id="reportBtn" type="button"><span class="icon">⚑</span><span>إبلاغ</span></button>\n            </div>\n          </div>\n'''
          if stack_marker not in text:
              raise SystemExit('panel stack marker not found')
          text = text.replace(stack_marker, side_header, 1)

          p.write_text(text, encoding='utf-8')
          PY

          python tests/test_play_header_move.py
          python tests/test_player_profile_links.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add play.html
          git commit -m "Move play header controls above players"
          git push
