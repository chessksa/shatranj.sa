name: Test global Arial font
on:
  push:
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'tests/test_global_arial_font.py'
      - 'tests/test_welcome_ticker_cache_bust.py'
      - 'tests/test_welcome_ticker_loader.py'
      - '.github/workflows/test-global-arial-font.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Arial is the only site font
        run: python tests/test_global_arial_font.py
      - name: Verify welcome ticker wrapper cache bust
        run: python tests/test_welcome_ticker_cache_bust.py
      - name: Verify welcome ticker loader matches home header
        run: python tests/test_welcome_ticker_loader.py
