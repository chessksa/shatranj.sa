name: Apply home header ranking polish

on:
  push:
    branches: [home-header-ranking-polish]
    paths:
      - ci/apply_home_header_ranking_polish.py
      - .github/workflows/apply-home-header-ranking-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ci/apply_home_header_ranking_polish.py
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_home_header_ranking_polish.py
      - name: Commit applied layout
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home-theme.css
          git commit -m "feat: polish home header and move ranking left"
          git push
