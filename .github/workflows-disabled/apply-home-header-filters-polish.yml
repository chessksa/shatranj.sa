name: Apply home header filters polish

on:
  push:
    branches:
      - home-header-filters-polish
    paths:
      - ci/apply_home_header_filters_polish.py
      - .github/workflows/apply-home-header-filters-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: home-header-filters-polish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ci/apply_home_header_filters_polish.py
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_home_header_filters_polish.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check home-invite.js
      - name: Commit approved polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home-theme.css home-invite.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: compact home header and add ranking filters"
          git push origin HEAD:home-header-filters-polish
