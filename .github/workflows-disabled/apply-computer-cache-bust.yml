name: Apply computer cache bust
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-computer-cache-bust.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump computer controller cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('play-v10.html')
          text=path.read_text(encoding='utf-8')
          old='play-computer.js?v=20260906-3'
          new='play-computer.js?v=20260906-4'
          if old not in text:
              raise SystemExit('computer cache key marker not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify computer regression contract and fresh asset
        run: |
          grep -q 'play-computer.js?v=20260906-4' play-v10.html
          python tests/test_computer_play_mode.py
          cp play-computer.js /tmp/play-computer.mjs
          node --check /tmp/play-computer.mjs
      - name: Commit cache bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-v10.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: force fresh computer controller asset'
          git push
