name: Verify current home member layout
on:
  push:
    paths:
      - '.github/workflows/verify-current-home-member-layout.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run member layout regression test
        run: python tests/test_home_member_layout.py
