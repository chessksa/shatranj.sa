name: Apply fresh play route
on:
  push:
    paths:
      - '.github/workflows/apply-play-v8-route.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create cache-independent play route
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          fresh_html = 'play-v8.html'
          fresh_js = 'play-v8.js'
          fresh_css = 'play-v8.css'
          version = '20260903-8'

          html = Path('play.html').read_text(encoding='utf-8')
          js = Path('play-live.js').read_text(encoding='utf-8')
          css = Path('realistic-pieces.css').read_text(encoding='utf-8')

          html = re.sub(
              r'\n  <script>\n    const PLAY_CACHE_RESET_VERSION = .*?\n  </script>',
              '',
              html,
              count=1,
              flags=re.S,
          )
          html = html.replace('</title>', '</title>\n  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />', 1)
          html = re.sub(r'realistic-pieces\.css\?v=[^"\']+', fresh_css + '?v=' + version, html, count=1)
          html = re.sub(r'play-live\.js\?v=[^"\']+', fresh_js + '?v=' + version, html, count=1)
          html = html.replace('href="play.html"', f'href="{fresh_html}"')

          js = js.replace('play.html?game=', fresh_html + '?game=')
          js = js.replace("location.href='play.html';", f"location.href='{fresh_html}';")
          js = js.replace('location.href = `play.html?game=', f'location.href = `{fresh_html}?game=')

          Path(fresh_html).write_text(html, encoding='utf-8')
          Path(fresh_js).write_text(js, encoding='utf-8')
          Path(fresh_css).write_text(css, encoding='utf-8')

          for name in ['index.html','profile.html','profile.js','profile-section.js','site-notifications.js']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'play\.html(?:\?v=\d+)?', fresh_html, text)
              p.write_text(text, encoding='utf-8')

          sw = Path('sw.js').read_text(encoding='utf-8')
          sw = sw.replace('/play.html","/play-live.js","/realistic-pieces.css","/assets/pieces/', '/play.html","/play-v8.html","/play-live.js","/play-v8.js","/realistic-pieces.css","/play-v8.css","/assets/pieces/')
          Path('sw.js').write_text(sw, encoding='utf-8')

          test_lines = [
              "from pathlib import Path",
              "fresh_html = Path('play-v8.html').read_text(encoding='utf-8')",
              "fresh_js = Path('play-v8.js').read_text(encoding='utf-8')",
              "fresh_css = Path('play-v8.css').read_text(encoding='utf-8')",
              "assert 'PLAY_CACHE_RESET_VERSION' not in fresh_html",
              "assert 'play-v8.css?v=20260903-8' in fresh_html",
              "assert 'play-v8.js?v=20260903-8' in fresh_html",
              "assert 'piece-image' in fresh_css",
              "assert 'assets/pieces/${color}${type}.png' in fresh_js",
              "assert 'play-v8.html?game=' in fresh_js",
              "for name in ['index.html','profile.html','profile.js','profile-section.js','site-notifications.js']:",
              "    text = Path(name).read_text(encoding='utf-8')",
              "    assert 'play-v8.html' in text, name",
              "print('fresh play route: PASS')",
              "",
          ]
          Path('tests/test_play_fresh_route.py').write_text('\n'.join(test_lines), encoding='utf-8')
          PY

          python tests/test_play_fresh_route.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add play-v8.html play-v8.js play-v8.css index.html profile.html profile.js profile-section.js site-notifications.js sw.js tests/test_play_fresh_route.py
          git commit -m "Route play through fresh uncached assets"
          git push
