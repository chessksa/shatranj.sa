name: Test home header ranking polish

on:
  push:
    branches: [home-header-ranking-polish]
    paths:
      - index.html
      - home-theme.css
      - tests/test_home_header_ranking_polish.py
      - .github/workflows/test-home-header-ranking-polish.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_home_header_ranking_polish.py
