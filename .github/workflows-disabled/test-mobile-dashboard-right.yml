name: Apply dedicated mobile dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-mobile-dashboard-right.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: RED - prove dedicated mobile dashboard is missing
        run: |
          set +e
          python tests/test_mobile_dashboard_visible.py > /tmp/mobile-dashboard-red.log 2>&1
          code=$?
          set -e
          cat /tmp/mobile-dashboard-red.log
          if [ "$code" -eq 0 ]; then
            echo "Expected the dedicated mobile dashboard test to fail before the fix."
            exit 1
          fi
          echo "RED confirmed: the dedicated mobile dashboard is not present yet."

      - name: Add dedicated signed-in mobile dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')

          if 'id="mobileDashboardNav"' not in html:
              start = html.find('<a id="dashboardNav"')
              if start < 0:
                  raise SystemExit('dashboard anchor start not found in index.html')
              end = html.find('</a>', start)
              if end < 0:
                  raise SystemExit('dashboard anchor end not found in index.html')
              end += len('</a>')
              mobile = '''\n      <a id="mobileDashboardNav" class="mobile-dashboard-link header-tile" href="profile.html">\n        <span class="header-tile-icon" aria-hidden="true">⚙</span><span>لوحة التحكم</span>\n      </a>'''
              html = html[:end] + mobile + html[end:]

          old_key = 'home-theme.css?v=20260905-15'
          new_key = 'home-theme.css?v=20260905-16'
          if new_key not in html:
              if old_key not in html:
                  raise SystemExit('expected home-theme cache key not found')
              html = html.replace(old_key, new_key, 1)
          html_path.write_text(html, encoding='utf-8')

          css_path = Path('home-theme.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Dedicated mobile dashboard 20260905 */'
          block = dedent('''

          /* Dedicated mobile dashboard 20260905 */
          .mobile-dashboard-link{display:none!important}
          @media(max-width:600px){
            body.home-signed-in .compact-member-nav .nav-user{
              grid-template-columns:repeat(3,minmax(0,1fr))!important;
              direction:rtl!important;
            }
            body.home-signed-in .compact-member-nav .dashboard-link{
              display:none!important;
            }
            body.home-signed-in .compact-member-nav .header-tournaments{
              display:none!important;
            }
            body.home-signed-in .compact-member-nav .mobile-dashboard-link{
              display:inline-flex!important;
              grid-column:1!important;
              grid-row:2!important;
              width:100%!important;
              min-width:0!important;
              max-width:none!important;
              height:42px!important;
              min-height:42px!important;
              margin:0!important;
              padding:0 6px!important;
              align-items:center!important;
              justify-content:center!important;
              gap:5px!important;
              font-size:11px!important;
              font-weight:800!important;
            }
            body.home-signed-in .compact-member-nav .mobile-dashboard-link>span:not(.header-tile-icon){
              display:inline!important;
            }
            body.home-signed-in .compact-member-nav .header-notification-host{
              grid-column:2!important;
              grid-row:2!important;
            }
            body.home-signed-in .compact-member-nav .nav-logout{
              grid-column:3!important;
              grid-row:2!important;
            }
          }
          ''')
          if marker not in css:
              css_path.write_text(css.rstrip() + block, encoding='utf-8')
          PY

      - name: GREEN - verify dedicated mobile dashboard
        run: |
          python tests/test_mobile_dashboard_visible.py
          python tests/test_dashboard_desktop_mobile_split.py

      - name: Verify diff and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-theme.css index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No production changes to commit"
            exit 0
          fi
          git commit -m "fix: add dedicated mobile dashboard control"
          git push origin main
