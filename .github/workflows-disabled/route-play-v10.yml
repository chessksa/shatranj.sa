name: Route site to direct play v10
on:
  push:
    paths:
      - '.github/workflows/route-play-v10.yml'
permissions:
  contents: write
jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point play entry links to v10
        run: |
          for f in index.html profile.html profile.js profile-section.js site-notifications.js; do
            sed -i 's/play-v8\.html/play-v10.html/g; s/play-v9\.html/play-v10.html/g' "$f"
          done
          if ! grep -q '/play-v10.html' sw.js; then
            sed -i 's#"/assets/pieces/"#"/play-v10.html","/play-v10-match.js","/assets/pieces/"#' sw.js
          fi
          grep -q 'play-v10.html' index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html profile.html profile.js profile-section.js site-notifications.js sw.js
          git commit -m "Route Play Now directly to chessboard"
          git push
