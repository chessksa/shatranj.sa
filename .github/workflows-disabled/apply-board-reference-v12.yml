name: Apply approved board reference v12
on:
  push:
    paths:
      - '.github/workflows/apply-board-reference-v12.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch play page to approved board styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('play-v10.html')
          s = p.read_text(encoding='utf-8')
          old = 'board-polish-v11.css?v=20260903-11'
          new = 'board-reference-v12.css?v=20260903-12'
          if old not in s and new not in s:
              raise SystemExit('board stylesheet link not found')
          s = s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play-v10.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply approved luxurious chessboard styling"
          git push
