name: Apply simple computer chooser navigation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-computer-chooser-simple.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply chooser UI fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js = Path('play-computer.js')
          text = js.read_text(encoding='utf-8')

          old_back_style = "back.style.cssText = 'position:absolute;inset-inline-end:16px;top:12px;width:64px;height:64px;border:1px solid rgba(224,181,103,.55);border-radius:16px;background:rgba(3,43,48,.28);color:#f6ead8;font:800 42px/1 Arial,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;z-index:3;';"
          current_back_style = "back.style.cssText = 'position:absolute;inset-inline-end:16px;top:12px;width:64px;height:64px;border:1px solid rgba(224,181,103,.55);border-radius:16px;background:rgba(3,43,48,.28);color:#f6ead8;font:800 42px/1 Arial,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;z-index:3;';"
          new_back_style = "back.style.cssText = 'position:absolute;inset-inline-end:12px;top:8px;width:42px;height:42px;border:0;background:transparent;color:#f6ead8;font:800 30px/1 Arial,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;z-index:3;';"
          if current_back_style in text:
              text = text.replace(current_back_style, new_back_style, 1)
          elif new_back_style not in text:
              raise SystemExit('back style marker missing')

          helper = (
              "function applyChooserTitle(title, text) {\n"
              "  if (!title) return;\n"
              "  title.textContent = text;\n"
              "  title.style.setProperty('text-align', 'center', 'important');\n"
              "  title.style.setProperty('font-size', 'clamp(16px, 3vw, 24px)', 'important');\n"
              "  title.style.setProperty('line-height', '1.2', 'important');\n"
              "  title.style.setProperty('white-space', 'normal', 'important');\n"
              "  title.style.setProperty('width', '100%', 'important');\n"
              "  title.style.setProperty('min-width', '0', 'important');\n"
              "  title.style.setProperty('max-width', '100%', 'important');\n"
              "  title.style.setProperty('box-sizing', 'border-box', 'important');\n"
              "  title.style.setProperty('padding-inline', '48px', 'important');\n"
              "  title.style.setProperty('overflow', 'visible', 'important');\n"
              "  title.style.setProperty('text-overflow', 'clip', 'important');\n"
              "  title.style.setProperty('margin-bottom', '12px', 'important');\n"
              "}\n\n"
          )
          if 'function applyChooserTitle(title, text)' not in text:
              text = text.replace('function setupTimeChooser(levelKey) {', helper + 'function setupTimeChooser(levelKey) {', 1)

          time_start = text.index('function setupTimeChooser(levelKey) {')
          time_end = text.index('function setupLevelChooser() {', time_start)
          time_block = text[time_start:time_end]
          title_start = time_block.index("  const title = opponentSearchSetup?.querySelector('.opponent-search-title');")
          add_back = time_block.index('  addTimeChooserBack();', title_start)
          time_block = time_block[:title_start] + "  const title = opponentSearchSetup?.querySelector('.opponent-search-title');\n  applyChooserTitle(title, `اختر زمن المباراة — مستوى ${level.label}`);\n" + time_block[add_back:]
          text = text[:time_start] + time_block + text[time_end:]

          level_start = text.index('function setupLevelChooser() {')
          level_end = text.index("resignBtn?.addEventListener('click'", level_start)
          level_block = text[level_start:level_end]
          title_start = level_block.index("  const title = opponentSearchSetup?.querySelector('.opponent-search-title');")
          next_marker = level_block.index("  if (opponentSearchSetup)", title_start)
          level_block = level_block[:title_start] + "  const title = opponentSearchSetup?.querySelector('.opponent-search-title');\n  applyChooserTitle(title, 'اختر مستوى الكمبيوتر — النقاط للمسجلين');\n" + level_block[next_marker:]
          text = text[:level_start] + level_block + text[level_end:]
          js.write_text(text, encoding='utf-8')

          play = Path('play-v10.html')
          html = play.read_text(encoding='utf-8')
          html = re.sub(r"play-computer\.js\?v=\d{8}-\d+", 'play-computer.js?v=20260906-10', html, count=1)
          play.write_text(html, encoding='utf-8')
          PY
      - name: Verify chooser fix
        run: |
          python tests/test_computer_play_mode.py
          cp play-computer.js /tmp/play-computer.mjs
          node --check /tmp/play-computer.mjs
      - name: Commit chooser fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-computer.js play-v10.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: simplify computer chooser back icon and unify titles'
          git pull --rebase origin main
          git push
