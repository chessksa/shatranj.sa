name: Test compact profile sections
on:
  push:
    paths:
      - 'tests/test_profile_compact_sections.py'
      - '.github/workflows/test-profile-compact-sections.yml'
      - 'profile.html'
      - 'profile.js'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify compact collapsible profile sections
        run: python tests/test_profile_compact_sections.py
