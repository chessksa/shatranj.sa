name: Apply five-second grace end

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-grace-end.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply approved grace-end UI and behavior
        run: python ci/apply_grace_end.py
      - name: Verify focused behavior
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_play_grace_end.py
          node --check play-v10-match.js
          node --check play-v8.js
      - name: Commit implementation
        run: |
          git config user.name "chessksa"
          git config user.email "gmel1199@gmail.com"
          git add play-v10.html play-v10-match.js play-v8.js
          git commit -m "feat: add five-second no-rating match exit"
          git push origin HEAD:main
