name: Apply player profile links
on:
  push:
    paths:
      - '.github/workflows/apply-player-profile-links.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link player names to public profiles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<span class="player-name">${escapeHTML(player.name)}</span>'
          new = '<a class="player-name player-profile-link" href="player.html?id=${encodeURIComponent(player.id)}">${escapeHTML(player.name)}</a>'
          if old not in text:
              raise SystemExit('ranking player-name pattern not found')
          text = text.replace(old, new, 1)
          text = re.sub(r'home-invite\.js\?v=[^"\s]+', 'home-invite.js?v=20260903-3', text, count=1)
          p.write_text(text, encoding='utf-8')

          p = Path('home-invite.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace('.home-invite-name{font-size:13px;font-weight:900}', '.home-invite-name{font-size:13px;font-weight:900}.home-invite-name-link{color:inherit;text-decoration:none}.home-invite-name-link:hover{text-decoration:underline}', 1)
          text = text.replace('.home-invite-send{flex:0 0 auto;color:#176148;font-size:11px;font-weight:900}', '.home-invite-send{flex:0 0 auto;border:0;background:transparent;color:#176148;font-size:11px;font-weight:900;cursor:pointer;padding:6px 8px;border-radius:8px}.home-invite-send:hover{background:#eef6f1}', 1)
          pattern = r'''results\.innerHTML = matches\.map\(player => `\n\s*<button class="home-invite-result" type="button" data-invite-player="\$\{esc\(player\.id\)\}" data-invite-name="\$\{esc\(player\.name\)\}">.*?</button>`\)\.join\(''\);'''
          replacement = "\n".join([
              "results.innerHTML = matches.map(player => `",
              "      <div class=\"home-invite-result\">",
              "        <span>",
              "          <a class=\"home-invite-name home-invite-name-link\" href=\"player.html?id=${encodeURIComponent(player.id)}\">${esc(player.name)}${player.username ? ` <small>@${esc(player.username)}</small>` : ''}</a>",
              "          <span class=\"home-invite-meta\">${esc(player.city || '—')} • ${Number(player.rating || 1500)} نقطة</span>",
              "        </span>",
              "        <button class=\"home-invite-send\" type=\"button\" data-invite-player=\"${esc(player.id)}\" data-invite-name=\"${esc(player.name)}\">دعوة</button>",
              "      </div>`).join('');"
          ])
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('invite result pattern not found')
          p.write_text(text, encoding='utf-8')

          p = Path('play.html')
          text = p.read_text(encoding='utf-8')
          if '<h2 class="name" id="topName">—</h2>' not in text or '<h2 class="name" id="bottomName">—</h2>' not in text:
              raise SystemExit('play player-name elements not found')
          text = text.replace('<h2 class="name" id="topName">—</h2>', '<a class="name player-profile-link" id="topName" aria-label="فتح ملف اللاعب">—</a>', 1)
          text = text.replace('<h2 class="name" id="bottomName">—</h2>', '<a class="name player-profile-link" id="bottomName" aria-label="فتح ملف اللاعب">—</a>', 1)
          marker = '    @media (min-width:1221px){'
          style = '    .player-profile-link{display:block;color:inherit;text-decoration:none;cursor:pointer}.player-profile-link:hover{color:var(--gold)}.player-profile-link[aria-disabled="true"]{cursor:default}\n\n'
          if marker not in text:
              raise SystemExit('play style insertion marker not found')
          text = text.replace(marker, style + marker, 1)
          text = re.sub(r'play-live\.js\?v=[^"\s]+', 'play-live.js?v=20260903-3', text, count=1)
          p.write_text(text, encoding='utf-8')

          p = Path('play-live.js')
          text = p.read_text(encoding='utf-8')
          white_old = "      name: serverState.white_name,\n      rating: serverState.white_rating,"
          white_new = "      id: serverState.white_player_id,\n      name: serverState.white_name,\n      rating: serverState.white_rating,"
          black_old = "    name: serverState.black_name,\n    rating: serverState.black_rating,"
          black_new = "    id: serverState.black_player_id,\n    name: serverState.black_name,\n    rating: serverState.black_rating,"
          if white_old not in text or black_old not in text:
              raise SystemExit('live colorInfo patterns not found')
          text = text.replace(white_old, white_new, 1).replace(black_old, black_new, 1)
          marker = 'function renderPlayers(){'
          helper = "\n".join([
              "function setPlayerProfileLink(el, info){",
              "  if(info?.id){",
              "    el.href=`player.html?id=${encodeURIComponent(info.id)}`;",
              "    el.removeAttribute('aria-disabled');",
              "  }else{",
              "    el.removeAttribute('href');",
              "    el.setAttribute('aria-disabled','true');",
              "  }",
              "}",
              "",
              ""
          ])
          if marker not in text:
              raise SystemExit('renderPlayers marker not found')
          text = text.replace(marker, helper + marker, 1)
          top_old = "  topNameEl.textContent = top.name || 'الخصم';\n  topRatingEl.textContent = top.rating ?? '—';"
          top_new = "  topNameEl.textContent = top.name || 'الخصم';\n  setPlayerProfileLink(topNameEl, top);\n  topRatingEl.textContent = top.rating ?? '—';"
          bottom_old = "  bottomNameEl.textContent = bottom.name || 'أنت';\n  bottomRatingEl.textContent = bottom.rating ?? '—';"
          bottom_new = "  bottomNameEl.textContent = bottom.name || 'أنت';\n  setPlayerProfileLink(bottomNameEl, bottom);\n  bottomRatingEl.textContent = bottom.rating ?? '—';"
          if top_old not in text or bottom_old not in text:
              raise SystemExit('renderPlayers name assignments not found')
          text = text.replace(top_old, top_new, 1).replace(bottom_old, bottom_new, 1)
          p.write_text(text, encoding='utf-8')
          PY

          python tests/test_player_profile_links.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html home-invite.js play.html play-live.js
          git commit -m "Link player names to public profiles"
          git push
