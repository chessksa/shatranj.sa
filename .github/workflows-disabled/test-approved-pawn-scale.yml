name: Test approved piece centering

on:
  push:
    paths:
      - 'assets/pieces/shatranj-approved-20260904.svg'
      - '.github/workflows/test-approved-pawn-scale.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all pieces are visually centered
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from PIL import Image

          path = Path('assets/pieces/shatranj-approved-20260904.svg')
          root = ET.parse(path).getroot()
          groups = {el.attrib.get('id'): el for el in root.iter() if el.attrib.get('id')}
          piece_ids = ('wp','bp','wr','br','wn','bn','wb','bb','wq','bq','wk','bk')
          errors=[]

          for piece_id in piece_ids:
              group = groups.get(piece_id)
              assert group is not None, f'missing {piece_id}'
              image = next((child for child in group if child.tag.endswith('image')), None)
              assert image is not None, f'missing image for {piece_id}'
              x=float(image.attrib['x']); y=float(image.attrib['y'])
              width=float(image.attrib['width']); height=float(image.attrib['height'])
              if piece_id in ('wp','bp') and (width != 46 or height != 46):
                  errors.append(f'{piece_id} pawn size changed: {width}x{height}')

              png=Image.open(f'assets/pieces/{piece_id}.png').convert('RGBA')
              bbox=png.getchannel('A').getbbox()
              assert bbox, f'no visible pixels in {piece_id}.png'
              x0,y0,x1,y1=bbox
              cx=(x0+x1)/2; cy=(y0+y1)/2
              pw,ph=png.size
              visual_x=x + width*(cx/pw)
              visual_y=y + height*(cy/ph)
              print(f'{piece_id}: bbox={bbox} visual_center=({visual_x:.3f},{visual_y:.3f}) image_xy=({x},{y}) size=({width},{height})')
              if abs(visual_x-20) > 0.35 or abs(visual_y-20) > 0.35:
                  errors.append(f'{piece_id} not visually centered: ({visual_x:.3f},{visual_y:.3f})')

          assert not errors, '; '.join(errors)
          print('all approved pieces are visually centered; pawn size remains 115 percent')
          PY
