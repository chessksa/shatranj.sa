name: Test home header filters polish

on:
  push:
    branches:
      - home-header-filters-polish
      - main
    paths:
      - index.html
      - home-theme.css
      - home-invite.js
      - tests/test_home_header_filters_polish.py
      - .github/workflows/test-home-header-filters-polish.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_home_header_filters_polish.py
