name: Verify tournament game demo RED

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tournament-game-demo-red.yml'

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm tournament demo test fails before implementation
        shell: bash
        run: |
          set +e
          python tests/test_tournament_game_demo.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected RED, but test already passed.'
            exit 1
          fi
          echo 'Tournament demo regression is RED as expected.'
