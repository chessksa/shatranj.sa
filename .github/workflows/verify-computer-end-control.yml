name: Verify computer end control

on:
  push:
    branches: [main]
    paths:
      - 'play-computer.js'
      - 'tests/test_computer_end_control.py'
      - '.github/workflows/verify-computer-end-control.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current computer end behavior
        run: python tests/test_computer_end_control.py
