name: Fix Arab city reset

on:
  push:
    branches:
      - feature/shatranj-arab
    paths:
      - 'ci/fix_arab_city_reset.py'
      - '.github/workflows/fix-arab-city-reset.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shatranj-arab
      - name: Fix signup city reset
        run: python ci/fix_arab_city_reset.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: keep Arab city field enabled after signup"
          git push origin HEAD:feature/shatranj-arab
