name: Apply home hero title glow v2

on:
  push:
    branches:
      - feature/hero-title-glow-20260908
    paths:
      - '.github/workflows/apply-home-hero-title-glow-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply title effect and cache refresh
        env:
          TITLE_GLOW_B64: 
        run: |
          python -c "from pathlib import Path; import os,base64; p=Path('home-theme.css'); s=p.read_text(encoding='utf-8'); marker='/* Calm orange-cyan hero title glow 20260908 */'; block=base64.b64decode(os.environ['TITLE_GLOW_B64']).decode('utf-8'); p.write_text(s.rstrip()+block+'\n',encoding='utf-8') if marker not in s else None; q=Path('index.html'); t=q.read_text(encoding='utf-8'); old='home-theme.css?v=2026090802'; new='home-theme.css?v=2026090803'; q.write_text(t.replace(old,new,1),encoding='utf-8') if old in t else None"
      - run: python tests/test_home_hero_title_glow.py
      - run: git diff --check
      - name: Commit title glow
        run: |
          git config user.name "chessksa"
          git config user.email "gmel1199@gmail.com"
          git add home-theme.css index.html
          git commit -m "style: add calm orange cyan hero title glow"
          git push
