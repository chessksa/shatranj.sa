name: Apply tournament demo header fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-tournament-demo-header-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply demo/header placement fix
        run: python tools/fix_tournament_demo_header.py
      - name: Verify tournament demo and play regressions
        run: |
          python tests/test_tournament_game_demo.py
          python tests/test_tournament_player_banner.py
          python tests/test_tournament_game_badge.py
          python tests/test_tournament_spectator_link.py
          python tests/test_last_move_highlight.py
          python tests/test_play_v10_cm_preview.py
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tournaments.html play-v10.html play.html play-v8.js play-live.js play-tournament-demo.js
          git commit -m 'fix: keep tournament banner below header'
          git push origin HEAD:main

# rerun-after-cache-test-update
