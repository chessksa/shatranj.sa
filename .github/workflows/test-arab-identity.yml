name: Test Arab platform identity

on:
  workflow_dispatch:
  push:
    branches:
      - feature/shatranj-arab
      - main
    paths:
      - 'index.html'
      - 'profile.html'
      - 'profile.js'
      - 'profile-section.js'
      - 'player.html'
      - 'player.js'
      - 'play-v10.html'
      - 'play.html'
      - 'watch.html'
      - 'manifest.webmanifest'
      - 'tests/test_arab_identity.py'
      - 'tests/test_arab_profile_country.py'
      - '.github/workflows/test-arab-identity.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Arab identity tests
        run: |
          python tests/test_arab_identity.py
          python tests/test_arab_profile_country.py
