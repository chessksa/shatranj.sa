name: Verify live move review controls

on:
  push:
    branches:
      - main
      - feature/live-move-review-20260907
    paths:
      - 'play-v8.js'
      - 'play-v10.html'
      - 'tests/test_live_move_review.py'
      - 'scripts/apply_live_move_review.py'
      - 'scripts/fix_live_move_review_css.py'
      - '.github/workflows/verify-live-move-review.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply live move review on feature branch
        if: github.ref_name == 'feature/live-move-review-20260907'
        run: |
          python scripts/apply_live_move_review.py
          python scripts/fix_live_move_review_css.py
      - name: Verify live move review
        run: python tests/test_live_move_review.py
      - name: Verify grace and result regressions
        run: |
          python tests/test_play_grace_end.py
          python tests/test_game_result_ui.py
      - name: Verify JavaScript syntax
        run: |
          cp play-v8.js /tmp/play-v8.mjs
          node --check /tmp/play-v8.mjs
      - name: Commit verified live move review
        if: github.ref_name == 'feature/live-move-review-20260907'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-v8.js play-v10.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: clean move review styles'
          git push origin HEAD:feature/live-move-review-20260907
