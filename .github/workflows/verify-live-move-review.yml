name: Verify live move review controls

on:
  push:
    branches:
      - main
      - feature/live-move-review-20260907
    paths:
      - 'play-v8.js'
      - 'play-v10.html'
      - 'tests/test_live_move_review.py'
      - '.github/workflows/verify-live-move-review.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify live move review
        run: python tests/test_live_move_review.py
      - name: Verify grace and result regressions
        run: |
          python tests/test_play_grace_end.py
          python tests/test_game_result_ui.py
      - name: Verify JavaScript syntax
        run: |
          cp play-v8.js /tmp/play-v8.mjs
          node --check /tmp/play-v8.mjs
