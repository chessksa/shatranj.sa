name: Apply stale computer timeout settlement guard

on:
  push:
    paths:
      - '.github/workflows/apply-computer-timeout-stale-settlement.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_computer_timeout_stale_settlement.py
      - run: python tests/test_computer_timeout_stale_settlement.py
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/computer-game/index.ts
          git commit -m 'fix: reject stale computer timeout losses'
          git push origin HEAD:main
