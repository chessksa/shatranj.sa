name: Pregame mobile fit

on:
  push:
    paths:
      - '.github/workflows/pregame-mobile-fit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify equal mobile player card and pull to refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('play-v10.html').read_text(encoding='utf-8')
          assert 'body.pregame #topPlayerCard{order:1;width:100%;min-height:96px!important;height:96px!important' in html
          assert 'body.pregame .panel-stack>.player-card:not(#topPlayerCard){order:3;width:100%;min-height:96px!important;height:96px!important' in html, 'bottom player card must equal top card height'
          assert 'body.pregame{height:auto!important;min-height:100dvh!important;overflow-y:auto!important;overflow-x:hidden!important' in html, 'pregame must allow vertical pull-to-refresh'
          assert 'body.live-game{height:auto!important;min-height:100dvh!important;overflow-y:auto!important;overflow-x:hidden!important' in html, 'live game must allow vertical pull-to-refresh'
          assert '-webkit-overflow-scrolling:touch' in html
          print('mobile equal-card and pull-to-refresh behavior verified')
          PY
