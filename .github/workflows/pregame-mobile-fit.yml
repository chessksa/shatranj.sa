name: Pregame mobile fit

on:
  push:
    paths:
      - '.github/workflows/pregame-mobile-fit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply in-page mobile pull refresh and existing mobile fixes
        run: python scripts/apply-pregame-mobile-fit.py
      - name: Verify equal mobile player card, search layout and pull to refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('play-v10.html').read_text(encoding='utf-8')
          assert 'body.pregame #topPlayerCard{order:1;width:100%;min-height:96px!important;height:96px!important' in html
          assert 'body.pregame .panel-stack>.player-card:not(#topPlayerCard){order:3;width:100%;min-height:96px!important;height:96px!important' in html, 'bottom player card must equal top card height'
          assert 'body.pregame{height:auto!important;min-height:100dvh!important;overflow-y:auto!important;overflow-x:hidden!important' in html, 'pregame must allow vertical pull-to-refresh'
          assert 'body.live-game{height:auto!important;min-height:100dvh!important;overflow-y:auto!important;overflow-x:hidden!important' in html, 'live game must allow vertical pull-to-refresh'
          assert '-webkit-overflow-scrolling:touch' in html
          assert 'width:52px!important;height:52px!important' in html
          assert 'body.pregame #opponentSearchWaiting .opponent-waiting-line{font-size:18px!important;color:#ffbd6a!important' in html, 'search title must be 18px light orange'
          assert 'body.pregame #opponentSearchWaiting .search-dots i{background:#ffbd6a!important' in html, 'search dots must match the light orange title'
          assert 'body.pregame #opponentSearchWaiting .inline-cancel-search{margin-top:15px!important' in html, 'cancel search button needs breathing room'
          assert 'body.pregame .board-panel{order:2;width:100%;height:auto!important;min-height:0!important;flex:0 0 auto!important' in html, 'board panel must not absorb leftover vertical space'
          assert 'id="mobilePullRefresh"' in html, 'mobile pull refresh indicator missing'
          assert "addEventListener('touchstart',handlePullStart" in html, 'pull refresh touchstart handler missing'
          assert "addEventListener('touchmove',handlePullMove" in html, 'pull refresh touchmove handler missing'
          assert "addEventListener('touchend',handlePullEnd" in html, 'pull refresh touchend handler missing'
          assert 'location.reload()' in html, 'pull refresh must reload the page after threshold'
          assert 'const PULL_REFRESH_THRESHOLD=72' in html, 'pull refresh threshold must be explicit'
          print('mobile search spacing, equal-card and in-page pull-to-refresh behavior verified')
          PY
      - name: Commit mobile pull refresh
        run: |
          if git diff --quiet -- play-v10.html; then
            echo "No mobile layout changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play-v10.html
          git commit -m "fix: enable in-page mobile pull refresh"
          git push
