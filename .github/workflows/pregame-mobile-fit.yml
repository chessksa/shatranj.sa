name: Pregame mobile fit

on:
  push:
    paths:
      - '.github/workflows/pregame-mobile-fit.yml'
      - 'scripts/apply-pregame-mobile-fit.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply universal mobile pull refresh and player sizing
        run: python scripts/apply-pregame-mobile-fit.py
      - name: Verify mobile pull refresh, header and player sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('play-v10.html').read_text(encoding='utf-8')
          assert 'body.pregame #topPlayerCard{order:1;width:100%;min-height:96px!important;height:96px!important' in html
          assert 'body.pregame .panel-stack>.player-card:not(#topPlayerCard){order:3;width:100%;min-height:96px!important;height:96px!important' in html
          assert 'body.pregame{height:auto!important;min-height:100dvh!important;overflow-y:auto!important;overflow-x:hidden!important' in html
          assert 'body.live-game{height:auto!important;min-height:100dvh!important;overflow-y:auto!important;overflow-x:hidden!important' in html
          assert 'id="mobilePullRefresh"' in html
          assert "addEventListener('touchstart',handlePullStart" in html
          assert "addEventListener('touchmove',handlePullMove" in html
          assert "addEventListener('touchend',handlePullEnd" in html
          assert 'location.reload()' in html
          assert 'const PULL_REFRESH_THRESHOLD=72' in html
          assert 'const PULL_ACTIVATE_DISTANCE=12' in html, 'downward swipe must distinguish itself from a tap'
          assert 'PULL_START_ZONE' not in html
          assert 'isBlockedPullTarget' not in html, 'no pregame page area may be excluded from downward refresh'
          assert 'window.scrollY>2' not in html, 'refresh must not depend on exact scroll position'
          assert "if(!document.body.classList.contains('pregame')) return resetPull();" in html, 'pull refresh must be disabled once the live game starts'
          assert 'if(event.touches.length!==1) return resetPull();' in html, 'touchstart should arm from any pregame page position'
          assert 'if(distance<PULL_ACTIVATE_DISTANCE) return;' in html, 'tap must remain available before swipe activation'
          assert 'body.pregame .side-header{order:0;width:100%;min-height:48px!important;height:48px!important' in html, 'mobile header must be larger'
          assert 'body.pregame .panel-stack>.player-card:not(#topPlayerCard) .avatar{width:78px!important;height:78px!important' in html, 'player image must fill the card height'
          assert 'body.pregame .panel-stack>.player-card:not(#topPlayerCard) .name{font-size:20px!important' in html, 'player name must be 20px'
          print('pregame-only pull refresh and larger mobile player UI verified')
          PY
      - name: Commit mobile game polish
        run: |
          if git diff --quiet -- play-v10.html; then
            echo "No mobile layout changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play-v10.html
          git commit -m "fix: disable pull refresh during live game"
          git push
