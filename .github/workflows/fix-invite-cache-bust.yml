name: Fix invite cache bust
on:
  push:
    paths:
      - '.github/workflows/fix-invite-cache-bust.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump homepage invite script version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='home-invite.js?v=20260903-1'
          new='home-invite.js?v=20260903-2'
          if old not in s:
              raise SystemExit('old invite script version not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'home-invite.js?v=20260903-2' in s
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Refresh homepage invite script cache" || exit 0
          git push
