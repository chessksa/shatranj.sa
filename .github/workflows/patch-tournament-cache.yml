name: Patch tournament cache key

on:
  push:
    branches:
      - fix-tournament-detail-cache-20260910

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-tournament-detail-cache-20260910
      - name: Update tournament loader cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tournaments.html')
          s = p.read_text(encoding='utf-8')
          old = 'site-presence.js?v=20260910-registration-button2'
          new = 'site-presence.js?v=20260910-detail-scale2'
          if old not in s:
              raise SystemExit('old cache key not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tournaments.html
          git commit -m 'fix: bust tournament detail loader cache'
          git push origin HEAD:fix-tournament-detail-cache-20260910
