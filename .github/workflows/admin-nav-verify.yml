name: Admin Navigation Verification

on:
  push:
    branches:
      - fix/admin-nav-visibility
  pull_request:
    branches: [main]
    paths:
      - 'v2/site/shell.mjs'
      - 'v2/site/nav.mjs'
      - 'tests/test_admin_nav_visibility.py'
      - '.github/workflows/admin-nav-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Admin navigation contract
        run: python -m pytest -q tests/test_admin_nav_visibility.py
      - name: Existing V2 shell contract
        run: python tests/test_v2_play_shell.py
