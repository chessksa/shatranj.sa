name: Apply computer move ack before engine

# Re-run after refining the focused correlation regression.
on:
  push:
    paths:
      - '.github/workflows/apply-computer-move-ack.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch server and client synchronization
        run: python tools/apply_computer_move_ack.py
      - name: Verify focused regressions
        run: |
          python tests/test_computer_move_ack_before_engine.py
          python tests/test_computer_sync_notice_silent.py
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/computer-game/index.ts play-computer.js play-v10.html index.html
          git commit -m 'fix: acknowledge computer moves before engine reply'
          git push origin HEAD:main
