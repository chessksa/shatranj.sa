name: Test username login recovery

on:
  push:
    branches:
      - main
      - feat/username-login-recovery
    paths:
      - 'index.html'
      - 'sw.js'
      - 'supabase/functions/username-login/**'
      - 'tests/test_username_login_recovery.py'
      - '.github/workflows/test-username-login-recovery.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run focused test
        run: python tests/test_username_login_recovery.py
