name: Verify double pawn highlight RED
on:
  push:
    branches: [main]
    paths:
      - 'tests/test_double_pawn_last_move.py'
      - '.github/workflows/verify-double-pawn-highlight-red.yml'
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm regression test fails before fix
        run: |
          if python tests/test_double_pawn_last_move.py; then
            echo 'Regression test unexpectedly passed before implementation.'
            exit 1
          fi
          echo 'RED confirmed: regression test fails before implementation.'
