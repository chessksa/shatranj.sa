name: Apply tournament game badge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-tournament-game-badge.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply tournament live-game badge
        run: python tools/apply_tournament_game_badge.py
      - name: Verify tournament badge and play regressions
        run: |
          python tests/test_tournament_game_badge.py
          python tests/test_tournament_start_engine.py
          python tests/test_tournament_spectator_link.py
          python tests/test_last_move_highlight.py
          python tests/test_play_v10_cm_preview.py
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-v10.html play-v8.js play.html play-live.js supabase/migrations/20260909213000_tournament_game_badge.sql
          git commit -m 'feat: mark tournament live games with tournament badge'
          git push origin HEAD:main

# rerun after cache expectation update
