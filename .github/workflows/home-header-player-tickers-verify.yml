name: Home header player and tickers verify

on:
  push:
    branches:
      - feat/header-player-tickers-20260914
    paths:
      - 'home-header-svg.css'
      - 'index-app.html'
      - 'tests/test_home_header_player_tickers.py'
      - '.github/workflows/home-header-player-tickers-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'home-header-svg.css'
      - 'index-app.html'
      - 'tests/test_home_header_player_tickers.py'
      - '.github/workflows/home-header-player-tickers-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_home_header_player_tickers.py -q
