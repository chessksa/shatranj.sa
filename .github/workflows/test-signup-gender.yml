name: Test signup gender

on:
  push:
    branches:
      - feat/signup-gender-work
    paths:
      - 'index.html'
      - 'tests/test_signup_gender.py'
      - '.github/workflows/test-signup-gender.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run focused test
        run: python tests/test_signup_gender.py
