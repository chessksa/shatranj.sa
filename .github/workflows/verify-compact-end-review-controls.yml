name: Verify compact End review controls

on:
  push:
    branches:
      - feature/compact-end-review-controls-20260907
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compact-end-review-controls-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply compact control UI
        run: python scripts/apply_compact_end_review_controls.py
      - name: Verify compact control UI
        run: python tests/test_compact_end_review_controls.py
      - name: Verify existing result UI
        run: python tests/test_game_result_ui.py
      - name: Verify computer End review
        run: python tests/test_computer_end_review.py
      - name: Verify JavaScript syntax
        run: |
          node --check play-v8.js
          node --check play-computer.js
      - name: Commit production UI change
        run: |
          if git diff --quiet -- play-v10.html; then
            echo "No production change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play-v10.html
          git commit -m "ui: compact End and review controls"
          git push origin HEAD:feature/compact-end-review-controls-20260907
