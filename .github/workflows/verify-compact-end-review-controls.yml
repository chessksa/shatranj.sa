name: Verify compact End review controls

on:
  push:
    branches:
      - main
      - feature/compact-end-review-controls-20260907
    paths:
      - play-v10.html
      - play-v8.js
      - play-computer.js
      - tests/test_compact_end_review_controls.py
      - tests/test_game_result_ui.py
      - tests/test_computer_end_review.py
      - .github/workflows/verify-compact-end-review-controls.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify compact control UI
        run: python tests/test_compact_end_review_controls.py
      - name: Verify existing result UI
        run: python tests/test_game_result_ui.py
      - name: Verify computer End review
        run: python tests/test_computer_end_review.py
      - name: Verify JavaScript syntax
        run: |
          node --check play-v8.js
          node --check play-computer.js
