name: Test unified profile icon row
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run full regression suite
        run: |
          set -e
          for test in tests/test_*.py; do
            echo "==> $test"
            python "$test"
          done
          for script in *.js; do
            echo "==> node --check $script"
            node --check "$script"
          done
