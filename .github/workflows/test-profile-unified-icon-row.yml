name: Test unified profile icon row
on:
  push:
    branches:
      - main
      - feature/profile-unified-icon-row
    paths:
      - 'profile.html'
      - 'profile.js'
      - 'profile-section.html'
      - 'profile-section.js'
      - 'tests/**'
      - '.github/workflows/test-profile-unified-icon-row.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run full regression suite
        run: |
          set -e
          for test in tests/test_*.py; do
            echo "==> $test"
            python "$test"
          done
          for script in *.js; do
            echo "==> node --check $script"
            node --check "$script"
          done
