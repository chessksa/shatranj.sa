name: Apply board v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-board-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install pillow
      - name: Build normalized v3 PNG pieces and live theme
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          src_dir = root / 'assets' / 'pieces'
          out_dir = src_dir / 'v3'
          out_dir.mkdir(parents=True, exist_ok=True)

          codes = ['wk','wq','wr','wb','wn','wp','bk','bq','br','bb','bn','bp']
          target_h = {'k':420, 'q':470, 'r':440, 'b':455, 'n':455, 'p':380}
          pawn_heights = []

          for code in codes:
              src = src_dir / f'{code}.png'
              if not src.exists():
                  raise SystemExit(f'missing source image: {src}')
              im = Image.open(src).convert('RGBA')
              alpha = im.getchannel('A')
              bbox = alpha.getbbox()
              if not bbox:
                  raise SystemExit(f'empty piece: {code}')

              # Remove the king cross from the source artwork. The round finial
              # is added by the SVG sprite, so the body stays clean.
              if code.endswith('k'):
                  px = im.load()
                  cut_y = bbox[1] + round((bbox[3] - bbox[1]) * 0.19)
                  for y in range(0, min(cut_y, im.height)):
                      for x in range(im.width):
                          r,g,b,a = px[x,y]
                          if a:
                              px[x,y] = (r,g,b,0)
                  bbox = im.getchannel('A').getbbox()

              crop = im.crop(bbox)
              w, h = crop.size
              desired_h = target_h[code[1]]
              scale = desired_h / h
              max_w = 470
              if w * scale > max_w:
                  scale = max_w / w
              nw = max(1, round(w * scale))
              nh = max(1, round(h * scale))
              crop = crop.resize((nw, nh), Image.Resampling.LANCZOS)

              canvas = Image.new('RGBA', (512, 512), (0,0,0,0))
              x = (512 - nw) // 2
              y = 506 - nh
              canvas.alpha_composite(crop, (x, y))
              out = out_dir / f'{code}.png'
              canvas.save(out, 'PNG', optimize=True)

              out_bbox = canvas.getchannel('A').getbbox()
              if code.endswith('p'):
                  pawn_heights.append(out_bbox[3] - out_bbox[1])

          if pawn_heights != [380, 380]:
              raise SystemExit(f'pawn height mismatch: {pawn_heights}')

          sprite = '''<?xml version="1.0" encoding="UTF-8"?>
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
            <title>Shatranj Saudi Arabia 3D Staunton v3</title>
            <defs>
              <radialGradient id="ivoryOrb" cx="35%" cy="28%" r="70%">
                <stop offset="0" stop-color="#fff8d7"/>
                <stop offset="0.45" stop-color="#f6d98e"/>
                <stop offset="1" stop-color="#c9953e"/>
              </radialGradient>
              <radialGradient id="brownOrb" cx="35%" cy="28%" r="70%">
                <stop offset="0" stop-color="#9a5d2d"/>
                <stop offset="0.45" stop-color="#5e2d16"/>
                <stop offset="1" stop-color="#24110a"/>
              </radialGradient>
            </defs>
            <g id="wk"><image href="assets/pieces/v3/wk.png?v=20260904-6" x="-1.25" y="-1.25" width="42.5" height="42.5" preserveAspectRatio="xMidYMid meet"/><circle cx="20" cy="5.6" r="2.75" fill="url(#ivoryOrb)" stroke="#d7a74d" stroke-width="0.35"/></g>
            <g id="wq"><image href="assets/pieces/v3/wq.png?v=20260904-6" x="-1.25" y="-1.25" width="42.5" height="42.5" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="wr"><image href="assets/pieces/v3/wr.png?v=20260904-6" x="-1.25" y="-1.25" width="42.5" height="42.5" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="wb"><image href="assets/pieces/v3/wb.png?v=20260904-6" x="-1.25" y="-1.25" width="42.5" height="42.5" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="wn"><image href="assets/pieces/v3/wn.png?v=20260904-6" x="-1.25" y="-1.25" width="42.5" height="42.5" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="wp"><image href="assets/pieces/v3/wp.png?v=20260904-6" x="-1.25" y="-1.25" width="42.5" height="42.5" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="bk"><image href="assets/pieces/v3/bk.png?v=20260904-6" x="-1.25" y="-1.25" width="42.5" height="42.5" preserveAspectRatio="xMidYMid meet"/><circle cx="20" cy="5.6" r="2.75" fill="url(#brownOrb)" stroke="#1b0d08" stroke-width="0.35"/></g>
            <g id="bq"><image href="assets/pieces/v3/bq.png?v=20260904-6" x="-1.25" y="-1.25" width="42.5" height="42.5" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="br"><image href="assets/pieces/v3/br.png?v=20260904-6" x="-1.25" y="-1.25" width="42.5" height="42.5" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="bb"><image href="assets/pieces/v3/bb.png?v=20260904-6" x="-1.25" y="-1.25" width="42.5" height="42.5" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="bn"><image href="assets/pieces/v3/bn.png?v=20260904-6" x="-1.25" y="-1.25" width="42.5" height="42.5" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="bp"><image href="assets/pieces/v3/bp.png?v=20260904-6" x="-1.25" y="-1.25" width="42.5" height="42.5" preserveAspectRatio="xMidYMid meet"/></g>
          </svg>'''.replace('          ','')
          (src_dir/'shatranj-3d-staunton-v3.svg').write_text(sprite, encoding='utf-8')

          base_css = (root/'cm-chessboard-shatranj.css').read_text(encoding='utf-8')
          new_css = base_css.replace('#155b63', '#246f77')
          (root/'cm-chessboard-shatranj-v3.css').write_text(new_css, encoding='utf-8')

          def replace(path, old, new):
              p = root/path
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'missing expected text in {path}: {old}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          for path in ('play-v8.js','play-v10-match.js'):
              replace(path, 'pieces/shatranj-3d-staunton-v2.svg', 'pieces/shatranj-3d-staunton-v3.svg')
              replace(path, 'cm-chessboard-shatranj.css?v=20260904-2', 'cm-chessboard-shatranj-v3.css?v=20260904-3')
              replace(path, "style.setProperty('fill','#155b63','important')", "style.setProperty('fill','#246f77','important')")

          replace('play-v10.html', '.square.dark{background:#0b4850}', '.square.dark{background:#246f77}')
          replace('play-v10.html', 'play-v8.js?v=20260904-2', 'play-v8.js?v=20260904-3')
          replace('play-v10.html', 'play-v10-match.js?v=20260904-2', 'play-v10-match.js?v=20260904-3')

          test = root/'tests/test_approved_piece_sprite.py'
          if test.exists():
              s = test.read_text(encoding='utf-8')
              s = s.replace('shatranj-3d-staunton-v2.svg', 'shatranj-3d-staunton-v3.svg')
              s = s.replace('#155b63', '#246f77')
              s = s.replace('cm-chessboard-shatranj.css', 'cm-chessboard-shatranj-v3.css')
              test.write_text(s, encoding='utf-8')
          PY
      - name: Verify JavaScript syntax
        run: |
          node --check play-v8.js
          node --check play-v10-match.js
      - name: Verify live board v3
        run: |
          grep -q "shatranj-3d-staunton-v3.svg" play-v8.js
          grep -q "shatranj-3d-staunton-v3.svg" play-v10-match.js
          grep -q "cm-chessboard-shatranj-v3.css?v=20260904-3" play-v8.js
          grep -q "#246f77" cm-chessboard-shatranj-v3.css
          grep -q "play-v8.js?v=20260904-3" play-v10.html
          grep -q "play-v10-match.js?v=20260904-3" play-v10.html
          grep -q '<circle cx="20" cy="5.6"' assets/pieces/shatranj-3d-staunton-v3.svg
          test $(find assets/pieces/v3 -name '*.png' | wc -l) -eq 12
      - name: Commit live board v3
        run: |
          git config user.name "chessksa"
          git config user.email "gmel1199@gmail.com"
          git rm .github/workflows/apply-board-v3.yml
          git add play-v8.js play-v10-match.js play-v10.html cm-chessboard-shatranj-v3.css assets/pieces/shatranj-3d-staunton-v3.svg assets/pieces/v3 tests/test_approved_piece_sprite.py
          git commit -m "feat: deploy enlarged normalized 3D board v3"
          git push origin main
