name: Test home theme cache

on:
  push:
    branches: [main]
    paths:
      - index.html
      - home-theme.css
      - tests/test_home_theme_cache_buster.py
      - .github/workflows/test-home-theme-cache.yml
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pytest -q tests/test_home_theme_cache_buster.py
