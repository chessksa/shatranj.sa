name: Apply mobile hero title one line
on:
  push:
    paths:
      - '.github/workflows/apply-mobile-hero-title-one-line.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one-line mobile hero title
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          anchor = '<link rel="stylesheet" href="home-theme.css?v=20260905-7">\n'
          block = '''<style id="mobileHeroTitleOneLine">
          @media(max-width:600px){
            .home-hero h1{white-space:nowrap!important}
            .home-hero h1 span{display:inline!important}
          }
          </style>
          '''
          assert anchor in text, 'stylesheet anchor not found'
          assert 'id="mobileHeroTitleOneLine"' not in text, 'rule already exists'
          text = text.replace(anchor, anchor + block, 1)
          assert '.home-hero h1{white-space:nowrap!important}' in text
          assert '.home-hero h1 span{display:inline!important}' in text
          p.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-mobile-hero-title-one-line.yml
          git add index.html
          git commit -m "جعل عنوان الترحيب سطرا واحدا في الجوال"
          git push
