name: Verify single mobile computer chessboard
on:
  push:
    branches: [main]
    paths:
      - 'play-computer.js'
      - 'play-v10.html'
      - 'computer-single-board-mobile.css'
      - '.github/workflows/verify-mobile-computer-board.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-mobile-board:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser automation
        run: |
          npm install --no-audit --no-fund --prefix /tmp/phone-board-check playwright-core@1.56.1 pngjs@7.0.0
          command -v google-chrome
      - name: Test mobile chessboard without overlay, then make a real move
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/computer-board-http.log 2>&1 &
          export CHROME_PATH="$(command -v google-chrome)"
          node <<'JS'
          const {chromium}=require('/tmp/phone-board-check/node_modules/playwright-core');
          const {PNG}=require('/tmp/phone-board-check/node_modules/pngjs');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
              const page=await context.newPage();
              page.on('pageerror',error=>console.log('PAGE_ERROR:',error.message));
              await page.goto('http://127.0.0.1:8765/play-entry-v16.html?computer=1&test='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForSelector('body.computer-game',{timeout:35000});
              await page.waitForSelector('#board.mobile-computer-single-board .mobile-board-square',{timeout:25000});
              await page.waitForFunction(()=>[...document.querySelectorAll('#board img')].filter(img=>img.complete && img.naturalWidth).length===32,null,{timeout:25000});
              async function check(phase){
                const result=await page.evaluate(()=>{
                  const board=document.getElementById('board');
                  const squares=[...board.querySelectorAll('.mobile-board-square')];
                  const imgs=[...board.querySelectorAll('.mobile-board-piece')];
                  const css=getComputedStyle(board);
                  return {
                    className:board.className,children:board.children.length,squares:squares.length,pieces:imgs.length,
                    loaded:imgs.filter(img=>img.complete&&img.naturalWidth>0).length,svgLayers:document.querySelectorAll('#board svg').length,
                    extraGrids:document.querySelectorAll('.mobile-computer-main-grid,.has-mobile-home-board').length,
                    background:css.backgroundImage,light:getComputedStyle(board.querySelector('.light')).backgroundColor,
                    dark:getComputedStyle(board.querySelector('.dark')).backgroundColor,
                    rect:board.getBoundingClientRect().toJSON()
                  };
                });
                console.log(phase,JSON.stringify(result));
                if(result.squares!==64||result.children!==64||result.pieces!==32||result.loaded!==32||
                   result.svgLayers!==0||result.extraGrids!==0||!result.background.includes('wood4.jpg')||
                   result.rect.width<300||result.light==='rgba(0, 0, 0, 0)')throw Error('Single board contract failed at '+phase);
              }
              await check('level-picker');
              const boardBounds=await page.locator('#board').boundingBox();
              const pixels=PNG.sync.read(await page.screenshot({path:'/tmp/mobile-single-board-before.png'}));
              const x=Math.floor((boardBounds.x+boardBounds.width*4.5/8)*2);
              const y=Math.floor((boardBounds.y+boardBounds.height*3.5/8)*2);
              const i=4*(y*pixels.width+x);
              const color=[...pixels.data.slice(i,i+3)];
              console.log('VISIBLE_BOARD_PIXEL',color);
              if(color.every(n=>n<25)) throw Error('Board appears black');
              await page.locator('.opponent-time-option[data-level="easy"]').click();
              await check('after-level');
              await page.locator('.opponent-time-option[data-minutes="5"]').click();
              await page.waitForFunction(()=>document.body.classList.contains('live-game'),null,{timeout:25000});
              await check('playing');
              await page.locator('#board [data-square="e2"]').click();
              await page.waitForSelector('#board [data-square="e2"].mobile-selected',{timeout:8000});
              await page.locator('#board [data-square="e4"]').click();
              await page.waitForFunction(()=>document.querySelector('#board [data-square="e4"]')?.dataset.piece==='wp',null,{timeout:16000});
              console.log('MOVE_E2_E4_VERIFIED');
              await page.screenshot({path:'/tmp/mobile-single-board-after.png'});
              console.log('SINGLE_BOARD_VERIFIED');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Save before and after screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-single-board-test
          path: /tmp/mobile-single-board-*.png
          if-no-files-found: ignore
