name: Verify phone computer board rendering
on:
  push:
    branches: [main]
    paths:
      - 'play-computer.js'
      - 'play-v10.html'
      - 'computer-home-board-mobile.css'
      - '.github/workflows/verify-mobile-computer-board.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-mobile-board:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install browser automation
        run: |
          npm install --no-audit --no-fund --prefix /tmp/phone-board-check playwright-core@1.56.1 pngjs@7.0.0
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Verify 64 visible squares and 32 original PNG chess pieces on mobile
        shell: bash
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node <<'JS'
          const {chromium}=require('/tmp/phone-board-check/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
              const page=await context.newPage();
              page.on('pageerror',error=>console.log('PAGE_ERROR:',error.message));
              await page.goto('https://arabchees.com/play-entry-v16.html?computer=1&test='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForSelector('body.computer-game',{timeout:35000});
              await page.waitForTimeout(5000);
              console.log('DIAGNOSTIC',JSON.stringify(await page.evaluate(()=>{
                const shell=document.querySelector('.board-shell');
                const grid=document.querySelector('.mobile-computer-main-grid');
                const board=document.getElementById('board');
                const links=[...document.querySelectorAll('link[rel="stylesheet"]')].map(e=>({href:e.href.slice(-95),media:e.media,sheet:!!e.sheet}));
                return {url:location.href,body:document.body.className,boardExists:!!board,boardClasses:board?.className,
                  shell:!!shell,shellClasses:shell?.className,grid:!!grid,gridStyle:grid?getComputedStyle(grid).cssText:null,
                  gridChildCount:grid?.children.length,gridRect:grid?.getBoundingClientRect().toJSON(),
                  pieces:grid?.querySelectorAll('img').length,renderedSvg:!!board?.querySelector('svg'),
                  scripts:[...document.querySelectorAll('script[src]')].map(x=>x.src.split('/').pop()),
                  links,boardOuter:shell?.outerHTML.slice(0,1100)};
              })));
              await page.screenshot({path:'/tmp/mobile-computer-board.png',fullPage:false});
              await page.waitForSelector('.board-shell.has-mobile-home-board .mobile-computer-main-grid',{timeout:7000});
              await page.waitForFunction(()=>{
                const grid=document.querySelector('.mobile-computer-main-grid');
                return grid?.querySelectorAll('.mobile-computer-main-piece').length===32;
              },{timeout:15000});
              async function check(phase){
                const result=await page.evaluate(()=>{
                  const grid=document.querySelector('.mobile-computer-main-grid');
                  const shell=grid?.parentElement;
                  const board=shell?.querySelector('#board');
                  const pieces=[...grid?.querySelectorAll('img')||[]];
                  const srcImages=pieces.map(x=>({loaded:x.complete&&x.naturalWidth>0,src:x.src.split('/').pop()}));
                  const rect=grid.getBoundingClientRect();
                  const g=window.getComputedStyle(grid);
                  const b=window.getComputedStyle(board);
                  return {squares:grid.children.length,pieces:pieces.length,loaded:srcImages.filter(x=>x.loaded).length,
                    missing:srcImages.filter(x=>!x.loaded).map(x=>x.src),gridZ:g.zIndex,boardZ:b.zIndex,
                    gridDisplay:g.display,gridOpacity:g.opacity,gridWidth:rect.width,gridHeight:rect.height,
                    classReady:shell.classList.contains('has-mobile-home-board'),
                    texture:g.backgroundImage,whiteSq:window.getComputedStyle(grid.querySelector('.light')).backgroundColor,
                    blackSq:window.getComputedStyle(grid.querySelector('.dark')).backgroundColor};
                });
                console.log(phase,JSON.stringify(result));
                if(result.squares!==64||result.pieces!==32||result.loaded!==32||!result.classReady||!(Number(result.gridZ)>Number(result.boardZ))||result.gridWidth<300)throw new Error('Mobile board invisible or images missing: '+phase);
              }
              await check('level-chooser');
              await page.locator('.opponent-time-option[data-level="easy"]').click();
              await check('time-chooser');
              const screen=await page.screenshot({path:'/tmp/mobile-computer-board.png',fullPage:false});
              const PNG=require('/tmp/phone-board-check/node_modules/pngjs').PNG;
              const png=PNG.sync.read(screen);
              const rect=await page.locator('.mobile-computer-main-grid').boundingBox();
              const px=(column,row)=>{
                const x=Math.floor((rect.x+rect.width*(column+.5)/8)*2);
                const y=Math.floor((rect.y+rect.height*(row+.5)/8)*2);
                const offset=(png.width*y+x)*4;
                return [...png.data.slice(offset,offset+3)];
              };
              const boardSamples={light:px(4,3),dark:px(3,3)};
              console.log('BOARD_PIXELS',JSON.stringify(boardSamples));
              for(const rgb of Object.values(boardSamples)){
                if(rgb.every(value=>value<22))throw new Error('Black pixels still cover the board');
              }
              await page.locator('.opponent-time-option[data-minutes="5"]').click();
              await page.waitForFunction(()=>document.body.classList.contains('live-game'),{timeout:22000});
              await check('active-game');
              await page.screenshot({path:'/tmp/mobile-computer-game.png',fullPage:false});
              console.log('MOBILE_BOARD_VERIFIED');
            } finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Save board screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-computer-board-check
          path: /tmp/mobile-computer-*.png
          if-no-files-found: ignore
