name: Verify mobile homepage and computer board parity
on:
  push:
    branches: [main]
    paths:
      - 'play-computer.js'
      - 'play-v10.html'
      - 'computer-single-board-mobile.css'
      - 'mobile-home-fixed-v1.css'
      - '.github/workflows/verify-mobile-computer-board.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-mobile-board:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install --no-audit --no-fund --prefix /tmp/chess-board-check playwright-core@1.56.1 pngjs@7.0.0
          command -v google-chrome
      - name: Compare actual homepage board against computer game and test legal move
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/board-check-server.log 2>&1 &
          export CHROME_PATH="$(command -v google-chrome)"
          node <<'JS'
          const {chromium}=require('/tmp/chess-board-check/node_modules/playwright-core');
          const {PNG}=require('/tmp/chess-board-check/node_modules/pngjs');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
              const page=await context.newPage();
              page.on('pageerror',e=>console.log('PAGE_ERROR:',e.message));
              await page.goto('http://127.0.0.1:8765/index.html?test='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForSelector('#mfwBoard .mfw-board-grid .mfw-square',{timeout:30000});
              await page.waitForFunction(()=>[...document.querySelectorAll('#mfwBoard img.mfw-piece')].filter(x=>x.complete&&x.naturalWidth).length===32,null,{timeout:20000});
              const homeBoard=page.locator('#mfwBoard .mfw-board-grid');
              const original=await homeBoard.evaluate(e=>{
                const square=e.querySelector('.mfw-square');
                const dark=e.querySelector('.mfw-square.dark');
                const img=e.querySelector('.mfw-piece:not([src*="/wp.png"]):not([src*="/bp.png"])');
                const pawn=e.querySelector('.mfw-piece[src*="/wp.png"]');
                const styles={};
                for(const [k,node] of [['grid',e],['square',square],['dark',dark],['piece',img],['pawn',pawn]]){
                  const g=getComputedStyle(node);
                  styles[k]={background:g.backgroundImage,color:g.backgroundColor,border:g.borderRightWidth,
                    width:g.width,height:g.height,objectFit:g.objectFit,transform:g.transform};
                }
                return {classes:e.className,squares:e.children.length,
                  pieces:e.querySelectorAll('img.mfw-piece').length,
                  coordinates:e.querySelectorAll('.mfw-coordinate').length,
                  images:[...e.querySelectorAll('img.mfw-piece')].map(i=>i.getAttribute('src')),
                  styles};
              });
              const homeBuffer=await homeBoard.screenshot({path:'/tmp/real-mobile-home-board.png'});
              console.log('REAL_HOME_BOARD',JSON.stringify(original));
              await page.goto('http://127.0.0.1:8765/play-entry-v16.html?computer=1&test='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForSelector('#board.mfw-board-grid.mobile-computer-single-board .mfw-square',{timeout:30000});
              await page.waitForFunction(()=>[...document.querySelectorAll('#board img.mfw-piece')].filter(x=>x.complete&&x.naturalWidth).length===32,null,{timeout:20000});
              const board=page.locator('#board.mobile-computer-single-board');
              async function test(phase){
                const state=await board.evaluate(e=>{
                  const square=e.querySelector('.mfw-square');
                  const dark=e.querySelector('.mfw-square.dark');
                  const img=e.querySelector('.mfw-piece:not([src*="/wp.png"]):not([src*="/bp.png"])');
                  const pawn=e.querySelector('.mfw-piece[src*="/wp.png"]');
                  const styles={};
                  for(const [k,node] of [['grid',e],['square',square],['dark',dark],['piece',img],['pawn',pawn]]){
                    const g=getComputedStyle(node);
                    styles[k]={background:g.backgroundImage,color:g.backgroundColor,border:g.borderRightWidth,
                      width:g.width,height:g.height,objectFit:g.objectFit,transform:g.transform};
                  }
                  return {classes:e.className,squares:e.children.length,svg:e.querySelectorAll('svg').length,
                    pieces:e.querySelectorAll('img.mfw-piece').length,
                    coordinates:e.querySelectorAll('.mfw-coordinate').length,
                    images:[...e.querySelectorAll('img.mfw-piece')].map(i=>i.getAttribute('src')),styles};
                });
                console.log(phase,JSON.stringify(state));
                if(state.squares!==64||state.svg!==0||state.pieces!==32||state.coordinates!==16||
                   state.styles.grid.background!==original.styles.grid.background||
                   state.styles.square.color!==original.styles.square.color||
                   state.styles.dark.color!==original.styles.dark.color||
                   state.styles.piece.width!==original.styles.piece.width||
                   state.styles.pawn.width!==original.styles.pawn.width) throw Error('Not an identical homepage mobile board: '+phase);
                return state;
              }
              await test('COMPUTER_CHOOSER_BOARD');
              const computerBuffer=await board.screenshot({path:'/tmp/real-mobile-computer-board.png'});
              const a=PNG.sync.read(homeBuffer),b=PNG.sync.read(computerBuffer);
              const get=(img,fx,fy)=>{
                const x=Math.min(img.width-1,Math.floor(img.width*fx));
                const y=Math.min(img.height-1,Math.floor(img.height*fy));
                const j=(y*img.width+x)*4;
                return Array.from(img.data.slice(j,j+3));
              };
              const samples=[[.43,.43],[.53,.44],[.31,.32],[.67,.25],[.06,.06],[.94,.94]];
              for(const [fx,fy] of samples){
                const one=get(a,fx,fy),two=get(b,fx,fy);
                const diff=one.reduce((sum,c,i)=>sum+Math.abs(c-two[i]),0);
                console.log('IMAGE_COMPARE',fx,fy,one,two,diff);
                if(diff>70)throw Error('Homepage and computer pixel difference too large');
              }
              await page.locator('.opponent-time-option[data-level="easy"]').click();
              await test('AFTER_DIFFICULTY');
              await page.locator('.opponent-time-option[data-minutes="5"]').click();
              await page.waitForFunction(()=>document.body.classList.contains('live-game'),null,{timeout:23000});
              await test('MATCH_STARTED');
              await page.locator('#board [data-square="e2"]').click();
              await page.locator('#board [data-square="e4"]').click();
              await page.waitForFunction(()=>document.querySelector('#board [data-square="e4"] img')?.src.includes('/wp.png'),null,{timeout:16000});
              await page.screenshot({path:'/tmp/real-mobile-computer-playing.png'});
              console.log('CANONICAL_MOBILE_BOARD_AND_MOVE_VERIFIED');
            }finally{await browser.close()}
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
      - name: Capture baseline and game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-mobile-board-parity
          path: /tmp/real-mobile-*.png
          if-no-files-found: ignore
