name: Apply direct board play route
on:
  push:
    paths:
      - '.github/workflows/apply-play-v9-direct-board.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build direct-board play route
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('play-v8.html').read_text(encoding='utf-8')
          js = Path('play-v8.js').read_text(encoding='utf-8')
          css = Path('play-v8.css').read_text(encoding='utf-8')

          # Fresh route and fresh asset names.
          html = html.replace('play-v8.css?v=20260903-8', 'play-v9.css?v=20260903-9')
          html = html.replace('play-v8.js?v=20260903-8', 'play-v9.js?v=20260903-9')
          html = html.replace('<section class="matchmaking-screen" id="matchmakingScreen" hidden>', '<section class="matchmaking-screen" id="matchmakingScreen" hidden style="display:none!important">')
          html = html.replace('<main class="page" id="gamePage" hidden>', '<main class="page" id="gamePage">')

          old_top = '''          <section class="player-card">
            <div class="avatar" id="topAvatar"></div>
            <div class="player-info">
              <div class="status">متصل</div>
              <a class="name player-profile-link" id="topName" aria-label="فتح ملف اللاعب">—</a>
              <div class="location">📍 <span id="topLocation">—</span></div>
              <div class="rating"><span id="topRating">—</span> <span class="trend">📈</span></div>
            </div>
            <div class="clock-box">
              <div class="clock" id="topClock">00:00</div>
              <div class="clock-progress"><span style="width:76%"></span></div>
            </div>
          </section>'''

          new_top = '''          <section class="player-card opponent-slot" id="topPlayerCard">
            <div class="opponent-search-panel" id="opponentSearchPanel">
              <div id="opponentSearchSetup">
                <div class="opponent-search-title">اختر زمن المباراة</div>
                <div class="opponent-time-options" aria-label="اختيار زمن المباراة">
                  <button class="opponent-time-option" type="button" data-minutes="3"><strong>3</strong><span>دقائق</span></button>
                  <button class="opponent-time-option" type="button" data-minutes="5"><strong>5</strong><span>دقائق</span></button>
                  <button class="opponent-time-option" type="button" data-minutes="10"><strong>10</strong><span>دقائق</span></button>
                </div>
                <p class="opponent-search-error" id="opponentSearchError"></p>
              </div>
              <div id="opponentSearchWaiting" hidden>
                <div class="opponent-waiting-line">
                  <span class="search-dots" aria-hidden="true"><i></i><i></i><i></i></span>
                  <strong>جارٍ البحث عن خصم</strong>
                </div>
                <div class="opponent-waiting-meta">
                  <span>النطاق <b id="inlineMatchmakingRange">±150</b></span>
                  <span>الانتظار <b id="inlineMatchmakingElapsed">00:00</b></span>
                </div>
                <button class="inline-cancel-search" id="cancelInlineMatchmaking" type="button">إلغاء البحث</button>
                <p class="opponent-search-error" id="opponentSearchWaitingError"></p>
              </div>
            </div>
            <div class="top-player-live" id="topPlayerLive" hidden>
              <div class="avatar" id="topAvatar"></div>
              <div class="player-info">
                <div class="status">متصل</div>
                <a class="name player-profile-link" id="topName" aria-label="فتح ملف اللاعب">—</a>
                <div class="location">📍 <span id="topLocation">—</span></div>
                <div class="rating"><span id="topRating">—</span> <span class="trend">📈</span></div>
              </div>
              <div class="clock-box">
                <div class="clock" id="topClock">00:00</div>
                <div class="clock-progress"><span style="width:76%"></span></div>
              </div>
            </div>
          </section>'''

          if old_top not in html:
              raise SystemExit('top player card block not found')
          html = html.replace(old_top, new_top, 1)

          extra_css = '''
    /* Direct-board matchmaking: search lives in the opponent slot. */
    .opponent-slot{position:relative;overflow:hidden}
    .opponent-search-panel{grid-column:1/-1;width:100%;text-align:center;align-self:center}
    .opponent-search-title{font-weight:800;font-size:16px;margin-bottom:12px;color:var(--text)}
    .opponent-time-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
    .opponent-time-option{min-height:72px;border:1px solid rgba(224,181,103,.38);border-radius:12px;background:rgba(2,28,33,.42);color:var(--text);font:700 12px inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:.14s ease}
    .opponent-time-option:hover,.opponent-time-option:focus-visible{border-color:var(--gold);background:rgba(224,181,103,.09);outline:none}
    .opponent-time-option strong{font-size:24px;line-height:1.05;color:var(--gold)}
    .opponent-time-option span{font-size:11px;color:var(--muted)}
    .opponent-waiting-line{display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px}
    .search-dots{display:inline-flex;align-items:center;gap:5px;direction:ltr;height:18px}
    .search-dots i{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.28;animation:searchDot 1.05s infinite ease-in-out}
    .search-dots i:nth-child(2){animation-delay:.16s}.search-dots i:nth-child(3){animation-delay:.32s}
    @keyframes searchDot{0%,65%,100%{opacity:.24;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
    .opponent-waiting-meta{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:11px;color:var(--muted)}
    .opponent-waiting-meta b{color:var(--gold);margin-inline-start:3px}
    .inline-cancel-search{margin-top:11px;height:32px;padding:0 14px;border:1px solid rgba(255,255,255,.20);border-radius:9px;background:transparent;color:var(--text);font:700 11px inherit;cursor:pointer}
    .opponent-search-error{min-height:16px;margin:7px 0 0;color:#ff8d8d;font-size:11px}
    .top-player-live{display:contents}
    @media(max-width:900px){.opponent-time-option{min-height:58px}.opponent-time-option strong{font-size:21px}.opponent-search-title{font-size:14px;margin-bottom:8px}}
'''
          html = html.replace('\n  </style>', extra_css + '\n  </style>', 1)

          # New inline-search references.
          js = js.replace(
              "const cancelMatchmakingBtn = $('cancelMatchmaking');",
              "const cancelMatchmakingBtn = $('cancelMatchmaking');\nconst opponentSearchPanel = $('opponentSearchPanel');\nconst opponentSearchSetup = $('opponentSearchSetup');\nconst opponentSearchWaiting = $('opponentSearchWaiting');\nconst opponentSearchError = $('opponentSearchError');\nconst opponentSearchWaitingError = $('opponentSearchWaitingError');\nconst inlineMatchmakingRange = $('inlineMatchmakingRange');\nconst inlineMatchmakingElapsed = $('inlineMatchmakingElapsed');\nconst cancelInlineMatchmakingBtn = $('cancelInlineMatchmaking');\nconst topPlayerLive = $('topPlayerLive');"
          )

          old_show = '''function showMatchmakingState(state){
  matchmakingScreen.hidden = false;
  gamePage.hidden = true;
  matchmakingSetup.hidden = state !== 'setup';
  matchmakingWaiting.hidden = state !== 'waiting';
  matchmakingFound.hidden = state !== 'found';
  leaveText.textContent = 'رجوع';
}

function showGamePage(){
  matchmakingScreen.hidden = true;
  gamePage.hidden = false;
  leaveText.textContent = 'مغادرة المباراة';
}'''
          new_show = '''function showMatchmakingState(state){
  matchmakingScreen.hidden = true;
  gamePage.hidden = false;
  matchmakingSetup.hidden = state !== 'setup';
  matchmakingWaiting.hidden = state !== 'waiting';
  matchmakingFound.hidden = true;
  opponentSearchPanel.hidden = false;
  opponentSearchSetup.hidden = state !== 'setup';
  opponentSearchWaiting.hidden = state !== 'waiting';
  topPlayerLive.hidden = true;
  leaveText.textContent = 'رجوع';
}

function showGamePage(){
  matchmakingScreen.hidden = true;
  gamePage.hidden = false;
  opponentSearchPanel.hidden = true;
  topPlayerLive.hidden = false;
  leaveText.textContent = 'مغادرة المباراة';
}'''
          if old_show not in js:
              raise SystemExit('show state block not found')
          js = js.replace(old_show, new_show, 1)

          old_profile_tail = '''  matchmakingProfile.textContent = `${profile.name} — تصنيف ${profile.rating}`;
  return profile;'''
          new_profile_tail = '''  matchmakingProfile.textContent = `${profile.name} — تصنيف ${profile.rating}`;
  bottomNameEl.textContent = profile.name || 'أنت';
  bottomRatingEl.textContent = profile.rating ?? '—';
  bottomLocationEl.textContent = [profile.city, profile.region].filter(Boolean).join(' — ') || '—';
  setPlayerProfileLink(bottomNameEl, {id: profile.id || profile.player_id || profile.user_id || null});
  return profile;'''
          if old_profile_tail not in js:
              raise SystemExit('profile tail not found')
          js = js.replace(old_profile_tail, new_profile_tail, 1)

          enter_pattern = re.compile(r"async function enterMatchedGame\(row\)\{.*?\n\}", re.S)
          enter_new = '''async function enterMatchedGame(row){
  if(!row?.game_id || !row?.seat_key || !row?.color) return;
  liveGameId = row.game_id;
  seatKey = row.seat_key;
  myColor = row.color;
  sessionStorage.setItem('shatranj_live_game_id', row.game_id);
  sessionStorage.setItem('shatranj_live_game_code', row.game_code || '');
  sessionStorage.setItem('shatranj_live_seat_key', row.seat_key);
  sessionStorage.setItem('shatranj_live_color', row.color);
  sessionStorage.removeItem('shatranj_matchmaking_active');
  sessionStorage.removeItem('shatranj_matchmaking_started_at');
  clearInterval(matchmakingTimer);
  history.replaceState(null, '', `play-v9.html?game=${encodeURIComponent(row.game_id)}`);
  showGamePage();
  await refreshLiveGame(true);
  clearInterval(gamePollTimer);
  gamePollTimer=setInterval(()=>{
    if(!document.hidden && serverState?.status!=='finished') refreshLiveGame(false);
  },1200);
}'''
          js, n = enter_pattern.subn(enter_new, js, count=1)
          if n != 1:
              raise SystemExit('enterMatchedGame not replaced')

          js = js.replace(
              "  matchmakingRange.textContent = `±${Number(row?.rating_window || 150)}`;",
              "  matchmakingRange.textContent = `±${Number(row?.rating_window || 150)}`;\n  inlineMatchmakingElapsed.textContent = formatElapsed(seconds);\n  inlineMatchmakingRange.textContent = `±${Number(row?.rating_window || 150)}`;"
          )
          js = js.replace(
              "    matchmakingWaitingError.textContent = 'تعذر متابعة البحث. سنحاول من جديد تلقائيًا.';",
              "    matchmakingWaitingError.textContent = 'تعذر متابعة البحث. سنحاول من جديد تلقائيًا.';\n    opponentSearchWaitingError.textContent = 'تعذر متابعة البحث. سنحاول من جديد تلقائيًا.';"
          )
          js = js.replace(
              "  matchmakingError.textContent = '';\n  matchmakingWaitingError.textContent = '';",
              "  matchmakingError.textContent = '';\n  matchmakingWaitingError.textContent = '';\n  opponentSearchError.textContent = '';\n  opponentSearchWaitingError.textContent = '';"
          )
          old_error = '''    matchmakingError.textContent = String(err?.message || '').includes('active game exists')
      ? 'لديك مباراة نشطة بالفعل.'
      : 'تعذر بدء البحث عن خصم. حاول مرة أخرى.';'''
          new_error = '''    const message = String(err?.message || '').includes('active game exists')
      ? 'لديك مباراة نشطة بالفعل.'
      : 'تعذر بدء البحث عن خصم. حاول مرة أخرى.';
    matchmakingError.textContent = message;
    opponentSearchError.textContent = message;'''
          if old_error not in js:
              raise SystemExit('matchmaking error block not found')
          js = js.replace(old_error, new_error, 1)
          js = js.replace(
              "  matchmakingWaitingError.textContent = '';\n}",
              "  matchmakingWaitingError.textContent = '';\n  opponentSearchWaitingError.textContent = '';\n}",
              1
          )

          js = js.replace(
              "cancelMatchmakingBtn.addEventListener('click',cancelMatchmaking);",
              "cancelMatchmakingBtn.addEventListener('click',cancelMatchmaking);\ncancelInlineMatchmakingBtn.addEventListener('click',cancelMatchmaking);"
          )
          js = js.replace(
              "  if(!matchmakingWaiting.hidden && matchmakingStartedAt){\n    matchmakingElapsed.textContent=formatElapsed((Date.now()-matchmakingStartedAt)/1000);\n  }",
              "  if(!opponentSearchWaiting.hidden && matchmakingStartedAt){\n    const elapsed=formatElapsed((Date.now()-matchmakingStartedAt)/1000);\n    matchmakingElapsed.textContent=elapsed;\n    inlineMatchmakingElapsed.textContent=elapsed;\n  }"
          )

          old_init_setup = '''  showMatchmakingState('setup');
  await loadMyProfile();

  if(sessionStorage.getItem('shatranj_matchmaking_active')==='1'){'''
          new_init_setup = '''  showMatchmakingState('setup');
  await loadMyProfile();
  game = new Chess();
  flipped = false;
  orientationInitialized = true;
  renderCoords();
  renderBoard();
  topClockEl.textContent = '--:--';
  bottomClockEl.textContent = '--:--';

  if(sessionStorage.getItem('shatranj_matchmaking_active')==='1'){'''
          if old_init_setup not in js:
              raise SystemExit('init setup block not found')
          js = js.replace(old_init_setup, new_init_setup, 1)

          # Keep the fresh route stable on recovery/redirects.
          js = js.replace('play-v8.html', 'play-v9.html')

          Path('play-v9.html').write_text(html, encoding='utf-8')
          Path('play-v9.js').write_text(js, encoding='utf-8')
          Path('play-v9.css').write_text(css, encoding='utf-8')

          # All active entry points now open the board directly.
          for name in ['index.html','profile.html','profile.js','profile-section.js','site-notifications.js']:
              p = Path(name)
              text = p.read_text(encoding='utf-8').replace('play-v8.html', 'play-v9.html')
              p.write_text(text, encoding='utf-8')

          # Treat v9 play assets as network-only too.
          swp = Path('sw.js')
          sw = swp.read_text(encoding='utf-8')
          sw = sw.replace('/play-v8.html","/play-live.js', '/play-v8.html","/play-v9.html","/play-live.js')
          sw = sw.replace('/play-v8.js","/realistic-pieces.css', '/play-v8.js","/play-v9.js","/realistic-pieces.css')
          sw = sw.replace('/play-v8.css","/assets/pieces/', '/play-v8.css","/play-v9.css","/assets/pieces/')
          swp.write_text(sw, encoding='utf-8')

          # Regression test for the exact behavior requested.
          test = r'''from pathlib import Path
h=Path('play-v9.html').read_text(encoding='utf-8')
j=Path('play-v9.js').read_text(encoding='utf-8')
assert '<main class="page" id="gamePage">' in h
assert 'id="opponentSearchPanel"' in h
assert 'id="opponentSearchSetup"' in h
assert 'id="opponentSearchWaiting"' in h
assert 'search-dots' in h
assert h.count('data-minutes="3"') >= 2
assert 'play-v9.css?v=20260903-9' in h
assert 'play-v9.js?v=20260903-9' in h
assert 'game = new Chess();' in j
assert "showMatchmakingState('setup');" in j
enter=j.split('async function enterMatchedGame(row){',1)[1].split('\n}',1)[0]
assert 'location.href' not in enter
assert 'history.replaceState' in enter
assert 'showGamePage();' in enter
assert 'topPlayerLive.hidden = true' in j
assert 'opponentSearchPanel.hidden = true' in j
assert "cancelInlineMatchmakingBtn.addEventListener('click',cancelMatchmaking);" in j
for name in ['index.html','profile.html','profile.js','profile-section.js','site-notifications.js']:
    assert 'play-v9.html' in Path(name).read_text(encoding='utf-8'), name
print('direct board play route: PASS')
'''
          Path('tests/test_play_v9_direct_board.py').write_text(test, encoding='utf-8')
          PY

          python tests/test_play_v9_direct_board.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add play-v9.html play-v9.js play-v9.css index.html profile.html profile.js profile-section.js site-notifications.js sw.js tests/test_play_v9_direct_board.py
          git commit -m "Open chessboard directly and search in opponent slot"
          git push
