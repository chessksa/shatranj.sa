name: Apply Arab cities integration

on:
  push:
    branches: [main]
    paths:
      - 'ci/apply_arab_cities.py'
      - '.github/workflows/apply-arab-cities.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python ci/apply_arab_cities.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: connect Arab cities to country fields"
          git push
