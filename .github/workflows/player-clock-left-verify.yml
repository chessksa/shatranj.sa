name: Player clock left verify

on:
  push:
    branches:
      - fix/player-clock-left-desktop-20260914
  pull_request:
    branches: [main]
    paths:
      - 'play-desktop-fit-v20.css'
      - 'tests/test_desktop_player_clock_left.py'
      - '.github/workflows/player-clock-left-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_desktop_player_clock_left.py -q
