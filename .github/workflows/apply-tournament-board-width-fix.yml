name: Apply tournament board width fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-tournament-board-width-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply board width fix
        run: python tools/apply_tournament_board_width_fix.py
      - name: Verify board width and related tournament regressions
        run: |
          python tests/test_tournament_board_width_stable.py
          python tests/test_tournament_player_banner.py
          python tests/test_tournament_game_demo.py
          python tests/test_tournament_game_badge.py
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exact-board-v13.css play-v10.html
          git commit -m 'fix: keep tournament board at normal width'
          git push origin HEAD:main
