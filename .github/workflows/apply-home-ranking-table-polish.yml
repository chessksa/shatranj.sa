name: Apply home ranking table polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-home-ranking-table-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved CSS polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('home-theme.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Ranking table + actions final polish 20260904 */'
          block = r'''

/* Ranking table + actions final polish 20260904 */
#rankingTitle{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:17px!important;
  line-height:1.2!important;
}
#ranking .head{
  min-height:64px!important;
  padding:8px 10px!important;
  display:flex!important;
  align-items:center!important;
  justify-content:space-between!important;
  gap:10px!important;
}
#ranking .head>div:first-child{
  flex:1 1 auto;
  min-width:0;
  width:auto!important;
  text-align:center!important;
}
#ranking .ranking-filters{
  width:auto!important;
  max-width:280px!important;
  flex:0 0 280px;
  display:grid!important;
  grid-template-columns:1fr 1fr!important;
  gap:6px!important;
}
#ranking .ranking-filters select{
  height:32px!important;
  min-width:0;
  padding:0 7px!important;
  border-radius:9px!important;
  font-size:10px!important;
  text-align:center;
  text-align-last:center;
}
#ranking th,#ranking td{
  text-align:center!important;
}
#ranking th:not(:last-child),#ranking td:not(:last-child){
  border-left:1px solid rgba(216,182,101,.18)!important;
}
#ranking .player-name{
  text-align:center!important;
}
#ranking th:nth-child(1),#ranking td:nth-child(1),
#ranking th:nth-child(2),#ranking td:nth-child(2),
#ranking th:nth-child(3),#ranking td:nth-child(3),
#ranking th:nth-child(4),#ranking td:nth-child(4){
  text-align:center!important;
}

.home-hero .home-board-actions{
  grid-template-columns:repeat(2,minmax(0,1fr))!important;
  gap:12px!important;
  align-items:stretch!important;
}
.home-hero .home-board-actions>.btn,
.home-hero .home-board-actions>.home-invite-wrap>.btn{
  height:56px!important;
  min-height:56px!important;
  padding:0 18px!important;
  border-radius:15px!important;
  font-size:17px!important;
  gap:8px!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
}
.hero-action-icon{
  width:26px;
  height:26px;
  flex:0 0 26px;
  border-radius:8px;
  font-size:15px;
}

@media(max-width:900px){
  #ranking .head{
    display:grid!important;
    grid-template-columns:1fr!important;
    gap:7px!important;
  }
  #ranking .ranking-filters{
    width:100%!important;
    max-width:280px!important;
    margin-inline:auto;
    flex:none;
  }
}
'''
          if marker not in css:
              css = css.rstrip() + block + '\n'
              css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          html = re.sub(r'home-theme\.css\?v=\d+', 'home-theme.css?v=2026090424', html, count=1)
          index_path.write_text(html, encoding='utf-8')
          PY
      - name: Run focused test
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_home_ranking_table_polish.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-theme.css index.html
          git commit -m "style: polish ranking table and home actions"
          git push origin main
