name: Apply tournament modern layout everywhere
on:
  push:
    paths:
      - 'tools/apply_tournament_modern_layout_everywhere.py'
      - '.github/workflows/apply-tournament-modern-layout-everywhere.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply modern tournament layout to players and spectators
        run: python tools/apply_tournament_modern_layout_everywhere.py
      - name: Verify tournament layout regressions
        run: |
          python tests/test_tournament_modern_layout_everywhere.py
          python tests/test_tournament_game_badge.py
          python tests/test_tournament_spectator_link.py
          python tests/test_last_move_highlight.py
          python tests/test_play_v10_cm_preview.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play-v10.html play-v8.js tournaments.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: use modern tournament layout for all viewers"
          git push
