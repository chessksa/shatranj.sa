name: Test realistic play board

on:
  push:
    branches:
      - feature/realistic-chessboard
  pull_request:
    paths:
      - play.html
      - play-live.js
      - realistic-pieces.css
      - .github/workflows/test-realistic-play-board.yml

jobs:
  verify-realistic-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify realistic board integration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'realistic-pieces.css?v=20260903-1' play.html
          grep -Fq 'piece ${cls} piece-${type}' play-live.js
          grep -Fq -- '--real-board-dark:#0b4850' realistic-pieces.css
          grep -Fq -- '--real-board-light:#d6cfbf' realistic-pieces.css
          grep -Fq 'data:image/png;base64,' realistic-pieces.css
          grep -Fq '.piece-k::before' realistic-pieces.css
          grep -Fq '.piece-q::before' realistic-pieces.css
          grep -Fq '.piece-b::before' realistic-pieces.css
          grep -Fq '.piece-n::before' realistic-pieces.css
          grep -Fq '.piece-r::before' realistic-pieces.css
          grep -Fq '.piece-p::before' realistic-pieces.css
          grep -Fq '.piece.white::before' realistic-pieces.css
          grep -Fq '.piece.black::before' realistic-pieces.css
