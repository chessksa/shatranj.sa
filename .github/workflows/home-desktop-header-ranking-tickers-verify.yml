name: Home desktop header ranking tickers verify

on:
  push:
    branches:
      - home-desktop-header-ranking-tickers
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_home_desktop_header_ranking_tickers.py -q
