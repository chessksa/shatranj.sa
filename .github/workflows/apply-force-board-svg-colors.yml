name: Apply forced board SVG colors

on:
  push:
    branches:
      - 'fix/force-board-svg-colors'
    paths:
      - '.github/workflows/apply-force-board-svg-colors.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/force-board-svg-colors
      - name: Force approved colors directly on SVG squares
        run: |
          python - <<'PY'
          from pathlib import Path

          helper = '''
function forceBoardSquareColors(){
  boardEl.querySelectorAll('.cm-chessboard .square.white').forEach((square)=>{
    square.style.setProperty('fill','#d6cfbf','important');
  });
  boardEl.querySelectorAll('.cm-chessboard .square.black').forEach((square)=>{
    square.style.setProperty('fill','#0b4850','important');
  });
}

function watchBoardSquareColors(){
  if(boardEl._shatranjColorObserver) return;
  const observer=new MutationObserver(()=>forceBoardSquareColors());
  observer.observe(boardEl,{childList:true,subtree:true});
  boardEl._shatranjColorObserver=observer;
}
'''.strip()

          for filename, anchor, board_created, render_anchor in [
              ('play-v8.js', 'function ensureBoard(){', "  cmBoard.enableMoveInput(handleBoardInput,myColor==='b' ? COLOR.black : COLOR.white);", "  board.setPosition(game.fen(),false);"),
              ('play-v10-match.js', 'function ensurePreviewBoard(){', '  return previewBoard;', '  if(board.getOrientation() !== orientation) board.setOrientation(orientation, false);'),
          ]:
              p=Path(filename)
              text=p.read_text(encoding='utf-8')
              if 'function forceBoardSquareColors' not in text:
                  text=text.replace(anchor, helper + '\n\n' + anchor, 1)
              if filename == 'play-v8.js':
                  replacement = board_created + "\n  forceBoardSquareColors();\n  watchBoardSquareColors();"
                  text=text.replace(board_created, replacement, 1)
                  text=text.replace(render_anchor, render_anchor + "\n  forceBoardSquareColors();", 1)
              else:
                  create_anchor = "  previewBoard = new Chessboard(boardEl, {"
                  # Apply immediately after the constructor block, before return.
                  text=text.replace('  });\n  return previewBoard;', '  });\n  forceBoardSquareColors();\n  watchBoardSquareColors();\n  return previewBoard;', 1)
                  text=text.replace(render_anchor, render_anchor + "\n  forceBoardSquareColors();", 1)
              p.write_text(text, encoding='utf-8')

          p=Path('play-v10.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('play-v8.js?v=20260903-11','play-v8.js?v=20260903-13')
          text=text.replace('play-v10-match.js?v=20260903-12','play-v10-match.js?v=20260903-14')
          p.write_text(text, encoding='utf-8')

          p=Path('play-v8.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('play-v8.js?v=20260903-9','play-v8.js?v=20260903-10')
          p.write_text(text, encoding='utf-8')

          p=Path('tests/test_play_v10_cm_preview.py')
          text=p.read_text(encoding='utf-8')
          text=text.replace('play-v10-match.js?v=20260903-12','play-v10-match.js?v=20260903-14')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify board regression tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_approved_piece_sprite.py tests/test_play_v10_cm_preview.py tests/test_cm_chessboard_integration.py
          node --check play-v8.js
          node --check play-v10-match.js
      - name: Commit forced SVG colors
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-v8.js play-v10-match.js play-v10.html play-v8.html tests/test_play_v10_cm_preview.py
          git commit -m 'fix: force approved board colors on SVG squares'
          git push origin HEAD:fix/force-board-svg-colors
