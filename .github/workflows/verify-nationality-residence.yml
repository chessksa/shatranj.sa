name: Verify nationality residence signup

on:
  push:
    branches:
      - main
    paths:
      - 'index-app.html'
      - 'world-locations.js'
      - 'supabase/migrations/20260911020000_nationality_residence.sql'
      - 'supabase/migrations/20260911031000_open_global_signup_ranking.sql'
      - 'supabase/migrations/20260911032000_exclude_il_country.sql'
      - 'tests/test_nationality_residence_signup.py'
      - '.github/workflows/verify-nationality-residence.yml'
  pull_request:
    paths:
      - 'index-app.html'
      - 'world-locations.js'
      - 'supabase/migrations/20260911020000_nationality_residence.sql'
      - 'supabase/migrations/20260911031000_open_global_signup_ranking.sql'
      - 'supabase/migrations/20260911032000_exclude_il_country.sql'
      - 'tests/test_nationality_residence_signup.py'
      - '.github/workflows/verify-nationality-residence.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify worldwide signup, ranking, and exclusions
        run: python tests/test_nationality_residence_signup.py
