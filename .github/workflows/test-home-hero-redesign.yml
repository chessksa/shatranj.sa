name: Test approved home hero redesign

on:
  push:
    branches:
      - main
      - feature/home-hero-redesign-20260904-work
    paths:
      - 'index.html'
      - 'home-theme.css'
      - 'tests/test_home_hero_design.py'
      - '.github/workflows/test-home-hero-redesign.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run approved homepage design tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_home_hero_design.py
