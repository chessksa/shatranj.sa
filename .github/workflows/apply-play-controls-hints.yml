name: Apply play controls and move hints

on:
  push:
    paths:
      - '.github/workflows/apply-play-controls-hints.yml'
      - 'ci/apply_play_controls_hints.py'
      - 'ci/fix_play_grace_nonblocking.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved play controls and hints
        run: |
          python ci/apply_play_controls_hints.py
          python ci/fix_play_grace_nonblocking.py
      - name: Test approved play layout and hints
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('play-v10.html').read_text(encoding='utf-8')
          js = Path('play-v8.js').read_text(encoding='utf-8')
          assert 'id="moveHints"' in html
          assert html.index('<section class="actions-card">') < html.index('<aside class="side-panel">')
          assert '/* Approved compact game actions below the board */' in html
          assert '.move-hint.capture::after' in html
          assert 'showMoveHints(event.squareFrom)' in js
          assert 'clearMoveHints();\n\n    const move=game.move' in js
          assert 'await loadGraceEndWindow();' not in js
          assert 'loadGraceEndWindow();' in js
          print('approved play layout and hints verified')
          PY
      - name: Commit approved play changes
        run: |
          if git diff --quiet -- play-v10.html play-v8.js; then
            echo "No play changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play-v10.html play-v8.js
          git commit -m "feat: move game actions below board and show legal move hints"
          git push
