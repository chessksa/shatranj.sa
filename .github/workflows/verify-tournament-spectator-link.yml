name: Verify tournament spectator link

on:
  push:
    branches:
      - main
    paths:
      - 'tournaments.html'
      - 'tests/test_tournament_spectator_link.py'
      - '.github/workflows/verify-tournament-spectator-link.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tournament spectator link
        run: python tests/test_tournament_spectator_link.py
