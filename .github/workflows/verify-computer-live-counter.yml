name: Verify live computer match counter
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'site-presence.js'
      - 'site-presence-base.js'
      - 'play-computer.js'
      - 'play-v10.html'
      - 'v2/home/inline-computer.mjs'
      - '.github/workflows/verify-computer-live-counter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-counter:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install --no-audit --no-fund --prefix /tmp/chess-presence playwright-core@1.56.1
          command -v google-chrome
      - name: Verify guest chess match increments and decrements live counter
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/computer-count-http.log 2>&1 &
          export CHROME_PATH="$(command -v google-chrome)"
          node <<'JS'
          const {chromium}=require('/tmp/chess-presence/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const viewer=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const player=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const home=await viewer.newPage();
              const game=await player.newPage();
              const issues=[];
              home.on('pageerror',e=>issues.push('HOME: '+e.message));
              game.on('pageerror',e=>issues.push('GAME: '+e.message));
              await home.goto('http://127.0.0.1:8765/index.html?test='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await home.waitForFunction(()=>typeof window.SHATRANJ_GUEST_COMPUTER_COUNT==='number',null,{timeout:45000});
              const before=await home.evaluate(()=>({
                guest:window.SHATRANJ_GUEST_COMPUTER_COUNT,
                displayed:document.getElementById('headerMatchesCount')?.textContent
              }));
              console.log('COUNTER_BEFORE',JSON.stringify(before));
              await game.goto('http://127.0.0.1:8765/play-entry-v16.html?computer=1',{waitUntil:'domcontentloaded',timeout:60000});
              await game.locator('.opponent-time-option[data-level="easy"]').click();
              await game.locator('.opponent-time-option[data-minutes="5"]').click();
              await game.waitForFunction(()=>document.body.classList.contains('live-game'),null,{timeout:35000});
              await game.waitForFunction(()=>window.SHATRANJ_GUEST_COMPUTER_ACTIVE===true,null,{timeout:20000});
              await home.waitForFunction(original=>window.SHATRANJ_GUEST_COMPUTER_COUNT>original,before.guest,{timeout:45000});
              const during=await home.evaluate(()=>({
                guest:window.SHATRANJ_GUEST_COMPUTER_COUNT,
                displayed:document.getElementById('headerMatchesCount')?.textContent,
                persistent:typeof persistedLiveMatchesCount!=='undefined'?persistedLiveMatchesCount:null
              }));
              console.log('COUNTER_DURING',JSON.stringify(during));
              if(Number(during.displayed)<during.guest)throw Error('Visible counter omits guest games');
              game.once('dialog',d=>d.accept());
              await game.locator('#resignBtn').click();
              await game.waitForFunction(()=>window.SHATRANJ_GUEST_COMPUTER_ACTIVE===false,null,{timeout:15000});
              await home.waitForFunction(initial=>window.SHATRANJ_GUEST_COMPUTER_COUNT<=initial,before.guest,{timeout:45000});
              const after=await home.evaluate(()=>({
                guest:window.SHATRANJ_GUEST_COMPUTER_COUNT,
                displayed:document.getElementById('headerMatchesCount')?.textContent
              }));
              console.log('COUNTER_AFTER',JSON.stringify(after));
              console.log('NON_FATAL_PAGE_ERRORS',JSON.stringify(issues.slice(0,8)));
              console.log('COMPUTER_LIVE_COUNTER_PASS');
            }finally{await browser.close()}
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
