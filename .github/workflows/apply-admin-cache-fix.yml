name: Apply admin cache fix

on:
  push:
    branches:
      - fix/admin-cache-refresh

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-cache-refresh
      - name: Patch admin cache behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          admin = Path('admin.html')
          text = admin.read_text(encoding='utf-8')
          old = '<script type="module" src="admin.js"></script>'
          new = '<script type="module" src="admin.js?v=20260906-cache1"></script>'
          if old in text:
              admin.write_text(text.replace(old, new, 1), encoding='utf-8')

          sw = Path('sw.js')
          text = sw.read_text(encoding='utf-8')
          text = text.replace('const CACHE="shatranj-arab-v3";', 'const CACHE="shatranj-arab-v4";', 1)
          play = 'const PLAY_PATHS=["/play.html","/play-v8.html","/play-live.js","/play-v8.js","/realistic-pieces.css","/play-v8.css","/play-v10.html","/play-v10-match.js","/assets/pieces/"];'
          admin_paths = play + '\nconst ADMIN_PATHS=["/admin.html","/admin.js"];'
          if 'const ADMIN_PATHS=' not in text:
              text = text.replace(play, admin_paths, 1)
          marker = '  const isPlayAsset=PLAY_PATHS.some(path=>url.pathname.endsWith(path)||url.pathname.includes(path));'
          block = '''  const isAdminAsset=ADMIN_PATHS.some(path=>url.pathname.endsWith(path));
          if(isAdminAsset){
            e.respondWith(fetch(new Request(e.request,{cache:"no-store"})).catch(()=>caches.match(e.request)));
            return;
          }

          ''' + marker
          if 'const isAdminAsset=' not in text:
              text = text.replace(marker, block, 1)
          sw.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html sw.js
          git commit -m "fix: refresh admin panel cache"
          git push origin HEAD:fix/admin-cache-refresh
