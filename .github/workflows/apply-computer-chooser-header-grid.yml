name: Apply computer chooser header grid
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-computer-chooser-header-grid.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply non-overlapping chooser header
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          js = Path('play-computer.js')
          text = js.read_text(encoding='utf-8')
          start = text.index('function addTimeChooserBack() {')
          end = text.index('function setupTimeChooser', start)
          block = base64.b64decode('').decode('utf-8')
          text = text[:start] + block + text[end:]

          time_start = text.index('function setupTimeChooser')
          level_start = text.index('function setupLevelChooser', time_start)
          time = text[time_start:level_start]
          pattern = r"  const title = opponentSearchSetup\?\.querySelector\('\.opponent-search-title'\);\n(  applyChooserTitle\(title, [^\n]+\);\n  addTimeChooserBack\(\);)"
          m = re.search(pattern, time)
          if not m:
              raise SystemExit('time chooser title block not found')
          time = time[:m.start()] + "  const { title } = ensureChooserHeader();\n" + m.group(1) + time[m.end():]
          text = text[:time_start] + time + text[level_start:]

          level_start = text.index('function setupLevelChooser')
          level_end = text.index("resignBtn?.addEventListener", level_start)
          level = text[level_start:level_end]
          pattern = r"  const title = opponentSearchSetup\?\.querySelector\('\.opponent-search-title'\);\n(  applyChooserTitle\(title, [^\n]+\);)"
          m = re.search(pattern, level)
          if not m:
              raise SystemExit('level chooser title block not found')
          replacement = "  const { header, title } = ensureChooserHeader();\n  header.style.gridTemplateColumns = 'minmax(0, 1fr)';\n" + m.group(1)
          level = level[:m.start()] + replacement + level[m.end():]
          text = text[:level_start] + level + text[level_end:]
          js.write_text(text, encoding='utf-8')

          play = Path('play-v10.html')
          html = play.read_text(encoding='utf-8')
          html = re.sub(r"play-computer\.js\?v=\d{8}-\d+", 'play-computer.js?v=20260906-13', html, count=1)
          play.write_text(html, encoding='utf-8')

          test = Path('tests/test_computer_play_mode.py')
          s = test.read_text(encoding='utf-8')
          s = s.replace("assert 'position:absolute' in back_block, 'back icon must not participate in layout flow'\nassert 'inset-inline-start:12px' in back_block and 'inset-inline-end:auto' in back_block and 'top:' in back_block, 'back control must stay on the opposite side beside the title'", "assert 'position:absolute' not in back_block, 'back control must not overlap the title'\nassert \"header.style.gridTemplateColumns = 'auto minmax(0, 1fr)'\" in back_block and \"header.insertBefore(back, title)\" in back_block, 'back control must occupy a dedicated left column beside the title'")
          s = s.replace("font-size', 'clamp(12px, 3vw, 18px)'", "font-size', 'clamp(11px, 2.5vw, 17px)'")
          s = s.replace("assert \"overflow', 'visible'\" in title_block, 'chooser title text must not be clipped'", "assert \"overflow', 'hidden'\" in title_block, 'single-line chooser title must stay inside its own column'")
          test.write_text(s, encoding='utf-8')
          PY
      - name: Verify chooser header
        run: |
          python tests/test_computer_chooser_style.py
          python tests/test_computer_play_mode.py
          cp play-computer.js /tmp/play-computer.mjs
          node --check /tmp/play-computer.mjs
      - name: Commit chooser header
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-computer.js play-v10.html tests/test_computer_play_mode.py
          git commit -m 'fix: separate computer chooser title and back control'
          git push
