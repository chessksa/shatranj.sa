name: Verify stale computer reply regression RED

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-computer-stale-reply-red.yml'

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm stale-reply regression test fails before fix
        shell: bash
        run: |
          set +e
          python tests/test_computer_stale_reply_status.py > /tmp/red.log 2>&1
          status=$?
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected regression test to fail before the fix.'
            exit 1
          fi
          grep -q 'activeRatedMoveId' /tmp/red.log || grep -q 'stale' /tmp/red.log
