name: Apply ranking filter labels

on:
  push:
    branches:
      - fix/ranking-filter-labels-v3
    paths:
      - 'ci/apply_ranking_filter_labels.py'
      - '.github/workflows/apply-ranking-filter-labels.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python ci/apply_ranking_filter_labels.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home-theme.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: simplify ranking filter labels"
          git push
