name: Apply exact interactive board v14
on:
  push:
    branches:
      - exact-interactive-board-v14-tests
    paths:
      - 'tools/build_exact_board_v14.py'
      - '.github/workflows/apply-exact-interactive-board-v14.yml'
jobs:
  build-board:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exact-interactive-board-v14-tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow opencv-python-headless
      - run: python tools/build_exact_board_v14.py
      - name: Commit generated exact board assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play-v10.html exact-board-v14.css exact-board-v14.js assets/exact-board-v14
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Build exact interactive board v14 from approved image"
          git push origin HEAD:exact-interactive-board-v14-tests
