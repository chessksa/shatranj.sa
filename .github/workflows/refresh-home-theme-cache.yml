name: Refresh home theme cache

on:
  push:
    paths:
      - '.github/workflows/refresh-home-theme-cache.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump homepage theme cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'home-theme.css?v=20260906-22'
          new = 'home-theme.css?v=2026090701'
          if old not in text and new not in text:
              raise SystemExit('home-theme link not found')
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          assert new in p.read_text(encoding='utf-8')
          PY
      - name: Commit cache refresh
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: refresh mobile live stat spacing cache'
          git push
