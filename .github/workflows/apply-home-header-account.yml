name: Apply compact right header controls
on:
  push:
    paths:
      - '.github/workflows/apply-home-header-account.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact homepage header controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          decode = lambda value: base64.b64decode(value).decode('utf-8')
          new_header = decode('')
          header_css = decode('')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html, count = re.subn(r'<header>.*?</header>', new_header, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('homepage header not found')
          if 'home-theme.css?v=20260903-8' not in html:
              raise SystemExit('current home theme version marker not found')
          html = html.replace('home-theme.css?v=20260903-8', 'home-theme.css?v=20260903-9', 1)
          index.write_text(html, encoding='utf-8')

          css_path = Path('home-theme.css')
          current_css = css_path.read_text(encoding='utf-8')
          marker = '/* Unified right header controls 20260903 */'
          if marker not in current_css:
              current_css += header_css
          css_path.write_text(current_css, encoding='utf-8')
          PY

          python tests/test_home_header_account.py
          python tests/test_home_member_layout.py
          python tests/test_home_member_polish.py
          python tests/test_global_arial_font.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html home-theme.css
          git commit -m "Compact homepage header controls on the right"
          git push
