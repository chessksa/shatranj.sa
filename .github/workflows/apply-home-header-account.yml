name: Apply home header account layout
on:
  push:
    paths:
      - '.github/workflows/apply-home-header-account.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reformat header and move logout
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          decode = lambda value: base64.b64decode(value).decode('utf-8')
          old_header = decode('')
          new_header = decode('')
          render_replacement = decode('')
          header_css = decode('')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          if old_header not in html:
              raise SystemExit('current header block not found')
          html = html.replace(old_header, new_header, 1)

          actions_pattern = re.compile(r'\n\s*<div class="account-actions">\s*<a class="btn light" href="profile\.html">👤 لوحة التحكم</a>\s*<button id="logoutBtn" class="btn light" type="button">تسجيل الخروج</button>\s*</div>', re.S)
          html, count = actions_pattern.subn('', html, count=1)
          if count != 1:
              raise SystemExit('member account actions block not found')

          render_pattern = re.compile(r'function renderAccount\(\)\{.*?\n\}\n\nasync function refreshAuthUI', re.S)
          html, count = render_pattern.subn(render_replacement, html, count=1)
          if count != 1:
              raise SystemExit('renderAccount function not found')

          old_logout = "$('#logoutBtn').addEventListener('click',async()=>{"
          if old_logout not in html:
              raise SystemExit('logout handler not found')
          html = html.replace(old_logout, "$('#navLogout').addEventListener('click',async()=>{", 1)

          old_theme = 'home-theme.css?v=20260903-6'
          if old_theme not in html:
              raise SystemExit('homepage theme version marker not found')
          html = html.replace(old_theme, 'home-theme.css?v=20260903-7', 1)
          index.write_text(html, encoding='utf-8')

          css_path = Path('home-theme.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Balanced homepage header 20260903 */'
          if marker not in css:
              css += header_css
          css_path.write_text(css, encoding='utf-8')
          PY

          python tests/test_home_header_account.py
          python tests/test_home_member_layout.py
          python tests/test_home_member_polish.py
          python tests/test_global_arial_font.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html home-theme.css
          git commit -m "Reformat homepage header and move logout"
          git push
