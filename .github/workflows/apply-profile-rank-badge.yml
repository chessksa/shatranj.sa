name: Apply profile rank badge
on:
  push:
    branches:
      - feature/profile-rank-badge
    paths:
      - 'tools/apply_profile_rank_badge.py'
      - '.github/workflows/apply-profile-rank-badge.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/profile-rank-badge
      - name: Apply rank badge change
        run: python tools/apply_profile_rank_badge.py
      - name: Verify focused tests
        run: |
          python tests/test_profile_rank_badge.py
          python tests/test_profile_unified_icon_row.py
          node --check profile.js
      - name: Commit implementation
        run: |
          if git diff --quiet -- profile.html profile.js; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git config user.name "chessksa"
          git config user.email "gmel1199@gmail.com"
          git add profile.html profile.js
          git commit -m "feat: replace achievements panel with gold rank badge"
          git push origin HEAD:feature/profile-rank-badge
