name: Verify full Python test suite (temporary)

on:
  push:
    paths:
      - '.github/workflows/verify-full-suite-temp.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run complete pytest suite
        run: python -m pytest -q
