name: Apply play-v10 cm cache bump

on:
  push:
    branches:
      - 'fix/prematch-cm-chessboard'
    paths:
      - '.github/workflows/apply-play-v10-cm-cache.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prematch-cm-chessboard
      - name: Bump play-v10 board asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('play-v10.html')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'exact-board-v13.css?v=20260903-13': 'exact-board-v13.css?v=20260903-14',
              'exact-board-v13.js?v=20260903-13': 'exact-board-v13.js?v=20260903-14',
              'play-v10-match.js?v=20260903-10': 'play-v10-match.js?v=20260903-11',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected string: {old}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify replacements
        run: python -m pytest -q tests/test_play_v10_cm_preview.py
      - name: Commit cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-v10.html
          git commit -m 'fix: bust cached play-v10 board assets'
          git push origin HEAD:fix/prematch-cm-chessboard
