name: Apply realistic play board

on:
  push:
    branches:
      - feature/realistic-chessboard
    paths:
      - '.tmp-realistic-sprite/**'
      - '.github/workflows/apply-realistic-play-board.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/realistic-chessboard
      - name: Build and apply realistic board
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          parts_dir = Path('.tmp-realistic-sprite')
          parts = [parts_dir / f'part{i:02d}.txt' for i in range(4)]
          missing = [str(p) for p in parts if not p.exists()]
          if missing:
              print('Waiting for sprite chunks:', ', '.join(missing))
              raise SystemExit(0)

          payload = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          sprite = base64.b64decode(payload, validate=True)
          assets = Path('assets')
          assets.mkdir(exist_ok=True)
          (assets / 'realistic-pieces.png').write_bytes(sprite)

          css = r'''/* Realistic chess pieces extracted from the approved reference image. */
          :root{
            --real-board-dark:#0b4850;
            --real-board-light:#d6cfbf;
            --real-board-edge:#063a40;
            --real-board-gold:#e0b567;
          }
          .board-frame{
            padding:10px 10px 18px !important;
            border-radius:14px !important;
            background:linear-gradient(145deg,#07363d,#022f33) !important;
            border:1px solid rgba(224,181,103,.72) !important;
            box-shadow:0 14px 34px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.05) !important;
          }
          .board-shell{
            border-radius:2px !important;
            background:var(--real-board-edge) !important;
            box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.04) !important;
          }
          .square{
            border-right:1px solid rgba(2,47,51,.34) !important;
            border-bottom:1px solid rgba(2,47,51,.34) !important;
          }
          .square.light{background:var(--real-board-light) !important;}
          .square.dark{background:var(--real-board-dark) !important;}
          .piece{
            position:relative !important;
            width:94% !important;
            height:94% !important;
            display:block !important;
            isolation:isolate;
            filter:drop-shadow(0 4px 3px rgba(0,0,0,.28)) !important;
          }
          .piece > svg{opacity:0 !important;pointer-events:none !important;}
          .piece::before{
            content:"";
            position:absolute;
            inset:-3%;
            z-index:2;
            background-image:url("assets/realistic-pieces.png");
            background-repeat:no-repeat;
            background-size:600% 200%;
            pointer-events:none;
          }
          .piece.white::before{background-position-y:0%;}
          .piece.black::before{background-position-y:100%;}
          .piece-k::before{background-position-x:0%;}
          .piece-q::before{background-position-x:20%;}
          .piece-b::before{background-position-x:40%;}
          .piece-n::before{background-position-x:60%;}
          .piece-r::before{background-position-x:80%;}
          .piece-p::before{background-position-x:100%;}
          @media (max-width:900px){
            .board-frame{padding:7px 7px 15px !important;border-radius:11px !important;}
            .piece{width:96% !important;height:96% !important;}
            .piece::before{inset:-4%;}
          }
          '''
          Path('realistic-pieces.css').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in css.splitlines()) + '\n', encoding='utf-8')

          js_path = Path('play-live.js')
          js = js_path.read_text(encoding='utf-8')
          old = 'const base = (inner) => `<div class="piece ${cls}"><svg viewBox="0 0 100 100" aria-hidden="true">${inner}</svg></div>`;'
          new = 'const base = (inner) => `<div class="piece ${cls} piece-${type}"><svg viewBox="0 0 100 100" aria-hidden="true">${inner}</svg></div>`;'
          if old not in js:
              raise SystemExit('piece base template not found')
          js_path.write_text(js.replace(old, new, 1), encoding='utf-8')

          html_path = Path('play.html')
          html = html_path.read_text(encoding='utf-8')
          marker = '  </style>\n</head>'
          link = '  </style>\n  <link rel="stylesheet" href="realistic-pieces.css?v=20260903-1" />\n</head>'
          if 'realistic-pieces.css?v=20260903-1' not in html:
              if marker not in html:
                  raise SystemExit('head style marker not found')
              html = html.replace(marker, link, 1)
          html = html.replace('play-live.js?v=20260903-3', 'play-live.js?v=20260903-4')
          html_path.write_text(html, encoding='utf-8')
          PY

          if [ ! -f assets/realistic-pieces.png ]; then
            exit 0
          fi

          rm -rf .tmp-realistic-sprite
          rm -f .github/workflows/apply-realistic-play-board.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play.html play-live.js realistic-pieces.css assets/realistic-pieces.png
          git add -u
          git commit -m 'ui: add realistic chessboard pieces from approved reference'
          git push origin HEAD:feature/realistic-chessboard
