name: Test home member layout
on:
  push:
    paths:
      - 'index.html'
      - 'home-theme.css'
      - 'home-invite.js'
      - 'tests/test_home_member_layout.py'
      - '.github/workflows/test-home-member-layout.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify member box, board, and actions order
        run: python tests/test_home_member_layout.py
