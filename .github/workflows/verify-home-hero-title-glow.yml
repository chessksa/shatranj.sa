name: Verify home hero title glow

on:
  push:
    branches:
      - main
      - feature/hero-title-glow-20260908
    paths:
      - 'home-theme.css'
      - 'index.html'
      - 'tests/test_home_hero_title_glow.py'
      - '.github/workflows/verify-home-hero-title-glow.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tests/test_home_hero_title_glow.py
      - run: git diff --check
