name: Phase 3 Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - 'v3/**'
      - 'supabase/**'
      - 'tests/**'
      - 'variants.html'
      - 'puzzle-battle.html'
      - 'tournaments.html'
      - '.github/workflows/phase3-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Phase 3 Python contracts
        run: >-
          python -m pytest -q
          tests/test_full_platform_phase3_schema.py
          tests/test_v3_platform_services.py
          tests/test_v3_puzzle_battle_schema.py
          tests/test_v3_puzzle_solution_security.py
          tests/test_v3_standard_variants.py
          tests/test_v3_tournament_formats.py
          tests/test_v3_variant_edge_function.py
      - name: Phase 3 Node contracts
        run: >-
          node --test
          tests/v3-game-review.test.mjs
          tests/v3-puzzle-battle.test.mjs
          tests/v3-variants.test.mjs
      - name: Frontend syntax
        run: |
          node --check v2/analysis/app.mjs
          node --check v2/puzzles/app.mjs
          node --check v2/site/shell.mjs
          node --check v2/stats/app.mjs
          node --check v3/admin/phase3.mjs
          node --check v3/puzzles/battle.mjs
          node --check v3/tournaments/formats.mjs
          node --check v3/variants/app.mjs
