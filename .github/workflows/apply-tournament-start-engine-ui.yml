name: Apply tournament start engine UI

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/apply_tournament_start_engine_ui.py'
      - '.github/workflows/apply-tournament-start-engine-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply tournament UI
        run: python .github/scripts/apply_tournament_start_engine_ui.py
      - name: Verify tournament engine contract
        run: python tests/test_tournament_start_engine.py
      - name: Commit UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.js tournaments.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: connect tournament start and bracket UI"
          git pull --rebase origin main
          git push origin HEAD:main
