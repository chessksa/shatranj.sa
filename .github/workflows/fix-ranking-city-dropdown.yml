name: Fix ranking city dropdown

on:
  push:
    branches:
      - fix/ranking-city-dropdown
    paths:
      - 'ci/fix_ranking_city_dropdown.py'
      - '.github/workflows/fix-ranking-city-dropdown.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ranking city dropdown fix
        run: python ci/fix_ranking_city_dropdown.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: show ranking cities as dropdown"
          git push
