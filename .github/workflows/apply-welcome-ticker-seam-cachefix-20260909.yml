name: Render welcome ticker top frame inside strip 20260909

on:
  push:
    paths:
      - '.github/workflows/apply-welcome-ticker-seam-cachefix-20260909.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render visible inset top frame and cache bust
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old_ver = 'home-theme.css?v=20260909-tickerframe4'
          new_ver = 'home-theme.css?v=20260909-tickerinset5'
          if old_ver not in text:
              raise SystemExit('expected current home theme cache version not found')
          text = text.replace(old_ver, new_ver, 1)

          old_inline = 'border-top:1px solid rgba(216,182,101,.26);border-bottom:1px solid rgba(197,163,77,.55);position:relative;z-index:19;'
          new_inline = 'border-top:0;border-bottom:1px solid rgba(197,163,77,.55);position:relative;z-index:19;box-shadow:inset 0 1px 0 rgba(216,182,101,.5);'
          if old_inline not in text:
              raise SystemExit('expected ticker inline frame rule not found')
          text = text.replace(old_inline, new_inline, 1)

          old_seam = '.welcome-ticker{border-top:1px solid rgba(216,182,101,.26)!important;margin-top:0!important}'
          new_seam = '.welcome-ticker{border-top:0!important;margin-top:0!important;box-shadow:inset 0 1px 0 rgba(216,182,101,.5)!important}'
          if old_seam not in text:
              raise SystemExit('expected ticker seam frame override not found')
          text = text.replace(old_seam, new_seam, 1)

          p.write_text(text, encoding='utf-8')
          updated = p.read_text(encoding='utf-8')
          assert new_ver in updated
          assert 'box-shadow:inset 0 1px 0 rgba(216,182,101,.5)' in updated
          assert 'border-top:1px solid rgba(216,182,101,.26)' not in updated
          PY
      - name: Commit visible ticker frame
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'style: render welcome ticker top frame inside strip'
          git push
