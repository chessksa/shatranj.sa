name: Remove remaining welcome ticker 2px border 20260909

on:
  push:
    paths:
      - '.github/workflows/apply-welcome-ticker-seam-cachefix-20260909.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove remaining 2px border and bust cache
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('home-theme.css')
          c = css.read_text(encoding='utf-8')
          old_css = 'html body .welcome-ticker{\n  border-top:2px solid #c5a34d!important;\n  margin-top:0!important;\n}'
          new_css = 'html body .welcome-ticker{\n  border-top:0!important;\n  margin-top:0!important;\n}'
          if old_css not in c:
              raise SystemExit('expected remaining 2px ticker border rule not found')
          css.write_text(c.replace(old_css, new_css, 1), encoding='utf-8')

          html = Path('index.html')
          h = html.read_text(encoding='utf-8')
          old_ver = 'home-theme.css?v=20260909-tickerrestore7'
          new_ver = 'home-theme.css?v=20260909-tickergap8'
          if old_ver not in h:
              raise SystemExit('expected current home theme cache version not found')
          html.write_text(h.replace(old_ver, new_ver, 1), encoding='utf-8')

          updated_css = css.read_text(encoding='utf-8')
          updated_html = html.read_text(encoding='utf-8')
          assert 'border-top:2px solid #c5a34d!important' not in updated_css
          assert 'border-top:0!important' in updated_css
          assert new_ver in updated_html
          PY
      - name: Commit seam fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-theme.css index.html
          git commit -m 'fix: remove remaining 2px between header and ticker'
          git push
