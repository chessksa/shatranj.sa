name: Test mobile play layout

on:
  push:
    branches: [main]
    paths:
      - 'play-v10.html'
      - 'tests/test_mobile_play_layout.py'
      - '.github/workflows/test-mobile-play-layout.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_mobile_play_layout.py
