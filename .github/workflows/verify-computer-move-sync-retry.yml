name: Verify computer move sync retry
on:
  push:
    paths:
      - 'tests/test_computer_move_sync_retry.py'
      - 'play-computer.js'
      - 'supabase/functions/computer-game/index.ts'
      - '.github/workflows/verify-computer-move-sync-retry.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_computer_move_sync_retry.py
