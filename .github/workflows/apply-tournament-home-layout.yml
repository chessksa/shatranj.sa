name: Apply tournament and home layout

on:
  push:
    paths:
      - '.github/workflows/apply-tournament-home-layout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested UI changes
        run: python scripts/apply_tournament_home_layout.py
      - name: Verify requested layout
        run: python tests/test_tournament_home_layout.py
      - name: Commit changes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tournaments.html home-theme.css
          git commit -m "feat: refine tournament table and home play actions"
          git push
