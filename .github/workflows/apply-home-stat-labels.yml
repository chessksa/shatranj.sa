name: Apply home stat labels

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-home-stat-labels.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap only the two labels
        run: python tools/swap_home_stat_labels.py
      - name: Verify labels
        run: python tests/test_home_stat_labels.py
      - name: Commit label swap
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: swap home live stat labels"
          git push
