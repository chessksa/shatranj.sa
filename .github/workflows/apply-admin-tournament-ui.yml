name: Apply admin tournament UI patch

on:
  push:
    branches:
      - fix/admin-layout-refresh-tournaments

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-layout-refresh-tournaments
      - name: Apply patch
        run: python scripts/patch_admin_tournament_ui.py
      - name: Commit patched files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html admin.js index.html
          git commit -m "fix: keep admin controls visible and publish tournaments"
          git push origin HEAD:fix/admin-layout-refresh-tournaments
