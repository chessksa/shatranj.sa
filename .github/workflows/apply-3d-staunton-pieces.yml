name: Apply 3D Staunton pieces

on:
  push:
    branches:
      - 'feature/3d-staunton-pieces'
    paths:
      - '.github/workflows/apply-3d-staunton-pieces.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/3d-staunton-pieces

      - name: Add regression test and confirm it fails first
        run: |
          cat > tests/test_approved_piece_sprite.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]


          def test_cm_chessboard_uses_3d_staunton_sprite_everywhere():
              live = (ROOT / "play-v8.js").read_text(encoding="utf-8")
              prematch = (ROOT / "play-v10-match.js").read_text(encoding="utf-8")
              expected = "pieces/shatranj-3d-staunton.svg"
              assert expected in live
              assert expected in prematch
              assert "pieces/shatranj-approved.svg" not in live
              assert "pieces/shatranj-approved.svg" not in prematch


          def test_3d_staunton_sprite_contains_all_twelve_embedded_webp_pieces():
              sprite = (ROOT / "assets" / "pieces" / "shatranj-3d-staunton.svg").read_text(encoding="utf-8")
              for code in ("wk", "wq", "wr", "wb", "wn", "wp", "bk", "bq", "br", "bb", "bn", "bp"):
                  assert f'id="{code}"' in sprite
              assert sprite.count("data:image/webp;base64,") == 12


          def test_board_theme_keeps_approved_cream_and_petrol_colors():
              css = (ROOT / "cm-chessboard-shatranj.css").read_text(encoding="utf-8")
              assert "fill:#d6cfbf" in css.replace(" ", "")
              assert "fill:#0b4850" in css.replace(" ", "")


          def test_board_colors_are_forced_inline_on_svg_squares():
              for filename in ("play-v8.js", "play-v10-match.js"):
                  js = (ROOT / filename).read_text(encoding="utf-8")
                  assert "function forceBoardSquareColors" in js
                  assert "style.setProperty('fill','#d6cfbf','important')" in js.replace(" ", "")
                  assert "style.setProperty('fill','#0b4850','important')" in js.replace(" ", "")
                  assert "MutationObserver" in js
          PY
          python -m pip install pytest
          if python -m pytest -q tests/test_approved_piece_sprite.py; then
            echo 'Regression test unexpectedly passed before implementation.'
            exit 1
          else
            echo 'Expected RED state confirmed.'
          fi

      - name: Build embedded 3D Staunton sprite and wire it in
        run: |
          cat .tmp/3d-staunton/chunk*.b64 > /tmp/3d-staunton.b64
          base64 -d /tmp/3d-staunton.b64 > /tmp/3d-staunton.zip
          mkdir -p /tmp/3d-staunton
          unzip -q /tmp/3d-staunton.zip -d /tmp/3d-staunton

          python - <<'PY'
          from pathlib import Path
          import base64

          root = Path('.')
          src = Path('/tmp/3d-staunton')
          codes = ('wk','wq','wr','wb','wn','wp','bk','bq','br','bb','bn','bp')
          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">',
              '  <title>Shatranj Saudi Arabia 3D Staunton brown and ivory pieces</title>',
          ]
          for code in codes:
              data = base64.b64encode((src / f'{code}.webp').read_bytes()).decode('ascii')
              lines.append(
                  f'  <g id="{code}"><image href="data:image/webp;base64,{data}" '
                  'x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/></g>'
              )
          lines.append('</svg>')
          (root / 'assets/pieces/shatranj-3d-staunton.svg').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          for filename in ('play-v8.js', 'play-v10-match.js'):
              p = root / filename
              text = p.read_text(encoding='utf-8')
              text = text.replace("pieces/shatranj-approved.svg", "pieces/shatranj-3d-staunton.svg")
              p.write_text(text, encoding='utf-8')

          p = root / 'play-v10.html'
          text = p.read_text(encoding='utf-8')
          text = text.replace('play-v8.js?v=20260903-13', 'play-v8.js?v=20260904-1')
          text = text.replace('play-v10-match.js?v=20260903-14', 'play-v10-match.js?v=20260904-1')
          p.write_text(text, encoding='utf-8')

          p = root / 'play-v8.html'
          text = p.read_text(encoding='utf-8')
          text = text.replace('play-v8.js?v=20260903-10', 'play-v8.js?v=20260904-1')
          p.write_text(text, encoding='utf-8')

          p = root / 'tests/test_play_v10_cm_preview.py'
          text = p.read_text(encoding='utf-8')
          text = text.replace('play-v10-match.js?v=20260903-14', 'play-v10-match.js?v=20260904-1')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify 3D Staunton integration
        run: |
          python -m pytest -q tests/test_approved_piece_sprite.py tests/test_play_v10_cm_preview.py tests/test_cm_chessboard_integration.py
          node --check play-v8.js
          node --check play-v10-match.js
          grep -q 'shatranj-3d-staunton.svg' play-v8.js
          grep -q 'shatranj-3d-staunton.svg' play-v10-match.js
          test "$(grep -o 'data:image/webp;base64,' assets/pieces/shatranj-3d-staunton.svg | wc -l)" -eq 12

      - name: Remove upload scaffolding and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .tmp/3d-staunton
          git rm .github/workflows/apply-3d-staunton-pieces.yml
          git add assets/pieces/shatranj-3d-staunton.svg play-v8.js play-v10-match.js play-v10.html play-v8.html tests/test_approved_piece_sprite.py tests/test_play_v10_cm_preview.py
          git commit -m 'feat: use 3D Staunton pieces on chessboard'
          git push origin HEAD:feature/3d-staunton-pieces
