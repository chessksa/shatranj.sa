name: Apply approved home hero redesign

on:
  push:
    branches:
      - feature/home-hero-redesign-20260904-work
    paths:
      - '.github/workflows/apply-home-hero-redesign.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/home-hero-redesign-20260904-work
          fetch-depth: 0
      - name: Apply approved homepage redesign
        run: python ci/apply_home_hero_redesign.py
      - name: Verify homepage redesign
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_home_hero_design.py
      - name: Commit approved homepage redesign
        run: |
          git config user.name "chessksa"
          git config user.email "gmel1199@gmail.com"
          git add index.html home-theme.css
          git commit -m "feat: apply approved dark teal homepage hero"
          git push origin HEAD:feature/home-hero-redesign-20260904-work
