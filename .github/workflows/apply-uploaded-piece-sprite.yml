name: Apply uploaded 3D pieces

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow pytest
      - run: python .tmp/apply_uploaded_pieces.py
      - run: python -m pytest -q tests/test_approved_piece_sprite.py
      - run: node --check play-v8.js
      - run: node --check play-v10-match.js
      - name: Commit verified fix
        run: |
          rm .github/workflows/apply-uploaded-piece-sprite.yml
          rm .tmp/apply_uploaded_pieces.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore uploaded 3D chess pieces"
          git push origin main
