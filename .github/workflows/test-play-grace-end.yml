name: Test play grace end

on:
  push:
    branches:
      - main
    paths:
      - 'play-v10.html'
      - 'play-v10-match.js'
      - 'play-v8.js'
      - 'supabase/migrations/20260904_grace_end_window.sql'
      - 'tests/test_play_grace_end.py'
      - '.github/workflows/test-play-grace-end.yml'
  pull_request:
    paths:
      - 'play-v10.html'
      - 'play-v10-match.js'
      - 'play-v8.js'
      - 'supabase/migrations/20260904_grace_end_window.sql'
      - 'tests/test_play_grace_end.py'
      - '.github/workflows/test-play-grace-end.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_play_grace_end.py
      - run: node --check play-v10-match.js
      - run: node --check play-v8.js
