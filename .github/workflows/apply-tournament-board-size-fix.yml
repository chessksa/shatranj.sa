name: Apply tournament board size fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-tournament-board-size-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply board-size stability fix
        run: python tools/fix_tournament_board_size.py
      - name: Verify board size and related play regressions
        run: |
          python tests/test_tournament_banner_board_size.py
          python tests/test_tournament_player_banner.py
          python tests/test_tournament_game_demo.py
          python tests/test_tournament_game_badge.py
          python tests/test_last_move_highlight.py
          python tests/test_play_v10_cm_preview.py
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exact-board-v13.css play-v10.html
          git commit -m 'fix: preserve board size with tournament banner'
          git push origin HEAD:main
