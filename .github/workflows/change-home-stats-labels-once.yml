name: Change home stats labels once
on:
  push:
    paths:
      - '.github/workflows/change-home-stats-labels-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            '<small>لاعب مسجل</small>':'<small>المشتركين</small>',
            '<small>مباراة حالية</small>':'<small>المباريات الآن</small>',
            '<small>يشاهد الآن</small>':'<small>المتواجدين</small>',
          }
          for old,new in replacements.items():
              assert old in s, f'missing expected text: {old}'
              s=s.replace(old,new,1)
          for new in replacements.values():
              assert new in s
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/change-home-stats-labels-once.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/change-home-stats-labels-once.yml
          git commit -m 'تعديل عناوين إحصاءات الواجهة'
          git push
