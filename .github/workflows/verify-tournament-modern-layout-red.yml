name: Verify tournament modern layout RED
on:
  push:
    paths:
      - 'tests/test_tournament_modern_layout_everywhere.py'
      - '.github/workflows/verify-tournament-modern-layout-red.yml'
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Confirm regression is red before implementation
        run: |
          if python tests/test_tournament_modern_layout_everywhere.py; then
            echo 'Expected test to fail before implementation'
            exit 1
          fi
