name: Patch tournament inline type scale

on:
  push:
    branches:
      - fix-tournament-inline-type-scale-20260910

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-tournament-inline-type-scale-20260910
      - name: Force detail type scale in page HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tournaments.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* tournament-detail-type-scale-16-14-12 */'
          if marker in s:
              raise SystemExit('inline scale already present')
          block = '''\n/* tournament-detail-type-scale-16-14-12 */\n.detail-toolbar-title,.detail-title,.bracket-title{font-size:16px!important}\n.detail-label,.bracket-round-title{font-size:14px!important}\n.detail-value,.detail-shell .status,.bracket-player,.bracket-meta,.bracket-empty{font-size:12px!important}\n'''
          if '</style>' not in s:
              raise SystemExit('style closing tag not found')
          s = s.replace('</style>', block + '</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify target rules
        run: python -m pytest tests/test_tournament_detail_type_scale.py -q
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tournaments.html
          git commit -m 'fix: force tournament detail type scale inline'
          git push origin HEAD:fix-tournament-inline-type-scale-20260910
