name: Apply home member square avatar
on:
  push:
    paths:
      - '.github/workflows/apply-home-member-avatar.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add square member avatar
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          decode=lambda value: base64.b64decode(value).decode('utf-8')
          old_markup=decode('ICAgICAgICA8ZGl2IGlkPSJhY2NvdW50UGFuZWwiIGNsYXNzPSJhY2NvdW50LXBhbmVsIiBoaWRkZW4+CiAgICAgICAgPGRpdj4KICAgICAgICAgIDxzdHJvbmcgaWQ9ImFjY291bnRXZWxjb21lIj7Zhdix2K3YqNmL2Kc8L3N0cm9uZz4=')
          new_markup=decode('')
          avatar_js=decode('')
          avatar_css=decode('')

          index=Path('index.html')
          html=index.read_text(encoding='utf-8')
          if old_markup not in html:
            raise SystemExit('account panel insertion point not found')
          html=html.replace(old_markup,new_markup,1)
          if 'function showAccountAvatar()' not in html:
            marker='function renderAccount(){'
            if marker not in html:
              raise SystemExit('renderAccount marker not found')
            html=html.replace(marker,avatar_js+marker,1)
          html=html.replace("if(loggedIn && currentProfile){\n    $('#accountWelcome')", "if(loggedIn && currentProfile){\n    showAccountAvatar();\n    $('#accountWelcome')",1)
          if 'home-theme.css?v=20260903-9' not in html:
            raise SystemExit('stylesheet version marker not found')
          html=html.replace('home-theme.css?v=20260903-9','home-theme.css?v=20260903-10',1)
          index.write_text(html,encoding='utf-8')

          css_path=Path('home-theme.css')
          css=css_path.read_text(encoding='utf-8')
          if '/* Square member avatar 20260903 */' not in css:
            css+=avatar_css
          css_path.write_text(css,encoding='utf-8')

          polish=Path('tests/test_home_member_polish.py')
          text=polish.read_text(encoding='utf-8').replace('home-theme.css?v=20260903-9','home-theme.css?v=20260903-10')
          polish.write_text(text,encoding='utf-8')
          PY

          python tests/test_home_member_avatar.py
          python tests/test_home_header_account.py
          python tests/test_home_member_layout.py
          python tests/test_home_member_polish.py
          python tests/test_global_arial_font.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html home-theme.css tests/test_home_member_polish.py
          git commit -m "Restore square member avatar on homepage"
          git push
