name: Apply member avatar beside name
on:
  push:
    paths:
      - '.github/workflows/apply-home-member-avatar.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move avatar beside member name
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          if 'class="account-identity-row"' not in html:
            pattern = re.compile(
              r'(?P<indent>\s*)<div class="account-avatar-wrap" aria-label="صورة العضو">\s*'
              r'<img class="account-avatar" id="accountAvatarImage" alt="صورة العضو" hidden />\s*'
              r'<div class="account-avatar account-avatar-fallback" id="accountAvatarFallback">♟</div>\s*'
              r'</div>\s*'
              r'<strong id="accountWelcome">مرحبًا</strong>'
            )
            match = pattern.search(html)
            if not match:
              raise SystemExit('member avatar/name markup not found')
            indent = match.group('indent')
            replacement = (
              f'{indent}<div class="account-identity-row">\n'
              f'{indent}  <div class="account-avatar-wrap" aria-label="صورة العضو">\n'
              f'{indent}    <img class="account-avatar" id="accountAvatarImage" alt="صورة العضو" hidden />\n'
              f'{indent}    <div class="account-avatar account-avatar-fallback" id="accountAvatarFallback">♟</div>\n'
              f'{indent}  </div>\n'
              f'{indent}  <strong id="accountWelcome">مرحبًا</strong>\n'
              f'{indent}</div>'
            )
            html = html[:match.start()] + replacement + html[match.end():]

          if 'home-theme.css?v=20260903-10' not in html:
            raise SystemExit('current stylesheet version marker not found')
          html = html.replace('home-theme.css?v=20260903-10', 'home-theme.css?v=20260903-11', 1)
          index.write_text(html, encoding='utf-8')

          css_path = Path('home-theme.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Member avatar beside name 20260903 */'
          if marker not in css:
            css += '''\n\n/* Member avatar beside name 20260903 */
.account-identity-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin:0 0 10px;
  direction:rtl;
}
.account-identity-row .account-avatar-wrap{
  margin:0;
  flex:0 0 76px;
}
.account-identity-row #accountWelcome{
  margin:0;
  text-align:right;
}
'''
          css_path.write_text(css, encoding='utf-8')

          polish = Path('tests/test_home_member_polish.py')
          text = polish.read_text(encoding='utf-8').replace('home-theme.css?v=20260903-10', 'home-theme.css?v=20260903-11')
          polish.write_text(text, encoding='utf-8')
          PY

          python tests/test_home_member_avatar.py
          python tests/test_home_header_account.py
          python tests/test_home_member_layout.py
          python tests/test_home_member_polish.py
          python tests/test_global_arial_font.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html home-theme.css tests/test_home_member_polish.py
          git commit -m "Place member avatar beside name"
          git push
