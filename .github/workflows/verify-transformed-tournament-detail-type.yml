name: Verify transformed tournament detail typography

on:
  push:
    branches:
      - fix-transformed-tournament-detail-table-type-20260910

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run transformed tournament detail typography test
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/test_tournament_detail_type_scale.py')
          ns['test_transformed_tournament_detail_table_keeps_label_larger_than_value_on_mobile']()
          PY
