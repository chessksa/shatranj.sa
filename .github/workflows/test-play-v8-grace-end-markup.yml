name: Test play-v8 grace end markup

on:
  push:
    branches: [main]
    paths:
      - play-v8.html
      - play-v8.js
      - tests/test_play_v8_grace_end_markup.py
      - .github/workflows/test-play-v8-grace-end-markup.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify play-v8 grace end markup
        run: python tests/test_play_v8_grace_end_markup.py
