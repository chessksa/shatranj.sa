name: Diagnose play-v8 blank page

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-play-v8-pawn-css-cache-bust.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce missing grace-end markup
        run: python tests/test_play_v8_grace_end_markup.py
