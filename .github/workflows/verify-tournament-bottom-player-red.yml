name: Verify tournament bottom player RED

on:
  push:
    branches: [main]
    paths:
      - 'tests/test_tournament_bottom_player_visibility.py'
      - '.github/workflows/verify-tournament-bottom-player-red.yml'

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm bottom-player regression fails before implementation
        shell: bash
        run: |
          if python tests/test_tournament_bottom_player_visibility.py; then
            echo 'Regression test unexpectedly passed before implementation.'
            exit 1
          fi
          echo 'Regression test is RED as expected.'
