name: Apply tournaments header and centered hero

on:
  push:
    branches:
      - home-tournaments-header-center-hero
    paths:
      - ci/apply_home_tournaments_header_center.py
      - .github/workflows/apply-home-tournaments-header-center.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: home-tournaments-header-center-hero
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ci/apply_home_tournaments_header_center.py
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_home_tournaments_header_center.py
      - name: Commit applied changes
        run: |
          if git diff --quiet -- index.html home-theme.css; then
            echo "No homepage changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home-theme.css
          git commit -m "style: move tournaments to header and center hero"
          git push origin HEAD:home-tournaments-header-center-hero
