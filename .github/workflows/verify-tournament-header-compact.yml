name: Verify compact tournament header

on:
  push:
    paths:
      - 'tournaments.html'
      - 'tests/test_tournament_header_compact.py'
      - '.github/workflows/verify-tournament-header-compact.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tournament header layout
        run: python tests/test_tournament_header_compact.py
