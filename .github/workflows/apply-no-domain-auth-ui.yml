name: Apply no-domain auth UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ci/apply_no_domain_auth_ui.py
      - tests/test_no_domain_auth_ui.py
      - .github/workflows/apply-no-domain-auth-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply no-domain signup copy
        run: python ci/apply_no_domain_auth_ui.py
      - name: Verify no-domain signup UI
        run: python -m pytest -q tests/test_no_domain_auth_ui.py
      - name: Commit UI update
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: align signup UI with no-domain auth"
          git push
