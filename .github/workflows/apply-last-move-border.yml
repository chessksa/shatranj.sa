name: Refresh last move play entry

on:
  push:
    paths:
      - '.github/workflows/apply-last-move-border.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify stale entry regression is red before patch
        run: |
          if python tests/test_play_entry_cache_bust.py; then
            echo 'Expected fresh play entry test to fail before patch' >&2
            exit 1
          fi
          echo 'RED confirmed: home still opens stale play URL'

      - name: Force fresh play document from home
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('index.html')
          text = page.read_text(encoding='utf-8')
          version = '20260908-red2'

          replacements = {
              'href="play-v10.html"><span>العب الآن</span>': f'href="play-v10.html?ui={version}"><span>العب الآن</span>',
              'href="play-v10.html?computer=1&v=20260907-23"><span>العب ضد الكمبيوتر</span>': f'href="play-v10.html?computer=1&ui={version}"><span>العب ضد الكمبيوتر</span>',
              'id="homeBoardPreview" class="home-board-preview protected-play" href="play-v10.html"': f'id="homeBoardPreview" class="home-board-preview protected-play" href="play-v10.html?ui={version}"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected entry link not found: {old}')
              text = text.replace(old, new, 1)

          page.write_text(text, encoding='utf-8')
          PY

      - name: Verify fresh entry and requested marker style
        run: |
          python tests/test_play_entry_cache_bust.py
          python tests/test_last_move_highlight.py
          python tests/test_live_move_review.py

      - name: Commit entry refresh
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: force fresh red last-move play page'
          git push origin HEAD:main

# trigger: fresh-play-red2-v1
