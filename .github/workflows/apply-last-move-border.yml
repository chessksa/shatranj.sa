name: Adjust last move marker style

on:
  push:
    paths:
      - '.github/workflows/apply-last-move-border.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply 2px light red marker style
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('play-v10.html')
          text = page.read_text(encoding='utf-8')
          old = ".cm-board-host .cm-chessboard .marker.marker-frame-last-move{stroke:#ffb45a!important;stroke-width:3.6px!important;stroke-linecap:round;stroke-linejoin:round;opacity:1!important;fill:none!important;filter:drop-shadow(0 0 1px rgba(255,180,90,.85))}"
          new = ".cm-board-host .cm-chessboard .marker.marker-frame-last-move{stroke:#ff6b6b!important;stroke-width:2px!important;stroke-linecap:round;stroke-linejoin:round;opacity:1!important;fill:none!important;filter:drop-shadow(0 0 1px rgba(255,107,107,.75))}"
          if old not in text:
              raise SystemExit('current last-move marker style not found')
          page.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_last_move_highlight.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace('"stroke:#ffb45a",', '"stroke:#ff6b6b",', 1)
          text = text.replace('"stroke-width:3.6px",', '"stroke-width:2px",', 1)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Verify last move marker tests
        run: |
          python tests/test_last_move_highlight.py
          python tests/test_live_move_review.py

      - name: Commit style change
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-v10.html tests/test_last_move_highlight.py
          git commit -m 'style: make last move marker thin light red'
          git push origin HEAD:main

# style trigger: light-red-2px
