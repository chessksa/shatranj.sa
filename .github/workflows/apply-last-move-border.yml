name: Apply native last move markers

on:
  push:
    paths:
      - '.github/workflows/apply-last-move-border.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify native marker regression is red before patch
        run: |
          if python tests/test_last_move_highlight.py; then
            echo 'Expected native marker regression to fail before implementation' >&2
            exit 1
          fi
          echo 'RED confirmed: last move is still using the external HTML overlay'

      - name: Apply native cm-chessboard markers
        run: python tools/apply_last_move_border.py

      - name: Verify native last-move behavior and related board regressions
        run: |
          python tests/test_last_move_highlight.py
          python tests/test_live_move_review.py
          python tests/test_compact_end_review_controls.py
          python tests/test_play_v10_cm_preview.py
          python tests/test_computer_move_stability.py

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-v8.js play-computer.js play-v10.html assets/last-move-markers.svg
          git commit -m 'fix: render last move with native board markers'
          git push origin HEAD:main
