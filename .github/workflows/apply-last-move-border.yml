name: Apply clear last move border

on:
  push:
    paths:
      - '.github/workflows/apply-last-move-border.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify border test is red before patch
        run: |
          if python tests/test_last_move_highlight.py; then
            echo 'Expected clearer border test to fail before patch' >&2
            exit 1
          fi
          echo 'RED confirmed: current border is not clear enough'

      - name: Apply light-orange border
        run: python tools/apply_last_move_border.py

      - name: Verify last-move behavior
        run: |
          python tests/test_last_move_highlight.py
          python tests/test_live_move_review.py
          python tests/test_compact_end_review_controls.py
          python tests/test_play_v10_cm_preview.py
          python tests/test_computer_move_stability.py

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-v10.html
          git commit -m 'style: make last move border clearer'
          git push origin HEAD:main
