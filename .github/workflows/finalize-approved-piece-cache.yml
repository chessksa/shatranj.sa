name: Finalize approved piece cache

on:
  push:
    branches:
      - 'fix/pieces-final-clean'
    paths:
      - '.github/workflows/finalize-approved-piece-cache.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pieces-final-clean
          fetch-depth: 0
      - name: Bump piece and script caches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          sprite=Path('assets/pieces/shatranj-approved-20260904.svg')
          s=sprite.read_text(encoding='utf-8')
          ET.parse(sprite)
          for code in ('wk','wq','wr','wb','wn','wp','bk','bq','br','bb','bn','bp'):
              assert f'id="{code}"' in s
          assert s.count('data:image/png;base64,') == 12
          assert 'approved-dark-20260904.png' not in s
          assert 'approved-light-20260904.png' not in s
          assert not Path('assets/pieces/approved-dark-20260904.png').exists()
          assert not Path('assets/pieces/approved-light-20260904.png').exists()

          for filename in ('play-v8.js','play-v10-match.js'):
              p=Path(filename)
              t=p.read_text(encoding='utf-8')
              old='pieces/shatranj-approved-20260904.svg?v=20260904-5'
              new='pieces/shatranj-approved-20260904.svg?v=20260904-7'
              assert old in t, filename
              p.write_text(t.replace(old,new),encoding='utf-8')

          p=Path('play-v10.html')
          h=p.read_text(encoding='utf-8')
          for old,new in (
              ('play-v8.js?v=20260904-5','play-v8.js?v=20260904-7'),
              ('play-v10-match.js?v=20260904-5','play-v10-match.js?v=20260904-7'),
          ):
              assert old in h, old
              h=h.replace(old,new)
          p.write_text(h,encoding='utf-8')
          PY
          node --check play-v8.js
          node --check play-v10-match.js
          grep -q "pieces/shatranj-approved-20260904.svg?v=20260904-7" play-v8.js
          grep -q "pieces/shatranj-approved-20260904.svg?v=20260904-7" play-v10-match.js
          grep -q "play-v8.js?v=20260904-7" play-v10.html
          grep -q "play-v10-match.js?v=20260904-7" play-v10.html
      - name: Commit verified integration
        shell: bash
        run: |
          rm -f .github/workflows/finalize-approved-piece-cache.yml
          git config user.name "chessksa"
          git config user.email "gmel1199@gmail.com"
          git add -A
          git commit -m "fix: load approved chess pieces from self-contained sprite"
          git push origin HEAD:fix/pieces-final-clean
