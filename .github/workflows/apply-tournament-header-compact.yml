name: Apply compact tournament header

on:
  push:
    paths:
      - '.github/workflows/apply-tournament-header-compact.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply compact tournament header
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('tournaments.html')
          text = page.read_text(encoding='utf-8')

          old_css = "main{padding:34px 0 48px}.page-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:16px;padding:18px 20px;border:1px solid var(--hero-cyan-line);border-radius:18px;background:linear-gradient(145deg,rgba(8,62,64,.86),rgba(7,49,51,.8));box-shadow:0 13px 30px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.025)}.page-head h1{margin:0;color:var(--hero-gold);font-size:30px}.page-head p{margin:6px 0 0;color:var(--hero-muted);font-size:13px}.count{color:var(--hero-gold-2);font-size:13px;font-weight:900;white-space:nowrap}"
          new_css = "main{padding:34px 0 48px}.page-head{display:flex;align-items:center;margin-bottom:4px;padding:18px 20px;border:1px solid var(--hero-cyan-line);border-radius:18px;background:linear-gradient(145deg,rgba(8,62,64,.86),rgba(7,49,51,.8));box-shadow:0 13px 30px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.025)}.page-head-title{display:flex;align-items:center;gap:10px;width:100%}.page-head h1{margin:0;color:var(--hero-gold);font-size:30px}.count{color:var(--hero-gold-2);font-size:18px;font-weight:900;white-space:nowrap}.tournament-intro-strip{width:100%;margin:0 0 12px;padding:12px 16px;border:1px solid rgba(46,147,147,.34);border-radius:14px;background:linear-gradient(90deg,rgba(7,49,51,.82),rgba(8,62,64,.68));color:var(--hero-muted);font-size:13px;font-weight:800}"
          if old_css not in text:
              raise SystemExit('expected current tournament header css not found')
          text = text.replace(old_css, new_css, 1)

          old_mobile = ".page-head-actions{width:100%;justify-content:space-between}.demo-link{min-height:36px;padding:0 10px;font-size:11px}.nav{min-height:62px}.brand{font-size:18px}.back{min-height:39px;padding:0 11px}.page-head{align-items:flex-start;flex-direction:column;padding:15px}.page-head h1{font-size:24px}main{padding-top:18px}"
          new_mobile = ".page-head-actions{width:100%;justify-content:space-between}.demo-link{min-height:36px;padding:0 10px;font-size:11px}.nav{min-height:62px}.brand{font-size:18px}.back{min-height:39px;padding:0 11px}.page-head{padding:15px}.page-head-title{gap:8px}.page-head h1{font-size:24px}.count{font-size:16px}.tournament-intro-strip{padding:10px 12px;font-size:12px}main{padding-top:18px}"
          if old_mobile not in text:
              raise SystemExit('expected current mobile tournament header css not found')
          text = text.replace(old_mobile, new_mobile, 1)

          old_head = '  <div class="page-head"><div><h1>البطولات</h1><p>اختر البطولة لعرض تفاصيلها والتسجيل فيها.</p></div><div class="page-head-actions"><div id="tournamentCount" class="count">0 بطولة</div></div></div>'
          new_head = '  <div class="page-head"><div class="page-head-title"><h1>البطولات</h1><div id="tournamentCount" class="count">0</div></div></div>\n  <div class="tournament-intro-strip">اختر البطولة للتسجيل والمشاركة والمشاهدة</div>'
          if old_head not in text:
              raise SystemExit('expected current tournament header markup not found')
          text = text.replace(old_head, new_head, 1)

          old_count = 'countEl.textContent=`${list.length} بطولة`;'
          new_count = 'countEl.textContent=`${list.length}`;'
          if old_count not in text:
              raise SystemExit('expected current tournament count renderer not found')
          text = text.replace(old_count, new_count, 1)

          page.write_text(text, encoding='utf-8')

          index = Path('index.html')
          home = index.read_text(encoding='utf-8')
          old_link = 'tournaments.html?v=20260909-hide-demo2'
          new_link = 'tournaments.html?v=20260909-header3'
          if old_link not in home:
              raise SystemExit('expected current tournament cache-busted home link not found')
          index.write_text(home.replace(old_link, new_link), encoding='utf-8')
          PY
      - name: Verify compact header
        run: |
          python tests/test_tournament_header_compact.py
          python tests/test_tournament_game_demo.py
      - name: Commit compact tournament header
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tournaments.html index.html
          git commit -m 'feat: compact tournament header and intro strip'
          git push
