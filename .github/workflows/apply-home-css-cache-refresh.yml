name: Apply home CSS cache refresh

on:
  push:
    branches:
      - feature/unify-stat-card-frame-20260908
    paths:
      - '.github/workflows/apply-home-css-cache-refresh.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh home theme cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'home-theme.css?v=2026090703'
          new = 'home-theme.css?v=2026090802'
          if old not in text:
              raise SystemExit(f'missing expected cache key: {old}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - run: python tests/test_home_stat_card_frame.py
      - run: git diff --check
      - name: Commit cache refresh
        run: |
          git config user.name "chessksa"
          git config user.email "gmel1199@gmail.com"
          git add index.html
          git commit -m "fix: refresh home theme cache"
          git push
