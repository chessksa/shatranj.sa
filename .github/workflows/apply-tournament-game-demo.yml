name: Apply tournament game demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-tournament-game-demo.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply tournament game visual demo
        run: python tools/apply_tournament_game_demo.py
      - name: Verify tournament demo and related play behavior
        run: |
          python tests/test_tournament_game_demo.py
          python tests/test_tournament_game_badge.py
          python tests/test_tournament_start_engine.py
          python tests/test_tournament_spectator_link.py
          python tests/test_play_v10_cm_preview.py
          node --check play-tournament-demo.js
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tournaments.html play-v10.html play-tournament-demo.js
          git commit -m 'feat: add tournament match visual demo'
          git push origin HEAD:main
