name: Apply tournament game demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-tournament-game-demo.yml'
      - 'tests/test_tournament_game_demo.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove public tournament demo link
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tournaments.html')
          text = path.read_text(encoding='utf-8')
          links = (
              '<a class="demo-link" href="play-v10.html?demo_tournament=1&layout=header3">عرض مثال مباراة بطولة</a>',
              '<a class="demo-link" href="play-v10.html?demo_tournament=1">عرض مثال مباراة بطولة</a>',
          )
          for link in links:
              text = text.replace(link, '')
          if 'عرض مثال مباراة بطولة' in text or 'play-v10.html?demo_tournament=1' in text:
              raise SystemExit('tournament demo link is still exposed')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify tournament demo and related play behavior
        run: |
          python tests/test_tournament_game_demo.py
          python tests/test_tournament_game_badge.py
          python tests/test_tournament_start_engine.py
          python tests/test_tournament_spectator_link.py
          python tests/test_play_v10_cm_preview.py
          node --check play-tournament-demo.js
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tournaments.html
          git commit -m 'fix: hide tournament demo link'
          git push origin HEAD:main
