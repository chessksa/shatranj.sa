name: Test realistic piece mask isolation

on:
  push:
    branches:
      - fix/realistic-piece-mask
      - fix/realistic-piece-cache
    paths:
      - realistic-pieces.css
      - play.html
      - tests/test_realistic_piece_mask.py
      - .github/workflows/test-realistic-piece-mask.yml
  pull_request:
    paths:
      - realistic-pieces.css
      - play.html
      - tests/test_realistic_piece_mask.py
      - .github/workflows/test-realistic-piece-mask.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify realistic sprites and cache bust
        run: python tests/test_realistic_piece_mask.py
