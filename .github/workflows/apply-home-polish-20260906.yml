name: Apply approved home polish

on:
  push:
    branches:
      - feature/home-polish-20260906
    paths:
      - '.github/workflows/apply-home-polish-20260906.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_home_polish_20260906.py
      - run: python tests/test_home_polish_20260906.py
      - run: git diff --check
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html home-welcome-ticker.js home-theme.css tournaments.html
          git commit -m 'style: polish ticker play actions and tournament table'
          git push
