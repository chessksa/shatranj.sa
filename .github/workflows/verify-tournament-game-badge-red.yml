name: Verify tournament game badge RED

on:
  push:
    branches: [main]
    paths:
      - 'tests/test_tournament_game_badge.py'
      - '.github/workflows/verify-tournament-game-badge-red.yml'

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm tournament badge test fails before implementation
        shell: bash
        run: |
          set +e
          python tests/test_tournament_game_badge.py > /tmp/tournament-badge-red.log 2>&1
          status=$?
          cat /tmp/tournament-badge-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected RED test to fail before implementation.'
            exit 1
          fi
          grep -q 'tournament game context migration must exist' /tmp/tournament-badge-red.log
