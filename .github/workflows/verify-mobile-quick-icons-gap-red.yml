name: Verify mobile action gap RED
on:
  push:
    branches: [main]
    paths:
      - 'tests/test_mobile_quick_icons_gap.py'
      - '.github/workflows/verify-mobile-quick-icons-gap-red.yml'
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm 1px regression test fails before implementation
        run: |
          if python tests/test_mobile_quick_icons_gap.py; then
            echo 'Regression test unexpectedly passed before implementation.'
            exit 1
          fi
          echo 'RED confirmed: 1px mobile action gap test fails before implementation.'
