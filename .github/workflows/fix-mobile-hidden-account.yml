name: Fix mobile hidden account

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-hidden-account.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify RED
        run: |
          cat > tests/test_mobile_hidden_nav_account.py <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('home-theme.css').read_text(encoding='utf-8')
          assert '#navAccount[hidden]{display:none!important}' in html
          header = html.split('<header class="home-header">',1)[1].split('</header>',1)[0]
          assert 'id="dashboardNav"' in header
          marker = '/* Mobile header remove dashboard final 20260905 */'
          assert marker in css
          assert 'body.home-signed-in .compact-member-nav .dashboard-link{display:none!important}' in css.split(marker,1)[1]
          print('mobile hidden nav account: PASS')
          PY
          set +e
          python tests/test_mobile_hidden_nav_account.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected RED before implementation"
            exit 1
          fi
          echo "RED verified"

      - name: Apply fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          style = '''<style id="hiddenNavAccountFix">
#navAccount[hidden]{display:none!important}
</style>
'''
          if '#navAccount[hidden]{display:none!important}' not in html:
              if '</head>' not in html:
                  raise SystemExit('head closing tag not found')
              html = html.replace('</head>', style + '</head>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Verify GREEN
        run: |
          python tests/test_mobile_hidden_nav_account.py
          python tests/test_dashboard_desktop_mobile_split.py
          python tests/test_mobile_dashboard_removed.py

      - name: Commit and remove workflow
        run: |
          rm .github/workflows/fix-mobile-hidden-account.yml
          git add index.html tests/test_mobile_hidden_nav_account.py .github/workflows/fix-mobile-hidden-account.yml
          git commit -m "إخفاء زر الحساب المخفي في هيدر الجوال"
          git push origin main
