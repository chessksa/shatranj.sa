name: Increase ranking font once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/increase-ranking-font-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increase ranking table font
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('home-theme.css')
          css = css_path.read_text(encoding='utf-8')
          replacements = {
              '#ranking th{height:38px;color:#d9c58f!important;font-size:11px!important;font-weight:900}': '#ranking th{height:38px;color:#d9c58f!important;font-size:14px!important;font-weight:900}',
              '#ranking td{font-size:12px!important}': '#ranking td{font-size:15px!important}',
              '#ranking th,#ranking td{font-size:9px!important;padding-inline:3px!important}': '#ranking th,#ranking td{font-size:12px!important;padding-inline:3px!important}',
          }
          for old, new in replacements.items():
              if old not in css:
                  raise SystemExit(f'Missing expected CSS: {old}')
              css = css.replace(old, new, 1)
          css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          old = 'home-theme.css?v=20260905-3'
          new = 'home-theme.css?v=20260905-4'
          if old not in html:
              raise SystemExit('Missing expected CSS cache version')
          index_path.write_text(html.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify ranking font sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('home-theme.css').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')
          assert '#ranking th{height:38px;color:#d9c58f!important;font-size:14px!important;font-weight:900}' in css
          assert '#ranking td{font-size:15px!important}' in css
          assert '#ranking th,#ranking td{font-size:12px!important;padding-inline:3px!important}' in css
          assert 'home-theme.css?v=20260905-4' in html
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/increase-ranking-font-once.yml
          git config user.name "chessksa"
          git config user.email "gmel1199@gmail.com"
          git add home-theme.css index.html .github/workflows/increase-ranking-font-once.yml
          git commit -m "تكبير خط جدول ترتيب اللاعبين"
          git push origin HEAD:main
