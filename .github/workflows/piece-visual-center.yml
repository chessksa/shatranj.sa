name: Center chess pieces

on:
  push:
    branches: [main]
    paths:
      - tests/test_piece_visual_center.py
      - .github/workflows/piece-visual-center.yml
      - assets/pieces/**
      - ci/center_piece_images.py

permissions:
  contents: write

jobs:
  center-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Center visible piece artwork
        run: python ci/center_piece_images.py
      - name: Verify piece visual centering
        run: python tests/test_piece_visual_center.py
      - name: Commit centered piece images
        run: |
          if git diff --quiet -- assets/pieces; then
            echo "Pieces already centered"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pieces
          git commit -m "fix: center chess pieces in board squares"
          git push
