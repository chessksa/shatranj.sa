name: Verify chess piece centering

on:
  push:
    branches: [main]
    paths:
      - tests/test_piece_visual_center.py
      - .github/workflows/piece-visual-center.yml
      - assets/pieces/**
      - ci/center_piece_images.py

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Verify committed piece visual centering
        run: python tests/test_piece_visual_center.py
