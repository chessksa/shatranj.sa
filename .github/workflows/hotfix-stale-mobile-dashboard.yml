name: Hotfix stale mobile dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-stale-mobile-dashboard.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write regression test and verify RED
        run: |
          cat > tests/test_stale_mobile_dashboard_hotfix.py <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          notifications = Path('site-notifications.js').read_text(encoding='utf-8')
          assert '<a id="dashboardNav"' not in html
          assert 'const CACHE="shatranj-arab-v3";' in sw
          assert 'client.navigate(client.url)' in sw
          assert 'function removeStaleMobileDashboard()' in notifications
          assert ".home-header #dashboardNav,.home-header .dashboard-link" in notifications
          assert "el.textContent.trim() === 'لوحة التحكم'" in notifications
          assert 'site-notifications.js?v=20260905-3' in html
          print('stale mobile dashboard hotfix: PASS')
          PY
          set +e
          python tests/test_stale_mobile_dashboard_hotfix.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected RED before implementation"
            exit 1
          fi
          echo "RED verified"

      - name: Apply stale-client hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          swp = Path('sw.js')
          sw = swp.read_text(encoding='utf-8')
          sw = sw.replace('const CACHE="shatranj-arab-v2";','const CACHE="shatranj-arab-v3";',1)
          old = '''self.addEventListener("activate",e=>{
            e.waitUntil(
              caches.keys()
                .then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k))))
                .then(()=>self.clients.claim())
            );
          });'''
          new = '''self.addEventListener("activate",e=>{
            e.waitUntil((async()=>{
              const keys=await caches.keys();
              await Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)));
              await self.clients.claim();
              const clients=await self.clients.matchAll({type:"window",includeUncontrolled:true});
              await Promise.all(clients.map(client=>client.navigate(client.url).catch(()=>null)));
            })());
          });'''
          if old not in sw:
              raise SystemExit('activate block not found')
          sw = sw.replace(old,new,1)
          swp.write_text(sw,encoding='utf-8')

          np = Path('site-notifications.js')
          notifications = np.read_text(encoding='utf-8')
          needle = "  'use strict';\n"
          insert = """  'use strict';

            function removeStaleMobileDashboard() {
              if (!window.matchMedia('(max-width:600px)').matches) return;
              document.querySelectorAll('.home-header #dashboardNav,.home-header .dashboard-link').forEach(el => el.remove());
              document.querySelectorAll('.home-header a,.home-header button').forEach(el => {
                if (el.textContent.trim() === 'لوحة التحكم') el.remove();
              });
            }
            removeStaleMobileDashboard();
          """
          if 'function removeStaleMobileDashboard()' not in notifications:
              if needle not in notifications:
                  raise SystemExit('notification insertion point not found')
              notifications = notifications.replace(needle,insert,1)
          np.write_text(notifications,encoding='utf-8')

          ip = Path('index.html')
          html = ip.read_text(encoding='utf-8')
          html = html.replace('site-notifications.js?v=20260903-2','site-notifications.js?v=20260905-3',1)
          ip.write_text(html,encoding='utf-8')
          PY

      - name: Verify GREEN
        run: |
          python tests/test_stale_mobile_dashboard_hotfix.py
          python tests/test_header_dashboard_source_removed.py
          python tests/test_mobile_dashboard_removed.py

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/hotfix-stale-mobile-dashboard.yml
          git add sw.js site-notifications.js index.html tests/test_stale_mobile_dashboard_hotfix.py .github/workflows/hotfix-stale-mobile-dashboard.yml
          git commit -m "إزالة لوحة التحكم من النسخ المخزنة في الجوال"
          git push origin main
