name: Apply split tournament header 22px

on:
  push:
    paths:
      - '.github/workflows/apply-tournament-header-split22.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Split tournament header and enlarge count
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tournaments.html')
          s = p.read_text(encoding='utf-8')
          old = '''main{padding:34px 0 48px}.page-head{display:flex;align-items:center;margin-bottom:4px;padding:18px 20px;border:1px solid var(--hero-cyan-line);border-radius:18px;background:linear-gradient(145deg,rgba(8,62,64,.86),rgba(7,49,51,.8));box-shadow:0 13px 30px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.025)}.page-head-title{display:flex;align-items:center;gap:10px;width:100%}.page-head h1{margin:0;color:var(--hero-gold);font-size:30px}.count{color:var(--hero-gold-2);font-size:18px;font-weight:900;white-space:nowrap}.tournament-intro-strip'''
          new = '''main{padding:34px 0 48px}.page-head{display:flex;align-items:center;margin-bottom:4px;padding:0;border:1px solid var(--hero-cyan-line);border-radius:18px;background:linear-gradient(145deg,rgba(8,62,64,.86),rgba(7,49,51,.8));box-shadow:0 13px 30px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.025);overflow:hidden}.page-head-title{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;width:100%;position:relative;min-height:66px}.page-head-title::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(216,182,101,.28);transform:translateX(-.5px)}.page-head h1{margin:0;color:var(--hero-gold);font-size:30px;display:flex;align-items:center;justify-content:center;text-align:center}.count{color:var(--hero-gold-2);font-size:22px;font-weight:900;white-space:nowrap;display:flex;align-items:center;justify-content:center;text-align:center}.tournament-intro-strip'''
          if old not in s:
              raise SystemExit('expected tournament header CSS not found')
          s = s.replace(old, new, 1)
          s = s.replace('.page-head{padding:15px}.page-head-title{gap:8px}.page-head h1{font-size:24px}.count{font-size:16px}', '.page-head{padding:0}.page-head-title{min-height:58px}.page-head h1{font-size:24px}.count{font-size:22px}', 1)
          p.write_text(s, encoding='utf-8')

          index = Path('index.html')
          i = index.read_text(encoding='utf-8')
          i = i.replace('tournaments.html?v=20260909-center4', 'tournaments.html?v=20260909-split22')
          index.write_text(i, encoding='utf-8')
          PY
      - name: Verify split header
        run: python tests/test_tournament_header_compact.py
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tournaments.html index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'style: split tournament header and enlarge count'
            git push origin main
          fi