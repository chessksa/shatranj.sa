name: Apply header source removal and fresh navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-header-source-removal.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify RED
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          Path('tests/test_header_dashboard_source_removed.py').write_text(
              base64.b64decode('').decode('utf-8'),
              encoding='utf-8'
          )
          PY
          set +e
          python tests/test_header_dashboard_source_removed.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected RED before implementation, but test already passes"
            exit 1
          fi
          echo "RED verified"

      - name: Remove dashboard source and refresh service worker
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          ip = Path('index.html')
          html = ip.read_text(encoding='utf-8')
          pattern = r'''\n\s*<a id="dashboardNav" class="header-action header-tile dashboard-link" href="#register">\s*<span class="header-tile-icon" aria-hidden="true">⚙</span><span>لوحة التحكم</span>\s*</a>\s*\n'''
          html, count = re.subn(pattern, '\n', html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one dashboardNav header element, removed {count}')
          ip.write_text(html, encoding='utf-8')

          Path('sw.js').write_text(
              base64.b64decode('').decode('utf-8'),
              encoding='utf-8'
          )
          PY

      - name: Verify GREEN
        run: |
          python tests/test_header_dashboard_source_removed.py
          python tests/test_mobile_dashboard_removed.py
          python tests/test_home_header_controls.py

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-header-source-removal.yml
          git add index.html sw.js tests/test_header_dashboard_source_removed.py .github/workflows/apply-header-source-removal.yml
          git commit -m "حذف لوحة التحكم من المصدر وتحديث كاش الصفحة"
          git push origin main
