name: Verify tournament round break RED

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tournament-round-break-red.yml'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm round-break test fails before implementation
        shell: bash
        run: |
          if python tests/test_tournament_round_break.py; then
            echo 'Expected tournament round-break regression test to fail before implementation.' >&2
            exit 1
          fi
          echo 'RED confirmed: round-break behavior is not implemented yet.'
