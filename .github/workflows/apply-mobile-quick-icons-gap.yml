name: Apply mobile quick icons gap
on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_mobile_quick_icons_gap.py'
      - '.github/workflows/apply-mobile-quick-icons-gap.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply mobile gap
        run: python tools/apply_mobile_quick_icons_gap.py
      - name: Verify mobile gap
        run: python tests/test_mobile_quick_icons_gap.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-theme-base.css home-theme.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "style: set visible mobile home action gaps to 2px"
          git push
