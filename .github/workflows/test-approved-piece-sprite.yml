name: Test approved piece sprite

on:
  push:
    branches:
      - 'fix/approved-brown-ivory-pieces'
    paths:
      - 'play-v8.js'
      - 'play-v10-match.js'
      - 'cm-chessboard-shatranj.css'
      - 'assets/pieces/shatranj-approved.svg'
      - 'tests/test_approved_piece_sprite.py'
      - '.github/workflows/test-approved-piece-sprite.yml'
  pull_request:
    paths:
      - 'play-v8.js'
      - 'play-v10-match.js'
      - 'cm-chessboard-shatranj.css'
      - 'assets/pieces/shatranj-approved.svg'
      - 'tests/test_approved_piece_sprite.py'
      - '.github/workflows/test-approved-piece-sprite.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_approved_piece_sprite.py
      - run: node --check play-v8.js
      - run: node --check play-v10-match.js
