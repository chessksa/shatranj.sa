name: Test approved piece sprite

on:
  push:
    branches:
      - 'main'
      - 'fix/self-contained-approved-pieces'
    paths:
      - 'play-v8.js'
      - 'play-v10-match.js'
      - 'play-v10.html'
      - 'cm-chessboard-shatranj-v3.css'
      - 'assets/pieces/shatranj-approved-20260904.svg'
      - 'assets/pieces/approved-dark-20260904.png'
      - 'assets/pieces/approved-light-20260904.png'
      - 'tests/test_approved_piece_sprite.py'
      - '.github/workflows/test-approved-piece-sprite.yml'
  pull_request:
    paths:
      - 'play-v8.js'
      - 'play-v10-match.js'
      - 'play-v10.html'
      - 'cm-chessboard-shatranj-v3.css'
      - 'assets/pieces/shatranj-approved-20260904.svg'
      - 'assets/pieces/approved-dark-20260904.png'
      - 'assets/pieces/approved-light-20260904.png'
      - 'tests/test_approved_piece_sprite.py'
      - '.github/workflows/test-approved-piece-sprite.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_approved_piece_sprite.py
      - run: node --check play-v8.js
      - run: node --check play-v10-match.js
