name: Apply welcome ticker cache bust
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-welcome-ticker-cache-bust.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire ticker only into home page
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('index.html')
          text=path.read_text(encoding='utf-8')

          players_marker="  ALL_PLAYERS=(data||[]).map(player=>({\n    ...player,\n    username:usernameMap.get(String(player.id))||''\n  }));"
          players_hook="\n\n  window.__HOME_PLAYERS__=ALL_PLAYERS;\n  window.dispatchEvent(new CustomEvent('home-players-loaded',{detail:ALL_PLAYERS}));"
          if 'window.__HOME_PLAYERS__=ALL_PLAYERS' not in text:
              if players_marker not in text:
                  raise SystemExit('players marker not found')
              text=text.replace(players_marker,players_marker+players_hook,1)

          old='<script src="site-notifications.js?v=20260906-welcome2"></script>'
          new='<script src="home-welcome-ticker.js?v=20260906-1"></script>\n<script src="site-notifications.js?v=20260906-welcome3"></script>'
          if 'home-welcome-ticker.js?v=' not in text:
              if old not in text:
                  raise SystemExit('home script insertion marker not found')
              text=text.replace(old,new,1)

          path.write_text(text,encoding='utf-8')
          PY
      - name: Verify dedicated home ticker
        run: |
          python tests/test_welcome_ticker_loader.py
          python tests/test_welcome_ticker_cache_bust.py
          python tests/test_global_arial_font.py
          node --check home-welcome-ticker.js
      - name: Commit home ticker wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: show latest members ticker on home page only'
          git pull --rebase origin main
          git push origin main
