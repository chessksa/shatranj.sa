name: Apply welcome ticker cache bust
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-welcome-ticker-cache-bust.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force fresh home notification wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          old='site-notifications.js?v=20260905-3'
          new='site-notifications.js?v=20260906-welcome1'
          if old not in text:
              raise SystemExit('old site-notifications cache marker not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify welcome ticker cache bust
        run: |
          python tests/test_welcome_ticker_cache_bust.py
          grep -q "welcome-ticker-core.mjs?v=20260906-1" site-notifications.js
      - name: Commit cache bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: force fresh welcome ticker loader'
          git push
