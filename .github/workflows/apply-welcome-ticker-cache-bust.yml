name: Apply home welcome ticker
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-welcome-ticker-cache-bust.yml'
      - '.github/scripts/apply_home_ticker.py'
      - 'tests/test_welcome_ticker_loader.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply inline home ticker
        run: python .github/scripts/apply_home_ticker.py
      - name: Verify inline home-only ticker
        run: |
          python tests/test_welcome_ticker_loader.py
          python tests/test_welcome_ticker_cache_bust.py
          python tests/test_global_arial_font.py
          grep -q 'id="welcomeTicker"' index.html
          grep -q 'function renderWelcomeTicker' index.html
          grep -q 'renderWelcomeTicker(ALL_PLAYERS);' index.html
          if grep -q 'home-welcome-ticker.js' index.html; then exit 1; fi
      - name: Commit home-only ticker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: inline latest members ticker on home only'
          git pull --rebase origin main
          git push origin main
