name: Test play-v10 cm preview

on:
  push:
    branches:
      - 'fix/prematch-cm-chessboard'
    paths:
      - 'play-v10-match.js'
      - 'tests/test_play_v10_cm_preview.py'
      - '.github/workflows/test-play-v10-cm-preview.yml'
  pull_request:
    paths:
      - 'play-v10-match.js'
      - 'tests/test_play_v10_cm_preview.py'
      - '.github/workflows/test-play-v10-cm-preview.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_play_v10_cm_preview.py
      - run: node --check play-v10-match.js
