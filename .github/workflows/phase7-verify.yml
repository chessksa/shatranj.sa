name: Phase 7 Verification

on:
  push:
    branches:
      - feature/phase7-retire-v1
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260912_phase7_*'
      - 'v2/play/**'
      - 'tests/test_v7_*'
      - '.github/workflows/phase7-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Phase 7 retirement contract
        run: python -m pytest -q tests/test_v7_*.py
      - name: V2 live-play regression contracts
        run: |
          python tests/test_v2_edge_function.py
          python tests/test_v2_live_actions.py
          python tests/test_v2_live_schema.py
          python tests/test_v2_matchmaking_ui.py
          python tests/test_v2_play_api.py
          python tests/test_v2_play_shell.py
