name: Bump approved piece JS cache

on:
  push:
    branches:
      - 'fix/approved-brown-ivory-pieces'
    paths:
      - '.github/workflows/bump-approved-piece-js-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/approved-brown-ivory-pieces
          fetch-depth: 0

      - name: Force browsers to fetch fixed piece scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('play-v10.html')
          html = path.read_text(encoding='utf-8')
          replacements = {
              "play-v8.js?v=20260904-4": "play-v8.js?v=20260904-5",
              "play-v10-match.js?v=20260904-4": "play-v10-match.js?v=20260904-5",
          }
          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f'expected cache reference not found: {old}')
              html = html.replace(old, new)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Verify targeted piece fix
        shell: bash
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_approved_piece_sprite.py
          node --check play-v8.js
          node --check play-v10-match.js
          rm -rf tests/__pycache__

      - name: Commit cache bump
        shell: bash
        run: |
          rm -f .github/workflows/bump-approved-piece-js-cache.yml
          git config user.name "chessksa"
          git config user.email "gmel1199@gmail.com"
          git add -A
          git commit -m "fix: force browsers to load corrected chess pieces"
          git push origin HEAD:fix/approved-brown-ivory-pieces
