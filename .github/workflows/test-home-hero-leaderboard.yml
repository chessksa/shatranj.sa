name: Test home hero leaderboard

on:
  push:
    branches:
      - hero-leaderboard-top10
      - main
    paths:
      - index.html
      - home-theme.css
      - tests/test_home_hero_leaderboard.py
      - .github/workflows/test-home-hero-leaderboard.yml
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - home-theme.css
      - tests/test_home_hero_leaderboard.py
      - .github/workflows/test-home-hero-leaderboard.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_home_hero_leaderboard.py -q
