name: Fix dashboard desktop only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dashboard-desktop-only.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify RED
        run: |
          cat > tests/test_dashboard_desktop_mobile_split.py <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('home-theme.css').read_text(encoding='utf-8')
          notifications = Path('site-notifications.js').read_text(encoding='utf-8')
          header = html.split('<header class="home-header">',1)[1].split('</header>',1)[0]
          assert '<a id="dashboardNav" class="header-action header-tile dashboard-link"' in header
          marker = '/* Mobile header remove dashboard final 20260905 */'
          assert marker in css
          assert 'body.home-signed-in .compact-member-nav .dashboard-link{display:none!important}' in css.split(marker,1)[1]
          assert "if (!window.matchMedia('(max-width:600px)').matches) return;" in notifications
          print('dashboard desktop/mobile split: PASS')
          PY
          set +e
          python tests/test_dashboard_desktop_mobile_split.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected RED before implementation"
            exit 1
          fi
          echo "RED verified"

      - name: Restore desktop dashboard only
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          anchor = '      <div id="siteNotificationHost" class="header-notification-host"></div>\n'
          dashboard = (
              '      <a id="dashboardNav" class="header-action header-tile dashboard-link" href="#register">\n'
              '        <span class="header-tile-icon" aria-hidden="true">⚙</span><span>لوحة التحكم</span>\n'
              '      </a>\n\n'
          )
          if '<a id="dashboardNav" class="header-action header-tile dashboard-link"' not in html:
              if anchor not in html:
                  raise SystemExit('header insertion point not found')
              html = html.replace(anchor, dashboard + anchor, 1)
          p.write_text(html, encoding='utf-8')

          Path('tests/test_header_dashboard_source_removed.py').write_text(
              'from pathlib import Path\n'
              'html = Path("index.html").read_text(encoding="utf-8")\n'
              'sw = Path("sw.js").read_text(encoding="utf-8")\n'
              'css = Path("home-theme.css").read_text(encoding="utf-8")\n'
              'header = html.split(\'<header class="home-header">\', 1)[1].split(\'</header>\', 1)[0]\n'
              'assert \'id="dashboardNav"\' in header, "dashboardNav must remain in desktop header source"\n'
              'assert \'لوحة التحكم\' in header\n'
              'marker = \'/* Mobile header remove dashboard final 20260905 */\'\n'
              'assert marker in css\n'
              'assert \'body.home-signed-in .compact-member-nav .dashboard-link{display:none!important}\' in css.split(marker,1)[1]\n'
              'assert \'const CACHE="shatranj-arab-v3";\' in sw\n'
              'assert \'client.navigate(client.url)\' in sw\n'
              'print("desktop dashboard present + mobile dashboard hidden: PASS")\n',
              encoding='utf-8'
          )

          Path('tests/test_stale_mobile_dashboard_hotfix.py').write_text(
              'from pathlib import Path\n'
              'html = Path("index.html").read_text(encoding="utf-8")\n'
              'sw = Path("sw.js").read_text(encoding="utf-8")\n'
              'notifications = Path("site-notifications.js").read_text(encoding="utf-8")\n'
              'assert \'<a id="dashboardNav"\' in html\n'
              'assert \'const CACHE="shatranj-arab-v3";\' in sw\n'
              'assert \'client.navigate(client.url)\' in sw\n'
              'assert \'function removeStaleMobileDashboard()\' in notifications\n'
              'assert ".home-header #dashboardNav,.home-header .dashboard-link" in notifications\n'
              'assert "if (!window.matchMedia(\'(max-width:600px)\').matches) return;" in notifications\n'
              'assert "el.textContent.trim() === \'لوحة التحكم\'" in notifications\n'
              'assert \'site-notifications.js?v=20260905-3\' in html\n'
              'print("stale mobile dashboard hotfix: PASS")\n',
              encoding='utf-8'
          )
          PY

      - name: Verify GREEN
        run: |
          python tests/test_dashboard_desktop_mobile_split.py
          python tests/test_header_dashboard_source_removed.py
          python tests/test_stale_mobile_dashboard_hotfix.py
          python tests/test_mobile_dashboard_removed.py

      - name: Commit and remove workflow
        run: |
          rm .github/workflows/fix-dashboard-desktop-only.yml
          git add index.html tests/test_dashboard_desktop_mobile_split.py tests/test_header_dashboard_source_removed.py tests/test_stale_mobile_dashboard_hotfix.py .github/workflows/fix-dashboard-desktop-only.yml
          git commit -m "إبقاء لوحة التحكم في الكمبيوتر وإخفاؤها في الجوال"
          git push origin main
