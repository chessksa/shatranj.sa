name: Verify silent computer sync notice

on:
  push:
    paths:
      - 'tests/test_computer_sync_notice_silent.py'
      - 'play-computer.js'
      - '.github/workflows/verify-computer-sync-notice-silent.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify silent successful reconciliation
        run: python tests/test_computer_sync_notice_silent.py
