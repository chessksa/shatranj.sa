name: Apply home theme cache bump

on:
  push:
    branches: [main]
    paths:
      - ci/bump_home_theme_cache.py
      - .github/workflows/apply-home-theme-cache.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ci/bump_home_theme_cache.py
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_home_theme_cache_buster.py
      - name: Commit cache bump
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: refresh homepage theme cache"
          git push
