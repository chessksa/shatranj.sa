name: Apply mobile header centered 22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-header-centered-22.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify RED
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_mobile_header_identity_22.py')
          p.write_text("""from pathlib import Path
css = Path('home-theme.css').read_text(encoding='utf-8')
html = Path('index.html').read_text(encoding='utf-8')
marker = '/* Mobile member identity centered 22px 20260905 */'
assert marker in css
section = css.split(marker, 1)[1]
assert 'font-size:22px!important;' in section
assert 'flex-direction:row!important;' in section
assert 'justify-content:center!important;' in section
assert '.compact-member-nav .header-member-points small{display:none!important}' in section
assert 'grid-template-columns:repeat(3,minmax(0,1fr))!important;' in section
assert 'grid-column:1!important;' in section
assert 'grid-column:2!important;' in section
assert 'grid-column:3!important;' in section
assert 'home-theme.css?v=20260905-11' in html
print('mobile header identity 22: PASS')
""", encoding='utf-8')
          PY
          set +e
          python tests/test_mobile_header_identity_22.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected RED before implementation, but test already passes"
            exit 1
          fi
          echo "RED verified"

      - name: Implement centered identity and single lower row
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          cssp = Path('home-theme.css')
          css = cssp.read_text(encoding='utf-8')
          marker = '/* Mobile member identity centered 22px 20260905 */'
          rule = '''

/* Mobile member identity centered 22px 20260905 */
@media(max-width:600px){
  body.home-signed-in .compact-member-nav .nav-user{
    grid-template-columns:repeat(3,minmax(0,1fr))!important;
    column-gap:6px!important;
    row-gap:6px!important;
  }
  body.home-signed-in .compact-member-nav .header-member{
    grid-column:1/-1!important;
  }
  body.home-signed-in .compact-member-nav .header-member-link.header-tile{
    position:relative!important;
    width:100%!important;
    min-height:50px!important;
    padding-inline:54px!important;
    justify-content:center!important;
  }
  body.home-signed-in .compact-member-nav .header-member-avatar-wrap{
    position:absolute!important;
    right:10px!important;
    top:50%!important;
    transform:translateY(-50%)!important;
  }
  body.home-signed-in .compact-member-nav .header-member-copy{
    width:100%!important;
    min-width:0!important;
    display:flex!important;
    flex-direction:row!important;
    align-items:baseline!important;
    justify-content:center!important;
    gap:8px!important;
  }
  body.home-signed-in .compact-member-nav .header-member-copy>strong{
    flex:0 1 auto!important;
    min-width:0!important;
    max-width:calc(100% - 58px)!important;
    margin:0!important;
    font-size:22px!important;
    line-height:1!important;
    white-space:nowrap!important;
    overflow:hidden!important;
    text-overflow:ellipsis!important;
    text-align:center!important;
  }
  body.home-signed-in .compact-member-nav .header-member-points{
    flex:0 0 auto!important;
    min-width:0!important;
    display:inline-flex!important;
    flex-direction:row!important;
    align-items:baseline!important;
    justify-content:center!important;
    line-height:1!important;
  }
  body.home-signed-in .compact-member-nav .header-member-points small{display:none!important}
  body.home-signed-in .compact-member-nav .header-member-points b{
    margin:0!important;
    font-size:22px!important;
    line-height:1!important;
  }
  body.home-signed-in .compact-member-nav .header-notification-host{
    grid-column:1!important;
    grid-row:2!important;
    order:0!important;
  }
  body.home-signed-in .compact-member-nav .header-tournaments{
    grid-column:2!important;
    grid-row:2!important;
    order:0!important;
  }
  body.home-signed-in .compact-member-nav .nav-logout{
    grid-column:3!important;
    grid-row:2!important;
    order:0!important;
  }
  body.home-signed-in .compact-member-nav .header-notification-host,
  body.home-signed-in .compact-member-nav .header-tournaments,
  body.home-signed-in .compact-member-nav .nav-logout{
    width:100%!important;
    min-width:0!important;
    max-width:none!important;
    height:42px!important;
    min-height:42px!important;
    margin:0!important;
  }
}
'''
          if marker not in css:
              css += rule
          cssp.write_text(css, encoding='utf-8')

          ip = Path('index.html')
          html = ip.read_text(encoding='utf-8')
          html = re.sub(r'home-theme\.css\?v=20260905-\d+', 'home-theme.css?v=20260905-11', html, count=1)
          ip.write_text(html, encoding='utf-8')

          for p in Path('tests').glob('test_*.py'):
              s = p.read_text(encoding='utf-8')
              ns = re.sub(r'home-theme\.css\?v=20260905-\d+', 'home-theme.css?v=20260905-11', s)
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
          PY

      - name: Verify GREEN
        run: |
          python tests/test_mobile_header_identity_22.py
          python tests/test_mobile_header_two_rows.py
          python tests/test_home_header_controls.py

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-mobile-header-centered-22.yml
          git add home-theme.css index.html tests .github/workflows/apply-mobile-header-centered-22.yml
          git commit -m "توسيط اسم العضو والنقاط في هيدر الجوال"
          git push origin main
