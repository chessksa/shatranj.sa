name: Apply play cache reset
on:
  push:
    paths:
      - '.github/workflows/apply-play-cache-reset.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix one-time cache reset and refresh play assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = '20260903-7'

          sw_lines = [
              'const CACHE="shatranj-saudi-v6";',
              'const ASSETS=["./","./index.html","./styles.css","./app.js","./config.js","./manifest.webmanifest"];',
              'const PLAY_PATHS=["/play.html","/play-live.js","/realistic-pieces.css","/assets/pieces/"];',
              '',
              'self.addEventListener("install",e=>{',
              '  self.skipWaiting();',
              '  e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)));',
              '});',
              '',
              'self.addEventListener("activate",e=>{',
              '  e.waitUntil(',
              '    caches.keys()',
              '      .then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k))))',
              '      .then(()=>self.clients.claim())',
              '  );',
              '});',
              '',
              'self.addEventListener("fetch",e=>{',
              '  const url=new URL(e.request.url);',
              '  const isPlayAsset=PLAY_PATHS.some(path=>url.pathname.endsWith(path)||url.pathname.includes(path));',
              '  if(isPlayAsset){',
              '    e.respondWith(fetch(new Request(e.request,{cache:"no-store"})).catch(()=>caches.match(e.request)));',
              '    return;',
              '  }',
              '  e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));',
              '});',
              ''
          ]
          Path('sw.js').write_text('\n'.join(sw_lines), encoding='utf-8')

          p = Path('play.html')
          html = p.read_text(encoding='utf-8')
          html, n = re.subn(
              r"const PLAY_CACHE_RESET_VERSION = '[^']+';",
              f"const PLAY_CACHE_RESET_VERSION = '{version}';",
              html,
              count=1
          )
          if n != 1:
              raise SystemExit('cache reset version marker not found')

          bad = "if(sessionStorage.getItem(resetKey)===PLAY_CACHE_RESET_VERSION || params.get('ui')===PLAY_CACHE_RESET_VERSION) return;"
          good = "if(sessionStorage.getItem(resetKey)===PLAY_CACHE_RESET_VERSION) return;"
          if bad in html:
              html = html.replace(bad, good, 1)
          elif good not in html:
              raise SystemExit('cache reset guard not found')

          html = re.sub(r'realistic-pieces\.css\?v=[^"\']+', f'realistic-pieces.css?v={version}', html, count=1)
          html = re.sub(r'play-live\.js\?v=[^"\']+', f'play-live.js?v={version}', html, count=1)
          p.write_text(html, encoding='utf-8')

          test = Path('tests/test_play_cache_reset.py').read_text(encoding='utf-8')
          if "params.get('ui')===PLAY_CACHE_RESET_VERSION" not in test:
              test += "\nassert \"params.get('ui')===PLAY_CACHE_RESET_VERSION\" not in html, \"ui query must not bypass the one-time cache cleanup\"\n"
              Path('tests/test_play_cache_reset.py').write_text(test, encoding='utf-8')
          PY

          python tests/test_play_cache_reset.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sw.js play.html tests/test_play_cache_reset.py
          git commit -m "Fix cache reset guard so fresh chess assets can load"
          git push
