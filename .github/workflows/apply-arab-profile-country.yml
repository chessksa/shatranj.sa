name: Apply Arab profile country

on:
  push:
    branches:
      - feature/shatranj-arab
    paths:
      - 'ci/apply_arab_profile_country.py'
      - '.github/workflows/apply-arab-profile-country.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shatranj-arab
      - name: Apply Arab profile country display
        run: python ci/apply_arab_profile_country.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.js player.js profile-section.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: show Arab country consistently on profiles"
          git push origin HEAD:feature/shatranj-arab
