name: Apply 3D Staunton pieces
on:
  push:
    branches:
      - feature/3d-staunton-pieces
    paths:
      - .github/workflows/apply-play-v9-direct-board-fixed.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/3d-staunton-pieces
      - run: python -m pip install pytest
      - run: python .tmp/3d-staunton/apply.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -r .tmp/3d-staunton
          git rm .github/workflows/apply-3d-staunton-pieces.yml || true
          git add assets/pieces/shatranj-3d-staunton.svg play-v8.js play-v10-match.js play-v10.html play-v8.html tests/test_approved_piece_sprite.py tests/test_play_v10_cm_preview.py
          git commit -m 'feat: use 3D Staunton chess pieces'
          git push origin HEAD:feature/3d-staunton-pieces
# rerun after verified bundle repair
