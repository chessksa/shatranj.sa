name: Apply direct board play route fixed
on:
  push:
    paths:
      - '.github/workflows/apply-play-v9-direct-board-fixed.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create direct-board page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('play-v8.html').read_text(encoding='utf-8')
          js = Path('play-v8.js').read_text(encoding='utf-8')
          css = Path('play-v8.css').read_text(encoding='utf-8')

          html = html.replace('play-v8.css?v=20260903-8', 'play-v9.css?v=20260903-9')
          html = html.replace('play-v8.js?v=20260903-8', 'play-v9.js?v=20260903-9')
          html = html.replace('<section class="matchmaking-screen" id="matchmakingScreen" hidden>', '<section class="matchmaking-screen" id="matchmakingScreen" hidden style="display:none!important">')
          html = html.replace('<main class="page" id="gamePage" hidden>', '<main class="page" id="gamePage">')

          top_block = '''          <section class="player-card opponent-slot" id="topPlayerCard">
            <div class="opponent-search-panel" id="opponentSearchPanel">
              <div id="opponentSearchSetup">
                <div class="opponent-search-title">اختر زمن المباراة</div>
                <div class="opponent-time-options" aria-label="اختيار زمن المباراة">
                  <button class="opponent-time-option" type="button" data-minutes="3"><strong>3</strong><span>دقائق</span></button>
                  <button class="opponent-time-option" type="button" data-minutes="5"><strong>5</strong><span>دقائق</span></button>
                  <button class="opponent-time-option" type="button" data-minutes="10"><strong>10</strong><span>دقائق</span></button>
                </div>
                <p class="opponent-search-error" id="opponentSearchError"></p>
              </div>
              <div id="opponentSearchWaiting" hidden>
                <div class="opponent-waiting-line"><span class="search-dots" aria-hidden="true"><i></i><i></i><i></i></span><strong>جارٍ البحث عن خصم</strong></div>
                <div class="opponent-waiting-meta"><span>النطاق <b id="inlineMatchmakingRange">±150</b></span><span>الانتظار <b id="inlineMatchmakingElapsed">00:00</b></span></div>
                <button class="inline-cancel-search" id="cancelInlineMatchmaking" type="button">إلغاء البحث</button>
                <p class="opponent-search-error" id="opponentSearchWaitingError"></p>
              </div>
            </div>
            <div class="top-player-live" id="topPlayerLive" hidden>
              <div class="avatar" id="topAvatar"></div>
              <div class="player-info">
                <div class="status">متصل</div>
                <a class="name player-profile-link" id="topName" aria-label="فتح ملف اللاعب">—</a>
                <div class="location">📍 <span id="topLocation">—</span></div>
                <div class="rating"><span id="topRating">—</span> <span class="trend">📈</span></div>
              </div>
              <div class="clock-box"><div class="clock" id="topClock">00:00</div><div class="clock-progress"><span style="width:76%"></span></div></div>
            </div>
          </section>'''

          p = re.compile(r'          <section class="player-card">\s*<div class="avatar" id="topAvatar"></div>.*?          </section>\n\n          <section class="actions-card">', re.S)
          html, n = p.subn(top_block + '\n\n          <section class="actions-card">', html, count=1)
          assert n == 1, 'top card replacement failed'

          extra_css = '''
    .opponent-slot{position:relative;overflow:hidden}
    .opponent-search-panel{grid-column:1/-1;width:100%;text-align:center;align-self:center}
    .opponent-search-title{font-weight:800;font-size:16px;margin-bottom:12px;color:var(--text)}
    .opponent-time-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
    .opponent-time-option{min-height:72px;border:1px solid rgba(224,181,103,.38);border-radius:12px;background:rgba(2,28,33,.42);color:var(--text);font:700 12px inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:.14s ease}
    .opponent-time-option:hover,.opponent-time-option:focus-visible{border-color:var(--gold);background:rgba(224,181,103,.09);outline:none}
    .opponent-time-option strong{font-size:24px;line-height:1.05;color:var(--gold)}
    .opponent-time-option span{font-size:11px;color:var(--muted)}
    .opponent-waiting-line{display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px}
    .search-dots{display:inline-flex;align-items:center;gap:5px;direction:ltr;height:18px}
    .search-dots i{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.28;animation:searchDot 1.05s infinite ease-in-out}
    .search-dots i:nth-child(2){animation-delay:.16s}.search-dots i:nth-child(3){animation-delay:.32s}
    @keyframes searchDot{0%,65%,100%{opacity:.24;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
    .opponent-waiting-meta{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:11px;color:var(--muted)}
    .opponent-waiting-meta b{color:var(--gold);margin-inline-start:3px}
    .inline-cancel-search{margin-top:11px;height:32px;padding:0 14px;border:1px solid rgba(255,255,255,.20);border-radius:9px;background:transparent;color:var(--text);font:700 11px inherit;cursor:pointer}
    .opponent-search-error{min-height:16px;margin:7px 0 0;color:#ff8d8d;font-size:11px}
    .top-player-live{display:contents}
    @media(max-width:900px){.opponent-time-option{min-height:58px}.opponent-time-option strong{font-size:21px}.opponent-search-title{font-size:14px;margin-bottom:8px}}
'''
          html = html.replace('\n  </style>', extra_css + '\n  </style>', 1)

          js = js.replace("const cancelMatchmakingBtn = $('cancelMatchmaking');", "const cancelMatchmakingBtn = $('cancelMatchmaking');\nconst opponentSearchPanel = $('opponentSearchPanel');\nconst opponentSearchSetup = $('opponentSearchSetup');\nconst opponentSearchWaiting = $('opponentSearchWaiting');\nconst opponentSearchError = $('opponentSearchError');\nconst opponentSearchWaitingError = $('opponentSearchWaitingError');\nconst inlineMatchmakingRange = $('inlineMatchmakingRange');\nconst inlineMatchmakingElapsed = $('inlineMatchmakingElapsed');\nconst cancelInlineMatchmakingBtn = $('cancelInlineMatchmaking');\nconst topPlayerLive = $('topPlayerLive');")

          state_pat = re.compile(r'function showMatchmakingState\(state\)\{.*?\n\}\n\nfunction showGamePage\(\)\{.*?\n\}', re.S)
          state_new = '''function showMatchmakingState(state){
  matchmakingScreen.hidden = true;
  gamePage.hidden = false;
  matchmakingSetup.hidden = state !== 'setup';
  matchmakingWaiting.hidden = state !== 'waiting';
  matchmakingFound.hidden = true;
  opponentSearchPanel.hidden = false;
  opponentSearchSetup.hidden = state !== 'setup';
  opponentSearchWaiting.hidden = state !== 'waiting';
  topPlayerLive.hidden = true;
  leaveText.textContent = 'رجوع';
}

function showGamePage(){
  matchmakingScreen.hidden = true;
  gamePage.hidden = false;
  opponentSearchPanel.hidden = true;
  topPlayerLive.hidden = false;
  leaveText.textContent = 'مغادرة المباراة';
}'''
          js, n = state_pat.subn(state_new, js, count=1)
          assert n == 1, 'state functions replacement failed'

          js = js.replace("  matchmakingProfile.textContent = `${profile.name} — تصنيف ${profile.rating}`;\n  return profile;", "  matchmakingProfile.textContent = `${profile.name} — تصنيف ${profile.rating}`;\n  bottomNameEl.textContent = profile.name || 'أنت';\n  bottomRatingEl.textContent = profile.rating ?? '—';\n  bottomLocationEl.textContent = [profile.city, profile.region].filter(Boolean).join(' — ') || '—';\n  setPlayerProfileLink(bottomNameEl, {id: profile.id || profile.player_id || profile.user_id || null});\n  return profile;")

          enter_pat = re.compile(r'async function enterMatchedGame\(row\)\{.*?\n\}', re.S)
          enter_new = '''async function enterMatchedGame(row){
  if(!row?.game_id || !row?.seat_key || !row?.color) return;
  liveGameId = row.game_id;
  seatKey = row.seat_key;
  myColor = row.color;
  sessionStorage.setItem('shatranj_live_game_id', row.game_id);
  sessionStorage.setItem('shatranj_live_game_code', row.game_code || '');
  sessionStorage.setItem('shatranj_live_seat_key', row.seat_key);
  sessionStorage.setItem('shatranj_live_color', row.color);
  sessionStorage.removeItem('shatranj_matchmaking_active');
  sessionStorage.removeItem('shatranj_matchmaking_started_at');
  clearInterval(matchmakingTimer);
  history.replaceState(null, '', `play-v9.html?game=${encodeURIComponent(row.game_id)}`);
  showGamePage();
  await refreshLiveGame(true);
  clearInterval(gamePollTimer);
  gamePollTimer=setInterval(()=>{ if(!document.hidden && serverState?.status!=='finished') refreshLiveGame(false); },1200);
}'''
          js, n = enter_pat.subn(enter_new, js, count=1)
          assert n == 1, 'enterMatchedGame replacement failed'

          js = js.replace("  matchmakingRange.textContent = `±${Number(row?.rating_window || 150)}`;", "  matchmakingRange.textContent = `±${Number(row?.rating_window || 150)}`;\n  inlineMatchmakingElapsed.textContent = formatElapsed(seconds);\n  inlineMatchmakingRange.textContent = `±${Number(row?.rating_window || 150)}`;")
          js = js.replace("    matchmakingWaitingError.textContent = 'تعذر متابعة البحث. سنحاول من جديد تلقائيًا.';", "    matchmakingWaitingError.textContent = 'تعذر متابعة البحث. سنحاول من جديد تلقائيًا.';\n    opponentSearchWaitingError.textContent = 'تعذر متابعة البحث. سنحاول من جديد تلقائيًا.';")
          js = js.replace("  matchmakingError.textContent = '';\n  matchmakingWaitingError.textContent = '';", "  matchmakingError.textContent = '';\n  matchmakingWaitingError.textContent = '';\n  opponentSearchError.textContent = '';\n  opponentSearchWaitingError.textContent = '';")

          err_old = "    matchmakingError.textContent = String(err?.message || '').includes('active game exists')\n      ? 'لديك مباراة نشطة بالفعل.'\n      : 'تعذر بدء البحث عن خصم. حاول مرة أخرى.';"
          err_new = "    const message = String(err?.message || '').includes('active game exists')\n      ? 'لديك مباراة نشطة بالفعل.'\n      : 'تعذر بدء البحث عن خصم. حاول مرة أخرى.';\n    matchmakingError.textContent = message;\n    opponentSearchError.textContent = message;"
          assert err_old in js, 'error block missing'
          js = js.replace(err_old, err_new, 1)

          js = js.replace("  matchmakingWaitingError.textContent = '';\n}", "  matchmakingWaitingError.textContent = '';\n  opponentSearchWaitingError.textContent = '';\n}", 1)
          js = js.replace("cancelMatchmakingBtn.addEventListener('click',cancelMatchmaking);", "cancelMatchmakingBtn.addEventListener('click',cancelMatchmaking);\ncancelInlineMatchmakingBtn.addEventListener('click',cancelMatchmaking);")
          js = js.replace("  if(!matchmakingWaiting.hidden && matchmakingStartedAt){\n    matchmakingElapsed.textContent=formatElapsed((Date.now()-matchmakingStartedAt)/1000);\n  }", "  if(!opponentSearchWaiting.hidden && matchmakingStartedAt){\n    const elapsed=formatElapsed((Date.now()-matchmakingStartedAt)/1000);\n    matchmakingElapsed.textContent=elapsed;\n    inlineMatchmakingElapsed.textContent=elapsed;\n  }")

          init_old = "  showMatchmakingState('setup');\n  await loadMyProfile();\n\n  if(sessionStorage.getItem('shatranj_matchmaking_active')==='1'){"
          init_new = "  showMatchmakingState('setup');\n  await loadMyProfile();\n  game = new Chess();\n  flipped = false;\n  orientationInitialized = true;\n  renderCoords();\n  renderBoard();\n  topClockEl.textContent = '--:--';\n  bottomClockEl.textContent = '--:--';\n\n  if(sessionStorage.getItem('shatranj_matchmaking_active')==='1'){"
          assert init_old in js, 'init block missing'
          js = js.replace(init_old, init_new, 1)
          js = js.replace('play-v8.html', 'play-v9.html')

          assert '<main class="page" id="gamePage">' in html
          assert 'id="opponentSearchPanel"' in html and 'search-dots' in html
          assert 'play-v9.css?v=20260903-9' in html and 'play-v9.js?v=20260903-9' in html
          assert 'game = new Chess();' in js
          enter = js.split('async function enterMatchedGame(row){',1)[1].split('\n}',1)[0]
          assert 'location.href' not in enter and 'history.replaceState' in enter and 'showGamePage();' in enter
          assert "cancelInlineMatchmakingBtn.addEventListener('click',cancelMatchmaking);" in js

          Path('play-v9.html').write_text(html, encoding='utf-8')
          Path('play-v9.js').write_text(js, encoding='utf-8')
          Path('play-v9.css').write_text(css, encoding='utf-8')

          for name in ['index.html','profile.html','profile.js','profile-section.js','site-notifications.js']:
              p = Path(name)
              text = p.read_text(encoding='utf-8').replace('play-v8.html', 'play-v9.html')
              p.write_text(text, encoding='utf-8')
              assert 'play-v9.html' in text

          swp = Path('sw.js')
          sw = swp.read_text(encoding='utf-8')
          sw = sw.replace('/play-v8.html","/play-live.js', '/play-v8.html","/play-v9.html","/play-live.js')
          sw = sw.replace('/play-v8.js","/realistic-pieces.css', '/play-v8.js","/play-v9.js","/realistic-pieces.css')
          sw = sw.replace('/play-v8.css","/assets/pieces/', '/play-v8.css","/play-v9.css","/assets/pieces/')
          swp.write_text(sw, encoding='utf-8')
          print('direct board play route: PASS')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add play-v9.html play-v9.js play-v9.css index.html profile.html profile.js profile-section.js site-notifications.js sw.js
          git commit -m "Open board directly and search inside opponent slot"
          git push
