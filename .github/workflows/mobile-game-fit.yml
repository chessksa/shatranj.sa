name: Mobile game fit

on:
  push:
    paths:
      - '.github/workflows/mobile-game-fit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact mobile game layout
        run: python ci/apply_mobile_game_fit.py
      - name: Verify compact mobile game layout
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('play-v10.html').read_text(encoding='utf-8')
          assert '/* Compact mobile no-scroll game layout */' in html
          assert 'height:74px!important' in html
          assert 'html,body{height:100%;overflow:hidden!important}' in html
          assert 'calc(100dvh - 270px)' in html
          assert 'min-height:36px!important' in html
          print('mobile game layout is compact and viewport-fitted')
          PY
      - name: Commit compact mobile game layout
        run: |
          if git diff --quiet -- play-v10.html; then
            echo "No layout changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play-v10.html
          git commit -m "fix: compact mobile player cards to fit game viewport"
          git push
