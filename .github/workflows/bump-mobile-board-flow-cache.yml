name: Bump mobile board flow cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-mobile-board-flow-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump exact board helper cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('play-v10.html')
          s = p.read_text(encoding='utf-8')
          old = 'exact-board-v13.js?v=20260903-14'
          new = 'exact-board-v13.js?v=20260904-15'
          if old not in s and new not in s:
              raise SystemExit('exact-board helper reference not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Verify mobile flow test
        run: python -m pytest -q tests/test_mobile_play_layout.py
      - name: Commit cache bump
        run: |
          rm .github/workflows/bump-mobile-board-flow-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play-v10.html .github/workflows/bump-mobile-board-flow-cache.yml
          git commit -m "fix: publish mobile board flow immediately"
          git push origin main
