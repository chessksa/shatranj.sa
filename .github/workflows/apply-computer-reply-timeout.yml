name: Apply computer reply and timeout resolution

on:
  push:
    paths:
      - '.github/workflows/apply-computer-reply-timeout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fix
        run: python tools/apply_computer_reply_timeout_resolution.py
      - name: Verify focused regression
        run: python tests/test_computer_reply_and_timeout_resolution.py
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/computer-game/index.ts play-computer.js play-v10.html index.html
          git commit -m 'fix: recover computer replies and settle timeout'
          git push origin HEAD:main
