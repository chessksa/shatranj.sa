name: Apply desktop computer back button side fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-computer-time-chooser-visibility.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add focused regression test
        run: |
          cat > tests/test_computer_desktop_back_side.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          PLAY = (ROOT / 'play-v10.html').read_text(encoding='utf-8')

          expected = '''@media(min-width:901px){
                body.computer-game.pregame .computer-chooser-header{
                  direction:rtl!important;
                }
              }'''
          assert expected in PLAY, 'desktop computer time chooser back button must be on the opposite/right side'
          print('desktop computer back side: PASS')
          PY

      - name: Confirm regression before fix
        run: |
          if python tests/test_computer_desktop_back_side.py; then
            echo 'Expected regression test to fail before applying the fix.'
            exit 1
          else
            echo 'Regression reproduced as expected.'
          fi

      - name: Apply desktop-only side change
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('play-v10.html')
          html = path.read_text(encoding='utf-8')
          anchor = '    /* COMPUTER MOBILE CHOOSER POLISH V2 20260906 */\n'
          block = '''    /* COMPUTER DESKTOP CHOOSER: back button on opposite side */
              @media(min-width:901px){
                body.computer-game.pregame .computer-chooser-header{
                  direction:rtl!important;
                }
              }
          '''
          if block in html:
              raise SystemExit('desktop back-side block already present')
          if anchor not in html:
              raise SystemExit('computer chooser CSS anchor not found')
          path.write_text(html.replace(anchor, block + anchor, 1), encoding='utf-8')
          PY

      - name: Verify focused change
        run: |
          python tests/test_computer_desktop_back_side.py
          python tests/test_computer_chooser_style.py
          python tests/test_mobile_time_options_style.py
          python tests/test_computer_time_chooser_visibility.py

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-v10.html tests/test_computer_desktop_back_side.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: move desktop computer back button to right'
          git pull --rebase origin main
          git push origin HEAD:main
