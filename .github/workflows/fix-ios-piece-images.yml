name: Fix iOS chess piece images

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-ios-piece-images.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace broken raster entries and bump cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64, io
          from PIL import Image

          sprite = Path('assets/pieces/shatranj-approved-20260904.svg')
          text = sprite.read_text(encoding='utf-8')
          if 'xmlns:xlink=' not in text:
              text = text.replace('xmlns="http://www.w3.org/2000/svg"', 'xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"', 1)

          fixes = {
            'wb': '',
            'wp': '',
            'bp': ''
          }

          dims = {'wb': (21,38), 'wp':(26,38), 'bp':(26,38)}
          for code, b64 in fixes.items():
              raw = base64.b64decode(b64, validate=True)
              img = Image.open(io.BytesIO(raw)); img.verify()
              w,h = dims[code]
              tw = w * 38 / h
              x = (40 - tw)/2
              href = 'data:image/png;base64,' + b64
              replacement = f'<g id="{code}"><image x="{x:.3f}" y="1" width="{tw:.3f}" height="38" preserveAspectRatio="xMidYMid meet" href="{href}" xlink:href="{href}"/></g>'
              pattern = rf'<g id="{code}">.*?</g>'
              text, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'could not replace {code}')
          sprite.write_text(text, encoding='utf-8')

          for f in ('play-v8.js','play-v10-match.js'):
              p = Path(f); s = p.read_text(encoding='utf-8')
              old = 'pieces/shatranj-approved-20260904.svg?v=20260904-7'
              new = 'pieces/shatranj-approved-20260904.svg?v=20260904-8'
              if old not in s: raise SystemExit(f'missing {old} in {f}')
              p.write_text(s.replace(old,new), encoding='utf-8')

          p = Path('play-v10.html'); s = p.read_text(encoding='utf-8')
          for old,new in [
            ('play-v8.js?v=20260904-7','play-v8.js?v=20260904-8'),
            ('play-v10-match.js?v=20260904-7','play-v10-match.js?v=20260904-8')]:
              if old not in s: raise SystemExit(f'missing {old}')
              s = s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64, io, xml.etree.ElementTree as ET
          from PIL import Image
          p=Path('assets/pieces/shatranj-approved-20260904.svg')
          ET.parse(p)
          s=p.read_text(encoding='utf-8')
          for code in ('wb','wp','bp'):
              m=re.search(rf'<g id="{code}">.*?href="data:image/png;base64,([A-Za-z0-9+/=]+)"',s,re.S)
              assert m, code
              raw=base64.b64decode(m.group(1),validate=True)
              im=Image.open(io.BytesIO(raw)); im.verify()
          assert '20260904-8' in Path('play-v8.js').read_text()
          assert '20260904-8' in Path('play-v10-match.js').read_text()
          print('verified iOS piece image payloads')
          PY
          node --check play-v8.js
          node --check play-v10-match.js

      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-ios-piece-images.yml
          git config user.name "chessksa"
          git config user.email "gmel1199@gmail.com"
          git add -A
          git commit -m "fix: repair pawn and bishop images on iOS"
          git push origin HEAD:main
