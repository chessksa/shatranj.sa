name: Verify tournament inline type scale

on:
  push:
    branches:
      - fix-tournament-inline-type-scale-20260910

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tournament detail type test
        run: python -m pytest tests/test_tournament_detail_type_scale.py -q
