name: Verify tournament inline type scale

on:
  push:
    branches:
      - fix-tournament-inline-type-scale-20260910

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tournament detail type test
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/test_tournament_detail_type_scale.py')
          ns['test_tournament_detail_typography_is_forced_inline_at_16_14_12']()
          PY
