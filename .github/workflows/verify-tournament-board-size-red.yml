name: Verify tournament board size RED

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tournament-board-size-red.yml'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm board-size regression fails before implementation
        shell: bash
        run: |
          set +e
          python tests/test_tournament_banner_board_size.py > /tmp/board-red.log 2>&1
          code=$?
          cat /tmp/board-red.log
          if [ "$code" -eq 0 ]; then
            echo 'Expected board-size regression to fail before implementation.'
            exit 1
          fi
          exit 0
