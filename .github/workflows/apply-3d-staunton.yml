name: Apply 3D Staunton pieces

on:
  push:
    branches:
      - 'feat/3d-staunton-pieces'
    paths:
      - '.github/workflows/apply-3d-staunton.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3d-staunton-pieces
      - name: Switch board to 3D Staunton sprite
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ('play-v8.js','play-v10-match.js'):
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              old="pieces:{file:'pieces/shatranj-approved.svg',tileSize:40}"
              new="pieces:{file:'pieces/shatranj-3d-staunton.svg',tileSize:40}"
              if old not in text and new not in text:
                  raise SystemExit(f'piece sprite anchor not found in {name}')
              text=text.replace(old,new)
              p.write_text(text,encoding='utf-8')

          p=Path('play-v10.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace("play-v8.js?v=20260903-13","play-v8.js?v=20260904-3d1")
          text=text.replace("play-v10-match.js?v=20260903-14","play-v10-match.js?v=20260904-3d1")
          p.write_text(text,encoding='utf-8')

          p=Path('play-v8.html')
          text=p.read_text(encoding='utf-8')
          import re
          text=re.sub(r"play-v8\.js\?v=[^\"']+", "play-v8.js?v=20260904-3d1", text)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Verify integration
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_approved_piece_sprite.py tests/test_play_v10_cm_preview.py tests/test_cm_chessboard_integration.py
          node --check play-v8.js
          node --check play-v10-match.js
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-v8.js play-v10-match.js play-v10.html play-v8.html
          git commit -m 'feat: use 3D Staunton pieces on board'
          git push origin HEAD:feat/3d-staunton-pieces
