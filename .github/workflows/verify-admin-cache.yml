name: Verify admin cache refresh

on:
  push:
    branches:
      - fix/admin-cache-refresh
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run admin cache regression tests
        run: python -m pytest -q tests/test_admin_cache_refresh.py
