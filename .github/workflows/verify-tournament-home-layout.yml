name: Verify tournament and home layout

on:
  push:
    paths:
      - '.github/workflows/verify-tournament-home-layout.yml'
      - 'tests/test_tournament_home_layout.py'
      - 'tournaments.html'
      - 'home-theme.css'
      - 'supabase/migrations/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify requested layout
        run: python tests/test_tournament_home_layout.py
