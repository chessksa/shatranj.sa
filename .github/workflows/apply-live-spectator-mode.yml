name: Apply live spectator mode

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply_live_spectator_mode.py'
      - '.github/workflows/apply-live-spectator-mode.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply spectator UI changes
        run: python scripts/apply_live_spectator_mode.py
      - name: Verify spectator contract
        run: python tests/test_live_spectator_mode.py
      - name: Check JavaScript syntax
        run: |
          cp play-live.js /tmp/play-live.mjs
          node --check /tmp/play-live.mjs
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add watch.html play.html play-live.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: enable live match spectating'
          git push
