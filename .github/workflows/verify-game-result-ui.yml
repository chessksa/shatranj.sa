name: Verify finished game result UI

on:
  push:
    branches:
      - main
      - feature/game-result-ui-20260907
    paths:
      - 'play-v10.html'
      - 'play-v8.js'
      - 'play-computer.js'
      - 'tests/test_game_result_ui.py'
      - '.github/workflows/verify-game-result-ui.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply result UI on feature branch
        if: github.ref_name == 'feature/game-result-ui-20260907'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pvp_path = Path('play-v8.js')
          computer_path = Path('play-computer.js')
          html_path = Path('play-v10.html')

          pvp = pvp_path.read_text(encoding='utf-8')
          computer = computer_path.read_text(encoding='utf-8')
          html = html_path.read_text(encoding='utf-8')

          if 'function applyFinishedGameUI(result)' not in pvp:
              old = "const resignBtn = $('resignBtn');\nconst endGraceBtn = $('endGraceBtn');"
              new = "const resignBtn = $('resignBtn');\nconst topPlayerCard = $('topPlayerCard');\nconst bottomPlayerCard = $('bottomPlayerCard');\nconst gameActions = $('gameActions');\nconst endGraceBtn = $('endGraceBtn');"
              if old not in pvp:
                  raise SystemExit('PvP DOM hook marker missing')
              pvp = pvp.replace(old, new, 1)

              marker = "function applyServerState(row, force=false){"
              result_fn = r'''function applyFinishedGameUI(result){
  if(!topPlayerCard || !bottomPlayerCard || !gameActions) return;
  [topPlayerCard,bottomPlayerCard].forEach((card)=>{
    card.classList.remove('result-winner','result-loser');
  });
  gameActions.classList.add('game-result-actions');

  const banner=document.createElement('div');
  banner.className='game-result-banner';
  const title=document.createElement('span');
  title.className='game-result-title';
  const name=document.createElement('strong');
  name.className='game-result-name';
  const winnerColor = result==='1-0' ? 'w' : result==='0-1' ? 'b' : null;

  if(!winnerColor){
    title.textContent='انتهت المباراة بالتعادل';
    banner.appendChild(title);
    gameActions.replaceChildren(banner);
    return;
  }

  const topColor = myColor === 'w' ? 'b' : 'w';
  const winner = colorInfo(winnerColor);
  const winnerCard = winnerColor===topColor ? topPlayerCard : bottomPlayerCard;
  const loserCard = winnerColor===topColor ? bottomPlayerCard : topPlayerCard;
  winnerCard.classList.add('result-winner');
  loserCard.classList.add('result-loser');
  title.textContent='مبروك';
  name.textContent=winner.name || (winnerColor===myColor ? 'أنت' : 'الخصم');
  banner.append(title,name);
  gameActions.replaceChildren(banner);
}

'''
              if marker not in pvp:
                  raise SystemExit('PvP result renderer marker missing')
              pvp = pvp.replace(marker, result_fn + marker, 1)

              old_finish = "    setTimeout(()=>alert(finishedMessage(row.result)),120);"
              new_finish = "    applyFinishedGameUI(row.result);\n    toast(finishedMessage(row.result),4200);"
              if old_finish not in pvp:
                  raise SystemExit('PvP finish marker missing')
              pvp = pvp.replace(old_finish, new_finish, 1)

          if 'function showGameResultUI(outcome)' not in computer:
              old = "const topPlayerCard = $('topPlayerCard');\nconst opponentSearchPanel = $('opponentSearchPanel');"
              new = "const topPlayerCard = $('topPlayerCard');\nconst bottomPlayerCard = $('bottomPlayerCard');\nconst gameActions = $('gameActions');\nconst opponentSearchPanel = $('opponentSearchPanel');"
              if old not in computer:
                  raise SystemExit('computer DOM hook marker missing')
              computer = computer.replace(old, new, 1)

              marker = "function formatClock(ms) {"
              result_fn = r'''function showGameResultUI(outcome) {
  if (!topPlayerCard || !bottomPlayerCard || !gameActions || !outcome) return;
  [topPlayerCard, bottomPlayerCard].forEach((card) => {
    card.classList.remove('result-winner', 'result-loser');
  });
  gameActions.classList.add('game-result-actions');

  const banner = document.createElement('div');
  banner.className = 'game-result-banner';
  const title = document.createElement('span');
  title.className = 'game-result-title';
  const name = document.createElement('strong');
  name.className = 'game-result-name';

  if (outcome === 'draw') {
    title.textContent = 'انتهت المباراة بالتعادل';
    banner.appendChild(title);
    gameActions.replaceChildren(banner);
    return;
  }

  const playerWon = outcome === 'player';
  const winnerCard = playerWon ? bottomPlayerCard : topPlayerCard;
  const loserCard = playerWon ? topPlayerCard : bottomPlayerCard;
  winnerCard.classList.add('result-winner');
  loserCard.classList.add('result-loser');
  title.textContent = 'مبروك';
  name.textContent = playerWon
    ? (bottomNameEl.textContent.trim() || 'أنت')
    : (topNameEl.textContent.trim() || 'الكمبيوتر');
  banner.append(title, name);
  gameActions.replaceChildren(banner);
}

'''
              if marker not in computer:
                  raise SystemExit('computer result renderer marker missing')
              computer = computer.replace(marker, result_fn + marker, 1)

              replacements = [
                  ("finishGame('انتهى وقتك — فاز الكمبيوتر');", "finishGame('انتهى وقتك — فاز الكمبيوتر', null, 'computer');", 1),
                  ("finishGame('انتهى وقت الكمبيوتر — فزت');", "finishGame('انتهى وقت الكمبيوتر — فزت', null, 'player');", 1),
                  ("function finishGame(message, rating = null) {", "function finishGame(message, rating = null, outcome = null) {", 1),
                  ("  renderClocks();\n  toast(`${message}${ratingSuffix(rating)}`, 5200);", "  renderClocks();\n  showGameResultUI(outcome);\n  toast(`${message}${ratingSuffix(rating)}`, 5200);", 1),
                  ("      finishGame('استسلمت أمام الكمبيوتر');", "      finishGame('استسلمت أمام الكمبيوتر', null, 'computer');", 1),
              ]
              for old, new, expected in replacements:
                  count = computer.count(old)
                  if count != expected:
                      raise SystemExit(f'computer patch marker mismatch for {old!r}: expected {expected}, found {count}')
                  computer = computer.replace(old, new, expected)

              rated_start = computer.index('function finishRatedResult(payload, computerCapMs = null) {')
              rated_end = computer.index('function checkGuestGameResult()', rated_start)
              rated_fn = r'''function finishRatedResult(payload, computerCapMs = null) {
  const results = {
    win: { message: 'فزت على الكمبيوتر', outcome: 'player' },
    loss: { message: 'فاز الكمبيوتر', outcome: 'computer' },
    draw: { message: 'انتهت المباراة بالتعادل', outcome: 'draw' }
  };
  if (payload) syncRatedClocks(payload, computerCapMs);
  const resolved = results[payload?.result] || { message: 'انتهت المباراة', outcome: null };
  finishGame(resolved.message, payload?.rating || null, resolved.outcome);
}

'''
              computer = computer[:rated_start] + rated_fn + computer[rated_end:]

              guest_start = computer.index('function checkGuestGameResult() {')
              guest_end = computer.index('async function invokeComputer', guest_start)
              guest_fn = r'''function checkGuestGameResult() {
  if (game.in_checkmate()) {
    finishGame(game.turn() === 'b' ? 'فزت على الكمبيوتر' : 'فاز الكمبيوتر', null, game.turn() === 'b' ? 'player' : 'computer');
    return true;
  }
  if (game.in_draw()) {
    finishGame('انتهت المباراة بالتعادل', null, 'draw');
    return true;
  }
  return false;
}

'''
              computer = computer[:guest_start] + guest_fn + computer[guest_end:]

          if '.player-card.result-winner' not in html:
              anchor = "    .actions-card{border-radius:18px;"
              result_css = """    .player-card.result-winner{background:linear-gradient(135deg,rgba(25,132,70,.94),rgba(9,82,43,.96));border-color:rgba(110,239,150,.95);box-shadow:0 12px 30px rgba(0,0,0,.24),inset 0 0 0 1px rgba(255,255,255,.08)}\n    .player-card.result-loser{background:linear-gradient(135deg,rgba(151,45,45,.94),rgba(95,24,28,.96));border-color:rgba(255,132,132,.92);box-shadow:0 12px 30px rgba(0,0,0,.24),inset 0 0 0 1px rgba(255,255,255,.06)}\n    .player-card.result-winner .location,.player-card.result-loser .location,.player-card.result-winner .rating-label,.player-card.result-loser .rating-label{color:rgba(255,255,255,.86)}\n    .player-card.result-winner .status,.player-card.result-loser .status{color:#fff}.player-card.result-winner .status::before,.player-card.result-loser .status::before{background:#fff}\n    .actions-card.game-result-actions{grid-template-columns:1fr!important;overflow:hidden;background:linear-gradient(135deg,rgba(224,181,103,.20),rgba(7,54,61,.92));border-color:rgba(224,181,103,.88)}\n    .game-result-banner{width:100%;min-height:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px;text-align:center;direction:rtl}.game-result-title{font-size:18px;font-weight:900;color:#f6d78e}.game-result-name{font-size:20px;font-weight:900;color:#fff;overflow-wrap:anywhere}\n"""
              if anchor not in html:
                  raise SystemExit('result CSS anchor missing')
              html = html.replace(anchor, result_css + anchor, 1)

          html = re.sub(r"play-computer\.js\?v=\d{8}-\d+", 'play-computer.js?v=20260907-25', html, count=1)
          html = re.sub(r"play-v8\.js\?v=\d{8}-\d+", 'play-v8.js?v=20260907-4', html, count=1)

          pvp_path.write_text(pvp, encoding='utf-8')
          computer_path.write_text(computer, encoding='utf-8')
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Verify result UI behavior
        run: python tests/test_game_result_ui.py

      - name: Verify computer regressions
        run: |
          python tests/test_computer_clock_monotonic.py
          python tests/test_computer_reply_and_timeout_resolution.py
          python tests/test_computer_server_two_phase_move.py

      - name: Verify JavaScript syntax
        run: |
          cp play-v8.js /tmp/play-v8.mjs
          cp play-computer.js /tmp/play-computer.mjs
          node --check /tmp/play-v8.mjs
          node --check /tmp/play-computer.mjs

      - name: Commit verified feature branch changes
        if: github.ref_name == 'feature/game-result-ui-20260907'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-v10.html play-v8.js play-computer.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: show winner and loser result state'
          git push origin HEAD:feature/game-result-ui-20260907
