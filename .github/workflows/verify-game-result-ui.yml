name: Verify finished game result UI

on:
  push:
    branches:
      - main
      - feature/game-result-ui-20260907
    paths:
      - 'play-v10.html'
      - 'play-v8.js'
      - 'play-computer.js'
      - 'tests/test_game_result_ui.py'
      - '.github/workflows/verify-game-result-ui.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Regression guard for the finished-game visual state.
      - name: Verify result UI behavior
        run: python tests/test_game_result_ui.py

      - name: Verify computer regressions
        run: |
          python tests/test_computer_clock_monotonic.py
          python tests/test_computer_reply_and_timeout_resolution.py
          python tests/test_computer_server_two_phase_move.py

      - name: Verify JavaScript syntax
        run: |
          cp play-v8.js /tmp/play-v8.mjs
          cp play-computer.js /tmp/play-computer.mjs
          node --check /tmp/play-v8.mjs
          node --check /tmp/play-computer.mjs
