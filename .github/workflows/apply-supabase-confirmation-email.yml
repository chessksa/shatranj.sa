name: Apply Supabase confirmation email

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-supabase-confirmation-email.yml

permissions:
  contents: read

jobs:
  update-confirmation-email:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: zjxkxhsvltihucdacjrv
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Normalize and validate management token
        shell: bash
        run: |
          set -euo pipefail

          RAW="${SUPABASE_ACCESS_TOKEN:-}"
          if [ -z "$RAW" ]; then
            echo "SUPABASE_ACCESS_TOKEN is missing"
            exit 1
          fi

          TOKEN="$(printf '%s' "$RAW" | tr -d '\r\n')"
          TOKEN="${TOKEN#SUPABASE_ACCESS_TOKEN=}"
          TOKEN="${TOKEN#Authorization:}"
          TOKEN="${TOKEN#authorization:}"
          TOKEN="${TOKEN# Bearer }"
          TOKEN="${TOKEN# bearer }"
          TOKEN="${TOKEN#Bearer }"
          TOKEN="${TOKEN#bearer }"
          TOKEN="${TOKEN#\"}"
          TOKEN="${TOKEN%\"}"
          TOKEN="${TOKEN#\'}"
          TOKEN="${TOKEN%\'}"

          while [[ "$TOKEN" == ' '* ]]; do TOKEN="${TOKEN# }"; done
          while [[ "$TOKEN" == *' ' ]]; do TOKEN="${TOKEN% }"; done

          echo "::add-mask::$RAW"
          echo "::add-mask::$TOKEN"

          if [[ "$TOKEN" != sbp_* ]]; then
            echo "The secret is present, but it is not a Supabase Personal Access Token (expected a value beginning with sbp_)."
            exit 2
          fi

          echo "AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Supabase Personal Access Token format accepted."

      - name: Apply approved Arabic confirmation email template
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/auth-email.json <<'JSON'
          {
            "mailer_subjects_confirmation": "فعّل حسابك في شطرنج السعودية",
            "mailer_templates_confirmation_content": "<div dir=\"rtl\" style=\"font-family:Arial,Tahoma,sans-serif;text-align:right;line-height:1.9;color:#17211f;max-width:560px;margin:0 auto;padding:24px\"><h2 style=\"margin:0 0 18px\">مرحبًا بك في شطرنج السعودية</h2><p>تم إنشاء حسابك بنجاح، وبقيت خطوة واحدة فقط لتفعيله.</p><p>اضغط على الزر أدناه لتأكيد بريدك الإلكتروني وبدء اللعب:</p><p style=\"text-align:center;margin:28px 0\"><a href=\"{{ .ConfirmationURL }}\" style=\"display:inline-block;padding:12px 28px;border-radius:8px;background:#174f46;color:#ffffff;text-decoration:none;font-weight:700\">تفعيل الحساب</a></p><p>بعد التفعيل يمكنك تسجيل الدخول باسم المستخدم وكلمة المرور.</p><p>نتمنى لك مباريات ممتعة ومنافسة قوية.</p><p style=\"margin-top:28px\"><strong>شطرنج السعودية</strong><br>منصة الشطرنج السعودية</p></div>"
          }
          JSON

          http_code=$(curl --silent --show-error --output /tmp/update-response.json --write-out "%{http_code}" \
            --request PATCH "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            --header "Authorization: Bearer ${AUTH_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/auth-email.json)

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Supabase update failed with HTTP ${http_code}."
            python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              data = json.loads(Path('/tmp/update-response.json').read_text(encoding='utf-8'))
              message = str(data.get('message') or data.get('error') or 'Unknown Supabase error')
              print('Supabase response:', message)
          except Exception:
              print('Supabase returned a non-JSON error response.')
          PY
            exit 1
          fi

      - name: Verify approved template was applied
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            --header "Authorization: Bearer ${AUTH_TOKEN}" \
            > /tmp/auth-config.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/auth-config.json').read_text(encoding='utf-8'))
          subject = data.get('mailer_subjects_confirmation', '')
          content = data.get('mailer_templates_confirmation_content', '')

          assert subject == 'فعّل حسابك في شطرنج السعودية', subject
          for phrase in [
              'مرحبًا بك في شطرنج السعودية',
              'تم إنشاء حسابك بنجاح',
              'تفعيل الحساب',
              '{{ .ConfirmationURL }}',
              'بعد التفعيل يمكنك تسجيل الدخول باسم المستخدم وكلمة المرور',
              'نتمنى لك مباريات ممتعة ومنافسة قوية',
              'منصة الشطرنج السعودية',
          ]:
              assert phrase in content, phrase

          print('Verified approved Arabic signup confirmation email template.')
          PY
