name: Play desktop fit notification verify

on:
  push:
    branches:
      - fix/play-desktop-fit-notification-20260914
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_play_desktop_fit_notification.py -q
