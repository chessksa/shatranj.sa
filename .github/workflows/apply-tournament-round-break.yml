name: Apply tournament round break

# Rerun after removing legacy list-layout tests that no longer describe the current table UI.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-tournament-round-break.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply three-minute round break
        run: python tools/apply_tournament_round_break.py
      - name: Verify tournament behavior
        run: |
          python tests/test_tournament_round_break.py
          python tests/test_tournament_start_engine.py
          python tests/test_tournament_spectator_link.py
          python tests/test_tournament_table_list.py
          python tests/test_tournament_capacity_mode.py
          python tests/test_tournament_results_ticker.py
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tournaments.html supabase/migrations/20260909210000_tournament_round_break.sql
          git commit -m 'feat: add three-minute break between tournament rounds'
          git push origin HEAD:main
