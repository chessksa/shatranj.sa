name: Verify Arab Chess domain
on:
  push:
    paths:
      - '.github/workflows/verify-arabchees-domain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dns_https:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose registrar authoritative name servers
        shell: bash
        run: |
          echo '--- Registered name servers from .com TLD ---'
          dig +short @a.gtld-servers.net arabchees.com NS || true
          echo '--- Check all 4 Dimofinf authoritative name servers ---'
          for ns in ns1.dimofinf.sa ns2.dimofinf.sa ns3.dimofinf.sa ns4.dimofinf.sa; do
            echo "==== $ns arabchees.com SOA ===="
            dig +time=3 +tries=1 @"$ns" arabchees.com SOA +noall +answer +comments || true
            echo "==== $ns arabchees.com A ===="
            dig +time=3 +tries=1 @"$ns" arabchees.com A +noall +answer +comments || true
            echo "==== $ns reference zone thiqqah.com SOA ===="
            dig +time=3 +tries=1 @"$ns" thiqqah.com SOA +noall +answer +comments || true
          done
          echo '--- DNSSEC parent DS (sanity check) ---'
          dig +time=3 +tries=1 @a.gtld-servers.net arabchees.com DS +noall +answer +comments || true
          echo '--- Public resolver A and WWW ---'
          dig +time=3 +tries=1 @8.8.8.8 arabchees.com A +noall +answer +comments || true
          dig +time=3 +tries=1 @1.1.1.1 www.arabchees.com CNAME +noall +answer +comments || true
          echo '--- HTTP on GitHub Pages origin, ignoring broken DNS ---'
          curl --noproxy '*' --resolve arabchees.com:80:185.199.108.153 -sS -I --max-time 15 http://arabchees.com/ | head -8 || true
          echo '--- HTTPS on GitHub Pages origin, ignoring broken DNS ---'
          curl --noproxy '*' --resolve arabchees.com:443:185.199.108.153 -sS -I --max-time 15 https://arabchees.com/ 2>&1 | head -5 || true
