name: Verify Arab Chess domain
on:
  push:
    paths:
      - '.github/workflows/verify-arabchees-domain.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  dns_https:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GitHub Pages certificate status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS --max-time 15 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" | python3 -c 'import json,sys; x=json.load(sys.stdin); print("cname:",x.get("cname")); print("https_enforced:",x.get("https_enforced")); print("https_certificate:",x.get("https_certificate")); print("pending_domain_unverified_at:",x.get("pending_domain_unverified_at")); print("protected_domain_state:",x.get("protected_domain_state"))'
      - name: Check Pages domain health and request certificate provisioning
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo '--- GitHub Pages DNS health ---'
          curl -sS --max-time 15 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/health" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d,ensure_ascii=False)[:3500])'
          echo '--- Request an idempotent custom domain refresh ---'
          http_code=$(curl --max-time 15 -sS -o /tmp/pages-repair.json -w '%{http_code}' -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"cname":"arabchees.com"}')
          echo "Pages update HTTP status: $http_code"
          cat /tmp/pages-repair.json
          echo
          if [[ "$http_code" != "204" ]]; then
            echo 'Token cannot update Pages settings; preserving existing domain.'
          else
            echo 'Pages accepted the custom domain refresh.'
          fi
      - name: Verify new DNS delegation and GitHub Pages
        shell: bash
        run: |
          echo '--- Parent delegation ---'
          dig +time=3 +tries=1 @a.gtld-servers.net arabchees.com NS +noall +answer +authority +comments || true
          echo '--- Public recursive DNS CAA (certificate authority) ---'
          dig +time=3 +tries=1 @8.8.8.8 arabchees.com CAA +noall +answer +comments || true
          echo '--- Public recursive DNS A ---'
          dig +time=3 +tries=1 @8.8.8.8 arabchees.com A +noall +answer +comments || true
          echo '--- Public recursive DNS www CNAME ---'
          dig +time=3 +tries=1 @8.8.8.8 www.arabchees.com CNAME +noall +answer +comments || true
          echo '--- Authoritative nameservers A, www, SOA ---'
          for ns in dns1.name-services.com dns2.name-services.com dns3.name-services.com dns4.name-services.com dns5.name-services.com; do
            echo "==== $ns SOA ===="
            dig +time=3 +tries=1 @"$ns" arabchees.com SOA +noall +answer +comments || true
            echo "==== $ns A ===="
            dig +time=3 +tries=1 @"$ns" arabchees.com A +noall +answer +comments || true
            echo "==== $ns www CNAME ===="
            dig +time=3 +tries=1 @"$ns" www.arabchees.com CNAME +noall +answer +comments || true
          done
          echo '--- Domain HTTPS ---'
          curl -IL --max-time 12 -sS https://arabchees.com/ 2>&1 | head -18 || true
          echo '--- Domain HTTP ---'
          curl -IL --max-time 12 -sS http://arabchees.com/ 2>&1 | head -18 || true
          echo '--- www HTTPS ---'
          curl -IL --max-time 12 -sS https://www.arabchees.com/ 2>&1 | head -18 || true
          echo '--- GitHub direct HTTP bypass DNS ---'
          curl --noproxy '*' --resolve arabchees.com:80:185.199.108.153 -sS -I --max-time 12 http://arabchees.com/ | head -10 || true
