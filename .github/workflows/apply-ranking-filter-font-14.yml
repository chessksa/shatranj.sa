name: Apply ranking filter font 14

on:
  push:
    branches:
      - fix/ranking-filter-font-14
    paths:
      - 'ci/apply_ranking_filter_font_14.py'
      - '.github/workflows/apply-ranking-filter-font-14.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python ci/apply_ranking_filter_font_14.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-theme.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: increase ranking filter font to 14px"
          git push
