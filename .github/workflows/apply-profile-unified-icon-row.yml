name: Apply unified profile icon row
on:
  push:
    branches:
      - feature/profile-unified-icon-row
    paths:
      - '.github/workflows/apply-profile-unified-icon-row.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply profile layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('profile.html')
          html = path.read_text(encoding='utf-8')

          old_stats = '''      <section class="stats" aria-label="إحصائيات اللاعب">
                  <div class="stat"><small>التصنيف</small><strong id="statRating">—</strong></div>
                  <div class="stat"><small>المباريات</small><strong id="statGames">—</strong></div>
                  <div class="stat"><small>فوز</small><strong id="statWins">—</strong></div>
                  <div class="stat"><small>تعادل</small><strong id="statDraws">—</strong></div>
                  <div class="stat"><small>خسارة</small><strong id="statLosses">—</strong></div>
                </section>'''.replace('                ', '')

          unified = '''      <section class="dashboard-icon-row" aria-label="إحصائيات وأقسام اللاعب">
            <div class="dashboard-icon-item">
              <span class="dashboard-icon-main"><span class="dashboard-icon-glyph" aria-hidden="true">♛</span><strong id="statRating">—</strong></span>
              <span class="dashboard-icon-label">النقاط</span>
            </div>
            <div class="dashboard-icon-item">
              <span class="dashboard-icon-main"><span class="dashboard-icon-glyph" aria-hidden="true">▦</span><strong id="statGames">—</strong></span>
              <span class="dashboard-icon-label">المباريات</span>
            </div>
            <div class="dashboard-icon-item">
              <span class="dashboard-icon-main"><span class="dashboard-icon-glyph" aria-hidden="true">✓</span><strong id="statWins">—</strong></span>
              <span class="dashboard-icon-label">فوز</span>
            </div>
            <div class="dashboard-icon-item">
              <span class="dashboard-icon-main"><span class="dashboard-icon-glyph" aria-hidden="true">＝</span><strong id="statDraws">—</strong></span>
              <span class="dashboard-icon-label">تعادل</span>
            </div>
            <div class="dashboard-icon-item">
              <span class="dashboard-icon-main"><span class="dashboard-icon-glyph" aria-hidden="true">×</span><strong id="statLosses">—</strong></span>
              <span class="dashboard-icon-label">خسارة</span>
            </div>
            <a class="dashboard-icon-item dashboard-icon-link" href="profile-section.html?section=friends">
              <span class="dashboard-icon-main"><span class="dashboard-icon-glyph" aria-hidden="true">♟</span><strong id="friendsCount">0</strong></span>
              <span class="dashboard-icon-label">الأصدقاء</span>
            </a>
            <a class="dashboard-icon-item dashboard-icon-link" href="profile-section.html?section=friend-requests">
              <span class="dashboard-icon-main"><span class="dashboard-icon-glyph" aria-hidden="true">✉</span><strong id="incomingCount">0</strong></span>
              <span class="dashboard-icon-label">طلبات الصداقة</span>
            </a>
            <a class="dashboard-icon-item dashboard-icon-link" href="profile-section.html?section=sent-requests">
              <span class="dashboard-icon-main"><span class="dashboard-icon-glyph" aria-hidden="true">↗</span><strong id="outgoingCount">0</strong></span>
              <span class="dashboard-icon-label">الطلبات المرسلة</span>
            </a>
            <a class="dashboard-icon-item dashboard-icon-link" href="profile-section.html?section=challenges">
              <span class="dashboard-icon-main"><span class="dashboard-icon-glyph" aria-hidden="true">♞</span><strong id="incomingChallengesCount">0</strong></span>
              <span class="dashboard-icon-label">التحديات</span>
            </a>
            <a class="dashboard-icon-item dashboard-icon-link" href="profile-section.html?section=sent-challenges">
              <span class="dashboard-icon-main"><span class="dashboard-icon-glyph" aria-hidden="true">⚑</span><strong id="outgoingChallengesCount">0</strong></span>
              <span class="dashboard-icon-label">التحديات المرسلة</span>
            </a>
          </section>'''

          if old_stats not in html:
              raise SystemExit('old stats block not found')
          html = html.replace(old_stats, unified, 1)
          html, removed = re.subn(r'\n\s*<nav class="profile-nav-grid" aria-label="أقسام العضو">.*?</nav>\n', '\n', html, count=1, flags=re.S)
          if removed != 1:
              raise SystemExit('old profile navigation block not found')

          old_ach = '.achievement-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.achievement{display:flex;align-items:center;gap:10px;padding:12px;'
          new_ach = '.achievement-grid{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}.achievement{display:flex;flex:0 0 min(210px,72vw);align-items:center;gap:10px;padding:12px;'
          if old_ach not in html:
              raise SystemExit('achievement layout rule not found')
          html = html.replace(old_ach, new_ach, 1)
          html = html.replace('@media(max-width:520px){.achievement-grid{grid-template-columns:1fr}}', '', 1)

          marker = '/* Unified dashboard icon row 20260903 */'
          if marker not in html:
              css = '''
              /* Unified dashboard icon row 20260903 */
              .dashboard-icon-row{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin:7px 0;overflow-x:auto;padding-bottom:2px}
              .dashboard-icon-item{min-width:0;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 5px;border:1px solid var(--line);border-radius:11px;background:rgba(13,56,57,.88);box-shadow:0 10px 26px rgba(0,0,0,.10);text-align:center}
              .dashboard-icon-link{transition:.16s}.dashboard-icon-link:hover{background:rgba(22,73,74,.96);transform:translateY(-1px)}
              .dashboard-icon-main{display:flex;align-items:center;justify-content:center;gap:5px;direction:rtl}
              .dashboard-icon-glyph{width:26px;height:26px;display:grid;place-items:center;font-size:20px;line-height:1;color:var(--gold)}
              .dashboard-icon-item strong{font-size:15px;color:var(--gold);line-height:1}
              .dashboard-icon-label{max-width:100%;font-size:10.5px;line-height:1.25;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
              @media(max-width:820px){.dashboard-icon-row{grid-template-columns:repeat(10,82px)}.dashboard-icon-item{min-height:70px}.dashboard-icon-label{font-size:10px}}
              @media(max-width:520px){.dashboard-icon-row{margin:6px 0;gap:5px;grid-template-columns:repeat(10,78px)}.dashboard-icon-item{min-height:66px;padding:7px 4px}.dashboard-icon-glyph{width:26px;height:26px;font-size:19px}}
              '''
              html = html.replace('</style>', css + '\n  </style>', 1)

          path.write_text(html, encoding='utf-8')
          PY

          python tests/test_profile_unified_icon_row.py
          python tests/test_profile_icon_navigation.py
          python tests/test_profile_compact_layout.py
          python tests/test_profile_compact_sections.py
          python tests/test_global_arial_font.py
          node --check profile.js

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile.html
          git commit -m "feat: unify member dashboard icons"
          git push
