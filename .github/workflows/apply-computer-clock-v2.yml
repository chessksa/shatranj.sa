name: Apply computer clock v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-computer-clock-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch rated computer clock
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          client_path = Path('play-computer.js')
          client = client_path.read_text(encoding='utf-8')

          sync_re = re.compile(r"function syncRatedClocks\(payload\) \{.*?\n\}", re.S)
          new_sync = """function syncRatedClocks(payload, computerCapMs = null) {
            if (!payload) return;
            playerTimeMs = Math.max(0, Number(payload.player_time_ms) || 0);
            const serverComputerTimeMs = Math.max(0, Number(payload.computer_time_ms) || 0);
            computerTimeMs = Number.isFinite(Number(computerCapMs))
              ? Math.max(0, Math.min(serverComputerTimeMs, computerCapMs))
              : serverComputerTimeMs;
            if (payload.status === 'active') {
              const serverNow = Date.parse(String(payload.server_now || ''));
              const turnStarted = Date.parse(String(payload.turn_started_at || ''));
              if (Number.isFinite(serverNow) && Number.isFinite(turnStarted)) {
                playerTimeMs = Math.max(0, playerTimeMs - Math.max(0, serverNow - turnStarted));
              }
              clockActiveSide = 'player';
              clockAnchorMs = Date.now();
            } else {
              clockActiveSide = null;
              clockAnchorMs = 0;
            }
            renderClocks();
          }"""
          client, count = sync_re.subn(new_sync, client, count=1)
          if count != 1:
              raise SystemExit(f'syncRatedClocks match count={count}')

          submit_re = re.compile(r"async function submitRatedMove\(move\) \{.*?\n\}\n\nfunction handleBoardInput", re.S)
          match = submit_re.search(client)
          if not match:
              raise SystemExit('submitRatedMove function not found')
          submit_block = match.group(0)
          response_re = re.compile(
              r"if \(!payload\?\.fen\) throw new Error\('Missing server position'\);\s*"
              r"game\.load\(payload\.fen\);\s*renderBoard\(true\);\s*syncRatedClocks\(payload\);\s*"
              r"if \(payload\.status === 'finished'\) finishRatedResult\(payload\);\s*else setComputerStatus\('جاهز'\);"
          )
          response_new = """if (!payload?.fen) throw new Error('Missing server position');
            const localComputerRemaining = currentClockMs('computer');
            game.load(payload.fen);
            renderBoard(true);
            syncRatedClocks(payload, localComputerRemaining);
            if (payload.status === 'finished') finishRatedResult(payload, localComputerRemaining);
            else setComputerStatus('جاهز');"""
          submit_block, response_count = response_re.subn(response_new, submit_block, count=1)
          if response_count != 1:
              raise SystemExit(f'submitRatedMove response match count={response_count}')
          client = client[:match.start()] + submit_block + client[match.end():]

          finish_re = re.compile(r"function finishRatedResult\(payload\) \{.*?\n\}", re.S)
          finish_match = finish_re.search(client)
          if not finish_match:
              raise SystemExit('finishRatedResult function not found')
          finish_block = finish_match.group(0)
          finish_block = finish_block.replace('function finishRatedResult(payload) {', 'function finishRatedResult(payload, computerCapMs = null) {', 1)
          finish_block = finish_block.replace('if (payload) syncRatedClocks(payload);', 'if (payload) syncRatedClocks(payload, computerCapMs);', 1)
          client = client[:finish_match.start()] + finish_block + client[finish_match.end():]

          validate_start = client.index("if (event.type === INPUT_EVENT_TYPE.validateMoveInput) {")
          validate_end = client.index("if (event.type === INPUT_EVENT_TYPE.moveInputCanceled)", validate_start)
          validate = client[validate_start:validate_end]
          rated_re = re.compile(
              r"if \(ratedMode\) \{\s*commitActiveClock\(\);\s*clockActiveSide = null;\s*clockAnchorMs = 0;\s*"
              r"renderClocks\(\);\s*Promise\.resolve\(\)\.then\(\(\) => submitRatedMove\(move\)\);\s*\} else \{"
          )
          rated_new = """if (ratedMode) {
              switchClock('computer');
              Promise.resolve().then(() => submitRatedMove(move));
            } else {"""
          validate, rated_count = rated_re.subn(rated_new, validate, count=1)
          if rated_count != 1:
              raise SystemExit(f'rated validate clock match count={rated_count}')
          client = client[:validate_start] + validate + client[validate_end:]
          client_path.write_text(client, encoding='utf-8')

          edge_path = Path('supabase/functions/computer-game/index.ts')
          edge = edge_path.read_text(encoding='utf-8')
          if 'const MIN_THINK_MS' not in edge:
              marker = 'const TIME_CONTROLS = new Set([5, 10, 15]);\n'
              if marker not in edge:
                  raise SystemExit('edge time controls marker not found')
              edge = edge.replace(marker, marker + 'const MIN_THINK_MS = { easy: 900, medium: 1200, hard: 1600 } as const;\n', 1)

          elapsed_re = re.compile(
              r"const computerStartedAt = Date\.now\(\);\s*const selected = chooseComputerMove\(chess, row\.level\);\s*"
              r"const computerElapsed = Math\.max\(1, Date\.now\(\) - computerStartedAt\);\s*"
              r"const computerTimeMs = Math\.max\(0, computerTimeBefore - computerElapsed\);"
          )
          elapsed_new = """const computerStartedAt = Date.now();
                const selected = chooseComputerMove(chess, row.level);
                const searchElapsed = Math.max(0, Date.now() - computerStartedAt);
                const waitMs = Math.max(0, MIN_THINK_MS[row.level] - searchElapsed);
                if (waitMs > 0) await new Promise((resolve) => setTimeout(resolve, waitMs));
                const computerElapsed = Math.max(1, Date.now() - computerStartedAt);
                const computerTimeMs = Math.max(0, computerTimeBefore - computerElapsed);"""
          edge, elapsed_count = elapsed_re.subn(elapsed_new, edge, count=1)
          if elapsed_count != 1:
              raise SystemExit(f'edge elapsed match count={elapsed_count}')
          edge_path.write_text(edge, encoding='utf-8')

          play_path = Path('play-v10.html')
          play = play_path.read_text(encoding='utf-8')
          if 'play-computer.js?v=20260906-4' in play:
              play = play.replace('play-computer.js?v=20260906-4', 'play-computer.js?v=20260906-5', 1)
          elif 'play-computer.js?v=20260906-5' not in play:
              raise SystemExit('computer cache key not found')
          play_path.write_text(play, encoding='utf-8')
          PY
      - name: Verify clock regression and syntax
        run: |
          python tests/test_computer_play_mode.py
          grep -q 'play-computer.js?v=20260906-5' play-v10.html
          cp play-computer.js /tmp/play-computer.mjs
          node --check /tmp/play-computer.mjs
      - name: Commit product fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-computer.js play-v10.html supabase/functions/computer-game/index.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep rated computer clock monotonic'
          git push