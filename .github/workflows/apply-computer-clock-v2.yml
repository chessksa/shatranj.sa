name: Apply computer clock v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-computer-clock-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch rated computer clock
        run: |
          python - <<'PY'
          from pathlib import Path

          client_path = Path('play-computer.js')
          client = client_path.read_text(encoding='utf-8')

          old_sync = """function syncRatedClocks(payload) {
            if (!payload) return;
            playerTimeMs = Math.max(0, Number(payload.player_time_ms) || 0);
            computerTimeMs = Math.max(0, Number(payload.computer_time_ms) || 0);
            if (payload.status === 'active') {
              const serverNow = Date.parse(String(payload.server_now || ''));
              const turnStarted = Date.parse(String(payload.turn_started_at || ''));
              if (Number.isFinite(serverNow) && Number.isFinite(turnStarted)) {
                playerTimeMs = Math.max(0, playerTimeMs - Math.max(0, serverNow - turnStarted));
              }
              clockActiveSide = 'player';
              clockAnchorMs = Date.now();
            } else {
              clockActiveSide = null;
              clockAnchorMs = 0;
            }
            renderClocks();
          }"""
          new_sync = """function syncRatedClocks(payload, computerCapMs = null) {
            if (!payload) return;
            playerTimeMs = Math.max(0, Number(payload.player_time_ms) || 0);
            const serverComputerTimeMs = Math.max(0, Number(payload.computer_time_ms) || 0);
            computerTimeMs = Number.isFinite(Number(computerCapMs))
              ? Math.max(0, Math.min(serverComputerTimeMs, computerCapMs))
              : serverComputerTimeMs;
            if (payload.status === 'active') {
              const serverNow = Date.parse(String(payload.server_now || ''));
              const turnStarted = Date.parse(String(payload.turn_started_at || ''));
              if (Number.isFinite(serverNow) && Number.isFinite(turnStarted)) {
                playerTimeMs = Math.max(0, playerTimeMs - Math.max(0, serverNow - turnStarted));
              }
              clockActiveSide = 'player';
              clockAnchorMs = Date.now();
            } else {
              clockActiveSide = null;
              clockAnchorMs = 0;
            }
            renderClocks();
          }"""
          if old_sync not in client:
              raise SystemExit('syncRatedClocks marker not found')
          client = client.replace(old_sync, new_sync, 1)

          old_submit = """    if (!payload?.fen) throw new Error('Missing server position');
            game.load(payload.fen);
            renderBoard(true);
            syncRatedClocks(payload);
            if (payload.status === 'finished') finishRatedResult(payload);
            else setComputerStatus('جاهز');"""
          new_submit = """    if (!payload?.fen) throw new Error('Missing server position');
            const localComputerRemaining = currentClockMs('computer');
            game.load(payload.fen);
            renderBoard(true);
            syncRatedClocks(payload, localComputerRemaining);
            if (payload.status === 'finished') finishRatedResult(payload, localComputerRemaining);
            else setComputerStatus('جاهز');"""
          if old_submit not in client:
              raise SystemExit('submitRatedMove marker not found')
          client = client.replace(old_submit, new_submit, 1)

          old_finish = """function finishRatedResult(payload) {
            const messages = {
              win: 'فزت على الكمبيوتر',
              loss: 'فاز الكمبيوتر',
              draw: 'انتهت المباراة بالتعادل'
            };
            if (payload) syncRatedClocks(payload);
            finishGame(messages[payload?.result] || 'انتهت المباراة', payload?.rating || null);
          }"""
          new_finish = """function finishRatedResult(payload, computerCapMs = null) {
            const messages = {
              win: 'فزت على الكمبيوتر',
              loss: 'فاز الكمبيوتر',
              draw: 'انتهت المباراة بالتعادل'
            };
            if (payload) syncRatedClocks(payload, computerCapMs);
            finishGame(messages[payload?.result] || 'انتهت المباراة', payload?.rating || null);
          }"""
          if old_finish not in client:
              raise SystemExit('finishRatedResult marker not found')
          client = client.replace(old_finish, new_finish, 1)

          old_rated = """    if (ratedMode) {
              commitActiveClock();
              clockActiveSide = null;
              clockAnchorMs = 0;
              renderClocks();
              Promise.resolve().then(() => submitRatedMove(move));
            } else {
              switchClock('computer');
              if (!checkGuestGameResult()) setTimeout(computerTurn, 180);
            }"""
          new_rated = """    if (ratedMode) {
              switchClock('computer');
              Promise.resolve().then(() => submitRatedMove(move));
            } else {
              switchClock('computer');
              if (!checkGuestGameResult()) setTimeout(computerTurn, 180);
            }"""
          if old_rated not in client:
              raise SystemExit('rated validate clock marker not found')
          client = client.replace(old_rated, new_rated, 1)
          client_path.write_text(client, encoding='utf-8')

          edge_path = Path('supabase/functions/computer-game/index.ts')
          edge = edge_path.read_text(encoding='utf-8')
          old_constants = """const TIME_CONTROLS = new Set([5, 10, 15]);
          const LEVEL_SEARCH = {"""
          new_constants = """const TIME_CONTROLS = new Set([5, 10, 15]);
          const MIN_THINK_MS = { easy: 900, medium: 1200, hard: 1600 } as const;
          const LEVEL_SEARCH = {"""
          if old_constants not in edge:
              raise SystemExit('edge constants marker not found')
          edge = edge.replace(old_constants, new_constants, 1)

          old_elapsed = """      const computerStartedAt = Date.now();
                const selected = chooseComputerMove(chess, row.level);
                const computerElapsed = Math.max(1, Date.now() - computerStartedAt);
                const computerTimeMs = Math.max(0, computerTimeBefore - computerElapsed);"""
          new_elapsed = """      const computerStartedAt = Date.now();
                const selected = chooseComputerMove(chess, row.level);
                const searchElapsed = Math.max(0, Date.now() - computerStartedAt);
                const waitMs = Math.max(0, MIN_THINK_MS[row.level] - searchElapsed);
                if (waitMs > 0) await new Promise((resolve) => setTimeout(resolve, waitMs));
                const computerElapsed = Math.max(1, Date.now() - computerStartedAt);
                const computerTimeMs = Math.max(0, computerTimeBefore - computerElapsed);"""
          if old_elapsed not in edge:
              raise SystemExit('edge elapsed marker not found')
          edge = edge.replace(old_elapsed, new_elapsed, 1)
          edge_path.write_text(edge, encoding='utf-8')

          play_path = Path('play-v10.html')
          play = play_path.read_text(encoding='utf-8')
          if 'play-computer.js?v=20260906-4' not in play:
              raise SystemExit('computer cache key -4 not found')
          play_path.write_text(play.replace('play-computer.js?v=20260906-4', 'play-computer.js?v=20260906-5', 1), encoding='utf-8')
          PY
      - name: Verify clock regression and syntax
        run: |
          python tests/test_computer_play_mode.py
          grep -q 'play-computer.js?v=20260906-5' play-v10.html
          cp play-computer.js /tmp/play-computer.mjs
          node --check /tmp/play-computer.mjs
      - name: Commit product fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-computer.js play-v10.html supabase/functions/computer-game/index.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep rated computer clock monotonic'
          git push