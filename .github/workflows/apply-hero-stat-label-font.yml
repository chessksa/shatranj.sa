name: Apply hero stat label font

on:
  push:
    paths:
      - '.github/workflows/apply-hero-stat-label-font.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Write regression test
        shell: bash
        run: |
          cat > tests/test_home_stat_labels.py <<'PY'
          from pathlib import Path

          css = Path('home-theme.css').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')

          assert '.hero-stat div small{order:1!important;margin:0 0 7px!important;font-size:14px!important}' in css, 'hero stat labels must be 14px'
          assert 'home-theme.css?v=20260905-8' in html, 'home page must use fresh stylesheet cache version'
          print('home stat labels: PASS')
          PY

      - name: Verify RED
        shell: bash
        run: |
          if python tests/test_home_stat_labels.py; then
            echo 'Regression test unexpectedly passed before implementation.'
            exit 1
          else
            echo 'Expected RED confirmed.'
          fi

      - name: Apply minimal implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('home-theme.css')
          css = css_path.read_text(encoding='utf-8')
          old = '.hero-stat div small{order:1!important;margin:0 0 7px!important;font-size:12px!important}'
          new = '.hero-stat div small{order:1!important;margin:0 0 7px!important;font-size:14px!important}'
          if css.count(old) != 1:
              raise SystemExit(f'Expected exactly one old hero-stat label rule, found {css.count(old)}')
          css_path.write_text(css.replace(old, new, 1), encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          old_cache = 'home-theme.css?v=20260905-7'
          new_cache = 'home-theme.css?v=20260905-8'
          if html.count(old_cache) != 1:
              raise SystemExit(f'Expected exactly one old cache reference, found {html.count(old_cache)}')
          index_path.write_text(html.replace(old_cache, new_cache, 1), encoding='utf-8')

          header_test = Path('tests/test_home_header_controls.py')
          text = header_test.read_text(encoding='utf-8')
          if text.count(old_cache) != 1:
              raise SystemExit(f'Expected one old cache assertion in header test, found {text.count(old_cache)}')
          header_test.write_text(text.replace(old_cache, new_cache, 1), encoding='utf-8')
          PY

      - name: Verify GREEN
        shell: bash
        run: |
          python tests/test_home_stat_labels.py
          python tests/test_home_header_controls.py

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-hero-stat-label-font.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-theme.css index.html tests/test_home_stat_labels.py tests/test_home_header_controls.py .github/workflows/apply-hero-stat-label-font.yml
          git commit -m 'تكبير خط عناوين إحصاءات الواجهة'
          git push origin HEAD:main
