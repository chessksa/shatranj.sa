name: Apply silent computer sync notice

on:
  push:
    paths:
      - '.github/workflows/apply-silent-computer-sync-notice.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove successful synchronization toast and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('play-computer.js')
          text = js.read_text(encoding='utf-8')
          old = "        toast('تم تحديث المباراة من الخادم.');\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one successful sync toast, found {text.count(old)}')
          js.write_text(text.replace(old, '', 1), encoding='utf-8')

          html = Path('play-v10.html')
          page = html.read_text(encoding='utf-8')
          old_version = "play-computer.js?v=20260907-20"
          new_version = "play-computer.js?v=20260907-21"
          if old_version not in page:
              raise SystemExit('expected current computer script cache version not found')
          html.write_text(page.replace(old_version, new_version, 1), encoding='utf-8')
          PY
      - name: Verify focused regression
        run: python tests/test_computer_sync_notice_silent.py
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-computer.js play-v10.html
          git commit -m 'fix: silence successful computer sync notice'
          git push origin HEAD:main
