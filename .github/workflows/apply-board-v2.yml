name: Apply board v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-board-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved board adjustments
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'missing expected text in {path}: {old}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          for path in ('play-v8.js','play-v10-match.js'):
              replace(path, "pieces/shatranj-3d-staunton.svg", "pieces/shatranj-3d-staunton-v2.svg")
              replace(path, "style.setProperty('fill','#0b4850','important')", "style.setProperty('fill','#155b63','important')")
              replace(path, "cm-chessboard-shatranj.css?v=20260903-3", "cm-chessboard-shatranj.css?v=20260904-2")

          replace('cm-chessboard-shatranj.css', 'fill:#0b4850 !important;', 'fill:#155b63 !important;')
          replace('play-v10.html', "play-v8.js?v=20260904-1", "play-v8.js?v=20260904-2")
          replace('play-v10.html', "play-v10-match.js?v=20260904-1", "play-v10-match.js?v=20260904-2")

          t = Path('tests/test_approved_piece_sprite.py')
          s = t.read_text(encoding='utf-8')
          s = s.replace('pieces/shatranj-3d-staunton.svg', 'pieces/shatranj-3d-staunton-v2.svg')
          s = s.replace('assets" / "pieces" / "shatranj-3d-staunton.svg', 'assets" / "pieces" / "shatranj-3d-staunton-v2.svg')
          s = s.replace("#0b4850", "#155b63")
          t.write_text(s, encoding='utf-8')
          PY
      - name: Verify JavaScript syntax
        run: |
          node --check play-v8.js
          node --check play-v10-match.js
      - name: Verify board references
        run: |
          grep -q "shatranj-3d-staunton-v2.svg" play-v8.js
          grep -q "shatranj-3d-staunton-v2.svg" play-v10-match.js
          grep -q "#155b63" cm-chessboard-shatranj.css
          grep -q "<circle cx=\"20\" cy=\"7.2\"" assets/pieces/shatranj-3d-staunton-v2.svg
      - name: Commit approved board v2
        run: |
          git config user.name "chessksa"
          git config user.email "gmel1199@gmail.com"
          git add play-v8.js play-v10-match.js play-v10.html cm-chessboard-shatranj.css tests/test_approved_piece_sprite.py
          git commit -m "feat: enlarge 3D pieces and lighten board" || exit 0
          git push origin main
