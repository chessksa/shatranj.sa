name: Verify home stat frame

on:
  push:
    branches:
      - feature/unify-stat-card-frame-20260908
    paths:
      - 'index.html'
      - 'home-theme.css'
      - 'tests/test_home_stat_card_frame.py'
      - '.github/workflows/verify-home-stat-frame.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tests/test_home_stat_card_frame.py
      - run: git diff --check
