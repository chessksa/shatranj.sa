name: Apply stale computer reply status fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-computer-stale-reply-status-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply stale reply guard
        run: python tools/apply_computer_stale_reply_status_fix.py
      - name: Verify computer reply behavior
        run: |
          python tests/test_computer_stale_reply_status.py
          python tests/test_computer_reply_and_timeout_resolution.py
          python tests/test_computer_move_stability.py
          python tests/test_computer_clock_monotonic.py
          python tests/test_last_move_highlight.py
          python tests/test_compact_end_review_controls.py
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-computer.js play-v10.html
          git commit -m 'fix: stop stale computer thinking status'
          git push origin HEAD:main
