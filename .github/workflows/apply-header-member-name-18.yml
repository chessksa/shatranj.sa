name: Apply header member name 18px

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-header-member-name-18.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add regression assertion and verify RED
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('tests/test_home_header_controls.py')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'home-theme\.css\?v=20260905-\d+', 'home-theme.css?v=20260905-9', s)
          if "Header member name size 20260905" not in s:
              s += "\nassert '/* Header member name size 20260905 */' in css, 'member name size override must exist'\nassert '.compact-member-nav .header-member-copy>strong{font-size:18px!important}' in css, 'member name must be 18px'\n"
          p.write_text(s, encoding='utf-8')
          PY
          set +e
          python tests/test_home_header_controls.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected RED before implementation, but test passed"
            exit 1
          fi
          echo "RED verified"

      - name: Implement 18px member name
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          cssp=Path('home-theme.css')
          css=cssp.read_text(encoding='utf-8')
          marker='/* Header member name size 20260905 */'
          rule='\n\n/* Header member name size 20260905 */\n.compact-member-nav .header-member-copy>strong{font-size:18px!important}\n'
          if marker not in css:
              css += rule
          cssp.write_text(css, encoding='utf-8')

          ip=Path('index.html')
          html=ip.read_text(encoding='utf-8')
          html=re.sub(r'home-theme\.css\?v=20260905-\d+', 'home-theme.css?v=20260905-9', html, count=1)
          ip.write_text(html, encoding='utf-8')
          PY

      - name: Verify GREEN
        run: python tests/test_home_header_controls.py

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-header-member-name-18.yml
          git add home-theme.css index.html tests/test_home_header_controls.py .github/workflows/apply-header-member-name-18.yml
          git commit -m "تكبير اسم العضو في الهيدر إلى 18"
          git push origin main
