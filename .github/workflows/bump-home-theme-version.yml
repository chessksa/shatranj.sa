name: Bump home theme cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-home-theme-version.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump home theme version
        run: |
          if grep -q 'home-theme.css?v=20260902' index.html; then
            sed -i 's/home-theme.css?v=20260902/home-theme.css?v=20260903-2/g' index.html
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Refresh home theme cache'
            git push
          else
            echo 'Version already updated.'
          fi
