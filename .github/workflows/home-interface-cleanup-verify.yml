name: Home interface cleanup verify

on:
  push:
    branches:
      - fix/remove-home-dashboard-notification-20260914
  pull_request:
    paths:
      - 'v2/home/dashboard.mjs'
      - 'home-header-svg.css'
      - 'tests/test_home_interface_cleanup.py'
      - '.github/workflows/home-interface-cleanup-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_home_interface_cleanup.py -q
