name: Apply computer time chooser polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-computer-time-chooser-polish.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish time chooser navigation and title
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js = Path('play-computer.js')
          text = js.read_text(encoding='utf-8')

          start = text.index('function addTimeChooserBack() {')
          end = text.index('function setupTimeChooser(levelKey) {', start)
          new_back = '''function addTimeChooserBack() {
  const existing = opponentSearchSetup?.querySelector('.computer-time-back');
  if (existing) existing.remove();
  const options = opponentSearchSetup?.querySelector('.opponent-time-options');
  if (!options) return;
  if (opponentSearchSetup) opponentSearchSetup.style.position = 'relative';
  const back = document.createElement('button');
  back.type = 'button';
  back.className = 'computer-time-back';
  back.setAttribute('aria-label', 'الرجوع لاختيار مستوى الكمبيوتر');
  back.innerHTML = '<span aria-hidden="true">›</span>';
  back.style.cssText = 'position:absolute;inset-inline-end:16px;top:12px;width:64px;height:64px;border:1px solid rgba(224,181,103,.55);border-radius:16px;background:rgba(3,43,48,.28);color:#f6ead8;font:800 42px/1 Arial,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;z-index:3;';
  back.onclick = () => {
    back.remove();
    setupLevelChooser();
  };
  options.parentNode.insertBefore(back, options);
}

'''
          text = text[:start] + new_back + text[end:]

          old_time = '''function setupTimeChooser(levelKey) {
  const level = LEVELS[levelKey];
  const title = opponentSearchSetup?.querySelector('.opponent-search-title');
  if (title) title.textContent = `اختر زمن المباراة — مستوى ${level.label}`;
  addTimeChooserBack();'''
          new_time = '''function setupTimeChooser(levelKey) {
  const level = LEVELS[levelKey];
  const title = opponentSearchSetup?.querySelector('.opponent-search-title');
  if (title) {
    title.textContent = `اختر زمن المباراة — مستوى ${level.label}`;
    title.style.setProperty('text-align', 'center', 'important');
    title.style.setProperty('font-size', 'clamp(18px, 4vw, 34px)', 'important');
    title.style.setProperty('line-height', '1.2', 'important');
    title.style.setProperty('white-space', 'nowrap', 'important');
    title.style.setProperty('width', '100%', 'important');
    title.style.setProperty('box-sizing', 'border-box', 'important');
    title.style.setProperty('padding-inline', '72px', 'important');
  }
  addTimeChooserBack();'''
          if old_time not in text:
              raise SystemExit('time chooser marker missing')
          text = text.replace(old_time, new_time, 1)

          old_level = '''  const title = opponentSearchSetup?.querySelector('.opponent-search-title');
  if (title) title.textContent = 'اختر مستوى الكمبيوتر — النقاط للمسجلين';'''
          new_level = '''  const title = opponentSearchSetup?.querySelector('.opponent-search-title');
  if (title) {
    ['text-align', 'font-size', 'line-height', 'white-space', 'width', 'box-sizing', 'padding-inline'].forEach((prop) => title.style.removeProperty(prop));
    title.textContent = 'اختر مستوى الكمبيوتر — النقاط للمسجلين';
  }
  if (opponentSearchSetup) opponentSearchSetup.style.removeProperty('position');'''
          if old_level not in text:
              raise SystemExit('level chooser title marker missing')
          text = text.replace(old_level, new_level, 1)
          js.write_text(text, encoding='utf-8')

          play = Path('play-v10.html')
          html = play.read_text(encoding='utf-8')
          html = re.sub(r"play-computer\.js\?v=\d{8}-\d+", 'play-computer.js?v=20260906-8', html, count=1)
          play.write_text(html, encoding='utf-8')
          PY
      - name: Verify approved chooser layout contract
        run: |
          python tests/test_computer_play_mode.py
          cp play-computer.js /tmp/play-computer.mjs
          node --check /tmp/play-computer.mjs
      - name: Commit approved polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-computer.js play-v10.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: polish computer time chooser navigation'
          git pull --rebase origin main
          git push
