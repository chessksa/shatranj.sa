name: Apply computer time chooser polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-computer-time-chooser-polish.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish time chooser navigation and title
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          js = Path('play-computer.js')
          text = js.read_text(encoding='utf-8')
          start = text.index('function addTimeChooserBack() {')
          end = text.index('function setupTimeChooser(levelKey) {', start)
          new_back = base64.b64decode('').decode('utf-8')
          text = text[:start] + new_back + text[end:]
          old_time = "function setupTimeChooser(levelKey) {\n  const level = LEVELS[levelKey];\n  const title = opponentSearchSetup?.querySelector('.opponent-search-title');\n  if (title) title.textContent = `اختر زمن المباراة — مستوى ${level.label}`;\n  addTimeChooserBack();"
          new_time = base64.b64decode('').decode('utf-8')
          if old_time not in text:
              raise SystemExit('time chooser marker missing')
          text = text.replace(old_time, new_time, 1)
          old_level = "  const title = opponentSearchSetup?.querySelector('.opponent-search-title');\n  if (title) title.textContent = 'اختر مستوى الكمبيوتر — النقاط للمسجلين';"
          new_level = base64.b64decode('').decode('utf-8')
          if old_level not in text:
              raise SystemExit('level chooser title marker missing')
          text = text.replace(old_level, new_level, 1)
          js.write_text(text, encoding='utf-8')
          play = Path('play-v10.html')
          html = play.read_text(encoding='utf-8')
          html = re.sub(r"play-computer\.js\?v=\d{8}-\d+", 'play-computer.js?v=20260906-8', html, count=1)
          play.write_text(html, encoding='utf-8')
          PY
      - name: Verify approved chooser layout contract
        run: |
          python tests/test_computer_play_mode.py
          cp play-computer.js /tmp/play-computer.mjs
          node --check /tmp/play-computer.mjs
      - name: Commit approved polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-computer.js play-v10.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: polish computer time chooser navigation'
          git pull --rebase origin main
          git push
