name: Apply computer chooser overflow fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-computer-time-chooser-polish.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix bounded computer time chooser
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          js = Path('play-computer.js')
          text = js.read_text(encoding='utf-8')
          start = text.index('function setupTimeChooser(levelKey) {')
          end = text.index('function setupLevelChooser() {', start)
          new_time = base64.b64decode('').decode('utf-8')
          text = text[:start] + new_time + text[end:]
          old_props = "['text-align', 'font-size', 'line-height', 'white-space', 'width', 'box-sizing', 'padding-inline']"
          new_props = "['text-align', 'font-size', 'line-height', 'white-space', 'width', 'min-width', 'max-width', 'box-sizing', 'padding-inline', 'overflow', 'text-overflow']"
          if old_props in text:
              text = text.replace(old_props, new_props, 1)
          old_parent = "if (opponentSearchSetup) opponentSearchSetup.style.removeProperty('position');"
          new_parent = "if (opponentSearchSetup) ['position', 'min-width', 'width', 'overflow'].forEach((prop) => opponentSearchSetup.style.removeProperty(prop));"
          if old_parent in text:
              text = text.replace(old_parent, new_parent, 1)
          js.write_text(text, encoding='utf-8')

          play = Path('play-v10.html')
          html = play.read_text(encoding='utf-8')
          html = re.sub(r"play-computer\.js\?v=\d{8}-\d+", 'play-computer.js?v=20260906-9', html, count=1)
          play.write_text(html, encoding='utf-8')
          PY
      - name: Verify computer chooser
        run: |
          python tests/test_computer_play_mode.py
          cp play-computer.js /tmp/play-computer.mjs
          node --check /tmp/play-computer.mjs
      - name: Commit overflow fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-computer.js play-v10.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep computer time chooser inside panel'
          git pull --rebase origin main
          git push
