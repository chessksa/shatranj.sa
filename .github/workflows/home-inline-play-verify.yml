name: home inline play verify

on:
  push:
    paths:
      - 'v2/home/**'
      - 'profile.html'
      - 'tests/test_desktop_member_profile_inline.py'
      - 'tests/home-inline-play-verify.mjs'
      - 'tests/desktop-guest-auth-active.test.mjs'
      - 'tests/desktop-login-direct.test.mjs'
      - 'tests/desktop-auth-observer-loop.test.mjs'
      - 'tests/desktop-board-preview-pieces.test.mjs'
      - '.github/workflows/home-inline-play-verify.yml'
  pull_request:
    paths:
      - 'v2/home/**'
      - 'profile.html'
      - 'tests/test_desktop_member_profile_inline.py'
      - 'tests/home-inline-play-verify.mjs'
      - 'tests/desktop-guest-auth-active.test.mjs'
      - 'tests/desktop-login-direct.test.mjs'
      - 'tests/desktop-auth-observer-loop.test.mjs'
      - 'tests/desktop-board-preview-pieces.test.mjs'
      - '.github/workflows/home-inline-play-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check v2/home/inline-play.mjs
      - run: node --check v2/home/desktop-board-shell-tune.mjs
      - run: node --check v2/home/dashboard.mjs
      - run: node tests/home-inline-play-verify.mjs
      - run: node tests/desktop-guest-auth-active.test.mjs
      - run: node tests/desktop-login-direct.test.mjs
      - run: node tests/desktop-auth-observer-loop.test.mjs
      - run: node tests/desktop-board-preview-pieces.test.mjs
      - run: python tests/test_desktop_member_profile_inline.py
