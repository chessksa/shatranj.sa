name: home inline play verify

on:
  push:
    paths:
      - 'v2/home/**'
      - 'profile.html'
      - 'profile.js'
      - 'player.html'
      - 'player.js'
      - 'tests/test_member_profile_toolbar.py'
      - 'tests/test_profile_dashboard_clean.py'
      - 'tests/test_profile_compact_sections.py'
      - 'tests/test_profile_compact_layout.py'
      - 'tests/test_profile_stat_tiles_layout.py'
      - 'tests/test_profile_unified_icon_row.py'
      - 'tests/test_desktop_member_profile_inline.py'
      - 'tests/home-inline-play-verify.mjs'
      - 'tests/desktop-guest-auth-active.test.mjs'
      - 'tests/desktop-login-direct.test.mjs'
      - 'tests/desktop-auth-observer-loop.test.mjs'
      - 'tests/desktop-board-preview-pieces.test.mjs'
      - '.github/workflows/home-inline-play-verify.yml'
  pull_request:
    paths:
      - 'v2/home/**'
      - 'profile.html'
      - 'profile.js'
      - 'player.html'
      - 'player.js'
      - 'tests/test_member_profile_toolbar.py'
      - 'tests/test_profile_dashboard_clean.py'
      - 'tests/test_profile_compact_sections.py'
      - 'tests/test_profile_compact_layout.py'
      - 'tests/test_profile_stat_tiles_layout.py'
      - 'tests/test_profile_unified_icon_row.py'
      - 'tests/test_desktop_member_profile_inline.py'
      - 'tests/home-inline-play-verify.mjs'
      - 'tests/desktop-guest-auth-active.test.mjs'
      - 'tests/desktop-login-direct.test.mjs'
      - 'tests/desktop-auth-observer-loop.test.mjs'
      - 'tests/desktop-board-preview-pieces.test.mjs'
      - '.github/workflows/home-inline-play-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check v2/home/inline-play.mjs
      - run: node --check v2/home/desktop-board-shell-tune.mjs
      - run: node --check v2/home/dashboard.mjs
      - run: node tests/home-inline-play-verify.mjs
      - run: node tests/desktop-guest-auth-active.test.mjs
      - run: node tests/desktop-login-direct.test.mjs
      - run: node tests/desktop-auth-observer-loop.test.mjs
      - run: node tests/desktop-board-preview-pieces.test.mjs
      - run: python tests/test_desktop_member_profile_inline.py
      - run: python tests/test_profile_dashboard_clean.py
      - run: python tests/test_member_profile_toolbar.py
      - run: node --check player.js
      - run: python tests/test_profile_compact_layout.py
      - run: python tests/test_profile_compact_sections.py
      - run: python tests/test_profile_dashboard_label_size.py
      - run: python tests/test_profile_icon_navigation.py
      - run: python tests/test_profile_rank_badge.py
      - run: python tests/test_profile_stat_tiles_layout.py
      - run: python tests/test_profile_unified_icon_row.py
      - run: node --check profile.js
      - run: node --check v2/home/desktop-board-shell.mjs
