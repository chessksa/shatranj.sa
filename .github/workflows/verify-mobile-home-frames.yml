name: Verify mobile home frames

on:
  push:
    branches:
      - main
    paths:
      - 'home-mobile-admin-colors.css'
      - 'index.html'
      - 'index-app.html'
      - 'tests/test_mobile_home_frames.py'
      - 'tests/test_home_tournaments_header_center.py'
      - '.github/workflows/verify-mobile-home-frames.yml'
  pull_request:
    paths:
      - 'home-mobile-admin-colors.css'
      - 'index.html'
      - 'index-app.html'
      - 'tests/test_mobile_home_frames.py'
      - 'tests/test_home_tournaments_header_center.py'
      - '.github/workflows/verify-mobile-home-frames.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify mobile home frame contract
        run: python tests/test_mobile_home_frames.py
      - name: Verify tournaments are absent from the header
        run: python tests/test_home_tournaments_header_center.py
