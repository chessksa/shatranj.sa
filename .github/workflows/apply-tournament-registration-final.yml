name: Apply tournament registration final

on:
  push:
    branches:
      - feature/tournament-registration-final

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tournament-registration-final
      - name: Apply homepage cleanup
        run: python scripts/patch_tournament_registration_final.py
      - name: Commit homepage cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: remove duplicate homepage tournaments section"
          git push origin HEAD:feature/tournament-registration-final
