name: Enable homepage player invite
on:
  push:
    paths:
      - '.github/workflows/add-home-player-invite.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add homepage invitation scripts
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the old malformed script tag that was accidentally placed inside <style>.
          s = s.replace('<script src="site-notifications.js"></script>\n', '')

          scripts = '<script src="site-notifications.js?v=20260903-2"></script>\n<script src="home-invite.js?v=20260903-1"></script>\n'
          if 'home-invite.js?v=20260903-1' not in s:
              s = s.replace('</body>', scripts + '</body>')

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Enable homepage player invitations" || exit 0
          git push
