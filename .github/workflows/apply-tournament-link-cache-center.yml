name: Refresh tournament page cache key

on:
  push:
    paths:
      - '.github/workflows/apply-tournament-link-cache-center.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh tournament link version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          old = 'tournaments.html?v=20260909-split22'
          new = 'tournaments.html?v=20260909-split22b'
          if old not in html:
              raise SystemExit('current tournament link version not found')
          html = html.replace(old, new, 1)
          assert new in html
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit cache key update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'chore: force fresh tournament header cache key'
          git push
