name: Verify computer reply and timeout recovery

on:
  push:
    paths:
      - 'tests/test_computer_reply_and_timeout_resolution.py'
      - 'tests/test_computer_timeout_stale_settlement.py'
      - '.github/workflows/verify-computer-reply-timeout.yml'
      - 'play-computer.js'
      - 'supabase/functions/computer-game/index.ts'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python tests/test_computer_reply_and_timeout_resolution.py
          python tests/test_computer_timeout_stale_settlement.py
