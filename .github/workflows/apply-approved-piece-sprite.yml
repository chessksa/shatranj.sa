name: Apply approved brown ivory pieces

on:
  push:
    branches:
      - 'fix/approved-brown-ivory-pieces'
    paths:
      - '.github/workflows/apply-approved-piece-sprite.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/approved-brown-ivory-pieces
      - name: Apply approved board appearance
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          sprite = '''<?xml version="1.0" encoding="UTF-8"?>
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
            <title>Shatranj Saudi Arabia approved brown and ivory pieces</title>
            <g id="wk"><image href="wk.png" x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="wq"><image href="wq.png" x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="wr"><image href="wr.png" x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="wb"><image href="wb.png" x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="wn"><image href="wn.png" x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="wp"><image href="wp.png" x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="bk"><image href="bk.png" x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="bq"><image href="bq.png" x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="br"><image href="br.png" x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="bb"><image href="bb.png" x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="bn"><image href="bn.png" x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/></g>
            <g id="bp"><image href="bp.png" x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/></g>
          </svg>
          '''.strip() + '\n'
          Path('assets/pieces/shatranj-approved.svg').write_text(sprite, encoding='utf-8')

          for name, old_theme in [('play-v8.js','20260903-1'), ('play-v10-match.js','20260903-2')]:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = re.sub(r"assetsUrl\s*:\s*'https://cdn\.jsdelivr\.net/npm/cm-chessboard@8/assets/'\s*,", "assetsUrl:'assets/',", text)
              text = re.sub(r"pieces\s*:\s*\{\s*file\s*:\s*'pieces/staunty\.svg'\s*,\s*tileSize\s*:\s*40\s*\}", "pieces:{file:'pieces/shatranj-approved.svg',tileSize:40}", text)
              text = text.replace(f"cm-chessboard-shatranj.css?v={old_theme}", "cm-chessboard-shatranj.css?v=20260903-3")
              if "pieces/shatranj-approved.svg" not in text:
                  raise SystemExit(f'approved sprite not applied to {name}')
              p.write_text(text, encoding='utf-8')

          p = Path('cm-chessboard-shatranj.css')
          text = p.read_text(encoding='utf-8')
          text = text.replace('fill:#d6cfbf;', 'fill:#d6cfbf !important;')
          text = text.replace('fill:#0b4850;', 'fill:#0b4850 !important;')
          text = text.replace('filter:drop-shadow(0 3px 2px rgba(0,0,0,.24));', 'filter:none;')
          p.write_text(text, encoding='utf-8')

          p = Path('play-v10.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace("play-v8.js?v=20260903-10", "play-v8.js?v=20260903-11")
          text = text.replace("play-v10-match.js?v=20260903-11", "play-v10-match.js?v=20260903-12")
          p.write_text(text, encoding='utf-8')

          p = Path('play-v8.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace("play-v8.js?v=20260903-8", "play-v8.js?v=20260903-9")
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify feature tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_approved_piece_sprite.py
          node --check play-v8.js
          node --check play-v10-match.js
      - name: Commit approved appearance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pieces/shatranj-approved.svg play-v8.js play-v10-match.js cm-chessboard-shatranj.css play-v10.html play-v8.html
          git commit -m 'fix: use approved brown ivory pieces'
          git push origin HEAD:fix/approved-brown-ivory-pieces
