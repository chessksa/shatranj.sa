name: Apply player card layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-player-card-layout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply approved player card layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path('play-v10.html')
          html = html_path.read_text(encoding='utf-8')
          replacements = [
            (
              ".avatar{width:82px;height:82px;border-radius:50%;border:2px solid rgba(224,181,103,.8);background:radial-gradient(circle at 38% 30%,#434a4f,#1a2126 62%,#12181c)}",
              ".avatar{width:82px;height:82px;border-radius:14px;border:2px solid rgba(224,181,103,.8);background:radial-gradient(circle at 38% 30%,#434a4f,#1a2126 62%,#12181c);position:relative;overflow:hidden;flex:0 0 auto}"
            ),
            (
              ".avatar.light{background:radial-gradient(circle at 38% 30%,#fff,#f4f4f4 48%,#dadada 70%,#cbcbcb)}",
              ".avatar.light{background:radial-gradient(circle at 38% 30%,#fff,#f4f4f4 48%,#dadada 70%,#cbcbcb)}.avatar-img{width:100%;height:100%;display:block;object-fit:cover}"
            ),
            (
              ".name{display:block;color:inherit;text-decoration:none;font-size:20px;font-weight:800;margin:0 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}",
              ".name{display:block;color:inherit;text-decoration:none;font-size:20px;font-weight:800;margin:0 0 7px;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35;overflow-wrap:anywhere}"
            ),
            (
              ".rating{font-size:13px}",
              ".rating{font-size:13px;display:flex;align-items:center;gap:6px}.rating-label{color:var(--muted);font-weight:700}"
            ),
            (
              '<div class="avatar" id="topAvatar"></div>',
              '<div class="avatar" id="topAvatar"><img class="avatar-img" id="topAvatarImg" alt="" hidden></div>'
            ),
            (
              '<div class="avatar light" id="bottomAvatar"></div>',
              '<div class="avatar light" id="bottomAvatar"><img class="avatar-img" id="bottomAvatarImg" alt="" hidden></div>'
            ),
            (
              '<div class="player-info"><div class="status">متصل</div><a class="name" id="topName">—</a><div class="location">📍 <span id="topLocation">—</span></div><div class="rating"><span id="topRating">—</span></div></div>',
              '<div class="player-info"><a class="name" id="topName">—</a><div class="location"><span id="topLocation">—</span></div><div class="rating"><span class="rating-label">النقاط</span><span id="topRating">—</span></div><div class="status">متصل</div></div>'
            ),
            (
              '<div class="player-info"><div class="status">متصل</div><a class="name" id="bottomName">أنت</a><div class="location">📍 <span id="bottomLocation">—</span></div><div class="rating"><span id="bottomRating">—</span></div></div>',
              '<div class="player-info"><a class="name" id="bottomName">أنت</a><div class="location"><span id="bottomLocation">—</span></div><div class="rating"><span class="rating-label">النقاط</span><span id="bottomRating">—</span></div><div class="status">متصل</div></div>'
            ),
            ("play-v8.js?v=20260904-13", "play-v8.js?v=20260904-14"),
            ("play-v10-match.js?v=20260904-13", "play-v10-match.js?v=20260904-14"),
          ]
          for old, new in replacements:
            if old not in html:
              raise SystemExit(f'play-v10.html expected text not found: {old[:90]}')
            html = html.replace(old, new, 1)
          html_path.write_text(html, encoding='utf-8')

          live_path = Path('play-v8.js')
          live = live_path.read_text(encoding='utf-8')
          live_replacements = [
            (
              "const topAvatarEl = $('topAvatar');\nconst bottomAvatarEl = $('bottomAvatar');",
              "const topAvatarEl = $('topAvatar');\nconst bottomAvatarEl = $('bottomAvatar');\nconst topAvatarImgEl = $('topAvatarImg');\nconst bottomAvatarImgEl = $('bottomAvatarImg');"
            ),
            ("[serverState.white_city,serverState.white_region]", "[serverState.white_region,serverState.white_city]"),
            ("[serverState.black_city,serverState.black_region]", "[serverState.black_region,serverState.black_city]"),
            (
              "function renderPlayers(){",
              "function setPlayerAvatar(box,img,info){\n  if(!box || !img || !info?.id) return;\n  const playerId=String(info.id);\n  if(img.dataset.playerId===playerId && img.getAttribute('src')) return;\n  img.dataset.playerId=playerId;\n  img.hidden=true;\n  const url=supabase.storage.from('avatars').getPublicUrl(`${playerId}/avatar.webp`).data.publicUrl;\n  img.onload=()=>{ img.hidden=false; };\n  img.onerror=()=>{ img.hidden=true; };\n  img.src=url;\n}\n\nfunction renderPlayers(){"
            ),
            (
              "  topAvatarEl.classList.toggle('light', topColor==='w');\n  bottomAvatarEl.classList.toggle('light', bottomColor==='w');",
              "  topAvatarEl.classList.toggle('light', topColor==='w');\n  bottomAvatarEl.classList.toggle('light', bottomColor==='w');\n  setPlayerAvatar(topAvatarEl, topAvatarImgEl, top);\n  setPlayerAvatar(bottomAvatarEl, bottomAvatarImgEl, bottom);"
            ),
          ]
          for old, new in live_replacements:
            if old not in live:
              raise SystemExit(f'play-v8.js expected text not found: {old[:90]}')
            live = live.replace(old, new, 1)
          live_path.write_text(live, encoding='utf-8')

          match_path = Path('play-v10-match.js')
          match = match_path.read_text(encoding='utf-8')
          match_replacements = [
            (
              "const bottomClockEl = $('bottomClock');\nconst topClockEl = $('topClock');",
              "const bottomClockEl = $('bottomClock');\nconst topClockEl = $('topClock');\nconst bottomAvatarImg = $('bottomAvatarImg');"
            ),
            ("[p.city,p.region]", "[p.region,p.city]"),
            (
              "  bottomLocationEl.textContent = [p.region,p.city].filter(Boolean).join(' — ') || '—';\n  return p;",
              "  bottomLocationEl.textContent = [p.region,p.city].filter(Boolean).join(' — ') || '—';\n  if(bottomAvatarImg && p.id){\n    const url=supabase.storage.from('avatars').getPublicUrl(`${p.id}/avatar.webp`).data.publicUrl;\n    bottomAvatarImg.onload=()=>{ bottomAvatarImg.hidden=false; };\n    bottomAvatarImg.onerror=()=>{ bottomAvatarImg.hidden=true; };\n    bottomAvatarImg.src=url;\n  }\n  return p;"
            ),
          ]
          for old, new in match_replacements:
            if old not in match:
              raise SystemExit(f'play-v10-match.js expected text not found: {old[:90]}')
            match = match.replace(old, new, 1)
          match_path.write_text(match, encoding='utf-8')
          PY
      - name: Verify player card layout
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_player_card_layout.py
      - name: Commit approved layout
        run: |
          git config user.name "chessksa"
          git config user.email "gmel1199@gmail.com"
          git add play-v10.html play-v8.js play-v10-match.js
          git commit -m "fix: arrange player cards with square photos and points"
          git push origin HEAD:main
