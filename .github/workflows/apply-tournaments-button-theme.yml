name: Apply tournaments button theme

on:
  push:
    branches:
      - fix/tournaments-button-page-theme

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tournaments-button-page-theme
      - name: Apply patch
        run: python scripts/patch_tournaments_button_theme.py
      - name: Commit UI changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home-theme.css
          git commit -m "fix: move tournaments beside computer play"
          git push origin HEAD:fix/tournaments-button-page-theme
