name: Apply tournaments button theme

on:
  push:
    branches:
      - fix/tournaments-button-page-theme

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tournaments-button-page-theme

      - name: Move tournaments button and resize action row
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          header_button = '''      <a id="headerTournaments" class="header-tournaments header-tile" href="#tournaments">
        <span class="header-tile-icon" aria-hidden="true">♜</span><span>البطولات</span>
      </a>
'''
          if header_button not in text:
              raise SystemExit('header tournaments button marker missing')
          text = text.replace(header_button, '', 1)

          computer = '        <a class="btn light hero-computer-btn" href="play-v10.html?computer=1"><span>اللعب ضد الكمبيوتر</span></a>\n'
          tournament = '        <a class="btn light hero-tournaments-btn" href="tournaments.html"><span>البطولات</span></a>\n'
          if computer not in text:
              raise SystemExit('computer play button marker missing')
          text = text.replace(computer, computer + tournament, 1)
          index.write_text(text, encoding='utf-8')

          theme = Path('home-theme.css')
          css = theme.read_text(encoding='utf-8')
          css = css.replace(
              '.home-hero .home-board-actions{\n  width:100%!important;\n  max-width:620px;\n  margin:0!important;\n  display:grid!important;\n  grid-template-columns:repeat(2,minmax(0,1fr))!important;',
              '.home-hero .home-board-actions{\n  width:100%!important;\n  max-width:760px;\n  margin:0!important;\n  display:grid!important;\n  grid-template-columns:repeat(3,minmax(0,1fr))!important;',
              1,
          )
          css = css.replace(
              '.home-hero .home-board-actions{\n  grid-template-columns:repeat(2,minmax(0,1fr))!important;',
              '.home-hero .home-board-actions{\n  grid-template-columns:repeat(3,minmax(0,1fr))!important;',
              1,
          )
          theme.write_text(css, encoding='utf-8')
          PY

      - name: Commit UI changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home-theme.css
          git commit -m "fix: move tournaments beside computer play"
          git push origin HEAD:fix/tournaments-button-page-theme
