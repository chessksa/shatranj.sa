name: Apply tournament list spacing and centered cells

on:
  push:
    paths:
      - '.github/workflows/apply-tournament-list-gap-center.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tighten tournament list spacing and center content
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tournaments.html')
          html = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '.tournament-intro-strip{width:100%;margin:0 0 12px;padding:12px 16px;border:1px solid rgba(46,147,147,.34);border-radius:14px;background:linear-gradient(90deg,rgba(7,49,51,.82),rgba(8,62,64,.68));color:var(--hero-muted);font-size:13px;font-weight:800}',
                  '.tournament-intro-strip{width:100%;margin:0 0 4px;padding:12px 16px;border:1px solid rgba(46,147,147,.34);border-radius:14px;background:linear-gradient(90deg,rgba(7,49,51,.82),rgba(8,62,64,.68));color:var(--hero-muted);font-size:13px;font-weight:800;text-align:center}'
              ),
              (
                  '.registration-message{min-height:22px;margin:0 0 12px;padding:0 4px;color:var(--hero-muted);font-size:14px;font-weight:800}.registration-message.ok{color:#a7e7bd}',
                  '.registration-message{min-height:22px;margin:0 0 12px;padding:0 4px;color:var(--hero-muted);font-size:14px;font-weight:800}.registration-message:empty{display:none}.registration-message.ok{color:#a7e7bd}'
              ),
              (
                  '.tournament-table th,.tournament-table td{padding:13px 14px;border-bottom:1px solid rgba(216,182,101,.18);text-align:right;vertical-align:middle}',
                  '.tournament-table th,.tournament-table td{padding:13px 14px;border-bottom:1px solid rgba(216,182,101,.18);text-align:center;vertical-align:middle}'
              ),
          ]

          for old, new in replacements:
              if old not in html:
                  raise SystemExit(f'expected pattern not found: {old[:90]}')
              html = html.replace(old, new, 1)

          path.write_text(html, encoding='utf-8')
          PY
      - name: Verify tournament layout
        run: python tests/test_tournament_header_compact.py
      - name: Commit layout update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tournaments.html
          git diff --cached --quiet && exit 0
          git commit -m 'style: tighten tournament list gap and center cells'
          git push
