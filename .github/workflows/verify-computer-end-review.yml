name: Verify computer End grace review

on:
  push:
    branches:
      - main
      - fix/computer-end-review-20260907
    paths:
      - 'play-computer.js'
      - 'play-v10.html'
      - 'supabase/functions/computer-game/index.ts'
      - 'tests/test_computer_end_review.py'
      - '.github/workflows/verify-computer-end-review.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify computer End grace and review
        run: python tests/test_computer_end_review.py
      - name: Verify computer regressions
        run: |
          python tests/test_computer_play_mode.py
          python tests/test_computer_clock_monotonic.py
          python tests/test_computer_reply_and_timeout_resolution.py
          python tests/test_computer_server_two_phase_move.py
          python tests/test_game_result_ui.py
      - name: Verify JavaScript syntax
        run: |
          cp play-computer.js /tmp/play-computer.mjs
          node --check /tmp/play-computer.mjs
