name: Verify stale computer timeout settlement guard

on:
  push:
    paths:
      - 'tests/test_computer_timeout_stale_settlement.py'
      - '.github/workflows/verify-computer-timeout-stale-settlement.yml'
      - 'supabase/functions/computer-game/index.ts'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_computer_timeout_stale_settlement.py
