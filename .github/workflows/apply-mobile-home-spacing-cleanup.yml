name: Apply mobile home spacing cleanup

on:
  push:
    branches:
      - fix/mobile-home-spacing-clean
    paths:
      - '.github/workflows/apply-mobile-home-spacing-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-home-spacing-clean
          fetch-depth: 0

      - name: Add regression test
        run: |
          cat > tests/test_mobile_home_spacing.py <<'PY'
          from pathlib import Path

          css = Path('home-theme.css').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')

          assert '/* Mobile home spacing cleanup 20260905 */' in css
          assert '@media(max-width:800px){\n  body{padding-bottom:0!important}\n}' in css
          assert '.home-hero{padding:10px 0 6px!important}' in css
          assert '.home-hero h1{margin:8px 0 4px!important}' in css
          assert '.home-hero p{margin:0 0 10px!important}' in css
          assert '.hero-live-stats{margin:0 0 10px!important}' in css
          assert '#ranking{padding:4px 7px 6px!important}' in css
          assert '.home-features{padding:10px 0 12px!important}' in css
          assert '#register{padding:14px 0!important}' in css
          assert 'home-theme.css?v=20260905-7' in html

          print('mobile home spacing: PASS')
          PY

      - name: Verify RED without failing workflow
        run: |
          if python tests/test_mobile_home_spacing.py; then
            echo 'Expected the new spacing test to fail before the fix.'
            exit 1
          else
            echo 'RED confirmed.'
          fi

      - name: Apply mobile spacing cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('home-theme.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Mobile home spacing cleanup 20260905 */'
          block = '''\n\n/* Mobile home spacing cleanup 20260905 */\n@media(max-width:800px){\n  body{padding-bottom:0!important}\n}\n@media(max-width:600px){\n  .home-hero{padding:10px 0 6px!important}\n  .home-hero h1{margin:8px 0 4px!important}\n  .home-hero p{margin:0 0 10px!important}\n  .hero-live-stats{margin:0 0 10px!important}\n  #ranking{padding:4px 7px 6px!important}\n  .home-features{padding:10px 0 12px!important}\n  #register{padding:14px 0!important}\n}\n'''
          if marker not in css:
              css = css.rstrip() + block
          css_path.write_text(css, encoding='utf-8')

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          old = 'home-theme.css?v=20260905-6'
          new = 'home-theme.css?v=20260905-7'
          if old not in html:
              raise SystemExit(f'Expected cache token not found: {old}')
          html_path.write_text(html.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify GREEN
        run: python tests/test_mobile_home_spacing.py

      - name: Commit production change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-mobile-home-spacing-cleanup.yml
          git add home-theme.css index.html tests/test_mobile_home_spacing.py
          git commit -m 'تقليل فراغات الواجهة في الجوال'
          git push origin HEAD:fix/mobile-home-spacing-clean
