name: Verify computer move ack before engine

on:
  push:
    paths:
      - 'tests/test_computer_move_ack_before_engine.py'
      - 'play-computer.js'
      - 'supabase/functions/computer-game/index.ts'
      - '.github/workflows/verify-computer-move-ack.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify move acknowledgement ordering
        run: python tests/test_computer_move_ack_before_engine.py
