name: Verify computer timeout turn guard

on:
  push:
    paths:
      - 'tests/test_computer_timeout_turn_guard.py'
      - 'supabase/functions/computer-game/index.ts'
      - '.github/workflows/verify-computer-timeout-turn-guard.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_computer_timeout_turn_guard.py
