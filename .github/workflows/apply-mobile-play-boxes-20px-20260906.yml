name: Apply mobile play boxes 20px

on:
  push:
    paths:
      - '.github/workflows/apply-mobile-play-boxes-20px-20260906.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile play box polish
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('home-theme.css')
          text = p.read_text(encoding='utf-8')
          patch = Path('mobile-play-boxes-20px.css.patch').read_text(encoding='utf-8')
          marker = '/* MOBILE PLAY BOXES 20PX 20260906 */'
          if marker not in text:
              p.write_text(text.rstrip() + '\n\n' + patch.rstrip() + '\n', encoding='utf-8')
          PY
      - name: Verify requested values
        run: python tests/test_mobile_play_boxes_20px_20260906.py
      - name: Commit mobile polish
        run: |
          if git diff --quiet -- home-theme.css; then
            echo 'No change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-theme.css
          git commit -m 'style: polish mobile play boxes with 20px text'
          git push
