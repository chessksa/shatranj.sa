name: Apply mobile play boxes 20px

on:
  push:
    paths:
      - '.github/workflows/apply-mobile-play-boxes-20px-20260906.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile play box polish
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('home-theme.css')
          text = p.read_text(encoding='utf-8')
          marker = '/* MOBILE PLAY BOXES 20PX 20260906 */'
          block = r'''

/* MOBILE PLAY BOXES 20PX 20260906 */
@media(max-width:700px){
  .home-hero .home-board-actions{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    grid-template-rows:repeat(2,82px)!important;
    gap:10px!important;
    align-items:stretch!important;
  }
  .home-hero .home-board-actions>.btn,
  .home-hero .home-invite-wrap,
  .home-hero .home-invite-wrap>.btn{
    width:100%!important;
    height:82px!important;
    min-height:82px!important;
    min-width:0!important;
  }
  .home-hero .home-board-actions>.btn,
  .home-hero .home-invite-wrap>.btn{
    border-radius:14px!important;
    padding:8px 10px!important;
    gap:0!important;
    font-family:Arial,sans-serif!important;
    font-size:20px!important;
    line-height:1.2!important;
    font-weight:900!important;
    text-align:center!important;
    align-items:center!important;
    justify-content:center!important;
  }
}
'''
          if marker not in text:
              p.write_text(text.rstrip() + block + '\n', encoding='utf-8')
          PY
      - name: Verify requested values
        run: python tests/test_mobile_play_boxes_20px_20260906.py
      - name: Commit mobile polish
        run: |
          if git diff --quiet -- home-theme.css; then
            echo 'No change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-theme.css
          git commit -m 'style: polish mobile play boxes with 20px text'
          git push
