name: Apply mobile header avatar dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-header-avatar-dashboard.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add regression test and verify RED
        shell: bash
        run: |
          cat > tests/test_mobile_header_avatar_dashboard.py <<'PY'
          from pathlib import Path
          css = Path('home-theme.css').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')
          marker = '/* Mobile header avatar identity + four controls 20260905 */'
          assert marker in css
          section = css.split(marker, 1)[1]
          assert 'grid-template-columns:repeat(4,minmax(0,1fr))!important;' in section
          assert 'position:static!important;' in section
          assert 'width:44px!important;' in section
          assert 'height:44px!important;' in section
          assert 'font-size:22px!important;' in section
          assert 'line-height:1.3!important;' in section
          assert 'overflow:visible!important;' in section
          assert 'text-overflow:clip!important;' in section
          assert '.compact-member-nav .dashboard-link{' in section
          assert 'display:inline-flex!important;' in section
          assert '.compact-member-nav .dashboard-link>span:not(.header-tile-icon){display:inline!important}' in section
          assert 'grid-column:4!important;' in section
          assert 'home-theme.css?v=20260905-12' in html
          print('mobile header avatar dashboard: PASS')
          PY
          set +e
          python tests/test_mobile_header_avatar_dashboard.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected RED before implementation, but test already passes"
            exit 1
          fi
          echo "RED verified"

      - name: Implement final mobile header layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          cssp = Path('home-theme.css')
          css = cssp.read_text(encoding='utf-8')
          marker = '/* Mobile header avatar identity + four controls 20260905 */'
          rule = '''

/* Mobile header avatar identity + four controls 20260905 */
@media(max-width:600px){
  body.home-signed-in .compact-member-nav .nav-user{
    width:100%!important;
    display:grid!important;
    grid-template-columns:repeat(4,minmax(0,1fr))!important;
    gap:6px!important;
    align-items:stretch!important;
    overflow:visible!important;
  }
  body.home-signed-in .compact-member-nav .header-member{
    grid-column:1/-1!important;
    grid-row:1!important;
    width:100%!important;
    min-width:0!important;
  }
  body.home-signed-in .compact-member-nav .header-member-link.header-tile{
    width:100%!important;
    min-width:0!important;
    max-width:none!important;
    height:auto!important;
    min-height:62px!important;
    padding:6px 10px!important;
    display:flex!important;
    flex-direction:row!important;
    align-items:center!important;
    justify-content:center!important;
    gap:10px!important;
    overflow:visible!important;
  }
  body.home-signed-in .compact-member-nav .header-member-avatar-wrap{
    position:static!important;
    right:auto!important;
    top:auto!important;
    transform:none!important;
    width:44px!important;
    height:44px!important;
    flex:0 0 44px!important;
  }
  body.home-signed-in .compact-member-nav .header-member-avatar{
    width:44px!important;
    height:44px!important;
  }
  body.home-signed-in .compact-member-nav .header-member-copy{
    width:auto!important;
    flex:0 1 auto!important;
    min-width:0!important;
    display:flex!important;
    flex-direction:row!important;
    align-items:center!important;
    justify-content:center!important;
    gap:8px!important;
    overflow:visible!important;
  }
  body.home-signed-in .compact-member-nav .header-member-copy>strong{
    flex:0 1 auto!important;
    min-width:0!important;
    max-width:none!important;
    margin:0!important;
    padding-block:3px!important;
    font-size:22px!important;
    line-height:1.3!important;
    white-space:nowrap!important;
    overflow:visible!important;
    text-overflow:clip!important;
    text-align:center!important;
  }
  body.home-signed-in .compact-member-nav .header-member-points{
    flex:0 0 auto!important;
    min-width:0!important;
    display:inline-flex!important;
    flex-direction:row!important;
    align-items:center!important;
    justify-content:center!important;
    line-height:1.3!important;
    overflow:visible!important;
  }
  body.home-signed-in .compact-member-nav .header-member-points small{display:none!important}
  body.home-signed-in .compact-member-nav .header-member-points b{
    margin:0!important;
    padding-block:3px!important;
    font-size:22px!important;
    line-height:1.3!important;
  }
  body.home-signed-in .compact-member-nav .dashboard-link{
    display:inline-flex!important;
    grid-column:1!important;
    grid-row:2!important;
    order:0!important;
  }
  body.home-signed-in .compact-member-nav .header-notification-host{
    grid-column:2!important;
    grid-row:2!important;
    order:0!important;
  }
  body.home-signed-in .compact-member-nav .header-tournaments{
    grid-column:3!important;
    grid-row:2!important;
    order:0!important;
  }
  body.home-signed-in .compact-member-nav .nav-logout{
    grid-column:4!important;
    grid-row:2!important;
    order:0!important;
  }
  body.home-signed-in .compact-member-nav .dashboard-link,
  body.home-signed-in .compact-member-nav .header-notification-host,
  body.home-signed-in .compact-member-nav .header-tournaments,
  body.home-signed-in .compact-member-nav .nav-logout{
    width:100%!important;
    min-width:0!important;
    max-width:none!important;
    height:42px!important;
    min-height:42px!important;
    margin:0!important;
    padding-inline:4px!important;
  }
  body.home-signed-in .compact-member-nav .dashboard-link{
    gap:4px!important;
    font-size:11px!important;
  }
  body.home-signed-in .compact-member-nav .dashboard-link>span:not(.header-tile-icon){display:inline!important}
  body.home-signed-in .compact-member-nav .dashboard-link .header-tile-icon{
    width:18px!important;
    height:18px!important;
    flex:0 0 18px!important;
    font-size:14px!important;
  }
  body.home-signed-in .compact-member-nav .site-notification-bell{
    width:100%!important;
    min-width:0!important;
    height:42px!important;
  }
}
'''
          if marker not in css:
              css += rule
          cssp.write_text(css, encoding='utf-8')

          ip = Path('index.html')
          html = ip.read_text(encoding='utf-8')
          html = re.sub(r'home-theme\.css\?v=20260905-\d+', 'home-theme.css?v=20260905-12', html, count=1)
          ip.write_text(html, encoding='utf-8')

          for p in Path('tests').glob('test_*.py'):
              s = p.read_text(encoding='utf-8')
              ns = re.sub(r'home-theme\.css\?v=20260905-\d+', 'home-theme.css?v=20260905-12', s)
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
          PY

      - name: Verify GREEN
        run: |
          python tests/test_mobile_header_avatar_dashboard.py
          python tests/test_mobile_header_identity_22.py
          python tests/test_mobile_header_two_rows.py
          python tests/test_home_header_controls.py

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-mobile-header-avatar-dashboard.yml
          git add home-theme.css index.html tests .github/workflows/apply-mobile-header-avatar-dashboard.yml
          git commit -m "ضم صورة العضو وإعادة لوحة التحكم في هيدر الجوال"
          git push origin main
