name: Puzzles viewport fit verify

on:
  push:
    branches:
      - feat/puzzles-no-scroll-20260914
    paths:
      - 'puzzles.html'
      - 'tests/test_puzzles_viewport_fit.py'
      - '.github/workflows/puzzles-viewport-fit-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'puzzles.html'
      - 'tests/test_puzzles_viewport_fit.py'
      - '.github/workflows/puzzles-viewport-fit-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_puzzles_viewport_fit.py -q
