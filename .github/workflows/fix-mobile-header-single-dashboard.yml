name: Apply mobile header single dashboard

on:
  push:
    branches: [fix/mobile-header-dashboard-dup]
    paths:
      - ci/fix_mobile_header_single_dashboard.py
      - .github/workflows/fix-mobile-header-single-dashboard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-header-dashboard-dup
      - name: Apply patch
        run: python ci/fix_mobile_header_single_dashboard.py
      - name: Verify regression test
        run: python tests/test_home_header_controls.py
      - name: Commit patched files
        run: |
          if git diff --quiet -- home-theme.css index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-theme.css index.html
          git commit -m "fix: remove duplicate mobile dashboard control"
          git push
